# ローカル確認用: docker compose up -d → http://localhost:8080
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ./themes/hikari-navi:/var/www/html/wp-content/themes/hikari-navi

  # wp-cli（setup.sh から利用）
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ./themes/hikari-navi:/var/www/html/wp-content/themes/hikari-navi
    profiles: [tools]

  # 送信メール確認用（http://localhost:8025）
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db:
  wp:
