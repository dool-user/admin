# 業種マスタ（大区分 → 小区分）
#   name    : 画面に出す名前
#   tabelog : 食べログのジャンルURL（https://tabelog.com/tokyo/rstLst/<tabelog>/）。空なら食べログはジャンル指定なしで取得して match で絞り込む
#   google  : Googleマップ（Places API）の検索語
#   match   : 食べログ一覧の「ジャンル」表記と照合する語（新規開店リストや大区分「すべて」の絞り込みに使う）
#
# ★ tabelog の値は 2026年9月時点で食べログ上のURLを確認済みのもの（✓）と未確認のもの（?）があります。
#   未確認のものは `python -m leadgen check-genres` で存在確認できます（404 なら直してください）。
和食:
  - {name: 和食(総合), tabelog: washoku, google: 和食, match: [和食]}                  # ✓
  - {name: 日本料理, tabelog: japanese, google: 日本料理, match: [日本料理, 割烹, 懐石, 小料理]}  # ✓
  - {name: 寿司, tabelog: sushi, google: 寿司, match: [寿司, 回転寿司]}                  # ✓
  - {name: 海鮮・魚介, tabelog: seafood, google: 海鮮料理, match: [海鮮, 魚介]}           # ?
  - {name: そば, tabelog: soba, google: そば, match: [そば, 蕎麦]}                      # ✓
  - {name: うどん, tabelog: udon, google: うどん, match: [うどん]}                      # ✓
  - {name: 天ぷら, tabelog: tempura, google: 天ぷら, match: [天ぷら]}                   # ✓
  - {name: とんかつ, tabelog: tonkatsu, google: とんかつ, match: [とんかつ]}             # ✓
  - {name: 焼き鳥, tabelog: yakitori, google: 焼き鳥, match: [焼き鳥, 焼鳥, 串焼き]}      # ?
  - {name: うなぎ, tabelog: unagi, google: うなぎ, match: [うなぎ]}                     # ?
  - {name: お好み焼き, tabelog: okonomiyaki, google: お好み焼き, match: [お好み焼き, もんじゃ, たこ焼き]}  # ✓
  - {name: 定食・食堂, tabelog: teishoku, google: 定食, match: [定食, 食堂]}              # ✓
  - {name: 丼もの, tabelog: '', google: 丼, match: [丼, 牛丼, 天丼, 海鮮丼]}

