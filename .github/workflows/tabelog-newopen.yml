# 食べログの新規オープン店を毎朝8時（日本時間）に抽出し、data/tabelog_newopen/ に保存する
name: 食べログ新規オープン店の抽出

on:
  schedule:
    - cron: "0 23 * * *"  # UTC 23:00 = 日本時間 8:00（GitHub 側の混雑で数分〜十数分遅れることがあります）
  workflow_dispatch: {}    # Actions 画面から手動実行もできる

permissions:
  contents: write

concurrency:
  group: tabelog-newopen

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/tabelog_newopen/requirements.txt
      - run: python3 tools/tabelog_newopen/newopen.py
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tabelog_newopen
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "食べログ新規オープン店 $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
