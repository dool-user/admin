# 食べログ 新規開店リスト（Uber Eats 未掲載）を毎日 7:00（日本時間）に作る
# 結果：この実行の「Artifacts」に CSV、Secrets に LEADGEN_WEBHOOK_URL があればスプレッドシートにも追記
name: leadgen-tabelog-daily

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 日本時間 7:00（GitHub 側の混雑で数分〜数十分遅れることがあります）
  workflow_dispatch: {}      # Actions 画面の「Run workflow」から手動実行

concurrency:
  group: leadgen-tabelog-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: leadgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: leadgen/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # 取得済みの店（前回までの記録）を復元
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: leadgen/state
          key: tabelog-seen-${{ github.run_id }}
          restore-keys: tabelog-seen-

      - name: Run
        env:
          LEADGEN_WEBHOOK_URL: ${{ secrets.LEADGEN_WEBHOOK_URL }}
        run: python -m leadgen daily

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leadgen/state
          key: tabelog-seen-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabelog-new-${{ github.run_id }}
          path: leadgen/output/
          retention-days: 30
          if-no-files-found: ignore
