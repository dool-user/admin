<svg class="hero-art__svg" viewBox="0 0 520 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="光回線でつながる家のイラスト">
  <defs>
    <linearGradient id="hnFiber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <radialGradient id="hnGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bfe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hnScreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#2a8cf0"/>
    </linearGradient>
    <linearGradient id="hnFadeG" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hnFade" maskUnits="userSpaceOnUse" x="-20" y="0" width="560" height="460"><rect x="-20" y="0" width="560" height="460" fill="url(#hnFadeG)"/></mask>
    <clipPath id="hnWin"><rect x="184" y="242" width="116" height="86" rx="5"/></clipPath>
  </defs>

  <!-- 背景の光 -->
  <circle cx="275" cy="235" r="210" fill="url(#hnGlow)"/>
  <!-- 背景の光ファイバー -->
  <g mask="url(#hnFade)">
  <g fill="none" stroke-linecap="round" opacity=".45">
    <path d="M-20 120 C 120 80, 220 170, 540 60" stroke="#7fe3ff" stroke-width="2"/>
    <path d="M-20 170 C 140 150, 300 230, 540 110" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M-20 230 C 80 200, 380 260, 540 190" stroke="#7fe3ff" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke-linecap="round" class="hn-pulse">
    <path d="M-20 120 C 120 80, 220 170, 540 60" stroke="#ffffff" stroke-width="3" pathLength="100" stroke-dasharray="4 96"/>
    <path d="M-20 230 C 80 200, 380 260, 540 190" stroke="#ffe14d" stroke-width="2.5" pathLength="100" stroke-dasharray="3 97"/>
  </g>
  </g>

  <!-- 地面 -->
  <ellipse cx="270" cy="398" rx="225" ry="20" fill="#001f4d" opacity=".35"/>

  <!-- 家に入る光回線 -->
  <path d="M-10 368 C 60 368, 100 318, 162 350" fill="none" stroke="#002a63" stroke-width="9" stroke-linecap="round"/>
  <path d="M-10 368 C 60 368, 100 318, 162 350" fill="none" stroke="url(#hnFiber)" stroke-width="4" stroke-linecap="round"/>
  <path class="hn-pulse" d="M-10 368 C 60 368, 100 318, 162 350" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="6 94"/>

  <!-- 家 -->
  <rect x="332" y="122" width="26" height="62" fill="#c94c00"/>
  <rect x="328" y="116" width="34" height="10" rx="2" fill="#a83f00"/>
  <rect x="160" y="208" width="222" height="184" fill="#ffffff"/>
  <rect x="332" y="208" width="50" height="184" fill="#dbe7f7"/>
  <polygon points="134,224 271,110 408,224" fill="#ff6a00"/>
  <polygon points="134,224 271,110 271,126 152,226" fill="#ff8a33"/>
  <rect x="134" y="220" width="274" height="10" rx="3" fill="#d65200"/>
  <!-- 屋根裏の丸窓 -->
  <circle cx="271" cy="182" r="15" fill="#bfe3ff" stroke="#003f86" stroke-width="4"/>
  <path d="M256 182h30M271 167v30" stroke="#003f86" stroke-width="3"/>

  <!-- 窓の中：ノートPCを使う人 -->
  <rect x="180" y="238" width="124" height="94" rx="7" fill="#003f86"/>
  <g clip-path="url(#hnWin)">
    <rect x="184" y="242" width="116" height="86" fill="#cfeaff"/>
    <rect x="184" y="242" width="116" height="86" fill="#ffffff" opacity=".25"/>
    <path d="M196 328 C 198 300, 212 294, 226 294 C 240 294, 252 302, 254 328 Z" fill="#ff6a00"/>
    <circle cx="225" cy="278" r="13" fill="#ffd2a8"/>
    <path d="M211 276 C 211 262, 239 260, 239 274 C 233 268, 219 268, 211 276 Z" fill="#3a2a22"/>
    <rect x="238" y="290" width="44" height="28" rx="3" fill="#1b2d4f"/>
    <rect x="241" y="293" width="38" height="22" rx="2" fill="url(#hnScreen)"/>
    <path d="M256 299 l9 5 -9 5 z" fill="#ffffff"/>
    <rect x="230" y="318" width="60" height="5" rx="2" fill="#8aa0bf"/>
  </g>
  <path d="M242 242v86M184 285h116" stroke="#003f86" stroke-width="3" opacity=".25"/>

  <!-- ドア -->
  <rect x="320" y="300" width="44" height="92" rx="5" fill="#0063c6"/>
  <circle cx="354" cy="348" r="3.5" fill="#ffe14d"/>
  <rect x="160" y="388" width="222" height="6" fill="#b8c9e2"/>

  <!-- ルーターとWi-Fi -->
  <g transform="translate(196 356)">
    <rect x="0" y="6" width="44" height="22" rx="5" fill="#1b2d4f"/>
    <rect x="8" y="-8" width="4" height="16" rx="2" fill="#1b2d4f"/>
    <rect x="32" y="-8" width="4" height="16" rx="2" fill="#1b2d4f"/>
    <circle cx="11" cy="17" r="2.5" fill="#39e58c"/>
    <circle cx="20" cy="17" r="2.5" fill="#39e58c"/>
    <circle cx="29" cy="17" r="2.5" fill="#7fe3ff"/>
  </g>
  <g class="hn-wifi" fill="none" stroke="#ffe14d" stroke-linecap="round" stroke-width="7" transform="translate(271 92)">
    <path d="M-16 -2 A 22 22 0 0 1 16 -2"/>
    <path d="M-32 -16 A 44 44 0 0 1 32 -16"/>
    <path d="M-48 -30 A 66 66 0 0 1 48 -30"/>
  </g>
  <circle cx="271" cy="98" r="6" fill="#ffe14d"/>

  <!-- 浮かぶスマホ -->
  <g class="hn-float hn-float--a">
    <g transform="translate(92 150) rotate(-12)">
      <rect x="-24" y="-44" width="48" height="88" rx="9" fill="#1b2d4f"/>
      <rect x="-19" y="-36" width="38" height="68" rx="4" fill="url(#hnScreen)"/>
      <rect x="-8" y="36" width="16" height="3" rx="1.5" fill="#5a7093"/>
      <path d="M-6 -12 l14 8 -14 8 z" fill="#ffffff"/>
      <rect x="-13" y="14" width="26" height="4" rx="2" fill="#ffffff" opacity=".7"/>
      <rect x="-13" y="14" width="17" height="4" rx="2" fill="#ffe14d"/>
    </g>
  </g>

  <!-- 速度の吹き出し -->
  <g class="hn-float hn-float--b">
    <g transform="translate(438 150)">
      <rect x="-60" y="-26" width="120" height="52" rx="26" fill="#ffffff"/>
      <path d="M-30 22 l-10 20 26 -18 z" fill="#ffffff"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#003f86">最大</text>
      <text x="0" y="16" text-anchor="middle" font-family="Montserrat,'Noto Sans JP',sans-serif" font-size="21" font-weight="800" fill="#0063c6">10Gbps</text>
    </g>
  </g>

  <!-- コイン -->
  <g class="hn-float hn-float--c">
    <g transform="translate(70 372)">
      <ellipse cx="0" cy="8" rx="32" ry="11" fill="#d99a00"/>
      <rect x="-32" y="-22" width="64" height="30" fill="#ffcc1f"/>
      <path d="M-32 -12h64M-32 -2h64" stroke="#e0a800" stroke-width="2"/>
      <ellipse cx="0" cy="-22" rx="32" ry="11" fill="#ffe066" stroke="#e0a800" stroke-width="2"/>
      <text x="0" y="-16.5" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="15" font-weight="800" fill="#c98600">¥</text>
    </g>
    <g transform="translate(118 330) rotate(18)">
      <ellipse cx="0" cy="0" rx="17" ry="17" fill="#ffcc1f" stroke="#e0a800" stroke-width="2.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="17" font-weight="800" fill="#c98600">¥</text>
    </g>
  </g>

  <!-- プレゼント -->
  <g class="hn-float hn-float--d">
    <g transform="translate(452 350)">
      <rect x="-34" y="-8" width="68" height="50" rx="4" fill="#e60033"/>
      <rect x="-38" y="-24" width="76" height="18" rx="3" fill="#ff3355"/>
      <rect x="-7" y="-24" width="14" height="66" fill="#ffe14d"/>
      <path d="M0 -24 C -26 -50, -40 -28, 0 -24 Z" fill="#ffe14d"/>
      <path d="M0 -24 C 26 -50, 40 -28, 0 -24 Z" fill="#ffd21f"/>
    </g>
  </g>

  <!-- きらめき -->
  <g fill="#ffe14d">
    <path class="hn-twinkle" d="M160 70 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
    <path class="hn-twinkle hn-twinkle--2" d="M412 250 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="hn-twinkle hn-twinkle--3" d="M40 260 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#ffffff"/>
  </g>
</svg>
