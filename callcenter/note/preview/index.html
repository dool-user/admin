の一覧（代わりに使う言葉つき）\n4. AI に文面を書かせる指示文（コピーして使える）\n5. 送ってよいかの判断（法律・規約で気をつけること）\n6. 返信が来たあとの返し方", "paid": "## 1. 文面の実例\n\n### フォーム用\n```\n件名：{店名}様　Googleマップでの見つけられ方について（15分）\n\nはじめまして。{会社名}の{名前}です。\n「{エリア} {業種}」で Googleマップを検索したとき、{店名}さんの口コミを拝見してご連絡しました。\nGoogleマップからのご来店を増やすためのツールを、15分だけオンラインでお見せできないでしょうか。\n10/2（木）14時か、10/3（金）11時はいかがでしょうか。\n今後のご連絡が不要でしたら、「不要」とだけご返信ください。以後お送りしません。\n\n{会社名}　{名前}　{電話}　{メール}\n```\n\n### Instagram DM 用（5行以内・URL は貼らない）\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{メニュー}の投稿を拝見してご連絡しました。\nGoogleマップからのご来店を増やすツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n**ポイント**\n- 2行目の「なぜこの店に」は、実際に見たことだけを書く。見ていない順位や数字は書かない\n- 日程は2択にする。「ご都合のよい日時を教えてください」より返事がしやすい\n- 断り方を書くと、相手は安心して読める\n\n## 2. 送る前の点検リスト9項目\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 店名・エリアが正しい。店について書いたことは実際に確かめたこと\n- [ ] 名乗り（会社名・名前）と、連絡先・署名がある\n- [ ] 連絡が不要な場合の伝え方が書いてある\n- [ ] 使わない言葉（下の一覧）を使っていない\n- [ ] 1通目で申込を迫っていない。目的は「15分の説明の日程」だけ\n- [ ] Instagram DM は5行以内、URL を貼っていない\n- [ ] 数字（順位・口コミ数など）は、実際に確かめた値だけ\n```\n\n私たちは、この点検を文面を作る AI とは別の AI（SV 役）にやらせています。**作る役と点検する役を分ける**と、見落としが減ります。【社長確認：差し戻しで多かった理由があれば1行】\n\n## 3. 使わない言葉の一覧\n\n| 使わない | 代わりに |\n|---|---|\n| 必ず来店が増えます | Googleマップからの来店を増やす方法の1つとしてご案内しています |\n| 1位にします・上位表示を保証 | （順位は Google が決めるので、保証しない） |\n| 口コミを増やします | （見返りつきの口コミ集めは Google のポリシー違反を連想させるので使わない） |\n| 至急ご返信ください | （返信は相手の自由。使わない） |\n| 今だけ・本日中に | 期限が事実のときだけ、事実を書く |\n\n## 4. AI に文面を書かせる指示文\n\n```\nあなたは店舗向けの営業担当です。次の店に送る問い合わせフォームの文面を作ってください。\n- 6行で：名乗り／この店に送った理由（下の事実から1つ）／15分の説明のお願い／日程2択／不要な場合の伝え方／署名\n- 店について書くのは、下の「確かめた事実」だけ。ないことは書かない\n- 使わない言葉：必ず・保証・1位・口コミを増やします・至急・今だけ\n- 書いたあと、次の点検リストを全部確かめて、引っかかったら直してから出す\n（点検リスト9項目を貼る）\n\n店名：\n業種・エリア：\n確かめた事実：（例：Googleの口コミ12件、ランチの写真が多い）\n日程候補：\n```\n\n## 5. 送ってよいかの判断\n\n- **問い合わせフォーム**：「営業お断り」の表記がある店には送らない。表記がなくても、同じ店に何度も送らない\n- **メール**：特定電子メール法では、原則として相手の同意が必要です。事業者がネットで公表しているアドレスは例外になりえますが、「広告メールお断り」などの表示があれば送れません（[総務省ガイドライン](https://www.soumu.go.jp/main_content/000060967.pdf)）。私たちはメールでの営業はしていません\n- **Instagram DM**：公式の仕組みでは、相手から先に連絡がないと DM を送れません。非公式ツールでの自動送信は規約違反になりえます。私たちは人が1件ずつ送っています\n\n※法律の判断は、必要に応じて専門家に確認してください。\n\n## 6. 返信が来たあとの返し方\n\n- **興味あり** → 日程を2択で返す。その日のうちに返す\n- **検討中** → 資料は1枚だけ送り、「1週間後にもう一度ご連絡してもよいですか」と聞く\n- **お断り** → お礼だけ返して、以後送らない\n\n---\n\n質問はコメントでどうぞ。【社長確認：次の記事の予告を入れるか】", "chars": 2757, "asks": 3}, {"id": "N005", "acc": "A02", "accName": "AI×営業（DM・フォーム営業の型）", "title": "SV 1人で AP 5人を回す：AI 営業チームの点検の仕組み", "price": 1980, "status": "校正待ち", "writer": "タロ", "memo": "状態：校正待ち（ライター：タロ）／アカウント：A02／価格：1,980円\n     編集長へ：A02 は営業部の実数が出るまで公開しない（編集長 9/29）。承認率・差し戻し件数・返信率などの数字は入れていない。\n     【社長確認】が残っている間は公開しない。仕組みの説明は callcenter/ の実ファイル（sv.md・appointer.md・sales/review.md・send_assist.py）どおり", "free": "**こんな人向け：** 営業チームの責任者。AI に営業文面を書かせ始めたが、品質のばらつきや「変な文面が送られないか」が心配な人。\n\n**この記事でできること：** AI の営業チームを「作る役」と「点検する役」に分け、点検リスト・差し戻しの集計・失敗の記録で回す仕組みが分かります。そのまま使える点検役（SV）の指示ファイルも載せています。\n\n**筆者がやったこと：** MEO対策ツールの営業で、Claude Code を使って営業部を作りました。AP（アポインター＝文面を作る役）5人に SV（スーパーバイザー＝点検する役）1人をつけ、A・B の2チームで動かしています。送信は人が行います。\n\n---\n\n## AI に文面を書かせると、何が困るか\n\nAI は速く、たくさん書けます。\n困るのは、その速さに点検が追いつかないことです。\n\n- 店について、確かめていないことを書いてしまう\n- 「必ず」「保証」など、言ってはいけない言葉が混ざる\n- 「営業お断り」と書いてある店にも、文面を作ってしまう\n- 同じ店に、何度も送る下書きができる\n\n1通ずつなら、人が読めば防げます。\nでも AI が1日に何十通も作ると、人の目だけでは見落とします。\n\n## 結論：作る役と点検する役を分け、送るのは人\n\n私たちの営業部は、3つの段に分けています。\n\n1. **作る（AP）**：店ごとの文面を作り、「下書き」で出す\n2. **点検する（SV）**：点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n3. **送る（人）**：承認済だけを、人が1件ずつ目で見て送る\n\n大事なのは、**作った本人に点検させない**ことです。\n同じ AI に「書いて、確かめて」と頼むと、自分の書いたものを甘く見がちです。\n役を分けると、点検役は「通さない理由」を探す立場になります。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 文面を作る AI と、点検する AI を分ける\n- 点検はリストで行う。「よさそうか」ではなく「✗ が1つもないか」で決める\n- 差し戻しには必ず「どの項目で落ちたか」を書かせる\n- 送信ボタンは人が押す。AI には送らせない\n\n### 有料部分の目次\n1. SV 1人に AP 5人にしている考え方\n2. 仕事の流れ（下書き → 点検 → 送信）\n3. 点検リスト全項目（コピーして使える）\n4. 差し戻し理由の集計のしかた\n5. mistakes.md：同じ失敗を繰り返さない記録\n6. 「送信は人」のルールと、送信補助ツールの作り\n7. SV の指示ファイル（sv.md）の全文\n8. つまずきやすい点と直し方", "paid": "## 1. SV 1人に AP 5人にしている考え方\n\n私たちの営業部は、A・B の2チームです。\nそれぞれ SV 1人・AP 5人。SV は自分のチームの5人だけを見ます。\n\n1:5 は、決まった正解ではありません。\n考え方は次の3つです。\n\n- **SV が1件ずつ読める量にする。** 点検は全件を読むのが前提です。読み飛ばすなら、点検役を置く意味がありません\n- **AP ごとの違いが見える人数にする。** 5人なら、誰の差し戻しが多いかを表1枚で見比べられます\n- **増やすときは、チームごと増やす。** AP を増やしたいときは、SV 1人・AP 5人の組をもう1つ作ります\n\n【社長確認：1:5 に決めた実際のきっかけ（書けなければ文ごと消す）】\n\nAI なので、人数を増やすのは簡単です。\nでも点検が追いつかない人数にすると、仕組み全体が崩れます。\n**AP の数は、SV が全件読める量で決めます。**\n\n## 2. 仕事の流れ\n\n1. リスト係が、送り先の店とフォーム・Instagram を集める（「営業お断り」表記の店は入れない）\n2. リストを AP に均等に割り振る\n3. AP が店ごとに文面を作り、一覧表（outbox.csv）に「下書き」で1行足す\n4. SV が点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n5. 人が送信補助ツールで、承認済だけを1件ずつ確かめて送る\n6. 返信は事務係が、返事の案と日程調整を作る\n\n一覧表の列はこうしています。\n\n```\nID,店名,送る手段,送り先URL,件名,本文,AP,SV,状態,作成日,メモ\n```\n\n状態は「下書き → 承認済／差し戻し → 送信済 → 返信あり」と進みます。\n送り先に「営業お断り」があれば、AP は文面を作らず「見送り」にします。\n\n**ポイント：** AP は「下書き」までしか書けません。\n「承認済」にできるのは SV だけ。「送信済」にできるのは人だけです。\n状態を変えられる人を分けておくと、どこで止まったかがすぐ分かります。\n\n## 3. 点検リスト全項目\n\nSV はこのリストで1件ずつ確かめます。\n1つでも ✗ なら差し戻しです。\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない（一覧表で店名・URLを確認）\n- [ ] 店名・エリアが正しい。店について書いたことは実際に確かめたこと\n- [ ] 名乗り（会社名・名前）と、連絡先・署名がある\n- [ ] 連絡が不要な場合の伝え方が書いてある\n- [ ] 使わない言葉の一覧にある言葉を使っていない。数字は資料にある値だけ\n- [ ] 1通目で申込を迫っていない。目的は「15分の説明（デモ）の日程」だけ\n- [ ] 順位の保証、見返り付きの口コミ集めを思わせる表現がない\n- [ ] 検索順位・口コミ数などの店の数字は、実際に確かめた値だけ\n- [ ] Instagram DM は5行以内、URLを貼っていない\n- [ ] アポは決裁者（店長・オーナー）本人の返信で、日時・店名・連絡先がそろっている\n```\n\nいま、次の4項目を追加の案として SV に渡しています。\n店のオーナーに「しつこい業者」と思われないための項目です。\n\n```\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 「無料診断」「今だけ」など、業者の決まり文句を使っていない\n- [ ] 断られた店、返信のない店に、1週間以内に同じ内容を再送していない（再送は1回まで）\n- [ ] 「Google から連絡が来た」「このままだと表示されなくなる」など、不安をあおる書き方をしていない\n```\n\n**リストの作り方のコツ**\n- 1項目は「はい／いいえ」で答えられる文にする。「適切か」「自然か」は書かない\n- 項目は増やしすぎない。増やしたら、使っていない項目を消す\n- 「営業お断り」の確認は、SV も自分でページを開いて確かめる。AP の報告をうのみにしない\n\n## 4. 差し戻し理由の集計のしかた\n\n差し戻しは、ただ直させて終わりにしません。\n**どの項目で落ちたかを数えると、AP への指示のどこが弱いかが分かります。**\n\n### 差し戻しのメモの書き方\nメモ列には、点検リストの何番で落ちたかと、一言の理由を書かせます。\n\n```\n差し戻し｜3番：「ランチが人気」と書いたが、確かめた事実にない\n差し戻し｜6番：「必ず」を使っている\n```\n\n番号を先に書くと、あとで数えやすくなります。\n\n### 集計の表\nSV には、AP ごとにこの表を作らせます。\n\n```\n| AP | 下書き数 | 承認数 | 差し戻し数 | 多かった項目 | 返信数 | アポ数 |\n|----|---------|-------|-----------|------------|-------|-------|\n| {AP名} | {数} | {数} | {数} | {項目番号} | {数} | {数} |\n```\n\n項目ごとにも数えます。\n\n```\n| 点検項目 | 差し戻し数 | 直し方（指示・テンプレのどこを変えるか） |\n|---------|-----------|------------------------------------|\n| 3番 店について確かめたことだけ | {数} | {直し方} |\n```\n\n【社長確認：差し戻しで実際に多かった項目（営業部の実数が出てから。書けなければ文ごと消す）】\n\n### 集計を見たら、何を直すか\n- **特定の AP だけ多い** → その AP の指示の読み違い。指示ファイルを見直す\n- **全員が同じ項目で落ちる** → テンプレや指示そのものが弱い。テンプレを直す\n- **ずっと0の項目** → 本当に守れているか、点検が甘いかを、SV に数件読み直させる\n\n## 5. mistakes.md：同じ失敗を繰り返さない記録\n\nAI は、前回の失敗を覚えていません。\nだから失敗を1つのファイル（mistakes.md）に書き残し、毎回最初に読ませます。\n\n書き方は1件3行です。\n\n```\n何を：フォームの下に「営業のご連絡はご遠慮ください」とあった店に下書きを作った（例）\nなぜ：フォームのページの下まで読まなかった\n次から：点検リストの1行目を、フォームのページ全体で確かめる\n```\n\n**3行にする理由**\n- 「何を」だけだと、次にどうすればいいか分からない\n- 「なぜ」があると、似た別の失敗も防げる\n- 「次から」は、点検リストか指示ファイルのどこかを直す形で書く\n\n言い回しの直し（「この言葉は使わない」）は、使わない言葉の一覧に移します。\nmistakes.md が長くなりすぎないようにするためです。\n\n## 6. 「送信は人」のルール\n\n私たちのルールでは、**送信・投稿・公開は人が行います。**\nAI は DM もフォームも送りません。\n\n理由は2つです。\n- 送ったものは取り消せない。最後の確認は、責任を持つ人がする\n- 送り先の規約や法律の判断を、AI に任せきりにしない\n\nとはいえ、人が毎回フォームに入力するのは手間です。\nそこで送信補助ツールを作りました。やることはこれだけです。\n\n- 承認済の文面を、上から1件ずつ出す\n- フォームなら、ブラウザで開いて名前・会社名・メール・電話・件名・本文を入れる。**送信ボタンは押さず、ボタンに枠を付けて止まる**。同意のチェックや選択肢も人が選ぶ\n- Instagram DM なら、プロフィールを開いて文面を画面に出すだけ。人がコピーして貼り、人が送る\n- 人が送ったら、一覧表の状態を「送信済」にし、送信日時を入れる\n- 1日の上限を超えたら止まる。フォームに「営業お断り」の表記を見つけたら、開くだけで入力しない\n\n**ポイント：** 「送信ボタンの手前で止まる」ことが大事です。\n人は必ず画面の文面を見てから押すことになります。\n\n## 7. SV の指示ファイル（sv.md）\n\nClaude Code のサブエージェントとして使っている SV の指示ファイルです。\n会社名や商材に合わせて書き換えてください。\n\n```\n---\nname: sv\ndescription: スーパーバイザー（SV）。AP 5人を見る。outbox.csv の下書きを review.md で点検して承認・差し戻しし、返信率や差し戻し理由を集計して改善点を出す。文面の点検・チームの振り返りで使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは営業部の SV です（Aチーム：{名前}／Bチーム：{名前}）。担当は自分のチームの AP 5人だけ。\n\n必ず最初に読む：review.md（点検リスト）・ng-words.md（使わない言葉）・knowledge.md（商材の事実）・mistakes.md（過去の失敗）\n\n## 仕事\n1. outbox.csv の自チームの「下書き」を review.md で1件ずつ点検\n   - 全部OK → 状態を「承認済」、SV列に自分の名前\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n3. AP ごとの 下書き数・承認率・返信数・アポ数 を集計\n4. 差し戻しや同じ失敗は mistakes.md に3行（何を・なぜ・次から）で足す\n5. 返信につながった文面は templates.md に足す提案を責任者へ出す\n```\n\n**書き換えるときの注意**\n- tools に送信の手段を入れない。SV は点検と記録だけ\n- 「最初に読む」に mistakes.md を必ず入れる\n- 担当の AP を名前で決める。全員を見させると、集計がぼやけます\n\n## 8. つまずきやすい点と直し方\n\n- **点検が甘くなる** → 「よさそうなら承認」と書かない。「✗ が1つでもあれば差し戻し」と書く\n- **差し戻しの理由がばらばら** → メモの先頭に項目番号を書かせる\n- **AP が店のことを盛る** → 指示に「店について書くのは確かめた事実だけ。ないことは書かない」と入れ、点検リストにも同じ項目を置く\n- **点検リストが長くなる** → 追加は「案」として出し、SV か責任者が採用を決める。使わない項目は消す\n- **人の送信が追いつかない** → AP を増やさない。1日の上限を決め、その範囲で回す\n\n---\n\n質問はコメントでどうぞ。", "chars": 5066, "asks": 2}, {"id": "N006", "acc": "A02", "accName": "AI×営業（DM・フォーム営業の型）", "title": "Instagram DM で店舗に嫌われない書き方", "price": 980, "status": "校正待ち", "writer": "タロ", "memo": "状態：校正待ち（ライター：タロ）／アカウント：A02／価格：980円\n     編集長へ：A02 は営業部の実数が出るまで公開しない（編集長 9/29）。返信率などの数字は入れていない。\n     【社長確認】が残っている間は公開しない。Meta のポリシーは公開前に原文を確認する（リンクは本文5章）", "free": "**こんな人向け：** 飲食店・美容室・整骨院などの店舗に、Instagram の DM で営業している人。送っても無視される、ブロックされないか心配な人。\n\n**この記事でできること：** 店のオーナーに「しつこい業者」と思われない DM の書き方が分かります。5行の型、店の投稿の触れ方、言わないこと、再送のルール、そのまま使える文例を載せています。\n\n**筆者がやったこと：** 店舗向けに MEO対策ツールを案内する営業で、DM の文面を AI に作らせ、別の AI に点検させ、人が1件ずつ送る仕組みを作りました。この記事のルールは、その点検リストから取っています。\n\n---\n\n## 店の DM は、どう読まれているか\n\n店の Instagram には、お客さんからの予約や質問が届きます。\nそこに営業の DM が混ざります。\n\nオーナーが営業 DM を嫌うのは、だいたい次のときです。\n\n- 長い。スマホの画面をスクロールしないと終わらない\n- どの店にも同じ文を送っているのが分かる\n- 1通目から URL や資料が貼ってある\n- 返事をしないと、何度も送ってくる\n\n**DM は「お客さんの連絡が届く場所」に入っていく営業です。**\nフォームやメールより、相手の場所に近い。だから短く、丁寧に、1回で引くのが基本です。\n\n## 結論：5行・URLなし・投稿は1つだけ・再送は1回\n\n1. **5行まで。** スマホで1画面に収める\n2. **1通目に URL を貼らない。** 資料も送らない\n3. **店の実際の投稿に1つだけ触れる。** 見ていないことは書かない\n4. **断り方を書く。**「ご興味がなければスルーで大丈夫です」\n5. **再送は1回まで。1週間以上あける。** 断られたら、もう送らない\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 1通目の目的は「売ること」ではなく「15分だけ話を聞いてもらえるか」\n- 「投稿を拝見しました」だけでは足りない。どの投稿かを1つ書く\n- 自動で大量に送る仕組みは使わない。人が1件ずつ送る\n\n### 有料部分の目次\n1. 5行の型と、1行ずつの書き方\n2. URL を貼らない理由と、資料を渡すタイミング\n3. 店の実際の投稿の触れ方（よい例・だめな例）\n4. 言わないことの一覧（代わりの言い方つき）\n5. 再送のルールと、返事が来たあと\n6. 自動送信をすすめない理由（Instagram の仕組みと規約）\n7. 業種別の文例（飲食・美容・整骨院）\n8. 送る前の点検リスト", "paid": "## 1. 5行の型\n\n```\n1行目：名乗り（会社名・名前）\n2行目：この店に送った理由（実際に見た投稿を1つ）\n3行目：お願い（「15分だけご紹介させていただけないでしょうか」）\n4行目：断り方（「ご興味がなければ、このままスルーしていただいて大丈夫です」）\n5行目：（なくてもよい）お礼の一言\n```\n\n**1行ずつのコツ**\n- **1行目**：「はじめまして、{会社名}の{名前}です。」だけ。会社の説明は書かない\n- **2行目**：ここだけが、その店あての部分です。一番時間をかけます\n- **3行目**：お願いは小さく。「契約」「導入」ではなく「15分」\n- **4行目**：断り方があると、相手は安心して読めます。返事をしない自由を先に渡します\n- **「突然のご連絡失礼いたします」は1回まで。** 何度も謝ると長くなるだけです\n\n5行に収まらないときは、2行目を短くするのではなく、ほかの行を削ります。\n\n## 2. URL を貼らない理由\n\n1通目には URL を貼りません。資料や画像も送りません。\n\n- 知らない相手からの URL は、開くのが怖い\n- URL があると「宣伝の DM」に見えやすい\n- 読む前に「押すかどうか」を迷わせてしまう\n\n**資料を渡すのは、相手が「詳しく知りたい」と返事をくれてから**です。\nそのときも、まず1枚だけにします。\n\n## 3. 店の実際の投稿の触れ方\n\n2行目は、その店の投稿を実際に見て書きます。\n\n### 見るところ\n- 最近の投稿のメニュー・施術・商品\n- 新しくオープンした、移転した、などのお知らせ\n- 季節の限定メニューやイベント\n\n### よい例\n```\n{店名}さんの、秋限定の{メニュー名}の投稿を拝見してご連絡しました。\n```\n```\n{エリア}に新しくオープンされたとの投稿を拝見してご連絡しました。\n```\n\n### だめな例\n```\n素敵な投稿をいつも拝見しています。\n```\n→ どの店にも送れる文です。見ていないのが伝わります。「いつも」も事実でなければ書きません。\n\n```\nフォロワーが少なくて、もったいないと思いました。\n```\n→ 店の弱みを指摘する書き方は、上から目線に聞こえます。\n\n**ルール**\n- 触れる投稿は1つだけ。たくさん褒めると、かえって作り物に見えます\n- 見ていないこと、推測したことは書かない（「人気のお店と伺いました」など）\n- 投稿の文章や写真を、そのまま DM に貼らない。どの投稿かが分かる一言で十分です\n- AI に書かせるときは、実際に見た投稿の内容を人が渡す。AI に想像で書かせない\n\n## 4. 言わないことの一覧\n\n| 言わない | 理由・代わりに |\n|---|---|\n| 必ず来店が増えます／絶対儲かります | 「来店を増やす方法の1つとしてご案内しています」 |\n| 1位にします・上位表示を保証 | 順位は Google が決めます。保証はできません |\n| 口コミを増やします・★5を集めます | 見返り付きの口コミ集めを思わせます。Google のポリシー違反の手法を連想させるので使いません |\n| Google公認・Google提携 | 事実でなければ使いません |\n| 今だけ・本日中に | 事実の期限がないなら書きません |\n| 無料診断 | 業者の決まり文句に見えます |\n| 皆さんやってます | 事実で確かめられるときだけ、具体的に |\n| 至急ご返信ください／ご返信がない場合は… | 返信は相手の自由。使いません |\n| 「このままだと表示されなくなります」 | 不安をあおる書き方はしません |\n| 競合店の悪口 | 使いません |\n\nほかに、**1通目で料金・契約の話をしない**ことも決めています。\nまだ話を聞くと決めていない相手に、お金の話は早すぎます。\n\n## 5. 再送のルールと、返事が来たあと\n\n### 再送\n- **返事がないとき**：再送は1回まで。1週間以上あける\n- 再送は同じ文を送らない。短く、「先日ご連絡した{名前}です」から始める\n- **断られたとき**：お礼だけ返して、以後送らない\n- 同じ店に30日以内に送っていないか、送る前に一覧で確かめる\n\n再送の文例です。\n\n```\n先日ご連絡した、{会社名}の{名前}です。\nGoogleマップからのご来店を増やすツールを、15分だけご紹介できればと思い、もう一度だけご連絡しました。\nご興味がなければ、このままで大丈夫です。今後はお送りしません。\n```\n\n### 返事が来たら\n- **興味あり** → 日程を2つ出して返す。その日のうちに返す\n- **検討中** → 資料は1枚だけ。「1週間後にもう一度ご連絡してもよいですか」と聞く\n- **お断り** → 「お忙しいところありがとうございました」で終える\n\n## 6. 自動送信をすすめない理由\n\nDM を自動でたくさん送りたくなるかもしれません。\n私たちは、すすめません。人が1件ずつ送っています。\n\n**Instagram の公式の仕組み（API）では、企業から自由に DM を送れるわけではありません。**\n基本は、相手から先にメッセージが届いたときに、その後24時間以内に返信できる、という形です。\nつまり、こちらから知らない店に1通目を送る用途には、公式の仕組みは向いていません。\n\n公式でないツールで自動送信すると、Instagram の規約に反するおそれがあります。\nアカウントが制限されることも考えられます。\n手で送る場合も、短い時間に大量に送る使い方は避けてください。\n\nルールは変わることがあります。**使う前に、Meta の最新のポリシーを必ず確認してください。**\n- Meta Messenger Platform のポリシー：https://developers.facebook.com/documentation/business-messaging/messenger-platform/policy\n\n私たちの送り方はこうです。\n- AI が文面を作り、別の AI が点検して「承認済」にする\n- 送信補助ツールは、店のプロフィールを開いて文面を画面に出すだけ\n- 人が文面を読み、コピーして DM に貼り、人が送る\n- 1日に送る上限を決めておく\n\n※規約・法律の判断は、必要に応じて専門家に確認してください。\n\n## 7. 業種別の文例\n\nどれも、`{ }` の中は実際に見た事実だけで埋めます。\n\n### 飲食店\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{メニュー名}の投稿を拝見してご連絡しました。\nGoogleマップからのご来店を増やすためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 美容室・サロン\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{施術名}のスタイル写真の投稿を拝見してご連絡しました。\nGoogleマップで見つけてもらいやすくするツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 整骨院\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんが{エリア}に新しく開院されたとの投稿を拝見してご連絡しました。\nGoogleマップで近くの方に見つけてもらうためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n【社長確認：実際に返信をもらえた DM の書き出しがあれば1つ（書けなければ文ごと消す）】\n\n## 8. 送る前の点検リスト\n\n```\n- [ ] プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 5行以内。URL・資料を貼っていない\n- [ ] 名乗り（会社名・名前）がある\n- [ ] 触れた投稿は1つで、実際に見たもの\n- [ ] 断り方が書いてある\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 上の「言わないこと」を使っていない\n- [ ] 不安をあおる書き方をしていない\n- [ ] 再送なら、前回から1週間以上あいていて、1回目の再送である\n- [ ] 送るのは人。自動送信ツールを使っていない\n```\n\n---\n\n質問はコメントでどうぞ。", "chars": 4227, "asks": 1}, {"id": "N007", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "Googleマップで見つけてもらうために、店舗が今日できること10個", "price": 1980, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/29 編集長の指示で社長確認を2か所に整理）／アカウント：A03／価格：1,980円\n     編集長へ：Google のヘルプの内容は公開前に原文を確認する。MEO ツールの紹介は最後に1回だけ（knowledge.md が埋まってから）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。Googleマップで検索しても自分の店が出てこない、何から手を付ければいいか分からない人。\n\n**この記事でできること：** お金をかけずに、今日のうちに Googleビジネスプロフィールで直せる10個の作業が分かります。やってはいけないこと（プロフィールが止められるおそれのあること）も分かります。\n\n**筆者について：** 店舗向けに MEO（Googleマップ集客）のツールを案内する仕事をしています。【社長確認：MEO に関わった期間・担当した店舗の数など、確認できる事実だけ】\n\n---\n\n## まず知っておくこと：Google は何を見て順番を決めているか\n\nGoogle の公式ヘルプでは、ローカル検索の結果は主に **関連性・距離・知名度** の3つで決まると説明されています（[Google のローカル検索結果のランキングを改善する](https://support.google.com/business/answer/7091?hl=ja)）。\n\n- **関連性**：検索された言葉と、お店の情報がどれだけ合っているか\n- **距離**：検索した人からお店までの距離\n- **知名度**：お店がどれだけ知られているか（口コミなども含む）\n\nこのうち **距離は変えられません。** お店が今日から変えられるのは、主に「関連性」です。つまり、**プロフィールの情報を正確に、たくさん入れること**が、いちばん確実な一歩です。\n\nまた、**順位は Google が決めるもので、誰にも保証はできません。**「必ず1位にします」という業者には気をつけてください。\n\n## 今日できること10個（見出しだけ）\n1. お店の名前を「看板どおり」にする\n2. メインの業種を正しく選ぶ\n3. 営業時間と、祝日・臨時休業を入れる\n4. 住所・電話番号を、ホームページや看板と同じ表記にそろえる\n5. 写真を足す（外観・店内・メニューやサービス）\n6. お店の説明を書く\n7. メニュー・サービスを登録する\n8. 口コミにすべて返信する\n9. 口コミを「見返りなしで」お願いする\n10. 最新情報（投稿）を出す\n\n有料部分では、1つずつの具体的なやり方と、**やるとプロフィールが止められるおそれのある5つのこと**、今日の作業チェックリストを載せています。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 変えられるのは「関連性」。情報を正確に、たくさん入れる\n- 順位の保証はできない。保証をうたう業者に注意\n- 口コミのお願いに、割引や特典をつけない\n\n### 有料部分の目次\n1. 10個の具体的なやり方\n2. やってはいけない5つのこと\n3. 今日の作業チェックリスト（30分版）\n4. 業者に頼むかどうかの判断\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N007)", "paid": "## 1. 10個の具体的なやり方\n\n### ① お店の名前を「看板どおり」にする\nGoogle のガイドラインでは、ビジネス名には実際に使っている名前を使い、**キーワードやキャッチフレーズを足してはいけない**とされています（[Google に掲載するビジネス情報のガイドライン](https://support.google.com/business/answer/3038177?hl=ja)）。\n- ✕「〇〇美容室｜渋谷駅徒歩3分・カット安い」\n- ○「〇〇美容室」\n\n### ② メインの業種を正しく選ぶ\n業種（カテゴリ）は、検索との「関連性」に大きく関わります。メインの業種は、お店がいちばん力を入れているものを1つ選びます。追加の業種は、実際にやっているものだけにします（[業種を管理する](https://support.google.com/business/answer/7249669?hl=ja)）。\n\n### ③ 営業時間と、祝日・臨時休業を入れる\n「行ったら閉まっていた」はお客さんを一番がっかりさせます。祝日や年末年始は「特別営業時間」で入れます。\n\n### ④ 住所・電話番号の表記をそろえる\nホームページ・予約サイト・看板・Googleで、住所と電話番号の書き方をそろえます（例：「1-2-3」と「1丁目2番3号」を混ぜない）。お客さんが別のサイトで見た情報と食い違わないようにするためです。\n\n### ⑤ 写真を足す\n外観（初めての人が入口を見つけられる写真）・店内・メニューやサービス・スタッフ。写真のルールは [写真や動画に関するポリシー](https://support.google.com/business/answer/7213077?hl=ja) を確認します。\n\n### ⑥ お店の説明を書く\n何のお店か・どんな人に向いているか・ほかの店との違いを、事実で書きます。URL や割引の宣伝は入れません。\n\n### ⑦ メニュー・サービスを登録する\n「カット」「骨盤矯正」「ランチ」など、お客さんが検索しそうな言葉で、実際のメニューを登録します。\n\n### ⑧ 口コミにすべて返信する\n良い口コミにはお礼を、悪い口コミには言い訳をせず、事実とこれからの対応を短く書きます。返信は、これから来るお客さんも読んでいます。\n\n### ⑨ 口コミを「見返りなしで」お願いする\n会計のときに「よろしければ、Googleにご感想をお願いします」と伝えます。**割引・プレゼント・ポイントなどの見返りはつけません。**\n\n### ⑩ 最新情報（投稿）を出す\n新メニュー・季節の案内・休業のお知らせなどを投稿します。無理のない頻度で、続けられるペースを決めてください。\n\n## 2. やってはいけない5つのこと\n\n| やってはいけないこと | 理由 |\n|---|---|\n| 口コミの見返りに割引・特典を渡す | Google のポリシーでは、見返りを渡して口コミを集めることは禁止。違反すると口コミの削除やプロフィールの制限がありうる（[ポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)） |\n| 家族・スタッフ・業者に口コミを書かせる | 嘘の口コミは禁止 |\n| お店の名前にキーワードを足す | ビジネス名のガイドライン違反 |\n| 実際にない住所で登録する | 所在地のガイドライン違反 |\n| 「★5を集めます」という業者に頼む | 上の違反を代わりにやっていることがある |\n\n## 3. 今日の作業チェックリスト（30分版）\n\n```\n- [ ] 名前が看板どおりか（キーワードが入っていないか）\n- [ ] メインの業種が正しいか\n- [ ] 営業時間・特別営業時間が入っているか\n- [ ] 住所・電話番号がホームページと同じ表記か\n- [ ] 外観・店内・メニューの写真が各1枚以上あるか\n- [ ] お店の説明が入っているか\n- [ ] 返信していない口コミがないか\n- [ ] 口コミのお願いに見返りをつけていないか\n```\n\n## 4. 業者に頼むかどうかの判断\n\n自分で10個をやってから考えても遅くありません。頼むなら、次を確かめてください。\n- 順位を「保証」していないか\n- 口コミをどう集めるのか（見返りや代筆がないか）\n- 何をしてくれて、いくらで、いつ解約できるか\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N007)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ（公開前）\n- ローカル検索のランキング：https://support.google.com/business/answer/7091?hl=ja\n- ビジネス情報のガイドライン：https://support.google.com/business/answer/3038177?hl=ja\n- 業種を管理する：https://support.google.com/business/answer/7249669?hl=ja\n- 写真や動画のポリシー：https://support.google.com/business/answer/7213077?hl=ja\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja\n（この一覧は公開前に消す）", "chars": 3611, "asks": 3}, {"id": "N008", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "やってはいけない口コミ集め：Google のルールと安全な頼み方", "price": 980, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/30）／アカウント：A03／価格：980円\n     編集長へ：Google のヘルプ・消費者庁のページは、公開前に社長が原文を確認する（ライターは検索結果の要約までしか見られていない）。\n     報告の細かい操作手順は原文を確認できなかったため書いていない。「公式ヘルプで手順を確認」としている。MEO ツールの紹介は入れていない（無料相談フォームへの案内だけ入れた）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。口コミを増やしたいけれど、どこまでが OK で、どこからが違反なのか分からない人。\n\n**この記事でできること：** Google が禁止している口コミの集め方が分かります。見返りなしで頼むときの、そのまま使える声かけ・POP・LINE の文面が手に入ります。悪い口コミへの返し方と、嘘っぽい口コミを見つけたときの動き方も分かります。\n\n**筆者について：** 店舗向けに MEO（Googleマップ集客）のツールを案内する仕事をしています。【社長確認：MEO に関わった期間・担当した店舗の数など、確認できる事実だけ】\n\n---\n\n## 口コミは「集め方」で損をする\n\n口コミは、Googleマップでお店を選ぶ人がよく見る場所です。\nだから「早く増やしたい」と思うのは自然です。\n\nただ、集め方をまちがえると逆効果です。\nGoogle は、ルールに合わない口コミを削除します。\n違反が重なると、プロフィールそのものに制限がかかることもあります（[Google ビジネス プロフィールのポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)）。\n\n## やってはいけない4つ（ここだけ覚えてください）\n\nGoogle マップの口コミのルールは「[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)」というページにまとまっています。\nそこでは、実際の体験にもとづかない口コミを「虚偽のエンゲージメント」と呼んで禁止しています。\n\nお店の側でよく起きるのは、次の4つです。\n\n1. **見返りをつける**：「口コミを書いたら1品サービス」「★5で次回割引」など\n2. **嘘の口コミを書く・書かせる**：来ていない人の口コミ、1人で何個も書く口コミ\n3. **家族・スタッフに書かせる**：利害関係のある人の口コミは禁止\n4. **代行業者に頼む**：お金を払って口コミを書いてもらうこと\n\nどれも「悪気がなかった」では通りません。\n迷ったら、**見返りなし・実際に来た人だけ・書くかどうかはお客さんの自由**。この3つで判断してください。\n\n## 安全な頼み方は「一言だけ、見返りなし」\n\nGoogle のヘルプでも、お客さんにリンクや QR コードを渡して口コミをお願いする方法が紹介されています（[クチコミを増やすためのヒント](https://support.google.com/business/answer/3474122?hl=ja)）。\n頼むこと自体は問題ありません。問題になるのは、見返りや、書く中身の指定です。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 見返り・嘘・家族スタッフ・代行業者の4つはやらない\n- 頼むときは「よろしければ」と一言。見返りはつけない\n- 良い口コミだけを選んで頼まない\n\n### 有料部分の目次\n1. 違反になる例・ならない例（早見表）\n2. そのまま使える文面：会計時・POP・LINE\n3. 悪い口コミへの返し方（型と例文）\n4. 嘘っぽい口コミを見つけたとき\n5. 広告のルール（ステマ規制）にも気をつける\n6. お店で共有するチェックリスト\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N008)", "paid": "## 1. 違反になる例・ならない例（早見表）\n\n| やりがちなこと | 判断 | 理由 |\n|---|---|---|\n| 「口コミを書いてくれたらドリンク1杯無料」 | ✕ | 見返りをつけている |\n| 「★5をつけてくれたら次回10%オフ」 | ✕ | 見返り＋評価の指定 |\n| 満足していそうな人にだけ頼む | ✕ | 良い口コミだけを選んで集めるのは禁止 |\n| スタッフが自分のスマホで口コミを書く | ✕ | 利害関係がある |\n| 家族や友人に「書いておいて」と頼む | ✕ | 利害関係がある。来ていない人なら嘘の口コミにもなる |\n| 業者に「口コミ〇件」を頼む | ✕ | お金を払って書かせている |\n| 悪い口コミを消してくれたら返金する、と持ちかける | ✕ | 口コミの修正と引き換えに見返りを渡している |\n| 会計のときに「よろしければ」と QR コードを渡す | ○ | 見返りなし・任意 |\n| レシートやお礼のメッセージにリンクをのせる | ○ | Google のヘルプでも紹介されている方法 |\n| 全部の口コミに返信する | ○ | 良い口コミにも悪い口コミにも返す |\n\nポイントは2つです。\n**「書いたら何かもらえる」をなくすこと。** そして **「書く人を選ばないこと」。**\n\n「良い口コミだけを選んで頼む」のは、うっかりやりがちです。\n満足そうなお客さんにだけ声をかける、アンケートで高い点をつけた人だけに Google のリンクを出す、といったやり方です。\n頼むなら、来てくれた人みんなに同じように頼みます。\n\n## 2. そのまま使える文面\n\n### 会計時の声かけ\n\n```\n本日はありがとうございました。\nもしよろしければ、Googleマップにご感想をいただけると励みになります。\nこちらの QR コードから書けます。もちろん、無理にとは言いません。\n```\n\n言い方のコツは3つです。\n- 「よろしければ」「無理にとは」を入れる（書くかどうかはお客さんの自由）\n- 「★5で」「良いことを」など、評価や中身を指定しない\n- 断られても、表情を変えない\n\n### 店内 POP（レジ横・テーブル）\n\n```\nご感想をお聞かせください\n\nGoogleマップでのご感想は、\nこれから来られる方の参考になります。\n良かったことも、直してほしいことも、\nそのまま書いていただけるとうれしいです。\n\n（QR コード）\n```\n\n「直してほしいことも」と書いておくと、良い口コミだけを求めている印象になりません。\nPOP に「プレゼント」「割引」の文字は入れません。\n\n### LINE（来店後のお礼）\n\n```\n〇〇様\n本日はご来店ありがとうございました。\nもしよろしければ、Googleマップにご感想をいただけるとうれしいです。\n▼こちらから書けます\n（リンク）\n今後ともよろしくお願いいたします。\n```\n\nLINE のクーポン配信と同じメッセージに入れないようにします。\n並べて送ると、「口コミを書いたらクーポン」と受け取られるおそれがあります。\n\nリンクや QR コードの作り方は、Google の公式ヘルプで手順を確認してください（[リンクまたは QR コードを作成してクチコミをリクエストする](https://support.google.com/business/answer/16816815?hl=ja)）。\n\n## 3. 悪い口コミへの返し方\n\n悪い口コミへの返信は、書いた本人だけでなく、**これから来る人が読んでいます。**\n言い返すより、「このお店はちゃんと対応してくれそう」と思ってもらうほうが大事です。\n\n### 返信の型（4行）\n1. お礼：来てくれたこと、書いてくれたことへのお礼\n2. おわび：嫌な思いをさせたことへのおわび（事実を認められる範囲で）\n3. これから：何を直すか、または確認すること\n4. 連絡先：くわしく聞きたいときの窓口（必要なときだけ）\n\n### 例文（待ち時間が長かった、という口コミ）\n\n```\nご来店いただき、またご感想をお寄せいただきありがとうございます。\nお待たせしてしまい、申し訳ございませんでした。\nご予約の入れ方と、お待ちいただくときのご案内を見直します。\nまたお越しいただけた際には、気持ちよくお過ごしいただけるよう努めます。\n```\n\n### 返信でやらないこと\n- お客さんの名前・来店日・施術内容など、個人が分かることを書く\n- 「そんな事実はありません」と言い切って責める\n- 「消してくれたら〇〇します」と持ちかける（見返りになる）\n- 感情的になったまま、その日のうちに返す\n\nすぐに返したくなったら、一晩おいてから、別の人に読んでもらってください。\n\n## 4. 嘘っぽい口コミを見つけたとき\n\n来た記録がない人の口コミや、同じような文の悪い口コミが続く、ということもあります。\n\n### まずやること\n1. **消そうとしない・言い返さない**：口コミに感情的な返信をつけない\n2. **記録を残す**：口コミの画面を保存し、投稿日・内容・気づいたことをメモする\n3. **ルールに当たるか確認する**：「[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)」のどれに当たりそうかを見る。「低い評価だから」「内容が気に入らないから」だけでは、ルール違反にはならない\n4. **Google に報告する**：ビジネスプロフィールの管理画面や Google マップから、ポリシー違反の口コミとして報告できます。**操作の手順は画面が変わることがあるため、公式ヘルプで手順を確認してください**（[ビジネス プロフィール上の不適切なクチコミを報告する](https://support.google.com/business/answer/4596773?hl=ja)／[クチコミの管理](https://support.google.com/business/workflow/9945796?hl=ja)）\n5. **報告の結果を確認する**：報告した口コミがどうなったかも、公式ヘルプの案内に沿って確認します\n\n報告しても、必ず消えるわけではありません。\n消えなかったときは、落ち着いた返信を1つつけておくほうが、読む人には伝わります。\n\n脅しや個人情報が書かれているなど、お店だけで抱えられないときは、弁護士などの専門家に相談してください。\n\n## 5. 広告のルール（ステマ規制）にも気をつける\n\nGoogle のルールとは別に、日本の法律の話もあります。\n2023年10月1日から、広告なのに広告だと分からない表示（いわゆるステルスマーケティング）は、景品表示法の不当表示として規制されています（[消費者庁：令和5年10月1日からステルスマーケティングは景品表示法違反となります](https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing)）。\n\n消費者庁の説明では、SNS の投稿やレビュー投稿も対象になりうるとされています。\nお店がお金や物を渡して、お客さんのふりをした投稿をしてもらう、といったことは避けてください。\n\nここは一般的な注意です。\n自分のお店のやり方が当たるかどうか迷ったら、消費者庁のページを読むか、専門家に確認してください。\n\n## 6. お店で共有するチェックリスト\n\nスタッフ全員で同じやり方にするために、印刷して貼っておけます。\n\n```\n- [ ] 口コミのお願いに、割引・プレゼント・ポイントをつけていない\n- [ ] 「★5で」「良いことを書いて」と言っていない\n- [ ] 満足していそうな人だけに頼んでいない（全員に同じように頼む）\n- [ ] スタッフ・家族・知人が、うちの店の口コミを書いていない\n- [ ] 口コミを書く業者に頼んでいない\n- [ ] POP・LINE に、クーポンと口コミのお願いを並べていない\n- [ ] 悪い口コミにも、4行の型で返信している\n- [ ] 返信に、お客さんの個人情報を書いていない\n- [ ] 嘘っぽい口コミは、記録を残してから公式ヘルプの手順で報告している\n```\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N008)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ・公的ページ（公開前）\n※ ライターの環境では support.google.com を開けなかったため、すべて検索結果の要約で確認しています（原文未確認）。\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja（原文未確認）\n- 禁止および制限されているコンテンツ（マップのユーザー投稿コンテンツ）：https://support.google.com/contributionpolicy/answer/7400114?hl=ja（原文未確認。「虚偽のエンゲージメント」「利益相反」「見返り」「肯定的なクチコミを選択的に募る」の記述があるか）\n- クチコミを増やすためのヒント：https://support.google.com/business/answer/3474122?hl=ja（原文未確認。リンク・QR コードをレシートやメールにのせる例があるか）\n- リンクまたは QR コードを作成してクチコミをリクエストする：https://support.google.com/business/answer/16816815?hl=ja（原文未確認）\n- 不適切なクチコミを報告する：https://support.google.com/business/answer/4596773?hl=ja（原文未確認。報告の手順の書き方をこの記事に足すかどうか）\n- クチコミの管理：https://support.google.com/business/workflow/9945796?hl=ja（原文未確認）\n- 消費者庁 ステルスマーケティング：https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing（原文未確認。施行日 2023年10月1日、レビュー投稿も対象になりうる、の記述）\n（この一覧は公開前に消す）", "chars": 5845, "asks": 3}, {"id": "N009", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "MEO 業者に頼む前に確認する7つのこと", "price": 1480, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/30）／アカウント：A03／価格：1,480円\n     編集長へ：自社でMEOツールを売っているため、自社に有利な書き方になっていないか編集長が確認\n     （特定の業者・ツールの名前は出していない。「業者に頼まず自分でやる」も選択肢として同じ重さで書いた。自社ツールの宣伝は入れていない。ただし社長の指示（9/30）で、最後に自社の無料相談フォームへの案内を入れた。案内の前に「筆者は MEO ツールを扱う会社にいる」ことを必ず明記すること）\n     Google のヘルプは、公開前に社長が原文を確認する（ライターは検索結果の要約までしか見られていない）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。MEO（Googleマップ集客）の業者から営業を受けていて、契約してよいか迷っている人。\n\n**この記事でできること：** 契約の前に業者へ聞くべき7つの質問と、返ってきた答えの見方が分かります。そのまま使える質問リストと、断るときの文面も手に入ります。\n\n**筆者について：** 【社長確認：筆者は MEO ツールを扱う会社にいる。この立場を読者にどう書くか（会社名を出すか・担当した期間など、確認できる事実だけ）】\n\n---\n\n## 先にお伝えしておくこと\n\n筆者は MEO ツールを扱う会社にいます（上の【社長確認】で書き方を決めます）。\nなので、この記事では **特定の業者やツールをすすめません。** 自社の紹介もしません。\n「頼まずに自分でやる」も、同じくらいまっとうな選択肢として書きます。\n\n## 業者選びで困るのは「あとから分かる」こと\n\nMEO の業者は、Googleビジネスプロフィール（Googleマップに出るお店の情報）の手入れを代わりにやってくれます。\nうまく使えば、手間が減ります。\n\n困るのは、契約してから分かることです。\n「解約できない」「プロフィールが自分で触れない」「何をしてくれているのか分からない」。\nどれも、**契約の前に聞いておけば防げる**ことです。\n\n## 確認する7つのこと（見出しだけ）\n\n1. 順位を「保証」していないか\n2. 口コミをどうやって集めるのか\n3. 契約期間と、解約の条件\n4. プロフィールのオーナー権限を誰が持つか\n5. 月額に何が含まれているか\n6. 報告の中身は何か\n7. Google のルールに違反したとき、誰が責任を持つか\n\nこの中で、**一番大事なのは4番です。** オーナー権限は、お店のあなたが持ち続けてください。\n\n## 1つだけ先に：順位の保証は、うたってはいけないこと\n\nGoogle は、代わりにプロフィールを管理する会社（サードパーティ）向けのルールを出しています。\nその中で、**Google での上位掲載を保証することは禁止**とされています（[ビジネス プロフィールのサードパーティ ポリシー](https://support.google.com/business/answer/7353941?hl=ja)）。\n\n順位は Google が決めます。誰にも保証はできません。\n「必ず1位」「上位表示を保証」と言われたら、そこで一度立ち止まってください。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 順位の保証をうたう業者は、Google のルールに合っていない\n- オーナー権限はお店が持ち続ける\n- 契約の前に、解約の条件と月額の中身を紙で確認する\n\n### 有料部分の目次\n1. 7つの質問と、答えの見方\n2. 業者に送る質問リスト（コピーして使える）\n3. オーナー権限を守る手順\n4. 自分でやるか、頼むかの判断\n5. 断るとき・見直すときの文面\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N009)", "paid": "## 1. 7つの質問と、答えの見方\n\n### ① 順位を「保証」していないか\n\n**聞くこと：** 「順位について、どんな約束をしていますか」\n\n**見方：**\n- ○「順位は Google が決めるので保証はできません。やることは〇〇です」\n- ✕「必ず上位に出します」「上がらなければ返金」\n\n返金の約束があっても、保証をうたっていることに変わりはありません。\nサードパーティのポリシーでは、特別な手段で順位を約束したり操作したりすることも認められていません（[サードパーティ ポリシー](https://support.google.com/business/answer/7353941?hl=ja)）。\n\n### ② 口コミをどうやって集めるのか\n\n**聞くこと：** 「口コミは、どんな方法で増やしますか。文面を見せてもらえますか」\n\n**見方：**\n- ○ お客さんに見返りなしでお願いする文面・QR コードを用意する\n- ✕「〇件増やします」「★5を集めます」\n- ✕ 割引や特典と引きかえに書いてもらう\n- ✕ 業者側の人が書く\n\nGoogle マップのルールでは、見返りと引きかえの口コミ、実際の体験にもとづかない口コミ、利害関係のある人の口コミは禁止です（[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)）。\n違反した口コミは削除され、プロフィールに制限がかかることもあります（[ポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)）。\n**件数を約束する業者は、どうやってその件数を出すのか**を必ず聞いてください。\n\n### ③ 契約期間と、解約の条件\n\n**聞くこと：** 「最低契約期間は何か月ですか。途中でやめるとき、いくらかかりますか。何日前までに、どうやって伝えればいいですか」\n\n**見方：**\n- ○ 期間・解約金・連絡方法が、契約書に書いてある\n- ✕ 口頭の説明だけで、書面がない\n- ✕ 自動で更新されるのに、そのことが説明されない\n\n「いつでもやめられます」と言われたら、**それが契約書のどこに書いてあるか**を指で示してもらいます。\n\n### ④ オーナー権限を誰が持つか\n\n**聞くこと：** 「プロフィールのオーナーは誰になりますか。御社にはどの権限を渡せばいいですか」\n\n**見方：**\n- ○ お店がオーナーのまま。業者には「管理者」の権限を渡す\n- ✕ 業者のアカウントを「メインのオーナー」にする\n- ✕ お店の Google アカウントのパスワードを教えてほしいと言われる\n\nGoogle のヘルプでは、プロフィールにはオーナーと管理者がいて、**メインのオーナーは1人だけ**とされています。\n管理者は、オーナーとほぼ同じことができますが、ユーザーの追加・削除や、プロフィールの削除はできません（[オーナーと管理者を管理する](https://support.google.com/business/answer/3403100?hl=ja)）。\n業者の仕事には、ふつう管理者で足ります。\n\n### ⑤ 月額に何が含まれているか\n\n**聞くこと：** 「月額の中で、毎月やってもらえることを全部書き出してもらえますか。別料金になるものはどれですか」\n\n**見方：**\n- ○「投稿は月〇回」「口コミの返信の代行あり・なし」など、回数と範囲が書いてある\n- ✕「総合的に対策します」だけで、中身が分からない\n- ✕ 初期費用・写真撮影・ツール利用料など、あとから別料金が出てくる\n\n回数が書いていないと、何もしていない月があっても確かめられません。\n\n### ⑥ 報告の中身は何か\n\n**聞くこと：** 「毎月の報告書の見本を見せてもらえますか」\n\n**見方：**\n- ○ その月に **やった作業** と、Google のプロフィールで見られる数字（表示回数・電話・ルート検索など）が分かれている\n- ✕ 業者が決めた言葉での「順位」だけ\n- ✕ 見本を出してもらえない\n\n順位は、調べる場所や時間、使う端末で変わります。\n「どの場所から、何という言葉で調べた順位か」も聞いておきます。\nプロフィールの数字は、オーナーのあなたも自分で見られます。業者の報告と見比べてください。\n\n### ⑦ Google のルールに違反したとき、誰が責任を持つか\n\n**聞くこと：** 「御社の作業が原因で、口コミが消えたりプロフィールが止まったりしたら、どう対応しますか」\n\n**見方：**\n- ○ 対応の中身（原因の説明・直す作業・費用の扱い）が契約書に書いてある\n- ✕「そういうことは起きません」で終わる\n- ✕ 責任はすべてお店、と書いてある\n\nプロフィールが止まって困るのは、お店です。\nここを聞いて答えがはっきりしない業者は、ほかの答えも疑ってよいと思います。\n\n## 2. 業者に送る質問リスト（コピーして使える）\n\nメールやフォームで、このまま送れます。**答えを文字でもらう**のが大事です。\n\n```\n〇〇株式会社 〇〇様\n\nご案内ありがとうございます。\n検討のため、次の7点を文書でお教えいただけますでしょうか。\n\n1. 検索順位について、どのようなお約束をされていますか\n2. 口コミはどのような方法で増やしますか（お客様への依頼文の見本があれば添付ください）\n3. 最低契約期間・途中解約の費用・解約の連絡方法と期限\n4. ビジネスプロフィールのオーナーは当店のままですか。御社に付与する権限は何ですか\n5. 月額に含まれる作業（回数）と、別料金になるもの\n6. 毎月の報告書の見本\n7. 御社の作業が原因でプロフィールに制限がかかった場合の対応\n\nお手数をおかけしますが、よろしくお願いいたします。\n（店名・お名前）\n```\n\n## 3. オーナー権限を守る手順\n\n1. **自分のアカウントがオーナーか確かめる**：プロフィールの設定の「ユーザーとアクセス権」の画面で、自分がオーナーになっているかを見る\n2. **業者は「管理者」で追加する**：業者の Google アカウントを、管理者として招待する\n3. **パスワードは渡さない**：お店の Google アカウントのログイン情報は、誰にも教えない\n4. **メインのオーナーを譲らない**：業者から頼まれても、メインのオーナー権限は移さない\n5. **解約したら、業者を外す**：契約が終わったら、業者のアカウントをユーザーから削除する\n\n画面の名前や操作は変わることがあります。**細かい手順は公式ヘルプで確認してください**（[オーナーと管理者を管理する](https://support.google.com/business/answer/3403100?hl=ja)／[メインのオーナー権限を譲渡する](https://support.google.com/business/answer/3415281?hl=ja)）。\n\n## 4. 自分でやるか、頼むかの判断\n\nどちらが正しい、ということはありません。目安だけ書きます。\n\n| 自分でやる向き | 頼む向き |\n|---|---|\n| 毎週すこしでも自分で触る時間をとれる | 手が回らず、何か月も触れていない |\n| 写真や投稿を自分で出したい | 何をすればいいか整理から手伝ってほしい |\n| まずお金をかけずに試したい | 7つの質問に、書面ではっきり答える業者がいる |\n\n先に基本の手入れ（名前・業種・営業時間・写真・口コミの返信）を自分でやってみると、業者の説明が分かりやすくなります。\nやってみてから決めても、遅くはありません。\n\n## 5. 断るとき・見直すときの文面\n\n### 断るとき\n\n```\nご案内ありがとうございました。\n検討しましたが、今回は見送らせていただきます。\n今後のご連絡は控えていただけますと幸いです。\n```\n\n理由を細かく書く必要はありません。\n\n### いま契約中で、見直したいとき\n\n```\nいつもお世話になっております。\n契約内容を確認したく、次の点をお教えください。\n・現在の契約期間の終わりと、解約の連絡期限\n・当店のビジネスプロフィールで、御社に付与している権限\n・この3か月に行った作業の一覧\n```\n\nまず、自分がオーナーのままかを先に確かめてから送ると安心です。\n\n## チェックリスト（契約の前に）\n\n```\n- [ ] 順位の保証をうたっていない\n- [ ] 口コミの集め方に、見返り・件数の約束・代筆がない\n- [ ] 契約期間・解約金・解約の連絡方法が書面にある\n- [ ] オーナーはお店のまま。業者は管理者\n- [ ] 月額の作業の回数と、別料金のものが書面にある\n- [ ] 報告書の見本を見た\n- [ ] 違反が起きたときの対応が書面にある\n```\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N009)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ（公開前）\n※ ライターの環境では support.google.com を開けなかったため、すべて検索結果の要約で確認しています（原文未確認）。\n- サードパーティ ポリシー：https://support.google.com/business/answer/7353941?hl=ja（原文未確認。「上位掲載の保証」「ランキングの約束・操作」の禁止の書き方）\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja（原文未確認）\n- 禁止および制限されているコンテンツ：https://support.google.com/contributionpolicy/answer/7400114?hl=ja（原文未確認）\n- オーナーと管理者を管理する：https://support.google.com/business/answer/3403100?hl=ja（原文未確認。「メインのオーナーは1人」「管理者はユーザーの追加・削除とプロフィールの削除ができない」「設定 → ユーザーとアクセス権」の表記）\n- メインのオーナー権限を譲渡する：https://support.google.com/business/answer/3415281?hl=ja（原文未確認）\n- 報告書で見られる数字（表示回数・電話・ルート検索など）の名前は、いまの管理画面の表記に合わせる\n（この一覧は公開前に消す）", "chars": 5692, "asks": 4}, {"id": "N010", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "引越しが決まったらやること：1か月前から当日までのチェックリスト", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：役所の手続き・期限は WebSearch の検索結果の要約で確かめたもの。公式ページの原文は作業環境から開けなかったため、確認リストの URL はすべて「原文未確認」。公開前に原文と照らしてください\n     締め：この記事はすべてのサービスにつながるため、5つを同じ重さで並べた。紹介料の書き方・仲介手数料無料の条件・フォーム URL は【社長確認】", "free": "**こんな人向け：** 引越しの日が決まった人。やることが多すぎて、何から手を付ければいいか分からない人。\n\n**この記事で分かること：** 1か月前・2週間前・1週間前・前日・当日・引越し後に、それぞれ何をすればいいか。役所の手続きの期限と、オンラインでできること。印刷して使えるチェックリスト。\n\n**結論：** まずは「退去の連絡」と「引越し業者の見積もり」の2つを今日やってください。役所の手続きは、転入届が **引越してから14日以内** という期限だけ覚えておけば、あとは順番どおりで間に合います。\n\n---\n\n## はじめに：順番を決めるのは「相手の都合」です\n\n引越しの準備は、自分だけで終わる作業と、相手（大家さん・管理会社・引越し業者・電気やネットの会社・役所）が必要な作業に分かれます。\n相手が必要な作業ほど、日にちの調整に時間がかかります。だから **相手が必要なものから先に** 連絡します。\n\n荷造りは自分のペースで進められます。後回しでも大丈夫です。\n\n---\n\n## 1か月前：相手のいる連絡から始める\n\n### □ 今の住まいの退去の連絡\n賃貸なら、まず契約書を開いてください。**「解約の予告は何日前まで」** と書いてあります。この期限を過ぎると、住んでいない月の家賃がかかることがあります。\n連絡先（管理会社か大家さんか）と、連絡の方法（電話か書面か）も契約書で確かめます。\n\n### □ 引越し業者の見積もりを取る\n見積もりは **2〜3社から取って比べる** のがおすすめです。同じ荷物でも、会社や日にちで金額や作業内容が変わるためです。\n見積もりのときは、次をメモしておくと比べやすくなります。\n- 引越しの日と時間帯（午前・午後・時間指定なし）\n- 大きな家具・家電の数（冷蔵庫・洗濯機・ベッドなど）\n- 今の住まいと新しい住まいの階数、エレベーターの有無\n\n見積書で確かめたいこと（キャンセル料の扱いなど）は、別の記事「関東の引越し：見積もりの取り方と、費用をおさえる時期・コツ」で詳しく書いています。\n\n### □ 新しい住まいの鍵を受け取る日を確かめる\n引越しの日に鍵がないと、荷物を入れられません。不動産会社に受け取り日と場所を確かめておきます。\n\n---\n\n## 2週間前：ライフラインとネットの申し込み\n\n### □ 電気・ガス・水道の「止める」と「使い始める」\n今の住まいで止める日と、新しい住まいで使い始める日を、それぞれの会社に伝えます。\n- **電気**：契約している電力会社に連絡。新しい住まいで使う電力会社を選び直すこともできます\n- **ガス**：使い始めるときに **係の人の立ち会いが必要なことが多い** ので、引越し当日か翌日に予約を入れておきます\n- **水道**：新しい住まいの地域の水道局（自治体のページに連絡先があります）に連絡します\n\n### □ インターネット回線\nネット回線は、**開通工事が必要な場合があり、時期によっては申し込みから開通まで日にちがかかることがあります。** 在宅勤務の人や、スマホの通信量が気になる人は、ここを早めに申し込むと安心です。\n今の回線を続けるなら「移転」の手続き、変えるなら「新しい申し込み」と「今の回線の解約」の2つが必要です。解約の手続きで違約金や撤去の扱いがどうなるかは、契約している会社の公式サイトで確かめてください。\n\n### □ 転出届（別の市区町村に引越す人）\n今住んでいる市区町村に出します。窓口で出すと「転出証明書」がもらえ、新しい住所の役所に持っていきます。\n転出届を出せる時期は自治体のページで確かめてください（引越しの前に出せる期間が決まっています）。\n\n**マイナンバーカードがある人は、オンラインでもできます。** デジタル庁の「引越しワンストップサービス」で、マイナポータルから転出届を出し、新しい住所の役所へ行く日を予約できます。この場合は、今の住所の役所に行く必要はありません。ただし **転入届は、新しい住所の役所に自分で行って出します。**\n\n同じ市区町村の中で引越す人は、転出届はいりません。引越してから「転居届」を出します。\n\n---\n\n## 1週間前：郵便と、細かい住所変更\n\n### □ 郵便の転送（日本郵便の e転居）\n日本郵便の「e転居」は、Webサイトや郵便局アプリから転居届を出せる無料のサービスです。**届け出た日から1年間**、前の住所あての郵便物を新しい住所に転送してもらえます。\n「転送を始めたい日から1年」ではなく「届け出た日から1年」なので、そこだけ注意です。登録には日にちがかかることがあるので、早めに出しておきます。\n\n### □ 住所を登録しているところの一覧を作る\n銀行・クレジットカード・スマホ・保険・通販サイトなど。1週間前に一覧を作っておくと、引越し後に順番に変えるだけで済みます。\n\n### □ 荷造りの仕上げと、いらない物の処分\n粗大ごみは、自治体によって予約が必要です。収集日が引越しに間に合うか、自治体のページで確かめてください。\n\n---\n\n## 前日：当日に慌てないための準備\n\n### □ 冷蔵庫の電源を抜く・洗濯機の水を抜く\nどちらも取扱説明書に手順が書いてあります。冷蔵庫は霜取りと水受けの水を捨てるところまで。\n\n### □ 当日すぐ使う物を1つの箱にまとめる\nトイレットペーパー・タオル・スマホの充電器・カーテン・はさみ・常備薬・その夜の着替え。この箱には大きく印をつけて、最後に積んでもらいます。\n\n### □ 鍵・契約書・貴重品は自分で持つ\n現金・通帳・印鑑・マイナンバーカード・新しい住まいの鍵は、業者に預けず手元に置きます。\n\n---\n\n## 当日：立ち会いと確認\n\n### □ 今の住まいの退去の立ち会い\n部屋の傷や汚れを管理会社と一緒に確かめます。気になるところは、その場で写真を撮っておくと後で話がしやすくなります。\n\n### □ 荷物の積み残しがないか確かめる\n押し入れ・ベランダ・玄関の靴箱まで、最後に自分の目で見ます。\n\n### □ 新しい住まいで、荷物と家具の傷を確かめる\n荷物が届いたら、家具や家電に傷がないか、その日のうちに見ておきます。\n\n### □ 電気のブレーカーを上げる・ガスの開栓に立ち会う\n予約した時間に立ち会えるよう、スマホの予定に入れておきます。\n\n---\n\n## 引越し後：期限のある手続きから\n\n### □ 転入届（引越してから14日以内）\n住民基本台帳法で、**転入した日から14日以内** に新しい住所の市区町村に届け出ることになっています。窓口には転出証明書を持って行きます（ワンストップサービスを使った人は、マイナンバーカードを持って行きます）。\n同じ市区町村の中で引越した人の「転居届」も、引越してから14日以内です。\n\n### □ マイナンバーカードの住所の変更\n転入届と同じときに、窓口でカードの住所を書き換えてもらいます。マイナンバーカードを持って行ってください。\n\n### □ 運転免許証の住所変更\n免許証の住所は、引越したら **速やかに** 新しい住所の警察署や運転免許センターなどで変更の届けを出すことになっています。必要な書類（新しい住所が分かる書類など）は、都道府県の警察のページで確かめてください。\nマイナ免許証の人は、手続きの流れが違う場合があります。これも都道府県の警察のページで確かめてください。\n\n### □ そのほかの住所変更\n1週間前に作った一覧を上から順に変えていきます。国民健康保険や子どもの手当など、自治体の手続きが必要な人は、転入届のときに窓口でまとめて聞くと早いです。\n\n---\n\n## よくある失敗\n\n**1. 退去の予告の期限を過ぎていた**\n契約書を見ないまま日にちを決めて、住んでいない期間の家賃がかかってしまうことがあります。退去の連絡は、引越しが決まったその日にしてください。\n\n**2. ガスの開栓を予約していなかった**\n引越しの夜にお風呂が使えない、というのはよくあります。ガスは立ち会いが必要なことが多いので、電気・水道と一緒に2週間前に予約してください。\n\n**3. 転入届を後回しにして14日を過ぎそうになった**\n引越し後は片付けで忙しく、役所に行く日がなかなか取れません。引越しの前に「この日に役所へ行く」と予定に入れておくと安心です。\n\n---\n\n## 印刷用チェックリスト\n\n```\n【1か月前】\n□ 退去の連絡（契約書で「解約予告の期限」を確認）\n□ 引越し業者の見積もりを2〜3社から取る\n□ 新しい住まいの鍵を受け取る日を確認\n\n【2週間前】\n□ 電気：止める日・使い始める日を連絡\n□ ガス：止める日・開栓の立ち会いを予約\n□ 水道：新しい地域の水道局に連絡\n□ インターネット回線：移転 or 新規申し込み＋解約\n□ 転出届（別の市区町村へ／マイナポータルでも可）\n\n【1週間前】\n□ 郵便の転送（e転居）\n□ 住所変更が必要なところの一覧を作る\n□ 粗大ごみの予約・荷造りの仕上げ\n\n【前日】\n□ 冷蔵庫の電源を抜く・洗濯機の水抜き\n□ 当日すぐ使う物の箱を作る\n□ 鍵・契約書・貴重品・マイナンバーカードを手元に\n\n【当日】\n□ 退去の立ち会い（気になる所は写真）\n□ 積み残しの確認\n□ 新居で荷物・家具の傷を確認\n□ ブレーカー・ガス開栓の立ち会い\n\n【引越し後】\n□ 転入届・転居届（引越してから14日以内）\n□ マイナンバーカードの住所変更\n□ 運転免許証の住所変更（速やかに）\n□ 銀行・カード・スマホ・保険などの住所変更\n```\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n「どこに何を連絡すればいいか分からない」「電気もネットも業者も、まとめて決めたい」という方は、ご相談ください。\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き【社長確認：対応できる範囲】\n- インターネット回線（フレッツ光・ドコモ光・auひかり・ソフトバンク光 など）\n- ウォーターサーバー【社長確認：紹介できるサービス】\n- 関東の引越し業者のご紹介【社長確認：提携業者の範囲】\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：紹介料の有無と書き方】\n\n▶ **[引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N010)**\n\n---\n\n## 確認リスト（公開前に消す）\n\n### 出典（すべて原文未確認：検索結果の要約で確認。公式ページは作業環境から開けなかった）\n- 転入届は転入した日から14日以内（住民基本台帳法第22条）・住所の異動届：総務省 https://www.soumu.go.jp/menu_kyotsuu/important/topics081127.html （原文未確認）\n- 住民基本台帳制度の各種届出（転居届の期限も確認）：総務省 https://www.soumu.go.jp/main_content/000753608.pdf （原文未確認）\n- 引越しワンストップサービス（転出届のオンライン提出・来庁予約、転入届は来庁）：マイナポータル https://myna.go.jp/html/moving_oss.html （原文未確認）\n- 同上・デジタル庁のお知らせ：https://digital-agency-news.digital.go.jp/articles/2025-02-06 （原文未確認）\n- e転居（無料・届出日から1年間転送）：日本郵便 https://www.post.japanpost.jp/service/tenkyo/index.html （原文未確認）\n- 運転免許証の記載事項変更（速やかに・新住所地の公安委員会）：例 神奈川県警 https://www.police.pref.kanagawa.jp/tetsuzuki/menkyo/mes83004.html ／埼玉県警 https://www.police.pref.saitama.lg.jp/f0110/menkyo/kisaihenko.html （原文未確認）\n\n### ジンに確かめてほしいこと\n- [ ] 転出届を出せる時期（「引越しの14日前から」は民間サイトの説明のみ。記事では自治体で確認と書いた）\n- [ ] マイナンバーカードの住所変更（転入届と同時・カードの持参）の書き方でよいか。継続利用の期限は確認できず書いていない\n- [ ] 同じ市区町村内の転居届も14日以内でよいか\n- [ ] ガスの開栓は立ち会いが必要な「ことが多い」の表現でよいか\n- [ ] マイナ免許証の住所変更の流れ（ワンストップで済む場合がある）\n\n### 【社長確認】\n- [ ] 締めの5サービスの条件・範囲（knowledge.md が未記入）\n- [ ] 仲介手数料を無料にできる条件と、宅建業の免許の表示\n- [ ] 紹介料の有無と書き方\n- [ ] 引越し相談フォームの公開 URL", "paid": "", "chars": 5229, "asks": 7}, {"id": "N011", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "仲介手数料はなぜ「無料」にできるのか：仕組みと確かめたい3つのこと", "price": 0, "status": "校正待ち", "writer": "アオイ", "memo": "状態：校正待ち（ライター：アオイ・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長へ：法律・告示の数字は国土交通省の告示を WebSearch で確かめたもの。国交省・e-Gov のページは取得がブロックされたため、原文は未確認（下の確認リスト参照）。自社で仲介手数料を無料にできる条件・免許（自社か提携先か）・紹介料の書き方は【社長確認】。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 賃貸の部屋探しをしていて、「仲介手数料無料」という表示を見かけた人。安いのはうれしいけれど、なぜ無料にできるのか、あとで別の費用がかからないのか気になる人。\n\n**この記事で分かること：** 賃貸の仲介手数料の上限が法律でどう決まっているか。無料にできるのはどんな仕組みか。申し込む前に確かめたい3つのこと。\n\n**結論：** 仲介手数料には法律で上限があり、それを「誰が」払うかで借りる人の負担が変わります。無料そのものは珍しい話ではありません。大事なのは、**①どの物件が対象か ②手数料以外に何の費用がかかるか ③それが書面に書いてあるか** の3つを、申込の前に確かめることです。\n\n---\n\n## まず知っておくこと：仲介手数料には「上限」がある\n\n仲介手数料は、不動産会社が部屋探しを手伝い、契約をまとめたことへの報酬です。この報酬の額は、会社が自由に決められるわけではありません。\n\n宅地建物取引業法 第46条では、不動産会社（宅地建物取引業者）が受け取れる報酬の額は国土交通大臣が定めること、そしてその額を超えて受け取ってはいけないことが決められています。事務所ごとに、見やすい場所へ報酬の額を掲げることも決まっています。\n\nその「大臣が定めた額」が、国土交通省の告示「宅地建物取引業者が宅地又は建物の売買等に関して受けることができる報酬の額」です。この告示では、賃貸の仲介について、おおむね次のように決められています。\n\n- 貸す人（貸主）と借りる人（借主）の **双方から受け取る報酬の合計** は、**家賃の1か月分に1.1を掛けた額まで**（1.1は消費税相当を含めた数字です）\n- 住まい（居住用の建物）の場合、**どちらか一方から受け取れるのは、家賃の1か月分に0.55を掛けた額まで**。ただし、仲介を頼むときに、その依頼者の承諾を得ている場合は別です\n\nつまり、ルールの上では「貸主と借主で合わせて1か月分（＋消費税相当）まで」が上限です。住まいの場合は「片方ずつ半月分（＋消費税相当）」が原則で、承諾があれば片方がもっと多く払う形もありえます。\n\nなお、この告示は2024年に改正され、長い間使われていない空き家などについて、貸主から受け取れる報酬の特例が加わりました。ふつうの賃貸の部屋探しで気にする場面は多くありませんが、「告示は変わることがある」と覚えておくと安心です。\n\nここで大事なのは、**上限が決まっているのは「合計」**だという点です。合計の中で、貸主と借主がどう分けるかによって、借りる人の負担は変わります。\n\n## なぜ「無料」にできるのか：受け取る先がちがう\n\nでは、仲介手数料を「無料」にできるのはなぜでしょうか。一般的には、次のような形が考えられます。\n\n### 1. 貸主の側から報酬を受け取っている\n上の告示のとおり、報酬は「双方から受け取る合計」で上限が決まっています。そのため、**貸主の側から報酬を受け取り、借主からは受け取らない**という形があります。この場合、借りる人の仲介手数料は0円になります。\n\n貸主にとっては、早く入居者が決まることに価値があります。空室の期間が短くなるなら、そのぶん費用を出してもよい、と考える貸主もいます。\n\n### 2. 会社が自分の判断で、借主の分を受け取らない\n告示が決めているのは「上限」です。上限より少なく受け取ること、受け取らないことは、会社の判断でできます。集客のために、借主の手数料を受け取らないと決めている会社もあります。\n\n### 3. 物件や時期によって条件がちがう\n同じ会社でも、「この物件は無料、この物件は通常どおり」と分かれていることがあります。どの物件で無料にできるかは、貸主との取り決めによって変わるためです。\n\nどの形でも、仕組みそのものはルールの中の話です。ただし、**「無料」という言葉だけでは、どの形なのか、あなたが借りたい部屋が対象なのかは分かりません。** だからこそ、次の3つを確かめます。\n\n## 申し込む前に確かめたい3つのこと\n\n### 確かめること1：その物件が「無料」の対象か\n「仲介手数料無料」と書いてあっても、すべての物件が対象とは限りません。\n\n- 無料になるのは、どの物件か（あなたが気になっている部屋は入っているか）\n- 無料になる条件は何か（申込の時期、契約の形など、条件がついていないか）\n- 無料なのは「仲介手数料の全額」か「一部」か\n\n聞き方の例：「この部屋は、仲介手数料が無料の対象ですか。条件があれば教えてください」\n\n気をつけたいのは、**無料の物件だけをすすめられて、ほかの候補が見えにくくなる**ことです。無料かどうかは大事な条件の一つですが、住み心地や家賃、通勤の便と合わせて比べてください。仲介手数料が無料でも、家賃や他の費用で差が出ることはあります。\n\n### 確かめること2：仲介手数料以外に、何の費用がかかるか\n初期費用は、仲介手数料だけではありません。一般的に、次のような費用が見積もりに入ることがあります。\n\n- 敷金・礼金\n- 前家賃（入居する月・翌月の家賃）、日割り家賃\n- 家賃保証会社の保証料\n- 火災保険料\n- 鍵の交換費用\n- 事務手数料・書類作成費など、会社ごとの名前の費用\n- 室内の消毒・抗菌、24時間の駆けつけサポートなどのオプション\n\nここで確かめたいのは、**一つずつ「何の費用か」「必須か、選べるものか」「誰が決めた費用か（貸主か、不動産会社か）」**です。\n\nたとえば、鍵の交換は防犯のために大事ですが、費用を誰が負担するかは物件によってちがいます。消毒やサポートのオプションは、付けるかどうかを選べる場合もあります。分からない項目は、遠慮せずに聞いて大丈夫です。\n\n聞き方の例：「この見積もりの中で、付けるかどうか選べる項目はありますか」「事務手数料は、何に対する費用ですか」\n\n仲介手数料が無料でも、ほかの項目が増えていれば、合計は変わりません。**比べるときは、項目ではなく「初期費用の合計」で比べる**のがコツです。\n\n### 確かめること3：書面に書いてあるか\n口で「無料です」と言われても、書面に残っていなければ、あとで食いちがったときに困ります。\n\n- **初期費用の見積書**：項目ごとの金額が書いてあるか。仲介手数料が0円と書いてあるか\n- **重要事項説明（重説）**：宅地建物取引業法 第35条で、契約の前に、宅地建物取引士が書面を渡して説明することになっています。家賃以外にかかるお金、解約のときの決まりなどもここで確かめられます\n- **契約の内容を書いた書面**：同じ法律の第37条で、契約が成立したら、家賃の額や支払い方法などを書いた書面を渡すことになっています\n\n聞き方の例：「見積書をいただけますか」「重要事項説明の書面は、事前に見せてもらえますか」\n\n重要事項説明は、その場で初めて読むと、分からない言葉が多くて聞き流してしまいがちです。**事前に書面をもらい、気になるところに印をつけておく**と、説明の時間に質問できます。\n\n## 申込前のチェックリスト（仲介手数料「無料」の物件）\n\n```\n□ 気になっている部屋が「仲介手数料無料」の対象か、聞いた\n□ 無料の条件（時期・契約の形など）を聞いた\n□ 無料なのは全額か一部か、確かめた\n□ 初期費用の見積書をもらった\n□ 見積もりの項目ごとに「何の費用か」を聞いた\n□ 付けるかどうか選べる項目（オプション）を確かめた\n□ 鍵交換・保証料・火災保険の扱いを確かめた\n□ ほかの候補の部屋と「初期費用の合計」で比べた\n□ 重要事項説明の書面を、できれば事前にもらった\n□ 不動産会社の免許番号（宅地建物取引業の免許）を確かめた\n```\n\n最後の項目について：不動産会社は、宅地建物取引業の免許を受けて営業しています。免許番号は、会社のホームページや店頭、広告などに書かれていることが多いので、一度目を通しておくと安心です。\n\n## よくある失敗\n\n### 失敗1：「無料」の表示だけで決めてしまう\n広告で「仲介手数料無料」を見て問い合わせたら、気になっていた部屋は対象外だった、ということがあります。問い合わせのときに、**部屋を指定して**「この部屋は対象ですか」と聞くと、話が早く進みます。\n\n### 失敗2：見積もりを「仲介手数料」の欄だけ見てしまう\n仲介手数料の欄が0円でも、ほかの項目の合計で、別の会社と変わらないこともあります。**合計を見る、項目の意味を聞く**。この2つで、比べやすくなります。\n\n### 失敗3：重要事項説明をその場で聞き流す\n説明は長く、専門用語も多いものです。分からないまま署名してしまうと、あとで「聞いていなかった」となりがちです。事前に書面をもらう、分からない言葉はその場で聞く、を意識してください。\n\n## まとめ\n\n- 賃貸の仲介手数料は、法律と国土交通省の告示で上限が決まっている（貸主と借主の合計で、家賃1か月分に1.1を掛けた額まで。住まいは原則として片方ずつ0.55を掛けた額まで）\n- 「無料」は、貸主の側から受け取る、会社が借主の分を受け取らない、などの形で成り立つ\n- 申込の前に、**①対象の物件か ②ほかの費用の内訳 ③書面** の3つを確かめる\n\n今日できることは、気になっている部屋を1つ決めて、「この部屋は仲介手数料の対象ですか」「見積書をいただけますか」と聞いてみることです。\n\n---\n\n## 引越しのこと、まとめて相談できます\nお部屋探しの段階から相談できます。仲介手数料を無料にできる物件があり、どの物件が対象か・ほかにかかる費用は何かを、申込の前にご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N011)\n\n---\n\n## 確認リスト（公開前に消す）\n\n### 出典（公式）\n- 宅地建物取引業法 第46条（報酬）・第35条（重要事項の説明）・第37条（書面の交付）：e-Gov 法令検索 https://laws.e-gov.go.jp/law/327AC1000000176 【原文未確認：取得がブロックされたため WebSearch の要約で確認。条文の言い回しを公開前に確認】\n- 国土交通省告示「宅地建物取引業者が宅地又は建物の売買等に関して受けることができる報酬の額」（昭和45年建設省告示第1552号、最終改正 令和6年6月21日 国土交通省告示第949号、令和6年7月1日施行）：https://www.mlit.go.jp/notice/noticedata/sgml/1970/26197000/26197000.html 【原文未確認：「双方の合計で借賃1か月分×1.1以内」「居住用は一方から×0.55以内（承諾がある場合を除く）」「長期の空家等の特例」は WebSearch の要約と都道府県ページで確認。告示の本文で公開前に確認】\n- 国土交通省「宅地建物取引業法関係」：https://www.mlit.go.jp/totikensangyo/const/1_6_bt_000266.html 【原文未確認】\n- 参考（都道府県の告示掲載ページ）：大阪府 https://www.pref.osaka.lg.jp/o130200/kenshin/kokuji/index.html ／茨城県 https://www.pref.ibaraki.jp/doboku/kenshi/kansatsu/kansatsumennkyohp/takkenn/hoshugaku.html 【原文未確認】\n- 国土交通省「重要事項説明・書面交付制度の概要」（資料）：https://www.mlit.go.jp/totikensangyo/const/content/001477450.pdf 【原文未確認】\n- 「1.1は消費税相当を含めた数字」という説明：告示本文で公開前に確認\n- 不動産の広告で「仲介手数料無料」と書くときの決まり：不動産の表示に関する公正競争規約（不動産公正取引協議会連合会）を公開前に確認（本文では広告の書き方には触れていない）\n\n### 【社長確認】\n- 自社で仲介手数料を無料にできる条件（対象の物件・誰から手数料を受け取るか）\n- 宅地建物取引業の免許：自社の免許番号か、提携先か。記事での表示の仕方\n- 紹介料を受け取るか、その書き方\n- 引越し相談フォームの URL（?src=N011 を付ける）\n\n### 点検（moving/review.md）\n- [x] 法律・告示は公式ページの出典つき（原文未確認の箇所は上に明記）\n- [x] 「仲介手数料無料」に条件（対象物件・誰から受け取るか）を書いた。免許・提携先は【社長確認】\n- [x] 他社の料金・キャンペーンを断定していない\n- [x] 締めに「筆者の会社が紹介していること」「紹介料を受け取る場合があること」がある\n- [x] フォームのリンクに ?src=N011\n- [x] ng-words の言葉なし（「必ず安くなる」「0円」だけ、「今だけ」なし）。不安をあおっていない\n- [x] チェックリストが1つある\n- [x] 制度確認（ジン）の「制度確認：OK」→ 9/30 済み（原文未確認の出典は公開前に確認）", "paid": "", "chars": 5629, "asks": 6}, {"id": "N012", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "部屋探しで損をしないために、内見と申込の前に見る10のこと", "price": 0, "status": "校正待ち", "writer": "アオイ", "memo": "状態：校正待ち（ライター：アオイ・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長へ：法律・ガイドラインの記述は WebSearch で確かめたもの。国交省・e-Gov のページは取得がブロックされたため、原文は未確認（下の確認リスト参照）。自社の物件紹介の条件・免許・紹介料の書き方は【社長確認】。フォームの URL は公開後に入れる", "free": "**こんな人向け：** これから賃貸の部屋を内見する人。間取り図と写真では良さそうだけれど、住んでから「こんなはずじゃなかった」とならないか不安な人。\n\n**この記事で分かること：** 内見の現地で見ること6つと、申込の前に聞いておくこと4つ。そのまま印刷して持っていけるチェックリスト。\n\n**結論：** 内見では「部屋の広さ」より、**日当たり・音・水回り・収納・電波・ネット回線**の6つを自分の目と耳で確かめます。申込の前には、**ゴミ出し・初期費用の内訳・解約の条件・周りの環境**の4つを聞いて、書面で確かめます。\n\n---\n\n## 内見の前に準備しておくもの\n\n内見の時間は、思ったより短く感じるものです。見るものを決めてから行くと、見落としが減ります。\n\n- この記事の最後のチェックリスト（印刷するか、スマホに保存）\n- スマホ（写真・動画・電波の確認・方位の確認に使います）\n- メジャー（家具や家電が入るかを測ります）\n- 今の部屋で使っている大きな家具・家電のサイズのメモ\n\n写真は、部屋全体だけでなく、コンセントの位置、窓、水回り、収納の中も撮っておくと、あとで比べるときに助かります。撮影してよいかは、案内してくれる担当者に一言聞いてからにしましょう。\n\n## 内見で見ること（現地で確かめる6つ）\n\n### 1. 日当たり\n間取り図の「南向き」だけでは、実際の明るさは分かりません。向かいの建物との距離や、窓の大きさで大きく変わります。\n\n- 窓の外に、光をさえぎる建物がないか\n- 部屋の奥まで光が入るか\n- スマホのコンパスで、窓の向きを確かめる\n\n内見の時間帯によって見え方は変わります。気になる部屋なら、**住んだときに家にいる時間帯**に、外から建物を見に行くのもひとつの方法です。\n\n### 2. 騒音\n音は、写真では分からない項目です。\n\n- 窓を閉めた状態と開けた状態で、外の音を聞き比べる\n- 近くに線路・大きな道路・お店・学校などがないか\n- 廊下や上の階から、足音や話し声が聞こえないか\n- 壁を軽くたたいてみて、隣との壁の感じを確かめる（強くたたかない）\n\n昼と夜で音の様子がちがう場所もあります。帰りに、建物のまわりを少し歩いてみると参考になります。\n\n### 3. 水回り（キッチン・お風呂・トイレ・洗面所）\n毎日使う場所なので、使いにくさが積み重なります。\n\n- 水を出してみてよいか聞き、水の出方と、排水の流れを確かめる\n- 排水口のにおいがしないか\n- カビや水あかの跡がないか\n- 洗濯機置き場が室内か外か、洗濯機のサイズが入るか（メジャーで測る）\n- 冷蔵庫を置く場所の幅と、コンセントの位置\n\n### 4. 収納\n「収納あり」でも、奥行きや高さで使い勝手は変わります。\n\n- クローゼットや押し入れの幅・奥行き・高さを測る\n- 扉の開き方（家具を置くと開かなくならないか）\n- 今持っている荷物が入りそうか。入らない分をどこに置くか\n\n### 5. スマホの電波\n意外と見落とされやすい項目です。建物の中や、部屋の場所によって電波の入り方がちがうことがあります。\n\n- 部屋の中、特に窓から遠い場所や、お風呂・トイレで電波の表示を見る\n- 可能なら、その場で短く電話をかけたり、ウェブページを開いたりしてみる\n\n家で仕事をする人や、固定回線を引かずにスマホで済ませたい人は、特に大事です。\n\n### 6. インターネット回線の対応\n部屋に入ってからでは変えにくいのが、ネット回線です。\n\n- 建物にどの回線が引かれているか（管理会社や担当者に聞く）\n- 「インターネット無料」「ネット対応」の表示がある場合、どんな形の回線か、自分で契約する必要があるか\n- 自分で回線を引きたい場合、工事をしてよいか（貸主の許可が要るか）\n- 部屋のどこに回線の差し込み口があるか\n\n回線の種類や料金は、回線会社によってちがい、すぐ変わります。最新の内容は、各社の公式サイトで確かめてください。\n\n## 申込の前に聞くこと（確かめる4つ）\n\n### 7. ゴミ出しのルール\n住んでから毎週関わることです。\n\n- 建物のゴミ置き場はどこか。いつでも出せるのか、曜日と時間が決まっているのか\n- ゴミ置き場がきれいに使われているか（建物の管理の様子も分かります）\n- 分別のルール（自治体によってちがいます。住む予定の自治体の公式ページで確かめます）\n\n### 8. 初期費用の内訳\n申込の前に、**見積書**をもらいます。一般的に、次のような項目が入ることがあります。\n\n- 敷金・礼金\n- 前家賃・日割り家賃\n- 仲介手数料\n- 家賃保証会社の保証料\n- 火災保険料\n- 鍵の交換費用\n- 事務手数料や、消毒・サポートなどのオプション\n\n一つずつ「何の費用か」「必須か、選べるか」を聞いてください。ほかの部屋と比べるときは、**項目ではなく合計で比べる**と分かりやすくなります。\n\nなお、仲介手数料には法律で上限があります（宅地建物取引業法 第46条と、国土交通省の告示）。仕組みは別の記事「仲介手数料はなぜ『無料』にできるのか」で説明しています。\n\n### 9. 解約の条件（出るときのこと）\n入るときに、出るときのことも確かめておきます。\n\n- 解約するとき、何か月前（何日前）までに伝える決まりか\n- 決まった期間より早く出ると、違約金がかかる決まり（短期解約の特約）があるか\n- 退去のときの原状回復（部屋を元に戻すこと）で、借りる人が負担する範囲。特約があるか\n- 更新のときにかかる費用があるか\n\n原状回復については、国土交通省が「原状回復をめぐるトラブルとガイドライン」を出しています。ふつうに暮らしていて起きる傷みや、時間がたって古くなった分をどう考えるかの目安がまとめられています。契約書の特約とあわせて、一度目を通しておくと安心です。\n\nこれらは、契約の前の**重要事項説明**（宅地建物取引業法 第35条）でも説明されます。その場で初めて聞くと流してしまいがちなので、**事前に書面をもらって、気になるところに印をつけておく**のがおすすめです。\n\n### 10. 周りの環境\n部屋の中だけでなく、毎日通る道も「住まい」の一部です。\n\n- 駅やバス停までの道：実際に歩いてみる。坂や暗い道がないか\n- スーパー・コンビニ・病院・役所など、よく使う場所までの距離\n- 夜の様子：街灯、人通り\n- 災害のリスク：国土交通省の「ハザードマップポータルサイト」で、洪水・土砂災害などの情報を確かめる\n\n災害のリスクについては、賃貸の契約でも、重要事項説明で水害ハザードマップ上の物件の位置を説明することになっています（2020年8月から）。ただ、契約の直前に知るより、部屋を選ぶ段階で自分で見ておくほうが、落ち着いて比べられます。\n\n## 印刷して持っていくチェックリスト\n\n```\n【内見で見る】\n□ 1 日当たり：窓の向き／前の建物との距離／部屋の奥まで明るいか\n□ 2 騒音：窓を閉めて・開けて聞く／線路・道路・お店／上や隣の音\n□ 3 水回り：水の出方・排水／におい／カビ／洗濯機・冷蔵庫の幅\n□ 4 収納：幅・奥行き・高さを測った／扉の開き方\n□ 5 スマホの電波：部屋の奥・お風呂・トイレで確かめた\n□ 6 ネット回線：建物の回線／自分で契約か／工事の可否／差し込み口の位置\n\n【申込の前に聞く】\n□ 7 ゴミ出し：置き場の場所／出せる曜日・時間／分別（自治体のページ）\n□ 8 初期費用：見積書をもらった／項目ごとの意味と、選べる項目を聞いた\n□ 9 解約の条件：解約の予告期間／短期解約の違約金／原状回復の特約／更新費用\n□ 10 周りの環境：駅までの道／買い物・病院／夜の様子／ハザードマップ\n\n【最後に】\n□ 気になる点を写真とメモに残した\n□ 重要事項説明の書面を、できれば事前にもらった\n\nメモ：\n_____________________________________________\n_____________________________________________\n```\n\n## よくある失敗\n\n### 失敗1：写真と間取り図だけで決めてしまう\n写真は、広く明るく見えるように撮られていることが多いものです。音・におい・電波は、現地でしか分かりません。**気になる部屋は、できるだけ自分で見に行く**のが確実です。\n\n### 失敗2：家具・家電のサイズを測っていない\n「冷蔵庫が入らない」「洗濯機置き場に合わない」は、引越しの当日に気づくと大変です。内見の前に今の家具のサイズをメモし、現地で測りましょう。\n\n### 失敗3：出るときの条件を見ていない\n入るときの費用ばかり見て、解約の予告期間や短期解約の違約金、原状回復の特約を見落とすことがあります。**契約の前に、出るときのことも聞く**。これだけで、あとの行き違いを減らせます。\n\n## まとめ\n\n- 内見では、日当たり・騒音・水回り・収納・スマホの電波・ネット回線の6つを、自分の目と耳で確かめる\n- 申込の前に、ゴミ出し・初期費用の内訳・解約の条件・周りの環境の4つを聞き、書面で確かめる\n- チェックリストを印刷して持っていけば、短い内見でも見落としが減る\n\n今日できることは、今の部屋の大きな家具・家電のサイズを測って、メモしておくことです。\n\n---\n\n## 引越しのこと、まとめて相談できます\nお部屋探しの段階から相談できます。内見の前に、候補の部屋の初期費用や契約の条件を一緒に確かめます。仲介手数料を無料にできる物件もあります（条件は物件によって違うため、ご相談のときにご説明します）。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N012)\n\n---\n\n## 確認リスト（公開前に消す）\n\n### 出典（公式）\n- 宅地建物取引業法 第35条（重要事項の説明）・第46条（報酬）：e-Gov 法令検索 https://laws.e-gov.go.jp/law/327AC1000000176 【原文未確認：取得がブロックされたため WebSearch の要約で確認】\n- 国土交通省告示「宅地建物取引業者が宅地又は建物の売買等に関して受けることができる報酬の額」：https://www.mlit.go.jp/notice/noticedata/sgml/1970/26197000/26197000.html 【原文未確認】\n- 国土交通省「原状回復をめぐるトラブルとガイドライン」：https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000021.html 【原文未確認：本文の「ふつうに暮らして起きる傷み・古くなった分の目安」という説明が、ガイドラインの内容と合っているか公開前に確認】\n- 国土交通省 報道発表「不動産取引時において、水害ハザードマップにおける対象物件の所在地の説明を義務化」：https://www.mlit.go.jp/report/press/totikensangyo16_hh_000205.html 【原文未確認：令和2年8月28日施行・賃貸借も対象、は WebSearch の要約で確認】\n- 国土交通省「ハザードマップポータルサイト」：https://disaportal.gsi.go.jp/ 【原文未確認：サイト名と URL を公開前に確認】\n- ゴミの分別：住む予定の自治体の公式ページ（記事では特定の自治体に触れていない）\n- 不動産の広告の決まり（「仲介手数料無料」の表示）：不動産の表示に関する公正競争規約（不動産公正取引協議会連合会）を公開前に確認\n\n### 【社長確認】\n- 自社で仲介手数料を無料にできる条件（対象の物件・誰から手数料を受け取るか）\n- 宅地建物取引業の免許：自社の免許番号か、提携先か。記事での表示の仕方\n- 内見前の相談で、実際に何ができるか（初期費用・契約条件の確認の手伝いなど）\n- 紹介料を受け取るか、その書き方\n- 引越し相談フォームの URL（?src=N012 を付ける）\n- 本文中の N011 への言及：公開順・リンクの付け方\n\n### 点検（moving/review.md）\n- [x] 法律・ガイドラインは公式ページの出典つき（原文未確認の箇所は上に明記）\n- [x] 「仲介手数料無料」に条件を付け、免許・提携先は【社長確認】\n- [x] 他社（回線会社など）の料金・キャンペーンを断定していない（「公式サイトで確認」と書いた）\n- [x] 締めに「筆者の会社が紹介していること」「紹介料を受け取る場合があること」がある\n- [x] フォームのリンクに ?src=N012\n- [x] ng-words の言葉なし。不安をあおっていない\n- [x] 印刷用チェックリストが1つある\n- [x] 制度確認（ジン）の「制度確認：OK」→ 9/30 済み（原文未確認の出典は公開前に確認）", "paid": "", "chars": 5430, "asks": 6}, {"id": "N013", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "電気・ガス・水道の引越し手続き：いつ・どこに・何を伝えるか", "price": 0, "status": "校正待ち", "writer": "リク", "memo": "状態：校正待ち（ライター：リク・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長へ：出典はすべて検索結果の要約でしか見られていない（公式ページの本文は取得できなかった）。確認リストの「原文未確認」をジンが原文で確かめる\n     締めの「でんき開通サポート」の説明は lp/index.html の記載どおり。対応範囲・費用の書き方は【社長確認】", "free": "**こんな人向け：** 引越しの日が決まった人。電気・ガス・水道の連絡を、いつ・どこにすればいいのか分からない人。はじめての一人暮らしで、何から手をつければいいか迷っている人。\n\n**この記事で分かること：** 旧居の「止める」手続きと、新居の「始める」手続きの順番。電話やWebで伝える前に手元にそろえておく情報。ガスの開栓で立ち会いが必要になる理由と、日時の決め方。\n\n**結論：** 引越しの日が決まったら、その週のうちに「電気・ガス・水道の3か所」に連絡します。伝えることは、どこもほぼ同じで「お客さま番号・旧居と新居の住所・止める日と始める日」です。ガスだけは、新居で立ち会いが必要になるのが一般的なので、先に日時を押さえておきます。\n\n---\n\n## まず全体像：「止める」と「始める」は別の手続き\n\n引越しのライフラインの手続きは、1つの会社に1回連絡すれば終わり、とは限りません。\n\n- **旧居**：使用を止める（電気の停止・ガスの閉栓・水道の使用中止）\n- **新居**：使用を始める（電気の使用開始・ガスの開栓・水道の使用開始）\n\n同じ会社・同じ水道局のエリア内の引越しなら、1回の連絡で「止める」と「始める」をまとめて受け付けてもらえることがあります。たとえば東京都水道局は、23区と多摩地区の対象の市町の中での引越しなら、お客さまセンターで一括して手続きを受け付けると案内しています（出典は最後の確認リスト）。\n\nただ、県をまたぐ引越しや、ガス会社が変わる引越しでは、旧居と新居で連絡先が別々になります。**「旧居の会社」と「新居の会社」をそれぞれ確かめる**ところから始めると、抜けが出にくくなります。\n\n## いつ連絡するか：時期順のやること\n\n### 引越しの日が決まったら（できればその週のうちに）\n- 旧居の電気・ガス・水道の会社を確かめる（検針票・請求書・Webの会員ページで分かります）\n- 新居の住所が、どのガス会社・どの水道局のエリアかを確かめる（不動産会社や管理会社に聞くのが早いです）\n- 電気の契約先をどうするか決める（今の会社を続けるか、新居で選び直すか。下で説明します）\n\n### 引越しの日の少し前まで\n- 旧居の「止める日」と、新居の「始める日」を各社に伝える\n- **ガスは、新居での開栓の立ち会い日時を予約する**\n- 水道は、新居の地域の水道局の案内どおりに申し込む。東京都水道局は、引越しの3〜4日前までの手続きを案内しています\n\n### 引越し当日\n- 旧居：ブレーカーを落とす、ガスの元栓を閉めるなど、各社の案内に従う\n- 新居：電気はブレーカー（分電盤）を入れる。水道は、水が出るか確かめる。ガスは予約した時間に立ち会う\n\n### 引越しのあと\n- 旧居の最後の料金の請求先（支払い方法）が正しいか確かめる\n- 新居の検針票やWebの会員ページで、お客さま番号を控えておく\n\n「もう引越しまで数日しかない」という人も、あわてなくて大丈夫です。今日のうちに3か所へ連絡すれば、間に合うことも少なくありません。直前の場合は、Webより電話のほうが、その場で日程を確かめられて安心です。\n\n## 連絡する前に手元にそろえるもの\n\nどの会社に連絡するときも、聞かれることはほぼ同じです。先にメモにまとめておくと、1件あたりの電話が短く済みます。\n\n- **お客さま番号**（旧居の検針票・請求書・会員ページに載っています）\n- **契約している人の名前と連絡先**（電話番号）\n- **旧居の住所**（建物名・部屋番号まで）\n- **新居の住所**（建物名・部屋番号まで。郵便番号も）\n- **旧居で止める日**と、**新居で始める日**\n- **最後の料金の支払い方法**（口座・クレジットカードなど）\n- ガスの場合：**新居で立ち会いができる日時の候補**（第2候補まであると決まりやすいです）\n\nお客さま番号が分からなくても、住所と名前で調べてもらえることが多いです。ただ、番号があるほうが話が早く進みます。検針票を捨てる前に、スマホで写真を撮っておくと安心です。\n\n## 電気：新居で使い始める前に「どこと契約するか」を決める\n\n電気は、2016年4月から家庭向けの販売が自由化され、家庭でも電力会社や料金プランを選べるようになっています（資源エネルギー庁の説明）。引越しは、契約先を見直しやすいタイミングです。\n\n選び方の考え方は、大きく2つです。\n\n1. **今の会社を続ける**：同じ会社が新居のエリアでも電気を売っていれば、住所変更の形で手続きできることがあります\n2. **新居で選び直す**：家族の人数や、家にいる時間帯に合うプランを選び直す\n\nどちらを選ぶ場合でも、料金やキャンペーンはすぐ変わります。**契約する前に、各社の公式サイトで料金と契約の条件（契約期間・解約のときの費用など）を確かめてください。**\n\n電気は、スマートメーターが付いている物件なら、立ち会いなしで使用開始の処理ができることが多いです。入居の日に分電盤のブレーカーを入れても明かりがつかないときは、まず契約先の会社に「使用開始の手続きが済んでいるか」を確かめます。\n\n## ガス：開栓には立ち会いが必要になるのが一般的\n\nガスは、電気や水道と違って、**新居で使い始めるときに係の人が訪問して、立ち会いのもとで開栓する**のが一般的です。ガス機器に安全に火がつくか確かめたり、安全な使い方の説明をしたりするためです。\n\nたとえば東京ガスは、ガスの使用開始の際は立ち会いが必要で、本人が立ち会えない場合は、連絡内容を伝えられる代理の人（大家さん・管理人さんなど）の立ち会いでもよいと案内しています。立ち会いの条件や、予約できる時間帯はガス会社によって違うので、**新居のガス会社で確認**してください。\n\nここで気をつけたいのは、**立ち会いの日時は、希望どおりに取れるとは限らない**点です。引越しの日が決まったら、ほかの手続きより先にガスの予約を入れておくと安心です。\n\n旧居のガスを止める「閉栓」は、立ち会いが要らない場合もあります。これもガス会社の案内を確かめてください。\n\n## 水道：連絡先は「新居の地域の水道局」\n\n水道は、住んでいる地域の水道局（市区町村など）が担当しています。電気やガスのように会社を選ぶものではありません。\n\n- 連絡先は、**新居の住所を担当する水道局**（市区町村のページで調べられます）\n- 旧居と新居で水道局が違うときは、それぞれに連絡します\n- 申し込み方法は、電話・Web・アプリなど、水道局ごとに違います\n\n多くの物件では、水道の使用開始に立ち会いは要りません。ただ、水道局や物件によって違うことがあるので、案内を確かめてください。新居に着いたら、まず蛇口をひねって水が出るか確かめます。\n\n## チェックリスト：3か所の連絡、済みましたか\n\n- [ ] 旧居の電気・ガス・水道の会社とお客さま番号を控えた\n- [ ] 新居のガス会社と水道局を確かめた\n- [ ] 電気の契約先を決めた（続ける／選び直す）\n- [ ] 電気：旧居の停止日・新居の開始日を伝えた\n- [ ] ガス：旧居の閉栓日を伝え、新居の開栓の立ち会い日時を予約した\n- [ ] 水道：旧居の使用中止・新居の使用開始を申し込んだ\n- [ ] 最後の料金の支払い方法を確かめた\n- [ ] 入居の日に、ブレーカー・蛇口・ガス（立ち会い）の順で確かめる予定を入れた\n\n## よくある失敗\n\n**1. ガスの予約が遅れて、入居してから数日お風呂に入れない**\n電気と水道はすぐ使えても、ガスは立ち会いの予約が必要なことが多いです。引越しの日が決まったら、まずガスの予約から入れておきます。\n\n**2. 旧居の停止を忘れて、住んでいない家の料金がかかり続ける**\n新居の「開始」だけ申し込んで、旧居の「停止」を忘れる例です。「止める」と「始める」は、1回の電話で両方伝えるつもりで連絡します。\n\n**3. 電気の申し込みがまだで、入居の夜に明かりがつかない**\n鍵をもらった安心感で、電気の申し込みを後回しにしてしまう例です。ブレーカーを入れてもつかないときは、契約先の会社に電話で状況を確かめます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n電気・ガス・水道の連絡先が多くて手が回らない方には、筆者の会社の「でんき開通サポート」（関東1都6県：東京・神奈川・埼玉・千葉・茨城・群馬・栃木）があります。新居の電気の使用開始のお申し込みを取り次ぎ、ガス・水道・インターネットのお申し込みもあわせてお預かりします。電力会社・ガス会社・水道局の公式窓口ではなく、民間の取次サービスです。【社長確認：対応できる電気・ガス・水道の範囲／「ご相談・お手続きは無料」と書いてよいか】\nでんき開通サポート：【社長確認：LPのURL】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N013)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は取得できず＝原文未確認。ジンが原文で確かめる）**\n- 東京都水道局「使用開始・中止について（お引っ越しの手続）」https://www.waterworks.metro.tokyo.lg.jp/faq/qa-4 ：引越しの3〜4日前までの手続き、アプリ・電話での手続き【原文未確認】\n- 東京都水道局「手続きに際して」https://www.waterworks.metro.tokyo.lg.jp/tetsuduki/shiyou ：23区・多摩地区の対象市町内の引越しは、お客さまセンターで一括受付【原文未確認】（対象の市町の範囲も原文で確認）\n- 東京ガス「ガス・電気の開始や停止のお手続き（お引越し等）」https://home.tokyo-gas.co.jp/gas_power/procedure/moving/index.html 【原文未確認】\n- 東京ガス「ガス・電気の使用開始お手続き詳細」https://home.tokyo-gas.co.jp/gas_power/procedure/moving/khsn_k_nagare.html ：使用開始の際は立ち会いが必要、宅内で点火確認と安全事項の説明【原文未確認】\n- 東京ガス サポート「日時・立会い」https://support.tokyo-gas.co.jp/category/show/900?site_domain=open ：代理の人（大家・管理人など）の立ち会いでも可【原文未確認】\n- 資源エネルギー庁「電力小売全面自由化」https://www.enecho.meti.go.jp/category/electricity_and_gas/electric/electricity_liberalization/ ：2016年4月から家庭でも電力会社・料金プランを選べる【原文未確認】\n- 「閉栓は立ち会いが要らない場合もある」「多くの物件で水道の開始に立ち会いは不要」「スマートメーターなら立ち会いなしで使用開始できることが多い」は、ガス会社・水道局ごとの原文で確かめる（スマートメーターの部分は lp/index.html のQ&Aと同じ内容）【原文未確認】\n\n**【社長確認】**\n- でんき開通サポートで対応できる電気・ガス・水道の範囲（knowledge.md が未記入）\n- 「ご相談・お手続きは無料」と記事に書いてよいか（LPには記載あり。docs/lp.md で表記の確認が必要とされている）\n- でんき開通サポートの LP の URL／相談フォームの URL\n- お部屋探しの仲介手数料を無料にできる条件\n- 紹介料についての書き方\n- （済）制度確認係（ジン）の「制度確認：OK」は 9/30 に先頭コメントへ記入", "paid": "", "chars": 4995, "asks": 6}, {"id": "N014", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "引越し先のネットが使えない…を防ぐ：回線の申込はいつ・何を確かめるか", "price": 0, "status": "校正待ち", "writer": "リク", "memo": "状態：校正待ち（ライター：リク・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長へ：出典はすべて検索結果の要約でしか見られていない（公式ページの本文は取得できなかった）。確認リストの「原文未確認」をジンが原文で確かめる\n     工事の日数・工事費・解約金などの数字は書いていない（事業者ごとに違い、すぐ変わるため）。他社の料金も書いていない", "free": "**こんな人向け：** 引越しが決まって、新居のインターネットをどうするか考えている人。在宅勤務や動画で、ネットが使えない日が続くと困る人。ウォーターサーバーを使っていて、引越しのときの扱いが気になる人。\n\n**この記事で分かること：** 回線の申し込みを早めにしたほうがいい理由。申し込む前に新居で確かめる3つのこと（建物の設備・工事の許可・撤去の要否）。開通までのつなぎ方。ウォーターサーバーを引越しで持っていくか、やめるかを決めるときの確認点。\n\n**結論：** 新居が決まったら、その週のうちに「建物にどんな回線の設備があるか」を管理会社に聞き、回線の申し込みを入れます。開通の工事が要る場合は、日程が先になることがあります。工事の目安は、申し込む事業者に確かめてください。\n\n---\n\n## なぜ早めに申し込むのか\n\n電気や水道と違って、インターネットは「申し込めば翌日から使える」とは限りません。\n\n- 新居に回線の設備がすでにあれば、工事の人が来なくても開通できることがあります\n- 設備がない、または部屋まで配線が来ていない場合は、**開通工事が必要**になります\n- 開通工事は、事業者の工事の日程に合わせて予約します。**時期によっては、希望の日がすぐには取れないことがあります**\n\nどのくらい先になるかは、事業者・地域・建物・時期によって違います。**申し込む前に「開通までの目安」を事業者に確かめる**のが確実です。\n\n在宅勤務の人や、入居の日からネットが必要な人は、新居の契約が決まった時点で動き始めると安心です。まだ間に合うかどうか分からない人も、今日、事業者に目安を聞くところから始められます。\n\n## 申し込む前に確かめる3つのこと\n\n### 1. 建物に光回線の設備があるか\nマンションやアパートでは、建物全体で回線の設備が入っていることがあります。まず、管理会社か大家さんに次のことを聞きます。\n\n- 建物に光回線の設備が入っているか。入っているなら、どの事業者の設備か\n- 部屋の壁に「光コンセント」（光回線の差し込み口）があるか\n- 建物で一括して契約しているインターネット（入居者は申し込み不要のもの）があるか\n\n建物の設備によっては、使える事業者や方式が限られることがあります。設備がすでにあれば、工事の人が来ずに開通できる場合もあります（NTT東日本は、新居に設備がある場合は訪問しない工事になり、立ち会いが要らないと案内しています）。\n\n### 2. 賃貸なら、工事の許可が要るか\n賃貸の部屋で、壁に穴をあける・配線を引き込むなどの工事が必要になる場合は、**大家さんや管理会社の許可**が要ります。集合住宅で建物の共用部分に装置を入れる場合も、管理会社の了承が必要になると事業者が案内しています。\n\n- 工事の内容（穴あけの有無・配線の通し方）を事業者に聞いてから、管理会社に相談する\n- 許可をもらったら、いつ・誰から・どんな形でもらったかを控えておく（退去のときに役立ちます）\n\n### 3. 旧居の回線をどうするか（解約・移転・撤去）\n旧居の回線は、次のどれかを選びます。\n\n- **移転**：同じ事業者を新居でも続ける\n- **解約**：旧居でやめて、新居では別の事業者にする\n\n解約のときは、次の点を事業者に確かめます。\n\n- **解約の手続きはいつまでに必要か**\n- **撤去の工事が要るか、任意か**（事業者や設備によって違います）\n- **レンタル機器（ルーターなど）の返し方と期限**\n- **契約期間の途中でやめる場合の費用**があるか\n\n賃貸では、撤去が必要かどうかが退去の条件に関わることもあります。管理会社にもあわせて確かめておきます。\n\n## 開通までのつなぎ：モバイルルーターなど\n\n開通工事の日が入居より後になったときは、つなぎの方法を用意しておくと困りません。\n\n- **モバイルルーター**（持ち運べるWi-Fiの機器）を短い期間だけ使う\n- 工事が要らない**ホームルーター**（コンセントに差すだけのもの）を検討する\n- スマホの**テザリング**（スマホをWi-Fiの親機にする機能）で急場をしのぐ\n\nどれも、使える通信量や契約期間、解約のときの条件はサービスごとに違います。**短い期間だけ使うつもりなら、契約期間と途中でやめる場合の費用を先に確かめて**ください。テザリングは、スマホの契約で使える通信量を確かめてから使います。\n\nなお、光回線やモバイルWi-Fiなどの通信サービスには、契約書面を受け取ってから一定の期間内なら、事業者の合意なしに契約を解除できる「初期契約解除制度」があります（国民生活センター・総務省の案内）。ただし、端末（機器）の代金は対象外とされています。細かい条件は、公式の案内を確かめてください。\n\n## ウォーターサーバーを使っている人：引越しのときの確かめ方\n\nウォーターサーバーは、引越しのときに「持っていく」か「やめる」かを決めます。どちらの場合も、先に契約書面かWebの会員ページを確かめます。\n\n**持っていく場合**\n- 新居に**置く場所**があるか（床の強さ・直射日光が当たらないか・壁との間をあけられるか）\n- 近くに**電源（コンセント）**があるか\n- 自分で運んでいいか、事業者に移設を頼む必要があるか\n- 水の配送先の住所変更（配送の日にちも）\n\n**やめる場合**\n- **契約期間**が残っているか\n- 途中でやめる場合の**解約金**があるか\n- サーバーが**レンタルか、購入か**（返し方・支払いが変わります）\n- 返却の方法と、残っている水の扱い\n\n国民生活センターは、ウォーターサーバーの契約で「解約料について説明がなかった」「レンタルだと思ったら購入の契約だった」といった相談を紹介し、契約書面で内容をよく確かめるよう呼びかけています。引越しのときに新しく契約する場合も、同じ点を確かめてから決めると安心です。\n\n## チェックリスト：新居のネットとウォーターサーバー\n\n- [ ] 管理会社に、建物の回線の設備・光コンセント・一括契約の有無を聞いた\n- [ ] 申し込む事業者に、開通までの目安と工事の有無を聞いた\n- [ ] 工事が要る場合、大家さん・管理会社の許可をもらい、記録を残した\n- [ ] 旧居の回線：移転か解約かを決め、手続きの期限を確かめた\n- [ ] 旧居の回線：撤去工事の要否と、レンタル機器の返し方を確かめた\n- [ ] 開通が入居より後なら、つなぎの方法（モバイルルーター・テザリングなど）を決めた\n- [ ] ウォーターサーバー：持っていくか、やめるかを決めた\n- [ ] ウォーターサーバー：置き場所と電源、または契約期間・解約金・返し方を確かめた\n\n## よくある失敗\n\n**1. 入居してから申し込んで、しばらくネットが使えない**\n新居の設備を確かめないまま入居し、そこから申し込むと、工事の日程が先になることがあります。新居が決まった時点で、設備の確認と申し込みを進めます。\n\n**2. 許可を取らずに工事を進めて、退去のときにもめる**\n賃貸での穴あけや配線の工事は、大家さん・管理会社の許可が前提です。許可の記録を残しておくと、退去のときに話がスムーズです。\n\n**3. 旧居の撤去や機器の返却を忘れる**\n解約の手続きだけして、撤去工事の要否やレンタル機器の返却を確かめ忘れる例です。解約の電話で「撤去は必要ですか」「機器はどう返せばいいですか」と、まとめて聞きます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n新居のインターネット回線や、ウォーターサーバーのご相談は、筆者の会社でお受けしています。フレッツ光・ドコモ光・auひかり・ソフトバンク光などの中から、新居の建物で使える回線をご案内します（建物やエリアによって使えない回線があります）。【社長確認：紹介できるウォーターサーバー】電気・ガス・水道の手続きとあわせて進めたい方には、「でんき開通サポート」（関東1都6県：東京・神奈川・埼玉・千葉・茨城・群馬・栃木）もあります。新居の電気の使用開始のお申し込みを取り次ぎ、ガス・水道・インターネットのお申し込みもあわせてお預かりする、民間の取次サービスです（電力会社などの公式窓口ではありません）。【社長確認：対応範囲の書き方】\nでんき開通サポート：【社長確認：LPのURL】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N014)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は取得できず＝原文未確認。ジンが原文で確かめる）**\n- NTT東日本「フレッツ光のお引越し手続き」https://flets.com/support/flets-hikari/iten/ ／ https://flets.com/first/move/ ：新居に設備がある場合は訪問しない工事で立ち会い不要、集合住宅で方式を切り替えるには管理会社の了承のもと共用部に装置の導入が必要【原文未確認】（事業者の案内の例として書いた。社名を出すかは編集長判断）\n- NTT東日本（法人向けコラム）「光回線の撤去工事が必要な3つのケース」https://business.ntt-east.co.jp/column/service/flets-hikari/opticalline_removal.html ：撤去工事の要否【原文未確認】\n- 国民生活センター FAQ「【光回線】初期契約解除制度とは何か。」https://www.faq.kokusen.go.jp/faq/show/1194?site_domain=default 【原文未確認】（期間は本文では「一定の期間」とした。数字を入れるなら原文で確認）\n- 総務省「電気通信事業法の消費者保護ルールに関するガイドライン」https://www.soumu.go.jp/main_content/000917286.pdf ：初期契約解除の対象（データ通信専用端末向けの接続サービスも対象、端末は対象外）【原文未確認】\n- 国民生活センター「ウォーターサーバーの勧誘トラブルにご注意！」https://www.kokusen.go.jp/news/data/n-20241106_1.html ：解約料の説明がない・レンタルと思ったら売買契約だった などの相談、契約書面での確認の呼びかけ【原文未確認】\n- 消費者庁「ショッピングモールで勧誘されたウォーターサーバー…」https://www.caa.go.jp/policies/policy/consumer_policy/caution/caution_032 【原文未確認・参考】\n\n**【社長確認】**\n- 紹介できるインターネット回線の種類・エリア、紹介できるウォーターサーバー（knowledge.md が未記入）\n- でんき開通サポートの対応範囲の書き方・LP の URL／相談フォームの URL\n- お部屋探しの仲介手数料を無料にできる条件\n- 紹介料についての書き方\n- （済）制度確認係（ジン）の「制度確認：OK」は 9/30 に先頭コメントへ記入", "paid": "", "chars": 4731, "asks": 7}, {"id": "N015", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "関東の引越し：見積もりの取り方と、費用をおさえる時期・コツ", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：標準引越運送約款・国土交通省の呼びかけ・消費者ホットラインは WebSearch の検索結果の要約で確かめたもの。公式ページの原文は作業環境から開けなかったため、確認リストの URL はすべて「原文未確認」。解約手数料の割合は約款の条文と照らしてください\n     他社の料金・相場の数字は書いていない（ng-words.md・A11.md）。締めは「関東の引越し業者の紹介」を先に置いた", "free": "**こんな人向け：** 関東で引越しをする予定の人。見積もりをどう取ればいいか、どうすれば費用をおさえられるかを知りたい人。\n\n**この記事で分かること：** 見積もりの取り方（訪問とオンラインの違い）、費用が上がりやすい時期、日にちと時間の選び方、見積書で確かめたいこと、困ったときの相談先。\n\n**結論：** 見積もりは複数の会社から、同じ条件で取って比べます。日にちを動かせるなら、3〜4月を避け、平日・時間指定なしも選択肢に入れてください。契約の前に、見積書の「解約手数料」の欄を必ず読みます。\n\n---\n\n## 1. 見積もりは「複数の会社から、同じ条件で」\n\n引越しの料金は、荷物の量・距離・日にち・時間帯・作業の内容で決まります。同じ引越しでも、会社によって金額や含まれる作業が違います。\nだから見積もりは **1社で決めず、複数の会社から取って比べる** のが基本です。\n\n比べるときに大切なのは、**どの会社にも同じ条件を伝えること** です。条件がばらばらだと、金額の差が「会社の差」なのか「条件の差」なのか分からなくなります。\n\n### 見積もりの前にまとめておくこと\n- 引越しの候補日（第1〜第3希望）と、時間帯の希望\n- 今の住まいと新しい住まいの住所・階数・エレベーターの有無\n- 大きな家具・家電の数（冷蔵庫・洗濯機・ベッド・ソファ・本棚など）\n- 段ボールのおおよその数（分からなければ「部屋の数」でも）\n- エアコンの取り外し・取り付け、不用品の引き取りなど、頼みたい作業\n\n---\n\n## 2. 訪問見積もりと、オンライン見積もり\n\n見積もりには、主に次の2つのやり方があります。\n\n**訪問見積もり**：担当者が家に来て、荷物を見て見積もります。荷物の量をその場で見てもらえるので、当日「トラックに乗り切らない」といった食い違いが起きにくくなります。家具が多い人、家族での引越しの人に向いています。\n\n**オンライン見積もり**：スマホのビデオ通話や、Webのフォームで荷物を伝えて見積もります。家に人を上げずに済み、時間の調整もしやすいのが良いところです。\nただし、**伝えた荷物の量と実際の量がずれると、当日に困ることがあります。** 国民生活センターにも「オンラインで見積もりを取って契約したが、荷物がトラックに乗り切らず積み残された」という相談が寄せられているとされています。オンラインで見積もるときは、押し入れやベランダ、物置の中まで伝えてください。\n\nなお、標準引越運送約款では **見積もりの料金は請求しない** とされています。ただし下見をした場合に限り、下見にかかった費用を請求することがあり、その場合は **見積もりの前に金額を伝えて了解を得る** ことになっています。\n\n---\n\n## 3. 費用が上がりやすい時期：3〜4月\n\n3〜4月は、進学・就職・転勤が重なり、引越しの依頼が集中します。この時期は **料金が高くなりやすく、希望の日に予約が取りにくい傾向** があります。\n\n国土交通省も毎年、引越し業者に依頼が集中する3〜4月を避けるなど、**引越し時期の分散への協力** を呼びかけています。呼びかけの中では、時期をずらした利用者の声として「引越し代金が安くなった」「予約が取りやすくなった」といったメリットも紹介されています。\n\n引越しの日を自分で選べる人は、次のように考えてみてください。\n- 3〜4月の中でも、特に混む時期（月末・月初や土日）を外す\n- 入居日と退去日に余裕があるなら、2月以前や5月以降を検討する\n- 会社の辞令や学校の都合で動かせない人は、日にちが決まった時点ですぐ見積もりを取る\n\n---\n\n## 4. 日にちと時間の選び方：平日・午後便・フリー便\n\n同じ時期でも、日にちと時間の選び方で料金が変わることがあります。\n\n- **平日**：土日・祝日より依頼が少ないため、料金がおさえられることがあります\n- **午後便**：午前に始める便より、始まる時間が後になる便です。前の作業が終わってからになるため、開始時間がずれることがあります\n- **フリー便（時間指定なし）**：業者の都合のよい時間に来てもらう便です。何時に来るかが当日まで分からないことがあります\n\n午後便やフリー便は、**その日のうちに新居で使えるようにしたいこと**（ガスの開栓の立ち会い・ネットの開通工事など）がある人は、時間が重ならないか先に確かめてください。\nそれぞれの便があるか、いくらになるかは会社によって違います。見積もりのときに「平日ならどうか」「時間指定なしならどうか」と、条件を変えた金額も聞いてみてください。\n\n---\n\n## 5. 荷物を減らす\n\n料金は荷物の量にも左右されます。荷物が減れば、トラックの大きさや作業の人数が変わることがあります。\n\n- **見積もりの前に** 捨てる物・売る物・譲る物を決める（見積もりの後に減らすと、金額に反映されないことがあります）\n- 粗大ごみは自治体によって予約が必要。収集日が引越しに間に合うか確かめる\n- 新居に合わない家具（サイズが入らない・使わない）は、運ぶ前に決める\n\n---\n\n## 6. 標準引越運送約款で、確かめておきたいこと\n\n引越しの契約のルールとして、国土交通省が定める **「標準引越運送約款」** があります。契約する会社の約款は、見積もりのときに確かめてください。ここでは、特に大切な点をまとめます。\n\n### 見積書に書かれること\n約款では、見積書に **運賃などの合計額と内訳・支払い方法、荷物を受け取る日時と引き渡す日、作業の内容、解約手数料の額** などを書くことになっています。\n口頭の説明だけでなく、**書面（またはデータ）で見積書を受け取り**、頼んだ作業がすべて書いてあるか確かめてください。\n\n### キャンセル・延期の手数料\nお客さんの都合でキャンセルや延期をする場合、約款では引越しの日に近いほど手数料がかかる決まりになっています（3日前までの連絡なら、約款上の手数料はかかりません）。\n- 引越しの **2日前**：運賃と料金の **20％以内**\n- 引越しの **前日**：運賃と料金の **30％以内**\n- 引越しの **当日**：運賃と料金の **50％以内**\n\nまた、業者は引越しの日の **3日前までに** 見積書の内容に変更がないかお客さんに確かめることになっていて、確かめなかった場合は、2日前・前日・当日のキャンセルや延期でも手数料を請求しないとされています。\n予定が変わりそうな人は、早めに業者に連絡してください。\n\n### 荷物の傷や紛失\n荷物の一部がなくなったり傷ついたりしたときは、**荷物を引き渡された日から3か月以内に業者に知らせないと、業者の責任がなくなる** と約款にあります。\n引越しの後、荷ほどきが遅れそうな人も、家具・家電の傷だけは早めに確かめ、見つけたら写真を撮って業者に連絡してください。\n\n---\n\n## よくある失敗\n\n**1. 1社目の見積もりでその場で契約してしまう**\n比べる前に決めると、条件が合っていたのか分かりません。「ほかの会社の見積もりも見てから決めます」と伝えて大丈夫です。\n\n**2. オンライン見積もりで荷物を少なく伝えてしまう**\n当日に荷物が乗り切らないと、追加の料金や積み残しにつながることがあります。見積もりのときは、しまってある物まで伝えてください。\n\n**3. 見積書の解約手数料を読んでいなかった**\n予定が変わってから慌てないように、契約の前に見積書の「解約手数料」の欄を読んでおきます。\n\n---\n\n## 困ったときの相談先：消費者ホットライン188\n\n見積もりや契約、引越しの後の補償などで業者と話がまとまらないときは、**消費者ホットライン「188」** に電話してください。消費者庁が設けている全国共通の番号で、近くの消費生活センターなどの相談窓口を案内してもらえます。受付の時間は窓口によって違います。\n\n---\n\n## チェックリスト：見積もりから契約まで\n\n```\n【見積もりの前】\n□ 候補日（第1〜第3希望）と時間帯の希望を決めた\n□ 家具・家電の数と、頼みたい作業をメモした\n□ 捨てる物・売る物を決めた\n\n【見積もり】\n□ 複数の会社に、同じ条件で見積もりを頼んだ\n□ 訪問かオンラインかを選んだ（オンラインは収納の中まで伝える）\n□ 「平日なら」「時間指定なしなら」の金額も聞いた\n□ 下見の費用がかかる場合、事前に金額を聞いた\n\n【契約の前】\n□ 見積書を書面（またはデータ）で受け取った\n□ 合計額と内訳・頼んだ作業がすべて書いてある\n□ 解約手数料の欄を読んだ\n□ 当日の開始時間と、ガス・ネットの立ち会いが重ならない\n\n【引越しの後】\n□ 家具・家電の傷を確かめた（見つけたら写真）\n□ 困ったら業者に連絡／まとまらなければ 188\n```\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n「どの業者に頼めばいいか分からない」「見積もりを取る時間がない」という方には、関東の引越し業者をご紹介しています。【社長確認：提携業者の範囲・紹介の流れ】\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n\n- 関東の引越し業者のご紹介\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：紹介料の有無と書き方】\n\n▶ **[引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N015)**\n\n---\n\n## 確認リスト（公開前に消す）\n\n### 出典（すべて原文未確認：検索結果の要約で確認。公式ページは作業環境から開けなかった）\n- 標準引越運送約款（見積料・下見の費用、見積書の記載事項、解約・延期手数料 20％／30％／50％以内、3日前の確認、3か月以内の通知）：国土交通省 https://www.mlit.go.jp/notice/noticedata/sgml/1990/68227000/68227000.html （原文未確認）\n- 標準引越運送約款の改正について：国土交通省 https://www.mlit.go.jp/jidosha/jidosha_tk4_000033.html （原文未確認）\n- 引越時期の分散のお願い：国土交通省 https://www.mlit.go.jp/jidosha/jidosha_fr4_000022.html ／報道発表 https://www.mlit.go.jp/report/press/jidosha04_hh_000206.html （原文未確認）\n- 引越しのキャンセル料の相談（国民生活センター）：https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2018_23.html （原文未確認）\n- 引越トラブル（オンライン見積もりで積み残し等の相談）：国民生活センター https://www.kokusen.go.jp/news/data/n-20260204_1.html （原文未確認）\n- 消費者ホットライン188：政府広報オンライン https://www.gov-online.go.jp/tokusyu/hotline188/ ／消費者庁 https://www.caa.go.jp/policies/policy/local_cooperation/local_consumer_administration/hotline/ （原文未確認）\n\n### ジンに確かめてほしいこと\n- [ ] 解約手数料の日数・割合、「3日前までの確認をしないと請求できない」の条件が約款の条文どおりか（延期手数料の扱いも含む）\n- [ ] 3か月以内の通知の条文の言い方\n- [ ] 国土交通省の呼びかけの最新年（令和8年1月の報道発表とする検索結果あり）。「3月の引越件数は通常月の約2倍」という数字は記事に入れていない（入れるなら原文で確認）\n- [ ] 業者ごとに独自の約款を使う場合があるか（記事では「契約する会社の約款を確かめる」とだけ書いた）\n\n### 【社長確認】\n- [ ] 関東の提携業者の範囲・紹介の流れ（knowledge.md が未記入）\n- [ ] 仲介手数料を無料にできる条件と、宅建業の免許の表示\n- [ ] 紹介料の有無と書き方\n- [ ] 引越し相談フォームの公開 URL", "paid": "", "chars": 5068, "asks": 5}];

  const withAsk = src.replace(/<mark class="ask">【社長確認：フォームを公開したURL】<\/mark>/g, "\u0000").replace(/【社長確認[^】]*】/g, m => `<mark class="ask">${esc(m)}</mark>`).replace(/\u0000/g, ' <mark class="ask">【社長確認：フォームを公開したURL】</mark>').replace(/\u0001/g, ' <mark class="ask">【社長確認：引越し相談フォームのURL】</mark>');

}
