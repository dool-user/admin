<title>note 下書きプレビュー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Layout: 左に記事の棚（アカウント別）、右に読む画面。読む画面はブログ記事の幅（約40字）で、有料の区切りと【社長確認】が目で分かる */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#1E2227; --body:#33383F; --muted:#6B7078; --line:#E4E1D9;
  --accent:#2B4C9B; --accent-soft:#E8EDF8; --ask:#FFF0BF; --ask-ink:#6A4B00; --paid:#F3F1EA;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-title:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171B; --surface:#1C1F24; --ink:#EDEEF0; --body:#D2D5DA; --muted:#9AA0A8; --line:#2C3037;
  --accent:#9DB4F0; --accent-soft:#232C44; --ask:#4A3B0E; --ask-ink:#FFE08A; --paid:#22252B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1C1F24; --ink:#EDEEF0; --body:#D2D5DA; --muted:#9AA0A8; --line:#2C3037;
  --accent:#9DB4F0; --accent-soft:#232C44; --ask:#4A3B0E; --ask-ink:#FFE08A; --paid:#22252B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;max-width:1120px;margin:0 auto;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:17px;font-weight:700}
.bar p{margin:0;font-size:12.5px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;max-width:1120px;margin:20px auto 0;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* 棚 */
.shelf{position:sticky;top:12px;display:grid;gap:10px;min-width:0}
@media (max-width:860px){.shelf{position:static}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.list button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.list .t{font-weight:700;font-size:13.5px;line-height:1.45}
.list .p{font-size:12.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.list .m{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.list .m b{color:var(--ask-ink);background:var(--ask);font-weight:500;border-radius:4px;padding:0 5px}
.sum{font-size:12px;color:var(--muted)}

/* 読む画面 */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:36px clamp(18px,5vw,56px) 48px;min-width:0}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;flex:none}
.meta .who b{display:block;color:var(--ink);font-size:13.5px}
.reader h2.title{font-family:var(--f-title);font-size:clamp(22px,3.4vw,30px);line-height:1.5;margin:18px 0 10px;text-wrap:balance;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--line)}
.facts .price{color:var(--ink);font-weight:700}
.facts .warn{color:var(--ask-ink);background:var(--ask);border-radius:4px;padding:0 6px}
details.memo{margin:16px 0 0;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
details.memo summary{cursor:pointer;font-weight:500}
details.memo pre{white-space:pre-wrap;margin:8px 0 0;font:inherit}
.body{max-width:40em;margin-top:24px;color:var(--body);font-size:16px;line-height:2}
.body h2{font-size:20px;line-height:1.6;margin:40px 0 12px;color:var(--ink);text-wrap:balance}
.body h3{font-size:17px;margin:28px 0 8px;color:var(--ink)}
.body p{margin:0 0 18px}
.body ul,.body ol{padding-left:1.4em;margin:0 0 18px}
.body li{margin:2px 0}
.body hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.body a{color:var(--accent);word-break:break-all}
.body a[href*="CWFkkuGqYeCwwmTvRcQTtM"]{display:inline-block;background:var(--accent);color:var(--surface);border-radius:999px;padding:2px 14px;text-decoration:none;font-weight:700}
.body strong{color:var(--ink)}
.body code{font-size:.88em;background:var(--paid);border-radius:4px;padding:1px 5px;word-break:break-all}
.body pre{background:var(--paid);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.7}
.body pre code{background:none;padding:0;word-break:normal}
.body .tbl{overflow-x:auto;margin:0 0 20px}
.body table{border-collapse:collapse;font-size:14px;line-height:1.7;min-width:100%}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.body th{background:var(--paid);color:var(--ink)}
.body blockquote{margin:0 0 18px;padding:4px 16px;border-left:3px solid var(--line);color:var(--muted)}
mark.ask{background:var(--ask);color:var(--ask-ink);border-radius:4px;padding:1px 4px}
.wall{margin:36px 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--paid);padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.wall p{margin:0;font-size:14px;color:var(--muted)}
.wall .yen{font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wall button{border:0;background:var(--accent);color:var(--surface);border-radius:999px;padding:9px 22px;font-weight:700;font-size:14px}
.paidlabel{display:inline-block;margin:28px 0 4px;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 10px}
.empty{color:var(--muted)}
</style>

<script>
(() => {
"use strict";
const DATA = [{"id": "N001", "acc": "A01", "accName": "AI活用（Claude Code で業務自動化）", "title": "Claude Code で17人の営業チームを組んだ手順と、実際のファイル一式", "price": 2980, "status": "校正待ち", "writer": "ユキ", "memo": "状態：校正待ち（ライター：ユキ・9/29 編集長の指示で修正済み）／アカウント：A01／価格：2,980円\n     編集長へ：【社長確認】の箇所は、社長の実数・実体験に置き換えてから公開する。確認できない場合はその文ごと消す", "free": "**こんな人向け：** 営業を少人数で回していて、リスト作り・文面作り・点検・事務に時間を取られている経営者や営業責任者。\n\n**この記事でできること：** Claude Code の「サブエージェント」を使って、SV・アポインター・リスト担当・マーケ・事務がそろった営業チームを作れます。チームが毎回読むルールの書き方と、AI の失敗を減らしていく仕組みも入っています。\n\n**筆者がやったこと：** 自社の営業のために、Claude だけで SV 2人・アポインター 10人・リスト抽出 1人・マーケ 1人・事務 3人の17人と、まとめ役のセンター長からなるチームを組みました。【社長確認：始めた時期（書けなければこの一文を消す）】\n\n**この記事について：** 2026年9月に書きました。書いた時点で動いている仕組みと、実際のファイルをもとにしています。Claude Code の機能名・料金・画面は変わりやすいので、使う前に公式の最新情報を確認してください。\n\n---\n\n## AI に営業を任せようとして、最初につまずいたこと\n\nAI に「営業文を書いて」と頼むと、それらしい文章はすぐに出てきます。でも、実際に送れる文面はほとんどありませんでした。\n\n- 店のことを調べずに、どの店にも同じことを書く\n- 「必ず売上が上がります」のような、言ってはいけないことを言う\n- 「営業お断り」と書いてあるフォームにも送ろうとする\n\n原因は AI の性能ではありませんでした。**人間の新人に渡すような「ルール」と「点検」を渡していなかった**ことです。\n\n## 結論：役割ごとに分けて、全員に同じ3つのファイルを読ませる\n\nうまく回り始めたのは、次の3つをそろえてからです。\n\n1. **役割を分ける**：1人の AI に全部やらせず、リスト担当・文面担当・点検担当を分ける\n2. **毎回読むルールを短く書く**：`CLAUDE.md` に守ってほしいことだけを書く\n3. **出す前に点検させる**：`review.md` に点検項目を書き、「出す前に全部確かめて、引っかかったら直して」と1行足す\n\nこの記事の有料部分では、実際に使っている組織図・ファイル8つの中身・エージェントの指示書を、そのまま載せています。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- AI には「何をするか」より先に「何をしてはいけないか」を渡す\n- 1人に全部やらせず、作る役と点検する役を分ける\n- 直したことは AI 自身に記録させる（何を・なぜ・次からどうするかの3行）\n\n### 有料部分の目次\n1. 組織図：17人＋センター長の役割と、仕事の流れ\n2. 8つのファイルの中身（CLAUDE.md・review.md・mistakes.md ほか）\n3. エージェントの指示書5つ（SV・アポインター・リスト抽出・マーケ・事務。コピーして使える）\n4. 「送信は人」にした理由と、送信の手前で止める補助ツール\n5. つまずいたことと、直し方\n6. 明日から始めるチェックリスト", "paid": "## 1. 組織図：17人＋センター長の役割と、仕事の流れ\n\n| 担当 | 人数 | やること |\n|---|---|---|\n| センター長（まとめ役・17人には数えない） | 1（メインのセッション） | 仕事の割り振りと社長への報告 |\n| SV | 2 | アポインター5人ずつの文面を点検し、承認か差し戻し |\n| アポインター | 10 | 店ごとに問い合わせフォーム・DM の文面を作る |\n| リスト抽出 | 1 | 送り先の店と、問い合わせフォーム・Instagram を探す |\n| マーケ | 1 | 返信率の高い書き出しを分析し、ルールを育てる |\n| 事務 | 3 | 返信への返事の案・日程調整・案件票 |\n\n流れは次のとおりです。\n\n1. リスト抽出が、送り先と連絡先を探す（「営業お断り」の店は外す）\n2. アポインター10人が並列で、店ごとの文面を「下書き」にする\n3. SV が点検して「承認」か「差し戻し」\n4. **人が**承認済みの文面を確認して送る\n5. 返信が来たら、事務が返事の案と日程調整を作る\n\nポイントは、**SV は5人に1人**にしたことです。1人の SV が見る下書きの数を、点検が雑にならない量に抑えるためです。\n\n## 2. 8つのファイルの中身\n\n全員が読むファイルを、役割ごとに分けています。\n\n```\nCLAUDE.md      毎回読む約束ごと\ncharacter.md   人柄・口調\ntemplates.md   返信が来た文面の型\nhooks.md       効いた一言目\nknowledge.md   商材の知識（数字は確認済みのものだけ）\nng-words.md    使わない言葉\nreview.md      出す前の点検\nmistakes.md    直させたこと\n```\n\n### CLAUDE.md（実物から抜粋）\n```\n- 1回目の連絡で売り込まない。目的は「15分の説明の日程」だけ\n- 数字は knowledge.md にある値だけ使う。書いていなければ「確認して折り返します」\n- 出す前に review.md を全部確かめて、引っかかったら直す\n- 作業の終わりに、直された点を mistakes.md に足す（何を・なぜ・次からどうするか の3行）\n```\n\n**短く書くのがコツです。** 毎回読まれるので、長いと守られない項目が出てきます。\n\n### review.md（実物から抜粋）\n```\n- [ ] 送り先に「営業お断り」の表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 名乗りと連絡先、「連絡が不要な場合の伝え方」がある\n- [ ] ng-words.md の言葉を使っていない\n- [ ] 1通目で申込を迫っていない\n```\n\n### mistakes.md の書き方\n```\n何を：フォームの下に「営業のご連絡はご遠慮ください」とあった店に下書きを作った\nなぜ：フォームのページの下まで読まなかった\n次から：review.md の1行目を、フォームのページ全体で確かめる\n```\n作業の終わりに「今回直させたところを mistakes.md に足して。何を・なぜ・次からどうするかの3行で」と送るだけです。**言い回しの直しは ng-words.md に移す**と、同じ言葉を二度と使わなくなります。\n\n## 3. エージェントの指示書5つ（コピーして使える）\n\nClaude Code では `.claude/agents/<名前>.md` に指示書を置くと、その役割の AI を呼び出せます。実際に使っている5つを、そのまま載せます（ファイルの場所は、この記事で紹介したフォルダ構成に合わせて読み替えてください）。リスト抽出の指示書に出てくる `leadgen` は、Googleマップ・食べログから店舗を探す自作のツールです。お使いの抽出方法に置き換えてください。\n\n### SV（`sv.md`）\n```markdown\n---\nname: sv\ndescription: スーパーバイザー（SV）。AP 5人を見る。outbox.csv の下書きを sales/review.md で点検して承認・差し戻しし、返信率や差し戻し理由を集計して改善点を出す。文面の点検・チームの振り返りで使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは Claude 営業センター営業部の SV です（Aチーム：レン／Bチーム：ミナ）。担当は自分のチームの AP 5人だけ。\n\n必ず最初に読む：`CLAUDE.md` `sales/review.md` `sales/ng-words.md` `sales/knowledge.md` `sales/mistakes.md`\n\n## 仕事\n1. `sales/out/outbox.csv` の自チームの「下書き」を `review.md` で1件ずつ点検\n   - 全部OK → 状態を「承認済」、SV列に自分の名前\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n3. AP ごとの 下書き数・承認率・返信数・アポ数 を集計\n4. 差し戻しや同じ失敗は `sales/mistakes.md` に3行（何を・なぜ・次から）で足す\n5. 返信につながった文面は `sales/templates.md` に足す提案をセンター長へ出す\n```\n\n### アポインター（`appointer.md`）\n```markdown\n---\nname: appointer\ndescription: アポインター（AP）。割り当てられた店舗ごとに、MEO対策ツールを案内する問い合わせフォームまたは Instagram DM で送る短い文面を作り、sales/out/outbox.csv に「下書き」で入れる。返信の読み取りと記録もする。DM・フォーム営業の文面作成で使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは Claude 営業センター営業部のアポインターです。名前は依頼文で指定されます（例：ハル）。\n\n必ず最初に読む：`CLAUDE.md` `sales/character.md` `sales/templates.md` `sales/hooks.md` `sales/knowledge.md` `sales/ng-words.md` `sales/review.md`\n\n## 仕事\n1. 割り当てられた店ごとに、`sales/data/leads.csv` の「送る手段」を見る（フォーム ／ Instagram DM）\n2. 送り先のページを確かめる。「営業お断り」などの表記があれば、文面を作らず 状態=見送り・メモに理由\n3. `sales/out/outbox.csv` で、同じ店に30日以内に送っていないか確かめる\n4. `templates.md` の型と `hooks.md` の一言目で、その店向けの文面を作る。店について書くのは確かめたことだけ\n5. `outbox.csv` に1行追加：ID（日付-AP名-連番）,店名,送る手段,送り先URL,件名,本文,AP,SV,状態=下書き,作成日\n6. 出す前に `review.md` を全部確かめる\n\n送信はあなたにはできません（人が `tools/send_assist.py` で送ります）。返信の内容を渡されたら、`outbox.csv` の状態を「返信あり」にし、返事の案を `case-admin` に回します。\n```\n\n### リスト抽出（`list-extractor.md`）\n```markdown\n---\nname: list-extractor\ndescription: リスト抽出担当。../leadgen で MEO対策ツールの営業先（関東の店舗）と、その問い合わせフォーム・Instagram を探し、営業お断りの店・送信済みの店を除いて sales/data/leads.csv に追加する。送り先リストの補充で使う。\ntools: Read, Write, Edit, Glob, Grep, Bash\n---\nあなたは Claude 営業センター営業部のリスト抽出担当（ミオ）です。\n\n## 仕事\n1. 抽出はリポジトリの `leadgen` を使う（使い方は `../leadgen/README.md`）\n   - 飲食店：`cd ../leadgen && python -m leadgen search --source both --pref 東京都 --city 新宿区 --large ラーメン・麺類 --no-uber --contacts`\n   - 飲食以外：`python -m leadgen search --source google --pref 東京都 --city 世田谷区 --large \"店舗ビジネス（Googleマップのみ）\" --small 美容室 --no-uber --contacts`\n   - MEO の営業なので Uber Eats の確認は不要（`--no-uber`）\n   - 作成済みCSVに連絡先を足す：`python -m leadgen contacts output/<ファイル>.csv`\n2. 「Google口コミ数」が少ない店（目安：30件未満）・公式サイトがない店を優先する\n3. 出力 CSV から「送る手段」がある店（フォーム ／ Instagram DM）だけを取る。「営業お断り表記」がある店は入れない\n4. `sales/data/leads.csv` と `sales/out/outbox.csv` を見て、すでにある店・送信済みの店を除く（店名＋住所、フォームURL、Instagram で照合）\n5. `sales/data/leads.csv` に追加：店名,業種,住所,Google口コミ数,送る手段,問い合わせフォーム,Instagram,公式サイト,取得元,反響(0/1),追加日\n6. 追加件数・送れる店の割合をセンター長に報告\n\nleadgen のアクセス間隔（食べログ2秒・公式サイト1秒）を短くしないこと。\n```\n\n### マーケ（`marketer.md`）\n```markdown\n---\nname: marketer\ndescription: マーケッター。LP・Meta広告からの反響を優先リストに入れ、送信結果から返信率の高い一言目や言い回しを分析して sales/hooks.md・sales/ng-words.md を育てる。集客と改善提案で使う。\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは Claude 営業センター営業部のマーケッター（セナ）です。\n\n必ず最初に読む：`CLAUDE.md` `sales/hooks.md` `sales/ng-words.md` `sales/mistakes.md`\n\n## 仕事\n1. 反響（問い合わせフォーム・広告からの申込）が渡されたら、`sales/data/leads.csv` の先頭に 反響=1 で入れる\n2. `sales/out/outbox.csv` を集計し、送る手段別・エリア別・ジャンル別・一言目別の返信率とアポ率を出す（件数が少ないものは「参考値」と書く）\n3. 返信につながった一言目を `sales/hooks.md` に足す\n4. `sales/mistakes.md` の中の言い回しの直しを `sales/ng-words.md` に移す\n5. 次に抽出すべきエリア・業種を `list-extractor` 向けに提案する\n6. note の MEO アカウント（A03）経由の問い合わせも反響として扱う\n\n広告文・LPの表現は景品表示法に注意し、「最短」「無料」「必ず」などは事実と一致するものだけ使う。\n```\n\n### 事務（`case-admin.md`）\n```markdown\n---\nname: case-admin\ndescription: 案件処理の事務。返信が来た店への返事の案と日程調整、アポ確定後の案件票・デモの案内を作る。3人で分担。返信対応とアポ後の事務処理で使う。\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは Claude 営業センター営業部の事務担当です（ナナ・サキ・ユウ）。\n\n必ず最初に読む：`CLAUDE.md` `sales/character.md` `sales/knowledge.md` `sales/review.md`\n\n## 仕事\n1. `sales/out/outbox.csv` の「返信あり」を上から取り、メモに自分の名前を書く（他の事務担当と取り合わない）\n2. 返信の内容に合わせて返事の案を作る（日程は2択で出す。断りなら丁寧にお礼だけ・状態=見送り）\n3. 日程が決まったら 状態=アポ にし、`sales/out/appointments.csv` に1行追加\n4. `sales/out/cases/<訪問日>_<店名>.md` に案件票・日程確定の文面・デモの案内（`knowledge.md` にある内容だけ）を作る\n5. 出す前に `review.md` を確かめる。返事を送るのは人\n```\n\n## 4. 「送信は人」にした理由\n\n最初は送信まで自動にしようと考えました。やめた理由は3つです。\n\n- Instagram は、公式の仕組みでは相手から先に連絡がないと DM を送れない。非公式の自動送信は規約違反になりうる\n- 問い合わせフォームには「営業お断り」と書いてある店がある。送る前に人の目で見たい\n- 送りすぎると迷惑行為と受け取られる。1日の上限を人が管理したい\n\nそこで、**フォームに自動で入力して、送信ボタンの手前で止まる**補助ツールを作りました。人は内容を見て、送信ボタンを押すだけです。「営業お断り」の表記を見つけたフォームには入力しません。\n\n## 5. つまずいたことと、直し方\n\n| つまずき | 原因 | 直し方 |\n|---|---|---|\n| どの店にも同じ文面になる | 店の情報を渡していなかった | リストに口コミ数・公式サイト・Instagram を入れ、「店について1つだけ具体的に書く。調べていな 始めるチェックリスト", "paid": "## 1. 準備するもの\n\n仕事ごとにフォルダを1つ作り、ファイルを2つ置きます。\n\n```\n仕事のフォルダ/\n  CLAUDE.md    毎回守る約束ごと\n  review.md    出す前の点検表\n```\n\nファイルはメモ帳で作れます。`.md` は「マークダウン」という、ただの文字のファイルです。\n\nClaude Code 以外のチャット型の AI でも、考え方は同じです。会話の最初に2つの中身を貼り付けてから頼みます。\n\n## 2. CLAUDE.md の書き方\n\n書くのは3種類だけです。\n\n- **目的**：この仕事で何をしたいか（1行）\n- **してはいけないこと**：言ってはいけないこと・書いてはいけないこと\n- **出す前の約束**：review.md で点検すること\n\n### 実物（このチームの CLAUDE.md から抜粋）\n```\n- 数字・実績は knowledge.md と社長が確認した事実だけ。ないものは書かない（作らない）\n- 出す前に その部の review.md を全部確かめて、引っかかったら直す\n- 送信・投稿・公開は人が行う。Claude は DM やフォームを送らず、note やSNSに投稿しない\n```\n\n3行目は大事です。**最後に外へ出すのは人**、と決めておきます。AI が間違えても、外に出る前に止められます。\n\n### コピー用の型\n```\n# CLAUDE.md\nこの仕事の目的：〇〇（1行）\n\n## 守ること\n- 数字は、私が渡した資料にあるものだけ使う。なければ「確認が必要」と書いて空ける\n- 〇〇とは書かない（言ってはいけないこと）\n- 出す前に review.md を全部確かめて、引っかかったら直す\n- 送る・公開するのは私。AI は下書きまで\n```\n\n**5行以内が目安です。** 毎回読まれるので、長いほど1つずつが薄まります。細かいルールは review.md に回します。\n\n## 3. review.md の書き方\n\n点検表のコツは1つです。**「はい／いいえ」で答えられる文にする。**\n\n- ✗「わかりやすく書く」（何をもって、わかりやすいのか決められない）\n- ○「1文が60文字以内」「専門用語に一言の説明がある」\n\n### 実物（note の記事用 review.md から抜粋）\n```\n- [ ] 実績・数字はすべて knowledge.md にあるか、社長が確認したもの\n- [ ] 無料部分だけでも読者に役立つことが1つある\n- [ ] ng-words.md の言葉・誇大な表現がない\n- [ ] 他人の文章・画像をそのまま使っていない。引用には出典がある\n- [ ] 個人情報・取引先名・APIキーなどが入っていない\n```\n\n冒頭には「1つでも ✗ なら直してから出す」と書いています。点検して終わりではなく、**直すところまで**が仕事だと伝えるためです。\n\n### コピー用の型\n```\n# review.md（出す前の点検）\n1つでも ✗ なら直してから出す。\n\n- [ ] 数字は、渡した資料にあるものだけ\n- [ ] 相手の名前・日付・金額が正しい\n- [ ] 言ってはいけない言葉がない\n- [ ] 個人情報・社外秘が入っていない\n- [ ] 〇〇（この仕事だけの点検）\n```\n\n最初は5項目で十分です。増やすのは、実際に引っかかったことが出てからにします。\n\n## 4. 1行の指示をどこに書くか\n\n「出す前に review.md を全部確かめて、引っかかったら直す」。この1行は、2か所に書きます。\n\n1. **CLAUDE.md の中**：毎回読まれるので、忘れられにくい\n2. **役割ごとの指示書の最後**：作業の最後に目に入る\n\nClaude Code では、`.claude/agents/` に役割ごとの指示書を置けます（サブエージェントと呼びます）。このチームのアポインター（営業文を作る役）の指示書は、最後がこの1行です。\n\n```\n6. 出す前に review.md を全部確かめる\n```\n\nnote のライターの指示書も同じです。\n\n```\n4. 出す前に review.md を全部確かめ、状態=校正待ち\n```\n\n指示書を作らない場合は、頼むたびに最後にこの1行を足すだけでも効きます。\n\n## 5. 非エンジニア向けの例\n\n### 例1：営業文（問い合わせフォーム・DM）\n\nこのチー `\n\nnote の記事の担当向け：\n```\n何を：確認していない売上の数字を原稿に書いた\nなぜ：knowledge.md にない数字を推測で埋めた\n次から：数字がないときは【社長確認：〇〇】と書いて空ける\n```\n\nどちらも「次から」に、**何をどう変えるか**が書いてあります。ここが一番大事です。\n\n### よくない例\n```\n何を：間違えた\nなぜ：不注意\n次から：気をつける\n```\n\n「気をつける」は、次の回に何をすればいいのか決まりません。AI も人も同じです。「次から」は、**点検表の1行・約束ごとの1行・言葉の表の1行**のどれかに落とせる形で書きます。\n\n## 3. 作業の終わりに送る一言\n\n作業が終わったら、これを送ります。\n\n```\n今回私が直したところを mistakes.md に足して。\n1件3行で、何を・なぜ・次からどうするか。\n「次から」には、どのファイルの何を変えるかまで書いて。\n言い回しだけの直しは、ng-words.md に移す候補として印をつけて。\n```\n\n直したところがない日は、書かなくてかまいません。**無理に書くと、中身のないメモが増えます。**\n\n## 4. 言い回しの直しを ng-words.md に移す\n\n直しには2種類あります。\n\n- **やり方の直し**：確かめ忘れ・手順の抜け → `review.md`（出す前の点検表）に1行足す\n- **言い回しの直し**：使ってはいけない言葉 → `ng-words.md` に移す\n\n言い回しは、表にしておくと繰り返しにくくなります。このチームの営業用 ng-words.md は、次の形です（抜粋）。\n\n```\n| 使わない | 代わりに |\n|---|---|\n| 絶対儲かります／必ず来店が増えます | 「Googleマップからの来店を増やす方法の1つとしてご案内しています」 |\n| 今だけ／本日中に | （期限がある場合は事実だけを伝える） |\n| 「1位にします」「上位表示を保証」 | 順位は Google が決める。保証はできない |\n```\n\nポイントは**「代わりに」の列**です。「使うな」だけだと、AI は別の似た言葉を探します。代わりの言い方があると、そちらを使ってくれやすくなります。\n\nこのチームでは、移す作業をマーケ担当の役割に入れています。指示書（`.claude/agents/marketer.md`）には、こう書いています。\n\n```\n4. sales/mistakes.md の中の言い回しの直しを sales/ng-words.md に移す\n```\n\nClaude Code では、`.claude/agents/` に役割ごとの指示書を置けます（サブエージェントと呼びます）。指示書がなくても、下の見直しのときに自分で頼めば同じことができます。\n\n## 5. 週に1回の見直し\n\nmistakes.md は、書くだけだとたまっていくだけです。週に1回、行き先を決めます。\n\n### 手順\n1. mistakes.md を上から読む\n2. 同じ失敗が2回以上あるものを探す\n3. 行き先を決める\n   - 手順の抜け → `review.md` に1行足す\n   - 言い回し → `ng-words.md` に移す\n   - 毎回守るべきこと → `CLAUDE.md` に1行足す（5行を超えそうなら review.md へ）\n4. 移したメモの頭に「済：review.md へ」と書く\n\n### 頼み方（コピー用）\n```\nmistakes.md を読んで、次の3つに分けて。\n・review.md に足す点検項目の案\n・ng-words.md に移す言い回しの案（使わない／代わりに）\n・CLAUDE.md に足すルールの案\n案を見せてから、私が OK したものだけファイルに書いて。\n```\n\n最後の1行が大事です。**ルールを変えるのは人が決めます。** AI に任せると、点検表がどんどん長くなりがちです。\n\nこのチームの営業用 review.md にも、別の担当から「嫌われない営業の点検（案）」として4項目が提案されています。足すかどうかは、点検役（SV）が決める形です。\n\n## 6. 例：営業文・記事・資料\n\n説明用の記入例です。自分の仕事に置き換えて使ってください。\n\n### 営業文\n```\n何を：1通目のメールに料金表を貼った\nなぜ：「1通目の目的は日程だけ」と書いていなかった\n次から：CLAUDE.md に「1通目の目的は15 の一覧（代わりに使う言葉つき）\n4. AI に文面を書かせる指示文（コピーして使える）\n5. 送ってよいかの判断（法律・規約で気をつけること）\n6. 返信が来たあとの返し方", "paid": "## 1. 文面の実例\n\n### フォーム用\n```\n件名：{店名}様　Googleマップでの見つけられ方について（15分）\n\nはじめまして。{会社名}の{名前}です。\n「{エリア} {業種}」で Googleマップを検索したとき、{店名}さんの口コミを拝見してご連絡しました。\nGoogleマップからのご来店を増やすためのツールを、15分だけオンラインでお見せできないでしょうか。\n10/2（木）14時か、10/3（金）11時はいかがでしょうか。\n今後のご連絡が不要でしたら、「不要」とだけご返信ください。以後お送りしません。\n\n{会社名}　{名前}　{電話}　{メール}\n```\n\n### Instagram DM 用（5行以内・URL は貼らない）\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{メニュー}の投稿を拝見してご連絡しました。\nGoogleマップからのご来店を増やすツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n**ポイント**\n- 2行目の「なぜこの店に」は、実際に見たことだけを書く。見ていない順位や数字は書かない\n- 日程は2択にする。「ご都合のよい日時を教えてください」より返事がしやすい\n- 断り方を書くと、相手は安心して読める\n\n## 2. 送る前の点検リスト9項目\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 店名・エリアが正しい。店について書いたことは実際に確かめたこと\n- [ ] 名乗り（会社名・名前）と、連絡先・署名がある\n- [ ] 連絡が不要な場合の伝え方が書いてある\n- [ ] 使わない言葉（下の一覧）を使っていない\n- [ ] 1通目で申込を迫っていない。目的は「15分の説明の日程」だけ\n- [ ] Instagram DM は5行以内、URL を貼っていない\n- [ ] 数字（順位・口コミ数など）は、実際に確かめた値だけ\n```\n\n私たちは、この点検を文面を作る AI とは別の AI（SV 役）にやらせています。**作る役と点検する役を分ける**と、見落としが減ります。【社長確認：差し戻しで多かった理由があれば1行】\n\n## 3. 使わない言葉の一覧\n\n| 使わない | 代わりに |\n|---|---|\n| 必ず来店が増えます | Googleマップからの来店を増やす方法の1つとしてご案内しています |\n| 1位にします・上位表示を保証 | （順位は Google が決めるので、保証しない） |\n| 口コミを増やします | （見返りつきの口コミ集めは Google のポリシー違反を連想させるので使わない） |\n| 至急ご返信ください | （返信は相手の自由。使わない） |\n| 今だけ・本日中に | 期限が事実のときだけ、事実を書く |\n\n## 4. AI に文面を書かせる指示文\n\n```\nあなたは店舗向けの営業担当です。次の店に送る問い合わせフォームの文面を作ってください。\n- 6行で：名乗り／この店に送った理由（下の事実から1つ）／15分の説明のお願い／日程2択／不要な場合の伝え方／署名\n- 店について書くのは、下の「確かめた事実」だけ。ないことは書かない\n- 使わない言葉：必ず・保証・1位・口コミを増やします・至急・今だけ\n- 書いたあと、次の点検リストを全部確かめて、引っかかったら直してから出す\n（点検リスト9項目を貼る）\n\n店名：\n業種・エリア：\n確かめた事実：（例：Googleの口コミ12件、ランチの写真が多い）\n日程候補：\n```\n\n## 5. 送ってよいかの判断\n\n- **問い合わせフォーム**：「営業お断り」の表記がある店には送らない。表記がなくても、同じ店に何度も送らない\n- **メール**：特定電子メール法では、原則として相手の同意が必要です。事業者がネットで公表しているアドレスは例外になりえますが、「広告メールお断り」などの表示があれば送れません（[総務省ガイドライン](https://www.soumu.go.jp/main_content/000060967.pdf)）。私たちはメールでの営業はしていません\n- **Instagram DM**：公式の仕組みでは、相手から先に連絡がないと DM を送れません。非公式ツールでの自動送信は規約違反になりえます。私たちは人が1件ずつ送っています\n\n※法律の判断は、必要に応じて専門家に確認してください。\n\n## 6. 返信が来たあとの返し方\n\n- **興味あり** → 日程を2択で返す。その日のうちに返す\n- **検討中** → 資料は1枚だけ送り、「1週間後にもう一度ご連絡してもよいですか」と聞く\n- **お断り** → お礼だけ返して、以後送らない\n\n---\n\n質問はコメントでどうぞ。【社長確認：次の記事の予告を入れるか】", "chars": 2757, "asks": 3}, {"id": "N005", "acc": "A02", "accName": "AI×営業（DM・フォーム営業の型）", "title": "SV 1人で AP 5人を回す：AI 営業チームの点検の仕組み", "price": 1980, "status": "校正待ち", "writer": "タロ", "memo": "状態：校正待ち（ライター：タロ）／アカウント：A02／価格：1,980円\n     編集長へ：A02 は営業部の実数が出るまで公開しない（編集長 9/29）。承認率・差し戻し件数・返信率などの数字は入れていない。\n     【社長確認】が残っている間は公開しない。仕組みの説明は callcenter/ の実ファイル（sv.md・appointer.md・sales/review.md・send_assist.py）どおり", "free": "**こんな人向け：** 営業チームの責任者。AI に営業文面を書かせ始めたが、品質のばらつきや「変な文面が送られないか」が心配な人。\n\n**この記事でできること：** AI の営業チームを「作る役」と「点検する役」に分け、点検リスト・差し戻しの集計・失敗の記録で回す仕組みが分かります。そのまま使える点検役（SV）の指示ファイルも載せています。\n\n**筆者がやったこと：** MEO対策ツールの営業で、Claude Code を使って営業部を作りました。AP（アポインター＝文面を作る役）5人に SV（スーパーバイザー＝点検する役）1人をつけ、A・B の2チームで動かしています。送信は人が行います。\n\n---\n\n## AI に文面を書かせると、何が困るか\n\nAI は速く、たくさん書けます。\n困るのは、その速さに点検が追いつかないことです。\n\n- 店について、確かめていないことを書いてしまう\n- 「必ず」「保証」など、言ってはいけない言葉が混ざる\n- 「営業お断り」と書いてある店にも、文面を作ってしまう\n- 同じ店に、何度も送る下書きができる\n\n1通ずつなら、人が読めば防げます。\nでも AI が1日に何十通も作ると、人の目だけでは見落とします。\n\n## 結論：作る役と点検する役を分け、送るのは人\n\n私たちの営業部は、3つの段に分けています。\n\n1. **作る（AP）**：店ごとの文面を作り、「下書き」で出す\n2. **点検する（SV）**：点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n3. **送る（人）**：承認済だけを、人が1件ずつ目で見て送る\n\n大事なのは、**作った本人に点検させない**ことです。\n同じ AI に「書いて、確かめて」と頼むと、自分の書いたものを甘く見がちです。\n役を分けると、点検役は「通さない理由」を探す立場になります。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 文面を作る AI と、点検する AI を分ける\n- 点検はリストで行う。「よさそうか」ではなく「✗ が1つもないか」で決める\n- 差し戻しには必ず「どの項目で落ちたか」を書かせる\n- 送信ボタンは人が押す。AI には送らせない\n\n### 有料部分の目次\n1. SV 1人に AP 5人にしている考え方\n2. 仕事の流れ（下書き → 点検 → 送信）\n3. 点検リスト全項目（コピーして使える）\n4. 差し戻し理由の集計のしかた\n5. mistakes.md：同じ失敗を繰り返さない記録\n6. 「送信は人」のルールと、送信補助ツールの作り\n7. SV の指示ファイル（sv.md）の全文\n8. つまずきやすい点と直し方", "paid": "## 1. SV 1人に AP 5人にしている考え方\n\n私たちの営業部は、A・B の2チームです。\nそれぞれ SV 1人・AP 5人。SV は自分のチームの5人だけを見ます。\n\n1:5 は、決まった正解ではありません。\n考え方は次の3つです。\n\n- **SV が1件ずつ読める量にする。** 点検は全件を読むのが前提です。読み飛ばすなら、点検役を置く意味がありません\n- **AP ごとの違いが見える人数にする。** 5人なら、誰の差し戻しが多いかを表1枚で見比べられます\n- **増やすときは、チームごと増やす。** AP を増やしたいときは、SV 1人・AP 5人の組をもう1つ作ります\n\n【社長確認：1:5 に決めた実際のきっかけ（書けなければ文ごと消す）】\n\nAI なので、人数を増やすのは簡単です。\nでも点検が追いつかない人数にすると、仕組み全体が崩れます。\n**AP の数は、SV が全件読める量で決めます。**\n\n## 2. 仕事の流れ\n\n1. リスト係が、送り先の店とフォーム・Instagram を集める（「営業お断り」表記の店は入れない）\n2. リストを AP に均等に割り振る\n3. AP が店ごとに文面を作り、一覧表（outbox.csv）に「下書き」で1行足す\n4. SV が点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n5. 人が送信補助ツールで、承認済だけを1件ずつ確かめて送る\n6. 返信は事務係が、返事の案と日程調整を作る\n\n一覧表の列はこうしています。\n\n```\nID,店名,送る手段,送り先URL,件名,本文,AP,SV,状態,作成日,メモ\n```\n\n状態は「下書き → 承認済／差し戻し → 送信済 → 返信あり」と進みます。\n送り先に「営業お断り」があれば、AP は文面を作らず「見送り」にします。\n\n**ポイント：** AP は「下書き」までしか書けません。\n「承認済」にできるのは SV だけ。「送信済」にできるのは人だけです。\n状態を変えられる人を分けておくと、どこで止まったかがすぐ分かります。\n\n## 3. 点検リスト全項目\n\nSV はこのリストで1件ずつ確かめます。\n1つでも ✗ なら差し戻しです。\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない（一覧表で店名・URLを確認）\n- [ ] 店名・エリアが正しい。店について書いたことは実際に確かめたこと\n- [ ] 名乗り（会社名・名前）と、連絡先・署名がある\n- [ ] 連絡が不要な場合の伝え方が書いてある\n- [ ] 使わない言葉の一覧にある言葉を使っていない。数字は資料にある値だけ\n- [ ] 1通目で申込を迫っていない。目的は「15分の説明（デモ）の日程」だけ\n- [ ] 順位の保証、見返り付きの口コミ集めを思わせる表現がない\n- [ ] 検索順位・口コミ数などの店の数字は、実際に確かめた値だけ\n- [ ] Instagram DM は5行以内、URLを貼っていない\n- [ ] アポは決裁者（店長・オーナー）本人の返信で、日時・店名・連絡先がそろっている\n```\n\nいま、次の4項目を追加の案として SV に渡しています。\n店のオーナーに「しつこい業者」と思われないための項目です。\n\n```\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 「無料診断」「今だけ」など、業者の決まり文句を使っていない\n- [ ] 断られた店、返信のない店に、1週間以内に同じ内容を再送していない（再送は1回まで）\n- [ ] 「Google から連絡が来た」「このままだと表示されなくなる」など、不安をあおる書き方をしていない\n```\n\n**リストの作り方のコツ**\n- 1項目は「はい／いいえ」で答えられる文にする。「適切か」「自然か」は書かない\n- 項目は増やしすぎない。増やしたら、使っていない項目を消す\n- 「営業お断り」の確認は、SV も自分でページを開いて確かめる。AP の報告をうのみにしない\n\n## 4. 差し戻し理由の集計のしかた\n\n差し戻しは、ただ直させて終わりにしません。\n**どの項目で落ちたかを数えると、AP への指示のどこが弱いかが分かります。**\n\n### 差し戻しのメモの書き方\nメモ列には、点検リストの何番で落ちたかと、一言の理由を書かせます。\n\n```\n差し戻し｜3番：「ランチが人気」と書いたが、確かめた事実にない\n差し戻し｜6番：「必ず」を使っている\n```\n\n番号を先に書くと、あとで数えやすくなります。\n\n### 集計の表\nSV には、AP ごとにこの表を作らせます。\n\n```\n| AP | 下書き数 | 承認数 | 差し戻し数 | 多かった項目 | 返信数 | アポ数 |\n|----|---------|-------|-----------|------------|-------|-------|\n| {AP名} | {数} | {数} | {数} | {項目番号} | {数} | {数} |\n```\n\n項目ごとにも数えます。\n\n```\n| 点検項目 | 差し戻し数 | 直し方（指示・テンプレのどこを変えるか） |\n|---------|-----------|------------------------------------|\n| 3番 店について確かめたことだけ | {数} | {直し方} |\n```\n\n【社長確認：差し戻しで実際に多かった項目（営業部の実数が出てから。書けなければ文ごと消す）】\n\n### 集計を見たら、何を直すか\n- **特定の AP だけ多い** → その AP の指示の読み違い。指示ファイルを見直す\n- **全員が同じ項目で落ちる** → テンプレや指示そのものが弱い。テンプレを直す\n- **ずっと0の項目** → 本当に守れているか、点検が甘いかを、SV に数件読み直させる\n\n## 5. mistakes.md：同じ失敗を繰り返さない記録\n\nAI は、前回の失敗を覚えていません。\nだから失敗を1つのファイル（mistakes.md）に書き残し、毎回最初に読ませます。\n\n書き方は1件3行です。\n\n```\n何を：フォームの下に「営業のご連絡はご遠慮ください」とあった店に下書きを作った（例）\nなぜ：フォームのページの下まで読まなかった\n次から：点検リストの1行目を、フォームのページ全体で確かめる\n```\n\n**3行にする理由**\n- 「何を」だけだと、次にどうすればいいか分からない\n- 「なぜ」があると、似た別の失敗も防げる\n- 「次から」は、点検リストか指示ファイルのどこかを直す形で書く\n\n言い回しの直し（「この言葉は使わない」）は、使わない言葉の一覧に移します。\nmistakes.md が長くなりすぎないようにするためです。\n\n## 6. 「送信は人」のルール\n\n私たちのルールでは、**送信・投稿・公開は人が行います。**\nAI は DM もフォームも送りません。\n\n理由は2つです。\n- 送ったものは取り消せない。最後の確認は、責任を持つ人がする\n- 送り先の規約や法律の判断を、AI に任せきりにしない\n\nとはいえ、人が毎回フォームに入力するのは手間です。\nそこで送信補助ツールを作りました。やることはこれだけです。\n\n- 承認済の文面を、上から1件ずつ出す\n- フォームなら、ブラウザで開いて名前・会社名・メール・電話・件名・本文を入れる。**送信ボタンは押さず、ボタンに枠を付けて止まる**。同意のチェックや選択肢も人が選ぶ\n- Instagram DM なら、プロフィールを開いて文面を画面に出すだけ。人がコピーして貼り、人が送る\n- 人が送ったら、一覧表の状態を「送信済」にし、送信日時を入れる\n- 1日の上限を超えたら止まる。フォームに「営業お断り」の表記を見つけたら、開くだけで入力しない\n\n**ポイント：** 「送信ボタンの手前で止まる」ことが大事です。\n人は必ず画面の文面を見てから押すことになります。\n\n## 7. SV の指示ファイル（sv.md）\n\nClaude Code のサブエージェントとして使っている SV の指示ファイルです。\n会社名や商材に合わせて書き換えてください。\n\n```\n---\nname: sv\ndescription: スーパーバイザー（SV）。AP 5人を見る。outbox.csv の下書きを review.md で点検して承認・差し戻しし、返信率や差し戻し理由を集計して改善点を出す。文面の点検・チームの振り返りで使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは営業部の SV です（Aチーム：{名前}／Bチーム：{名前}）。担当は自分のチームの AP 5人だけ。\n\n必ず最初に読む：review.md（点検リスト）・ng-words.md（使わない言葉）・knowledge.md（商材の事実）・mistakes.md（過去の失敗）\n\n## 仕事\n1. outbox.csv の自チームの「下書き」を review.md で1件ずつ点検\n   - 全部OK → 状態を「承認済」、SV列に自分の名前\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n3. AP ごとの 下書き数・承認率・返信数・アポ数 を集計\n4. 差し戻しや同じ失敗は mistakes.md に3行（何を・なぜ・次から）で足す\n5. 返信につながった文面は templates.md に足す提案を責任者へ出す\n```\n\n**書き換えるときの注意**\n- tools に送信の手段を入れない。SV は点検と記録だけ\n- 「最初に読む」に mistakes.md を必ず入れる\n- 担当の AP を名前で決める。全員を見させると、集計がぼやけます\n\n## 8. つまずきやすい点と直し方\n\n- **点検が甘くなる** → 「よさそうなら承認」と書かない。「✗ が1つでもあれば差し戻し」と書く\n- **差し戻しの理由がばらばら** → メモの先頭に項目番号を書かせる\n- **AP が店のことを盛る** → 指示に「店について書くのは確かめた事実だけ。ないことは書かない」と入れ、点検リストにも同じ項目を置く\n- **点検リストが長くなる** → 追加は「案」として出し、SV か責任者が採用を決める。使わない項目は消す\n- **人の送信が追いつかない** → AP を増やさない。1日の上限を決め、その範囲で回す\n\n---\n\n質問はコメントでどうぞ。", "chars": 5066, "asks": 2}, {"id": "N006", "acc": "A02", "accName": "AI×営業（DM・フォーム営業の型）", "title": "Instagram DM で店舗に嫌われない書き方", "price": 980, "status": "校正待ち", "writer": "タロ", "memo": "状態：校正待ち（ライター：タロ）／アカウント：A02／価格：980円\n     編集長へ：A02 は営業部の実数が出るまで公開しない（編集長 9/29）。返信率などの数字は入れていない。\n     【社長確認】が残っている間は公開しない。Meta のポリシーは公開前に原文を確認する（リンクは本文5章）", "free": "**こんな人向け：** 飲食店・美容室・整骨院などの店舗に、Instagram の DM で営業している人。送っても無視される、ブロックされないか心配な人。\n\n**この記事でできること：** 店のオーナーに「しつこい業者」と思われない DM の書き方が分かります。5行の型、店の投稿の触れ方、言わないこと、再送のルール、そのまま使える文例を載せています。\n\n**筆者がやったこと：** 店舗向けに MEO対策ツールを案内する営業で、DM の文面を AI に作らせ、別の AI に点検させ、人が1件ずつ送る仕組みを作りました。この記事のルールは、その点検リストから取っています。\n\n---\n\n## 店の DM は、どう読まれているか\n\n店の Instagram には、お客さんからの予約や質問が届きます。\nそこに営業の DM が混ざります。\n\nオーナーが営業 DM を嫌うのは、だいたい次のときです。\n\n- 長い。スマホの画面をスクロールしないと終わらない\n- どの店にも同じ文を送っているのが分かる\n- 1通目から URL や資料が貼ってある\n- 返事をしないと、何度も送ってくる\n\n**DM は「お客さんの連絡が届く場所」に入っていく営業です。**\nフォームやメールより、相手の場所に近い。だから短く、丁寧に、1回で引くのが基本です。\n\n## 結論：5行・URLなし・投稿は1つだけ・再送は1回\n\n1. **5行まで。** スマホで1画面に収める\n2. **1通目に URL を貼らない。** 資料も送らない\n3. **店の実際の投稿に1つだけ触れる。** 見ていないことは書かない\n4. **断り方を書く。**「ご興味がなければスルーで大丈夫です」\n5. **再送は1回まで。1週間以上あける。** 断られたら、もう送らない\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 1通目の目的は「売ること」ではなく「15分だけ話を聞いてもらえるか」\n- 「投稿を拝見しました」だけでは足りない。どの投稿かを1つ書く\n- 自動で大量に送る仕組みは使わない。人が1件ずつ送る\n\n### 有料部分の目次\n1. 5行の型と、1行ずつの書き方\n2. URL を貼らない理由と、資料を渡すタイミング\n3. 店の実際の投稿の触れ方（よい例・だめな例）\n4. 言わないことの一覧（代わりの言い方つき）\n5. 再送のルールと、返事が来たあと\n6. 自動送信をすすめない理由（Instagram の仕組みと規約）\n7. 業種別の文例（飲食・美容・整骨院）\n8. 送る前の点検リスト", "paid": "## 1. 5行の型\n\n```\n1行目：名乗り（会社名・名前）\n2行目：この店に送った理由（実際に見た投稿を1つ）\n3行目：お願い（「15分だけご紹介させていただけないでしょうか」）\n4行目：断り方（「ご興味がなければ、このままスルーしていただいて大丈夫です」）\n5行目：（なくてもよい）お礼の一言\n```\n\n**1行ずつのコツ**\n- **1行目**：「はじめまして、{会社名}の{名前}です。」だけ。会社の説明は書かない\n- **2行目**：ここだけが、その店あての部分です。一番時間をかけます\n- **3行目**：お願いは小さく。「契約」「導入」ではなく「15分」\n- **4行目**：断り方があると、相手は安心して読めます。返事をしない自由を先に渡します\n- **「突然のご連絡失礼いたします」は1回まで。** 何度も謝ると長くなるだけです\n\n5行に収まらないときは、2行目を短くするのではなく、ほかの行を削ります。\n\n## 2. URL を貼らない理由\n\n1通目には URL を貼りません。資料や画像も送りません。\n\n- 知らない相手からの URL は、開くのが怖い\n- URL があると「宣伝の DM」に見えやすい\n- 読む前に「押すかどうか」を迷わせてしまう\n\n**資料を渡すのは、相手が「詳しく知りたい」と返事をくれてから**です。\nそのときも、まず1枚だけにします。\n\n## 3. 店の実際の投稿の触れ方\n\n2行目は、その店の投稿を実際に見て書きます。\n\n### 見るところ\n- 最近の投稿のメニュー・施術・商品\n- 新しくオープンした、移転した、などのお知らせ\n- 季節の限定メニューやイベント\n\n### よい例\n```\n{店名}さんの、秋限定の{メニュー名}の投稿を拝見してご連絡しました。\n```\n```\n{エリア}に新しくオープンされたとの投稿を拝見してご連絡しました。\n```\n\n### だめな例\n```\n素敵な投稿をいつも拝見しています。\n```\n→ どの店にも送れる文です。見ていないのが伝わります。「いつも」も事実でなければ書きません。\n\n```\nフォロワーが少なくて、もったいないと思いました。\n```\n→ 店の弱みを指摘する書き方は、上から目線に聞こえます。\n\n**ルール**\n- 触れる投稿は1つだけ。たくさん褒めると、かえって作り物に見えます\n- 見ていないこと、推測したことは書かない（「人気のお店と伺いました」など）\n- 投稿の文章や写真を、そのまま DM に貼らない。どの投稿かが分かる一言で十分です\n- AI に書かせるときは、実際に見た投稿の内容を人が渡す。AI に想像で書かせない\n\n## 4. 言わないことの一覧\n\n| 言わない | 理由・代わりに |\n|---|---|\n| 必ず来店が増えます／絶対儲かります | 「来店を増やす方法の1つとしてご案内しています」 |\n| 1位にします・上位表示を保証 | 順位は Google が決めます。保証はできません |\n| 口コミを増やします・★5を集めます | 見返り付きの口コミ集めを思わせます。Google のポリシー違反の手法を連想させるので使いません |\n| Google公認・Google提携 | 事実でなければ使いません |\n| 今だけ・本日中に | 事実の期限がないなら書きません |\n| 無料診断 | 業者の決まり文句に見えます |\n| 皆さんやってます | 事実で確かめられるときだけ、具体的に |\n| 至急ご返信ください／ご返信がない場合は… | 返信は相手の自由。使いません |\n| 「このままだと表示されなくなります」 | 不安をあおる書き方はしません |\n| 競合店の悪口 | 使いません |\n\nほかに、**1通目で料金・契約の話をしない**ことも決めています。\nまだ話を聞くと決めていない相手に、お金の話は早すぎます。\n\n## 5. 再送のルールと、返事が来たあと\n\n### 再送\n- **返事がないとき**：再送は1回まで。1週間以上あける\n- 再送は同じ文を送らない。短く、「先日ご連絡した{名前}です」から始める\n- **断られたとき**：お礼だけ返して、以後送らない\n- 同じ店に30日以内に送っていないか、送る前に一覧で確かめる\n\n再送の文例です。\n\n```\n先日ご連絡した、{会社名}の{名前}です。\nGoogleマップからのご来店を増やすツールを、15分だけご紹介できればと思い、もう一度だけご連絡しました。\nご興味がなければ、このままで大丈夫です。今後はお送りしません。\n```\n\n### 返事が来たら\n- **興味あり** → 日程を2つ出して返す。その日のうちに返す\n- **検討中** → 資料は1枚だけ。「1週間後にもう一度ご連絡してもよいですか」と聞く\n- **お断り** → 「お忙しいところありがとうございました」で終える\n\n## 6. 自動送信をすすめない理由\n\nDM を自動でたくさん送りたくなるかもしれません。\n私たちは、すすめません。人が1件ずつ送っています。\n\n**Instagram の公式の仕組み（API）では、企業から自由に DM を送れるわけではありません。**\n基本は、相手から先にメッセージが届いたときに、その後24時間以内に返信できる、という形です。\nつまり、こちらから知らない店に1通目を送る用途には、公式の仕組みは向いていません。\n\n公式でないツールで自動送信すると、Instagram の規約に反するおそれがあります。\nアカウントが制限されることも考えられます。\n手で送る場合も、短い時間に大量に送る使い方は避けてください。\n\nルールは変わることがあります。**使う前に、Meta の最新のポリシーを必ず確認してください。**\n- Meta Messenger Platform のポリシー：https://developers.facebook.com/documentation/business-messaging/messenger-platform/policy\n\n私たちの送り方はこうです。\n- AI が文面を作り、別の AI が点検して「承認済」にする\n- 送信補助ツールは、店のプロフィールを開いて文面を画面に出すだけ\n- 人が文面を読み、コピーして DM に貼り、人が送る\n- 1日に送る上限を決めておく\n\n※規約・法律の判断は、必要に応じて専門家に確認してください。\n\n## 7. 業種別の文例\n\nどれも、`{ }` の中は実際に見た事実だけで埋めます。\n\n### 飲食店\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{メニュー名}の投稿を拝見してご連絡しました。\nGoogleマップからのご来店を増やすためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 美容室・サロン\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{施術名}のスタイル写真の投稿を拝見してご連絡しました。\nGoogleマップで見つけてもらいやすくするツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 整骨院\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんが{エリア}に新しく開院されたとの投稿を拝見してご連絡しました。\nGoogleマップで近くの方に見つけてもらうためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n【社長確認：実際に返信をもらえた DM の書き出しがあれば1つ（書けなければ文ごと消す）】\n\n## 8. 送る前の点検リスト\n\n```\n- [ ] プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 5行以内。URL・資料を貼っていない\n- [ ] 名乗り（会社名・名前）がある\n- [ ] 触れた投稿は1つで、実際に見たもの\n- [ ] 断り方が書いてある\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 上の「言わないこと」を使っていない\n- [ ] 不安をあおる書き方をしていない\n- [ ] 再送なら、前回から1週間以上あいていて、1回目の再送である\n- [ ] 送るのは人。自動送信ツールを使っていない\n```\n\n---\n\n質問はコメントでどうぞ。", "chars": 4227, "asks": 1}, {"id": "N007", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "Googleマップで見つけてもらうために、店舗が今日できること10個", "price": 1980, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/29 編集長の指示で社長確認を2か所に整理）／アカウント：A03／価格：1,980円\n     編集長へ：Google のヘルプの内容は公開前に原文を確認する。MEO ツールの紹介は最後に1回だけ（knowledge.md が埋まってから）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。Googleマップで検索しても自分の店が出てこない、何から手を付ければいいか分からない人。\n\n**この記事でできること：** お金をかけずに、今日のうちに Googleビジネスプロフィールで直せる10個の作業が分かります。やってはいけないこと（プロフィールが止められるおそれのあること）も分かります。\n\n**筆者について：** 店舗向けに MEO（Googleマップ集客）のツールを案内する仕事をしています。【社長確認：MEO に関わった期間・担当した店舗の数など、確認できる事実だけ】\n\n---\n\n## まず知っておくこと：Google は何を見て順番を決めているか\n\nGoogle の公式ヘルプでは、ローカル検索の結果は主に **関連性・距離・知名度** の3つで決まると説明されています（[Google のローカル検索結果のランキングを改善する](https://support.google.com/business/answer/7091?hl=ja)）。\n\n- **関連性**：検索された言葉と、お店の情報がどれだけ合っているか\n- **距離**：検索した人からお店までの距離\n- **知名度**：お店がどれだけ知られているか（口コミなども含む）\n\nこのうち **距離は変えられません。** お店が今日から変えられるのは、主に「関連性」です。つまり、**プロフィールの情報を正確に、たくさん入れること**が、いちばん確実な一歩です。\n\nまた、**順位は Google が決めるもので、誰にも保証はできません。**「必ず1位にします」という業者には気をつけてください。\n\n## 今日できること10個（見出しだけ）\n1. お店の名前を「看板どおり」にする\n2. メインの業種を正しく選ぶ\n3. 営業時間と、祝日・臨時休業を入れる\n4. 住所・電話番号を、ホームページや看板と同じ表記にそろえる\n5. 写真を足す（外観・店内・メニューやサービス）\n6. お店の説明を書く\n7. メニュー・サービスを登録する\n8. 口コミにすべて返信する\n9. 口コミを「見返りなしで」お願いする\n10. 最新情報（投稿）を出す\n\n有料部分では、1つずつの具体的なやり方と、**やるとプロフィールが止められるおそれのある5つのこと**、今日の作業チェックリストを載せています。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 変えられるのは「関連性」。情報を正確に、たくさん入れる\n- 順位の保証はできない。保証をうたう業者に注意\n- 口コミのお願いに、割引や特典をつけない\n\n### 有料部分の目次\n1. 10個の具体的なやり方\n2. やってはいけない5つのこと\n3. 今日の作業チェックリスト（30分版）\n4. 業者に頼むかどうかの判断\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N007)", "paid": "## 1. 10個の具体的なやり方\n\n### ① お店の名前を「看板どおり」にする\nGoogle のガイドラインでは、ビジネス名には実際に使っている名前を使い、**キーワードやキャッチフレーズを足してはいけない**とされています（[Google に掲載するビジネス情報のガイドライン](https://support.google.com/business/answer/3038177?hl=ja)）。\n- ✕「〇〇美容室｜渋谷駅徒歩3分・カット安い」\n- ○「〇〇美容室」\n\n### ② メインの業種を正しく選ぶ\n業種（カテゴリ）は、検索との「関連性」に大きく関わります。メインの業種は、お店がいちばん力を入れているものを1つ選びます。追加の業種は、実際にやっているものだけにします（[業種を管理する](https://support.google.com/business/answer/7249669?hl=ja)）。\n\n### ③ 営業時間と、祝日・臨時休業を入れる\n「行ったら閉まっていた」はお客さんを一番がっかりさせます。祝日や年末年始は「特別営業時間」で入れます。\n\n### ④ 住所・電話番号の表記をそろえる\nホームページ・予約サイト・看板・Googleで、住所と電話番号の書き方をそろえます（例：「1-2-3」と「1丁目2番3号」を混ぜない）。お客さんが別のサイトで見た情報と食い違わないようにするためです。\n\n### ⑤ 写真を足す\n外観（初めての人が入口を見つけられる写真）・店内・メニューやサービス・スタッフ。写真のルールは [写真や動画に関するポリシー](https://support.google.com/business/answer/7213077?hl=ja) を確認します。\n\n### ⑥ お店の説明を書く\n何のお店か・どんな人に向いているか・ほかの店との違いを、事実で書きます。URL や割引の宣伝は入れません。\n\n### ⑦ メニュー・サービスを登録する\n「カット」「骨盤矯正」「ランチ」など、お客さんが検索しそうな言葉で、実際のメニューを登録します。\n\n### ⑧ 口コミにすべて返信する\n良い口コミにはお礼を、悪い口コミには言い訳をせず、事実とこれからの対応を短く書きます。返信は、これから来るお客さんも読んでいます。\n\n### ⑨ 口コミを「見返りなしで」お願いする\n会計のときに「よろしければ、Googleにご感想をお願いします」と伝えます。**割引・プレゼント・ポイントなどの見返りはつけません。**\n\n### ⑩ 最新情報（投稿）を出す\n新メニュー・季節の案内・休業のお知らせなどを投稿します。無理のない頻度で、続けられるペースを決めてください。\n\n## 2. やってはいけない5つのこと\n\n| やってはいけないこと | 理由 |\n|---|---|\n| 口コミの見返りに割引・特典を渡す | Google のポリシーでは、見返りを渡して口コミを集めることは禁止。違反すると口コミの削除やプロフィールの制限がありうる（[ポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)） |\n| 家族・スタッフ・業者に口コミを書かせる | 嘘の口コミは禁止 |\n| お店の名前にキーワードを足す | ビジネス名のガイドライン違反 |\n| 実際にない住所で登録する | 所在地のガイドライン違反 |\n| 「★5を集めます」という業者に頼む | 上の違反を代わりにやっていることがある |\n\n## 3. 今日の作業チェックリスト（30分版）\n\n```\n- [ ] 名前が看板どおりか（キーワードが入っていないか）\n- [ ] メインの業種が正しいか\n- [ ] 営業時間・特別営業時間が入っているか\n- [ ] 住所・電話番号がホームページと同じ表記か\n- [ ] 外観・店内・メニューの写真が各1枚以上あるか\n- [ ] お店の説明が入っているか\n- [ ] 返信していない口コミがないか\n- [ ] 口コミのお願いに見返りをつけていないか\n```\n\n## 4. 業者に頼むかどうかの判断\n\n自分で10個をやってから考えても遅くありません。頼むなら、次を確かめてください。\n- 順位を「保証」していないか\n- 口コミをどう集めるのか（見返りや代筆がないか）\n- 何をしてくれて、いくらで、いつ解約できるか\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N007)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ（公開前）\n- ローカル検索のランキング：https://support.google.com/business/answer/7091?hl=ja\n- ビジネス情報のガイドライン：https://support.google.com/business/answer/3038177?hl=ja\n- 業種を管理する：https://support.google.com/business/answer/7249669?hl=ja\n- 写真や動画のポリシー：https://support.google.com/business/answer/7213077?hl=ja\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja\n（この一覧は公開前に消す）", "chars": 3611, "asks": 3}, {"id": "N008", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "やってはいけない口コミ集め：Google のルールと安全な頼み方", "price": 980, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/30）／アカウント：A03／価格：980円\n     編集長へ：Google のヘルプ・消費者庁のページは、公開前に社長が原文を確認する（ライターは検索結果の要約までしか見られていない）。\n     報告の細かい操作手順は原文を確認できなかったため書いていない。「公式ヘルプで手順を確認」としている。MEO ツールの紹介は入れていない（無料相談フォームへの案内だけ入れた）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。口コミを増やしたいけれど、どこまでが OK で、どこからが違反なのか分からない人。\n\n**この記事でできること：** Google が禁止している口コミの集め方が分かります。見返りなしで頼むときの、そのまま使える声かけ・POP・LINE の文面が手に入ります。悪い口コミへの返し方と、嘘っぽい口コミを見つけたときの動き方も分かります。\n\n**筆者について：** 店舗向けに MEO（Googleマップ集客）のツールを案内する仕事をしています。【社長確認：MEO に関わった期間・担当した店舗の数など、確認できる事実だけ】\n\n---\n\n## 口コミは「集め方」で損をする\n\n口コミは、Googleマップでお店を選ぶ人がよく見る場所です。\nだから「早く増やしたい」と思うのは自然です。\n\nただ、集め方をまちがえると逆効果です。\nGoogle は、ルールに合わない口コミを削除します。\n違反が重なると、プロフィールそのものに制限がかかることもあります（[Google ビジネス プロフィールのポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)）。\n\n## やってはいけない4つ（ここだけ覚えてください）\n\nGoogle マップの口コミのルールは「[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)」というページにまとまっています。\nそこでは、実際の体験にもとづかない口コミを「虚偽のエンゲージメント」と呼んで禁止しています。\n\nお店の側でよく起きるのは、次の4つです。\n\n1. **見返りをつける**：「口コミを書いたら1品サービス」「★5で次回割引」など\n2. **嘘の口コミを書く・書かせる**：来ていない人の口コミ、1人で何個も書く口コミ\n3. **家族・スタッフに書かせる**：利害関係のある人の口コミは禁止\n4. **代行業者に頼む**：お金を払って口コミを書いてもらうこと\n\nどれも「悪気がなかった」では通りません。\n迷ったら、**見返りなし・実際に来た人だけ・書くかどうかはお客さんの自由**。この3つで判断してください。\n\n## 安全な頼み方は「一言だけ、見返りなし」\n\nGoogle のヘルプでも、お客さんにリンクや QR コードを渡して口コミをお願いする方法が紹介されています（[クチコミを増やすためのヒント](https://support.google.com/business/answer/3474122?hl=ja)）。\n頼むこと自体は問題ありません。問題になるのは、見返りや、書く中身の指定です。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 見返り・嘘・家族スタッフ・代行業者の4つはやらない\n- 頼むときは「よろしければ」と一言。見返りはつけない\n- 良い口コミだけを選んで頼まない\n\n### 有料部分の目次\n1. 違反になる例・ならない例（早見表）\n2. そのまま使える文面：会計時・POP・LINE\n3. 悪い口コミへの返し方（型と例文）\n4. 嘘っぽい口コミを見つけたとき\n5. 広告のルール（ステマ規制）にも気をつける\n6. お店で共有するチェックリスト\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N008)", "paid": "## 1. 違反になる例・ならない例（早見表）\n\n| やりがちなこと | 判断 | 理由 |\n|---|---|---|\n| 「口コミを書いてくれたらドリンク1杯無料」 | ✕ | 見返りをつけている |\n| 「★5をつけてくれたら次回10%オフ」 | ✕ | 見返り＋評価の指定 |\n| 満足していそうな人にだけ頼む | ✕ | 良い口コミだけを選んで集めるのは禁止 |\n| スタッフが自分のスマホで口コミを書く | ✕ | 利害関係がある |\n| 家族や友人に「書いておいて」と頼む | ✕ | 利害関係がある。来ていない人なら嘘の口コミにもなる |\n| 業者に「口コミ〇件」を頼む | ✕ | お金を払って書かせている |\n| 悪い口コミを消してくれたら返金する、と持ちかける | ✕ | 口コミの修正と引き換えに見返りを渡している |\n| 会計のときに「よろしければ」と QR コードを渡す | ○ | 見返りなし・任意 |\n| レシートやお礼のメッセージにリンクをのせる | ○ | Google のヘルプでも紹介されている方法 |\n| 全部の口コミに返信する | ○ | 良い口コミにも悪い口コミにも返す |\n\nポイントは2つです。\n**「書いたら何かもらえる」をなくすこと。** そして **「書く人を選ばないこと」。**\n\n「良い口コミだけを選んで頼む」のは、うっかりやりがちです。\n満足そうなお客さんにだけ声をかける、アンケートで高い点をつけた人だけに Google のリンクを出す、といったやり方です。\n頼むなら、来てくれた人みんなに同じように頼みます。\n\n## 2. そのまま使える文面\n\n### 会計時の声かけ\n\n```\n本日はありがとうございました。\nもしよろしければ、Googleマップにご感想をいただけると励みになります。\nこちらの QR コードから書けます。もちろん、無理にとは言いません。\n```\n\n言い方のコツは3つです。\n- 「よろしければ」「無理にとは」を入れる（書くかどうかはお客さんの自由）\n- 「★5で」「良いことを」など、評価や中身を指定しない\n- 断られても、表情を変えない\n\n### 店内 POP（レジ横・テーブル）\n\n```\nご感想をお聞かせください\n\nGoogleマップでのご感想は、\nこれから来られる方の参考になります。\n良かったことも、直してほしいことも、\nそのまま書いていただけるとうれしいです。\n\n（QR コード）\n```\n\n「直してほしいことも」と書いておくと、良い口コミだけを求めている印象になりません。\nPOP に「プレゼント」「割引」の文字は入れません。\n\n### LINE（来店後のお礼）\n\n```\n〇〇様\n本日はご来店ありがとうございました。\nもしよろしければ、Googleマップにご感想をいただけるとうれしいです。\n▼こちらから書けます\n（リンク）\n今後ともよろしくお願いいたします。\n```\n\nLINE のクーポン配信と同じメッセージに入れないようにします。\n並べて送ると、「口コミを書いたらクーポン」と受け取られるおそれがあります。\n\nリンクや QR コードの作り方は、Google の公式ヘルプで手順を確認してください（[リンクまたは QR コードを作成してクチコミをリクエストする](https://support.google.com/business/answer/16816815?hl=ja)）。\n\n## 3. 悪い口コミへの返し方\n\n悪い口コミへの返信は、書いた本人だけでなく、**これから来る人が読んでいます。**\n言い返すより、「このお店はちゃんと対応してくれそう」と思ってもらうほうが大事です。\n\n### 返信の型（4行）\n1. お礼：来てくれたこと、書いてくれたことへのお礼\n2. おわび：嫌な思いをさせたことへのおわび（事実を認められる範囲で）\n3. これから：何を直すか、または確認すること\n4. 連絡先：くわしく聞きたいときの窓口（必要なときだけ）\n\n### 例文（待ち時間が長かった、という口コミ）\n\n```\nご来店いただき、またご感想をお寄せいただきありがとうございます。\nお待たせしてしまい、申し訳ございませんでした。\nご予約の入れ方と、お待ちいただくときのご案内を見直します。\nまたお越しいただけた際には、気持ちよくお過ごしいただけるよう努めます。\n```\n\n### 返信でやらないこと\n- お客さんの名前・来店日・施術内容など、個人が分かることを書く\n- 「そんな事実はありません」と言い切って責める\n- 「消してくれたら〇〇します」と持ちかける（見返りになる）\n- 感情的になったまま、その日のうちに返す\n\nすぐに返したくなったら、一晩おいてから、別の人に読んでもらってください。\n\n## 4. 嘘っぽい口コミを見つけたとき\n\n来た記録がない人の口コミや、同じような文の悪い口コミが続く、ということもあります。\n\n### まずやること\n1. **消そうとしない・言い返さない**：口コミに感情的な返信をつけない\n2. **記録を残す**：口コミの画面を保存し、投稿日・内容・気づいたことをメモする\n3. **ルールに当たるか確認する**：「[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)」のどれに当たりそうかを見る。「低い評価だから」「内容が気に入らないから」だけでは、ルール違反にはならない\n4. **Google に報告する**：ビジネスプロフィールの管理画面や Google マップから、ポリシー違反の口コミとして報告できます。**操作の手順は画面が変わることがあるため、公式ヘルプで手順を確認してください**（[ビジネス プロフィール上の不適切なクチコミを報告する](https://support.google.com/business/answer/4596773?hl=ja)／[クチコミの管理](https://support.google.com/business/workflow/9945796?hl=ja)）\n5. **報告の結果を確認する**：報告した口コミがどうなったかも、公式ヘルプの案内に沿って確認します\n\n報告しても、必ず消えるわけではありません。\n消えなかったときは、落ち着いた返信を1つつけておくほうが、読む人には伝わります。\n\n脅しや個人情報が書かれているなど、お店だけで抱えられないときは、弁護士などの専門家に相談してください。\n\n## 5. 広告のルール（ステマ規制）にも気をつける\n\nGoogle のルールとは別に、日本の法律の話もあります。\n2023年10月1日から、広告なのに広告だと分からない表示（いわゆるステルスマーケティング）は、景品表示法の不当表示として規制されています（[消費者庁：令和5年10月1日からステルスマーケティングは景品表示法違反となります](https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing)）。\n\n消費者庁の説明では、SNS の投稿やレビュー投稿も対象になりうるとされています。\nお店がお金や物を渡して、お客さんのふりをした投稿をしてもらう、といったことは避けてください。\n\nここは一般的な注意です。\n自分のお店のやり方が当たるかどうか迷ったら、消費者庁のページを読むか、専門家に確認してください。\n\n## 6. お店で共有するチェックリスト\n\nスタッフ全員で同じやり方にするために、印刷して貼っておけます。\n\n```\n- [ ] 口コミのお願いに、割引・プレゼント・ポイントをつけていない\n- [ ] 「★5で」「良いことを書いて」と言っていない\n- [ ] 満足していそうな人だけに頼んでいない（全員に同じように頼む）\n- [ ] スタッフ・家族・知人が、うちの店の口コミを書いていない\n- [ ] 口コミを書く業者に頼んでいない\n- [ ] POP・LINE に、クーポンと口コミのお願いを並べていない\n- [ ] 悪い口コミにも、4行の型で返信している\n- [ ] 返信に、お客さんの個人情報を書いていない\n- [ ] 嘘っぽい口コミは、記録を残してから公式ヘルプの手順で報告している\n```\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N008)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ・公的ページ（公開前）\n※ ライターの環境では support.google.com を開けなかったため、すべて検索結果の要約で確認しています（原文未確認）。\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja（原文未確認）\n- 禁止および制限されているコンテンツ（マップのユーザー投稿コンテンツ）：https://support.google.com/contributionpolicy/answer/7400114?hl=ja（原文未確認。「虚偽のエンゲージメント」「利益相反」「見返り」「肯定的なクチコミを選択的に募る」の記述があるか）\n- クチコミを増やすためのヒント：https://support.google.com/business/answer/3474122?hl=ja（原文未確認。リンク・QR コードをレシートやメールにのせる例があるか）\n- リンクまたは QR コードを作成してクチコミをリクエストする：https://support.google.com/business/answer/16816815?hl=ja（原文未確認）\n- 不適切なクチコミを報告する：https://support.google.com/business/answer/4596773?hl=ja（原文未確認。報告の手順の書き方をこの記事に足すかどうか）\n- クチコミの管理：https://support.google.com/business/workflow/9945796?hl=ja（原文未確認）\n- 消費者庁 ステルスマーケティング：https://www.caa.go.jp/policies/policy/representation/fair_labeling/stealth_marketing（原文未確認。施行日 2023年10月1日、レビュー投稿も対象になりうる、の記述）\n（この一覧は公開前に消す）", "chars": 5845, "asks": 3}, {"id": "N009", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "MEO 業者に頼む前に確認する7つのこと", "price": 1480, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・9/30）／アカウント：A03／価格：1,480円\n     編集長へ：自社でMEOツールを売っているため、自社に有利な書き方になっていないか編集長が確認\n     （特定の業者・ツールの名前は出していない。「業者に頼まず自分でやる」も選択肢として同じ重さで書いた。自社ツールの宣伝は入れていない。ただし社長の指示（9/30）で、最後に自社の無料相談フォームへの案内を入れた。案内の前に「筆者は MEO ツールを扱う会社にいる」ことを必ず明記すること）\n     Google のヘルプは、公開前に社長が原文を確認する（ライターは検索結果の要約までしか見られていない）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。MEO（Googleマップ集客）の業者から営業を受けていて、契約してよいか迷っている人。\n\n**この記事でできること：** 契約の前に業者へ聞くべき7つの質問と、返ってきた答えの見方が分かります。そのまま使える質問リストと、断るときの文面も手に入ります。\n\n**筆者について：** 【社長確認：筆者は MEO ツールを扱う会社にいる。この立場を読者にどう書くか（会社名を出すか・担当した期間など、確認できる事実だけ）】\n\n---\n\n## 先にお伝えしておくこと\n\n筆者は MEO ツールを扱う会社にいます（上の【社長確認】で書き方を決めます）。\nなので、この記事では **特定の業者やツールをすすめません。** 自社の紹介もしません。\n「頼まずに自分でやる」も、同じくらいまっとうな選択肢として書きます。\n\n## 業者選びで困るのは「あとから分かる」こと\n\nMEO の業者は、Googleビジネスプロフィール（Googleマップに出るお店の情報）の手入れを代わりにやってくれます。\nうまく使えば、手間が減ります。\n\n困るのは、契約してから分かることです。\n「解約できない」「プロフィールが自分で触れない」「何をしてくれているのか分からない」。\nどれも、**契約の前に聞いておけば防げる**ことです。\n\n## 確認する7つのこと（見出しだけ）\n\n1. 順位を「保証」していないか\n2. 口コミをどうやって集めるのか\n3. 契約期間と、解約の条件\n4. プロフィールのオーナー権限を誰が持つか\n5. 月額に何が含まれているか\n6. 報告の中身は何か\n7. Google のルールに違反したとき、誰が責任を持つか\n\nこの中で、**一番大事なのは4番です。** オーナー権限は、お店のあなたが持ち続けてください。\n\n## 1つだけ先に：順位の保証は、うたってはいけないこと\n\nGoogle は、代わりにプロフィールを管理する会社（サードパーティ）向けのルールを出しています。\nその中で、**Google での上位掲載を保証することは禁止**とされています（[ビジネス プロフィールのサードパーティ ポリシー](https://support.google.com/business/answer/7353941?hl=ja)）。\n\n順位は Google が決めます。誰にも保証はできません。\n「必ず1位」「上位表示を保証」と言われたら、そこで一度立ち止まってください。\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 順位の保証をうたう業者は、Google のルールに合っていない\n- オーナー権限はお店が持ち続ける\n- 契約の前に、解約の条件と月額の中身を紙で確認する\n\n### 有料部分の目次\n1. 7つの質問と、答えの見方\n2. 業者に送る質問リスト（コピーして使える）\n3. オーナー権限を守る手順\n4. 自分でやるか、頼むかの判断\n5. 断るとき・見直すときの文面\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N009)", "paid": "## 1. 7つの質問と、答えの見方\n\n### ① 順位を「保証」していないか\n\n**聞くこと：** 「順位について、どんな約束をしていますか」\n\n**見方：**\n- ○「順位は Google が決めるので保証はできません。やることは〇〇です」\n- ✕「必ず上位に出します」「上がらなければ返金」\n\n返金の約束があっても、保証をうたっていることに変わりはありません。\nサードパーティのポリシーでは、特別な手段で順位を約束したり操作したりすることも認められていません（[サードパーティ ポリシー](https://support.google.com/business/answer/7353941?hl=ja)）。\n\n### ② 口コミをどうやって集めるのか\n\n**聞くこと：** 「口コミは、どんな方法で増やしますか。文面を見せてもらえますか」\n\n**見方：**\n- ○ お客さんに見返りなしでお願いする文面・QR コードを用意する\n- ✕「〇件増やします」「★5を集めます」\n- ✕ 割引や特典と引きかえに書いてもらう\n- ✕ 業者側の人が書く\n\nGoogle マップのルールでは、見返りと引きかえの口コミ、実際の体験にもとづかない口コミ、利害関係のある人の口コミは禁止です（[禁止および制限されているコンテンツ](https://support.google.com/contributionpolicy/answer/7400114?hl=ja)）。\n違反した口コミは削除され、プロフィールに制限がかかることもあります（[ポリシーの概要](https://support.google.com/business/answer/13762416?hl=ja)）。\n**件数を約束する業者は、どうやってその件数を出すのか**を必ず聞いてください。\n\n### ③ 契約期間と、解約の条件\n\n**聞くこと：** 「最低契約期間は何か月ですか。途中でやめるとき、いくらかかりますか。何日前までに、どうやって伝えればいいですか」\n\n**見方：**\n- ○ 期間・解約金・連絡方法が、契約書に書いてある\n- ✕ 口頭の説明だけで、書面がない\n- ✕ 自動で更新されるのに、そのことが説明されない\n\n「いつでもやめられます」と言われたら、**それが契約書のどこに書いてあるか**を指で示してもらいます。\n\n### ④ オーナー権限を誰が持つか\n\n**聞くこと：** 「プロフィールのオーナーは誰になりますか。御社にはどの権限を渡せばいいですか」\n\n**見方：**\n- ○ お店がオーナーのまま。業者には「管理者」の権限を渡す\n- ✕ 業者のアカウントを「メインのオーナー」にする\n- ✕ お店の Google アカウントのパスワードを教えてほしいと言われる\n\nGoogle のヘルプでは、プロフィールにはオーナーと管理者がいて、**メインのオーナーは1人だけ**とされています。\n管理者は、オーナーとほぼ同じことができますが、ユーザーの追加・削除や、プロフィールの削除はできません（[オーナーと管理者を管理する](https://support.google.com/business/answer/3403100?hl=ja)）。\n業者の仕事には、ふつう管理者で足ります。\n\n### ⑤ 月額に何が含まれているか\n\n**聞くこと：** 「月額の中で、毎月やってもらえることを全部書き出してもらえますか。別料金になるものはどれですか」\n\n**見方：**\n- ○「投稿は月〇回」「口コミの返信の代行あり・なし」など、回数と範囲が書いてある\n- ✕「総合的に対策します」だけで、中身が分からない\n- ✕ 初期費用・写真撮影・ツール利用料など、あとから別料金が出てくる\n\n回数が書いていないと、何もしていない月があっても確かめられません。\n\n### ⑥ 報告の中身は何か\n\n**聞くこと：** 「毎月の報告書の見本を見せてもらえますか」\n\n**見方：**\n- ○ その月に **やった作業** と、Google のプロフィールで見られる数字（表示回数・電話・ルート検索など）が分かれている\n- ✕ 業者が決めた言葉での「順位」だけ\n- ✕ 見本を出してもらえない\n\n順位は、調べる場所や時間、使う端末で変わります。\n「どの場所から、何という言葉で調べた順位か」も聞いておきます。\nプロフィールの数字は、オーナーのあなたも自分で見られます。業者の報告と見比べてください。\n\n### ⑦ Google のルールに違反したとき、誰が責任を持つか\n\n**聞くこと：** 「御社の作業が原因で、口コミが消えたりプロフィールが止まったりしたら、どう対応しますか」\n\n**見方：**\n- ○ 対応の中身（原因の説明・直す作業・費用の扱い）が契約書に書いてある\n- ✕「そういうことは起きません」で終わる\n- ✕ 責任はすべてお店、と書いてある\n\nプロフィールが止まって困るのは、お店です。\nここを聞いて答えがはっきりしない業者は、ほかの答えも疑ってよいと思います。\n\n## 2. 業者に送る質問リスト（コピーして使える）\n\nメールやフォームで、このまま送れます。**答えを文字でもらう**のが大事です。\n\n```\n〇〇株式会社 〇〇様\n\nご案内ありがとうございます。\n検討のため、次の7点を文書でお教えいただけますでしょうか。\n\n1. 検索順位について、どのようなお約束をされていますか\n2. 口コミはどのような方法で増やしますか（お客様への依頼文の見本があれば添付ください）\n3. 最低契約期間・途中解約の費用・解約の連絡方法と期限\n4. ビジネスプロフィールのオーナーは当店のままですか。御社に付与する権限は何ですか\n5. 月額に含まれる作業（回数）と、別料金になるもの\n6. 毎月の報告書の見本\n7. 御社の作業が原因でプロフィールに制限がかかった場合の対応\n\nお手数をおかけしますが、よろしくお願いいたします。\n（店名・お名前）\n```\n\n## 3. オーナー権限を守る手順\n\n1. **自分のアカウントがオーナーか確かめる**：プロフィールの設定の「ユーザーとアクセス権」の画面で、自分がオーナーになっているかを見る\n2. **業者は「管理者」で追加する**：業者の Google アカウントを、管理者として招待する\n3. **パスワードは渡さない**：お店の Google アカウントのログイン情報は、誰にも教えない\n4. **メインのオーナーを譲らない**：業者から頼まれても、メインのオーナー権限は移さない\n5. **解約したら、業者を外す**：契約が終わったら、業者のアカウントをユーザーから削除する\n\n画面の名前や操作は変わることがあります。**細かい手順は公式ヘルプで確認してください**（[オーナーと管理者を管理する](https://support.google.com/business/answer/3403100?hl=ja)／[メインのオーナー権限を譲渡する](https://support.google.com/business/answer/3415281?hl=ja)）。\n\n## 4. 自分でやるか、頼むかの判断\n\nどちらが正しい、ということはありません。目安だけ書きます。\n\n| 自分でやる向き | 頼む向き |\n|---|---|\n| 毎週すこしでも自分で触る時間をとれる | 手が回らず、何か月も触れていない |\n| 写真や投稿を自分で出したい | 何をすればいいか整理から手伝ってほしい |\n| まずお金をかけずに試したい | 7つの質問に、書面ではっきり答える業者がいる |\n\n先に基本の手入れ（名前・業種・営業時間・写真・口コミの返信）を自分でやってみると、業者の説明が分かりやすくなります。\nやってみてから決めても、遅くはありません。\n\n## 5. 断るとき・見直すときの文面\n\n### 断るとき\n\n```\nご案内ありがとうございました。\n検討しましたが、今回は見送らせていただきます。\n今後のご連絡は控えていただけますと幸いです。\n```\n\n理由を細かく書く必要はありません。\n\n### いま契約中で、見直したいとき\n\n```\nいつもお世話になっております。\n契約内容を確認したく、次の点をお教えください。\n・現在の契約期間の終わりと、解約の連絡期限\n・当店のビジネスプロフィールで、御社に付与している権限\n・この3か月に行った作業の一覧\n```\n\nまず、自分がオーナーのままかを先に確かめてから送ると安心です。\n\n## チェックリスト（契約の前に）\n\n```\n- [ ] 順位の保証をうたっていない\n- [ ] 口コミの集め方に、見返り・件数の約束・代筆がない\n- [ ] 契約期間・解約金・解約の連絡方法が書面にある\n- [ ] オーナーはお店のまま。業者は管理者\n- [ ] 月額の作業の回数と、別料金のものが書面にある\n- [ ] 報告書の見本を見た\n- [ ] 違反が起きたときの対応が書面にある\n```\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N009)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ（公開前）\n※ ライターの環境では support.google.com を開けなかったため、すべて検索結果の要約で確認しています（原文未確認）。\n- サードパーティ ポリシー：https://support.google.com/business/answer/7353941?hl=ja（原文未確認。「上位掲載の保証」「ランキングの約束・操作」の禁止の書き方）\n- ポリシーの概要：https://support.google.com/business/answer/13762416?hl=ja（原文未確認）\n- 禁止および制限されているコンテンツ：https://support.google.com/contributionpolicy/answer/7400114?hl=ja（原文未確認）\n- オーナー function open(id, scroll) {
  const d = DATA.find(x => x.id === id); if (!d) return;
  if (current !== id) showPaid = false;
  current = id; renderList();
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  const read = Math.max(1, Math.round(d.chars / 500));
  $("#reader").innerHTML = `
    <div class="meta"><div class="av">${d.acc}</div><div class="who"><b>${esc(d.accName)}</b>ライター：${esc(d.writer)}（下書き・${esc(d.status)}）</div></div>
    <h2 class="title">${esc(d.title)}</h2>
    <div class="facts"><span class="price">${yen(d.price)}</span><span>${d.id}</span><span>約${d.chars.toLocaleString()}字・読了 約${read}分</span>${d.asks ? `<span class="warn">【社長確認】あと${d.asks}か所</span>` : ""}</div>
    ${d.memo ? `<details class="memo"><summary>編集メモ（公開前に消す）</summary><pre>${esc(d.memo)}</pre></details>` : ""}
    <div class="body">${md(d.free)}
      ${d.paid ? (showPaid
        ? `<span class="paidlabel">ここから有料部分</span>${md(d.paid)}`
        : `<div class="wall"><p>ここから先は有料部分です</p><span class="yen">${yen(d.price)}</span><button type="button" id="unlock">有料部分をひらく（確認用）</button><p>実際の note では、購入した人だけが読めます</p></div>`) : ""}
    </div>`;
  const u = $("#unlock"); if (u) u.onclick = () => { showPaid = true; open(id, false); };
  if (scroll && innerWidth <= 860) $("#reader").scrollIntoView({ behavior: "smooth", block: "start" });
}
renderChips(); renderList();
const start = (location.hash || "").slice(1);
open(DATA.some(d => d.id === start) ? start : (DATA[0] && DATA[0].id), false);
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== current && DATA.some(d => d.id === h)) open(h, true); });
})();
</script>
