スは、ガスの使用開始の際は立ち会いが必要で、本人が立ち会えない場合は、連絡内容を伝えられる代理の人（大家さん・管理人さんなど）の立ち会いでもよいと案内しています。立ち会いの条件や、予約できる時間帯はガス会社によって違うので、**新居のガス会社で確認**してください。\n\nここで気をつけたいのは、**立ち会いの日時は、希望どおりに取れるとは限らない**点です。引越しの日が決まったら、ほかの手続きより先にガスの予約を入れておくと安心です。\n\n旧居のガスを止める「閉栓」は、立ち会いが要らない場合もあります。これもガス会社の案内を確かめてください。\n\n## 水道：連絡先は「新居の地域の水道局」\n\n水道は、住んでいる地域の水道局（市区町村など）が担当しています。電気やガスのように会社を選ぶものではありません。\n\n- 連絡先は、**新居の住所を担当する水道局**（市区町村のページで調べられます）\n- 旧居と新居で水道局が違うときは、それぞれに連絡します\n- 申し込み方法は、電話・Web・アプリなど、水道局ごとに違います\n\n多くの物件では、水道の使用開始に立ち会いは要りません。ただ、水道局や物件によって違うことがあるので、案内を確かめてください。新居に着いたら、まず蛇口をひねって水が出るか確かめます。\n\n## チェックリスト：3か所の連絡、済みましたか\n\n- [ ] 旧居の電気・ガス・水道の会社とお客さま番号を控えた\n- [ ] 新居のガス会社と水道局を確かめた\n- [ ] 電気の契約先を決めた（続ける／選び直す）\n- [ ] 電気：旧居の停止日・新居の開始日を伝えた\n- [ ] ガス：旧居の閉栓日を伝え、新居の開栓の立ち会い日時を予約した\n- [ ] 水道：旧居の使用中止・新居の使用開始を申し込んだ\n- [ ] 最後の料金の支払い方法を確かめた\n- [ ] 入居の日に、ブレーカー・蛇口・ガス（立ち会い）の順で確かめる予定を入れた\n\n## よくある失敗\n\n**1. ガスの予約が遅れて、入居してから数日お風呂に入れない**\n電気と水道はすぐ使えても、ガスは立ち会いの予約が必要なことが多いです。引越しの日が決まったら、まずガスの予約から入れておきます。\n\n**2. 旧居の停止を忘れて、住んでいない家の料金がかかり続ける**\n新居の「開始」だけ申し込んで、旧居の「停止」を忘れる例です。「止める」と「始める」は、1回の電話で両方伝えるつもりで連絡します。\n\n**3. 電気の申し込みがまだで、入居の夜に明かりがつかない**\n鍵をもらった安心感で、電気の申し込みを後回しにしてしまう例です。ブレーカーを入れてもつかないときは、契約先の会社に電話で状況を確かめます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n電気・ガス・水道の連絡先が多くて手が回らない方には、筆者の会社の「でんき開通サポート」（関東1都6県：東京・神奈川・埼玉・千葉・茨城・群馬・栃木）があります。新居の電気の使用開始のお申し込みを取り次ぎ、ガス・水道・インターネットのお申し込みもあわせてお預かりします。電力会社・ガス会社・水道局の公式窓口ではなく、民間の取次サービスです。【社長確認：対応できる電気・ガス・水道の範囲／「ご相談・お手続きは無料」と書いてよいか】\nでんき開通サポート：【社長確認：LPのURL】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N013)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は取得できず＝原文未確認。ジンが原文で確かめる）**\n- 東京都水道局「使用開始・中止について（お引っ越しの手続）」https://www.waterworks.metro.tokyo.lg.jp/faq/qa-4 ：引越しの3〜4日前までの手続き、アプリ・電話での手続き【原文未確認】\n- 東京都水道局「手続きに際して」https://www.waterworks.metro.tokyo.lg.jp/tetsuduki/shiyou ：23区・多摩地区の対象市町内の引越しは、お客さまセンターで一括受付【原文未確認】（対象の市町の範囲も原文で確認）\n- 東京ガス「ガス・電気の開始や停止のお手続き（お引越し等）」https://home.tokyo-gas.co.jp/gas_power/procedure/moving/index.html 【原文未確認】\n- 東京ガス「ガス・電気の使用開始お手続き詳細」https://home.tokyo-gas.co.jp/gas_power/procedure/moving/khsn_k_nagare.html ：使用開始の際は立ち会いが必要、宅内で点火確認と安全事項の説明【原文未確認】\n- 東京ガス サポート「日時・立会い」https://support.tokyo-gas.co.jp/category/show/900?site_domain=open ：代理の人（大家・管理人など）の立ち会いでも可【原文未確認】\n- 資源エネルギー庁「電力小売全面自由化」https://www.enecho.meti.go.jp/category/electricity_and_gas/electric/electricity_liberalization/ ：2016年4月から家庭でも電力会社・料金プランを選べる【原文未確認】\n- 「閉栓は立ち会いが要らない場合もある」「多くの物件で水道の開始に立ち会いは不要」「スマートメーターなら立ち会いなしで使用開始できることが多い」は、ガス会社・水道局ごとの原文で確かめる（スマートメーターの部分は lp/index.html のQ&Aと同じ内容）【原文未確認】\n\n**【社長確認】**\n- でんき開通サポートで対応できる電気・ガス・水道の範囲（knowledge.md が未記入）\n- 「ご相談・お手続きは無料」と記事に書いてよいか（LPには記載あり。docs/lp.md で表記の確認が必要とされている）\n- でんき開通サポートの LP の URL／相談フォームの URL\n- お部屋探しの仲介手数料を無料にできる条件\n- 紹介料についての書き方\n- （済）制度確認係（ジン）の「制度確認：OK」は 9/30 に先頭コメントへ記入", "paid": "", "chars": 5103, "asks": 6, "header": "images/N013/header.png"}, {"id": "N014", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "引越し先のネットが使えない…を防ぐ：回線の申込はいつ・何を確かめるか", "price": 0, "status": "校正待ち", "writer": "リク", "memo": "状態：校正待ち（ライター：リク・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長へ：出典はすべて検索結果の要約でしか見られていない（公式ページの本文は取得できなかった）。確認リストの「原文未確認」をジンが原文で確かめる\n     工事の日数・工事費・解約金などの数字は書いていない（事業者ごとに違い、すぐ変わるため）。他社の料金も書いていない", "free": "**こんな人向け：** 引越しが決まって、新居のインターネットをどうするか考えている人。在宅勤務や動画で、ネットが使えない日が続くと困る人。ウォーターサーバーを使っていて、引越しのときの扱いが気になる人。\n\n**この記事で分かること：** 回線の申し込みを早めにしたほうがいい理由。申し込む前に新居で確かめる3つのこと（建物の設備・工事の許可・撤去の要否）。開通までのつなぎ方。ウォーターサーバーを引越しで持っていくか、やめるかを決めるときの確認点。\n\n**結論：** 新居が決まったら、その週のうちに「建物にどんな回線の設備があるか」を管理会社に聞き、回線の申し込みを入れます。開通の工事が要る場合は、日程が先になることがあります。工事の目安は、申し込む事業者に確かめてください。\n\n---\n\n## なぜ早めに申し込むのか\n\n電気や水道と違って、インターネットは「申し込めば翌日から使える」とは限りません。\n\n- 新居に回線の設備がすでにあれば、工事の人が来なくても開通できることがあります\n- 設備がない、または部屋まで配線が来ていない場合は、**開通工事が必要**になります\n- 開通工事は、事業者の工事の日程に合わせて予約します。**時期によっては、希望の日がすぐには取れないことがあります**\n\nどのくらい先になるかは、事業者・地域・建物・時期によって違います。**申し込む前に「開通までの目安」を事業者に確かめる**のが確実です。\n\n在宅勤務の人や、入居の日からネットが必要な人は、新居の契約が決まった時点で動き始めると安心です。まだ間に合うかどうか分からない人も、今日、事業者に目安を聞くところから始められます。\n\n## 申し込む前に確かめる3つのこと\n\n### 1. 建物に光回線の設備があるか\nマンションやアパートでは、建物全体で回線の設備が入っていることがあります。まず、管理会社か大家さんに次のことを聞きます。\n\n- 建物に光回線の設備が入っているか。入っているなら、どの事業者の設備か\n- 部屋の壁に「光コンセント」（光回線の差し込み口）があるか\n- 建物で一括して契約しているインターネット（入居者は申し込み不要のもの）があるか\n\n建物の設備によっては、使える事業者や方式が限られることがあります。設備がすでにあれば、工事の人が来ずに開通できる場合もあります（NTT東日本は、新居に設備がある場合は訪問しない工事になり、立ち会いが要らないと案内しています）。\n\n### 2. 賃貸なら、工事の許可が要るか\n賃貸の部屋で、壁に穴をあける・配線を引き込むなどの工事が必要になる場合は、**大家さんや管理会社の許可**が要ります。集合住宅で建物の共用部分に装置を入れる場合も、管理会社の了承が必要になると事業者が案内しています。\n\n- 工事の内容（穴あけの有無・配線の通し方）を事業者に聞いてから、管理会社に相談する\n- 許可をもらったら、いつ・誰から・どんな形でもらったかを控えておく（退去のときに役立ちます）\n\n### 3. 旧居の回線をどうするか（解約・移転・撤去）\n旧居の回線は、次のどれかを選びます。\n\n- **移転**：同じ事業者を新居でも続ける\n- **解約**：旧居でやめて、新居では別の事業者にする\n\n解約のときは、次の点を事業者に確かめます。\n\n- **解約の手続きはいつまでに必要か**\n- **撤去の工事が要るか、任意か**（事業者や設備によって違います）\n- **レンタル機器（ルーターなど）の返し方と期限**\n- **契約期間の途中でやめる場合の費用**があるか\n\n賃貸では、撤去が必要かどうかが退去の条件に関わることもあります。管理会社にもあわせて確かめておきます。\n\n## 開通までのつなぎ：モバイルルーターなど\n\n開通工事の日が入居より後になったときは、つなぎの方法を用意しておくと困りません。\n\n- **モバイルルーター**（持ち運べるWi-Fiの機器）を短い期間だけ使う\n- 工事が要らない**ホームルーター**（コンセントに差すだけのもの）を検討する\n- スマホの**テザリング**（スマホをWi-Fiの親機にする機能）で急場をしのぐ\n\nどれも、使える通信量や契約期間、解約のときの条件はサービスごとに違います。**短い期間だけ使うつもりなら、契約期間と途中でやめる場合の費用を先に確かめて**ください。テザリングは、スマホの契約で使える通信量を確かめてから使います。\n\nなお、光回線やモバイルWi-Fiなどの通信サービスには、契約書面を受け取ってから一定の期間内なら、事業者の合意なしに契約を解除できる「初期契約解除制度」があります（国民生活センター・総務省の案内）。ただし、端末（機器）の代金は対象外とされています。細かい条件は、公式の案内を確かめてください。\n\n## ウォーターサーバーを使っている人：引越しのときの確かめ方\n\nウォーターサーバーは、引越しのときに「持っていく」か「やめる」かを決めます。どちらの場合も、先に契約書面かWebの会員ページを確かめます。\n\n**持っていく場合**\n- 新居に**置く場所**があるか（床の強さ・直射日光が当たらないか・壁との間をあけられるか）\n- 近くに**電源（コンセント）**があるか\n- 自分で運んでいいか、事業者に移設を頼む必要があるか\n- 水の配送先の住所変更（配送の日にちも）\n\n**やめる場合**\n- **契約期間**が残っているか\n- 途中でやめる場合の**解約金**があるか\n- サーバーが**レンタルか、購入か**（返し方・支払いが変わります）\n- 返却の方法と、残っている水の扱い\n\n国民生活センターは、ウォーターサーバーの契約で「解約料について説明がなかった」「レンタルだと思ったら購入の契約だった」といった相談を紹介し、契約書面で内容をよく確かめるよう呼びかけています。引越しのときに新しく契約する場合も、同じ点を確かめてから決めると安心です。\n\n## チェックリスト：新居のネットとウォーターサーバー\n\n- [ ] 管理会社に、建物の回線の設備・光コンセント・一括契約の有無を聞いた\n- [ ] 申し込む事業者に、開通までの目安と工事の有無を聞いた\n- [ ] 工事が要る場合、大家さん・管理会社の許可をもらい、記録を残した\n- [ ] 旧居の回線：移転か解約かを決め、手続きの期限を確かめた\n- [ ] 旧居の回線：撤去工事の要否と、レンタル機器の返し方を確かめた\n- [ ] 開通が入居より後なら、つなぎの方法（モバイルルーター・テザリングなど）を決めた\n- [ ] ウォーターサーバー：持っていくか、やめるかを決めた\n- [ ] ウォーターサーバー：置き場所と電源、または契約期間・解約金・返し方を確かめた\n\n## よくある失敗\n\n**1. 入居してから申し込んで、しばらくネットが使えない**\n新居の設備を確かめないまま入居し、そこから申し込むと、工事の日程が先になることがあります。新居が決まった時点で、設備の確認と申し込みを進めます。\n\n**2. 許可を取らずに工事を進めて、退去のときにもめる**\n賃貸での穴あけや配線の工事は、大家さん・管理会社の許可が前提です。許可の記録を残しておくと、退去のときに話がスムーズです。\n\n**3. 旧居の撤去や機器の返却を忘れる**\n解約の手続きだけして、撤去工事の要否やレンタル機器の返却を確かめ忘れる例です。解約の電話で「撤去は必要ですか」「機器はどう返せばいいですか」と、まとめて聞きます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n新居のインターネット回線や、ウォーターサーバーのご相談は、筆者の会社でお受けしています。フレッツ光・ドコモ光・auひかり・ソフトバンク光などの中から、新居の建物で使える回線をご案内します（建物やエリアによって使えない回線があります）。【社長確認：紹介できるウォーターサーバー】電気・ガス・水道の手続きとあわせて進めたい方には、「でんき開通サポート」（関東1都6県：東京・神奈川・埼玉・千葉・茨城・群馬・栃木）もあります。新居の電気の使用開始のお申し込みを取り次ぎ、ガス・水道・インターネットのお申し込みもあわせてお預かりする、民間の取次サービスです（電力会社などの公式窓口ではありません）。【社長確認：対応範囲の書き方】\nでんき開通サポート：【社長確認：LPのURL】\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N014/points.png)\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N014)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は取得できず＝原文未確認。ジンが原文で確かめる）**\n- NTT東日本「フレッツ光のお引越し手続き」https://flets.com/support/flets-hikari/iten/ ／ https://flets.com/first/move/ ：新居に設備がある場合は訪問しない工事で立ち会い不要、集合住宅で方式を切り替えるには管理会社の了承のもと共用部に装置の導入が必要【原文未確認】（事業者の案内の例として書いた。社名を出すかは編集長判断）\n- NTT東日本（法人向けコラム）「光回線の撤去工事が必要な3つのケース」https://business.ntt-east.co.jp/column/service/flets-hikari/opticalline_removal.html ：撤去工事の要否【原文未確認】\n- 国民生活センター FAQ「【光回線】初期契約解除制度とは何か。」https://www.faq.kokusen.go.jp/faq/show/1194?site_domain=default 【原文未確認】（期間は本文では「一定の期間」とした。数字を入れるなら原文で確認）\n- 総務省「電気通信事業法の消費者保護ルールに関するガイドライン」https://www.soumu.go.jp/main_content/000917286.pdf ：初期契約解除の対象（データ通信専用端末向けの接続サービスも対象、端末は対象外）【原文未確認】\n- 国民生活センター「ウォーターサーバーの勧誘トラブルにご注意！」https://www.kokusen.go.jp/news/data/n-20241106_1.html ：解約料の説明がない・レンタルと思ったら売買契約だった などの相談、契約書面での確認の呼びかけ【原文未確認】\n- 消費者庁「ショッピングモールで勧誘されたウォーターサーバー…」https://www.caa.go.jp/policies/policy/consumer_policy/caution/caution_032 【原文未確認・参考】\n\n**【社長確認】**\n- 紹介できるインターネット回線の種類・エリア、紹介できるウォーターサーバー（knowledge.md が未記入）\n- でんき開通サポートの対応範囲の書き方・LP の URL／相談フォームの URL\n- お部屋探しの仲介手数料を無料にできる条件\n- 紹介料についての書き方\n- （済）制度確認係（ジン）の「制度確認：OK」は 9/30 に先頭コメントへ記入", "paid": "", "chars": 4784, "asks": 7, "header": "images/N014/header.png"}, {"id": "N015", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "関東の引越し：見積もりの取り方と、費用をおさえる時期・コツ", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・9/30）／アカウント：A11／価格：無料\n     制度確認：OK（ジン・9/30。原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：標準引越運送約款・国土交通省の呼びかけ・消費者ホットラインは WebSearch の検索結果の要約で確かめたもの。公式ページの原文は作業環境から開けなかったため、確認リストの URL はすべて「原文未確認」。解約手数料の割合は約款の条文と照らしてください\n     他社の料金・相場の数字は書いていない（ng-words.md・A11.md）。締めは「関東の引越し業者の紹介」を先に置いた", "free": "**こんな人向け：** 関東で引越しをする予定の人。見積もりをどう取ればいいか、どうすれば費用をおさえられるかを知りたい人。\n\n**この記事で分かること：** 見積もりの取り方（訪問とオンラインの違い）、費用が上がりやすい時期、日にちと時間の選び方、見積書で確かめたいこと、困ったときの相談先。\n\n**結論：** 見積もりは複数の会社から、同じ条件で取って比べます。日にちを動かせるなら、3〜4月を避け、平日・時間指定なしも選択肢に入れてください。契約の前に、見積書の「解約手数料」の欄を必ず読みます。\n\n---\n\n## 1. 見積もりは「複数の会社から、同じ条件で」\n\n引越しの料金は、荷物の量・距離・日にち・時間帯・作業の内容で決まります。同じ引越しでも、会社によって金額や含まれる作業が違います。\nだから見積もりは **1社で決めず、複数の会社から取って比べる** のが基本です。\n\n比べるときに大切なのは、**どの会社にも同じ条件を伝えること** です。条件がばらばらだと、金額の差が「会社の差」なのか「条件の差」なのか分からなくなります。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N015/points.png)\n\n### 見積もりの前にまとめておくこと\n- 引越しの候補日（第1〜第3希望）と、時間帯の希望\n- 今の住まいと新しい住まいの住所・階数・エレベーターの有無\n- 大きな家具・家電の数（冷蔵庫・洗濯機・ベッド・ソファ・本棚など）\n- 段ボールのおおよその数（分からなければ「部屋の数」でも）\n- エアコンの取り外し・取り付け、不用品の引き取りなど、頼みたい作業\n\n---\n\n## 2. 訪問見積もりと、オンライン見積もり\n\n見積もりには、主に次の2つのやり方があります。\n\n**訪問見積もり**：担当者が家に来て、荷物を見て見積もります。荷物の量をその場で見てもらえるので、当日「トラックに乗り切らない」といった食い違いが起きにくくなります。家具が多い人、家族での引越しの人に向いています。\n\n**オンライン見積もり**：スマホのビデオ通話や、Webのフォームで荷物を伝えて見積もります。家に人を上げずに済み、時間の調整もしやすいのが良いところです。\nただし、**伝えた荷物の量と実際の量がずれると、当日に困ることがあります。** 国民生活センターにも「オンラインで見積もりを取って契約したが、荷物がトラックに乗り切らず積み残された」という相談が寄せられているとされています。オンラインで見積もるときは、押し入れやベランダ、物置の中まで伝えてください。\n\nなお、標準引越運送約款では **見積もりの料金は請求しない** とされています。ただし下見をした場合に限り、下見にかかった費用を請求することがあり、その場合は **見積もりの前に金額を伝えて了解を得る** ことになっています。\n\n---\n\n## 3. 費用が上がりやすい時期：3〜4月\n\n3〜4月は、進学・就職・転勤が重なり、引越しの依頼が集中します。この時期は **料金が高くなりやすく、希望の日に予約が取りにくい傾向** があります。\n\n国土交通省も毎年、引越し業者に依頼が集中する3〜4月を避けるなど、**引越し時期の分散への協力** を呼びかけています。呼びかけの中では、時期をずらした利用者の声として「引越し代金が安くなった」「予約が取りやすくなった」といったメリットも紹介されています。\n\n引越しの日を自分で選べる人は、次のように考えてみてください。\n- 3〜4月の中でも、特に混む時期（月末・月初や土日）を外す\n- 入居日と退去日に余裕があるなら、2月以前や5月以降を検討する\n- 会社の辞令や学校の都合で動かせない人は、日にちが決まった時点ですぐ見積もりを取る\n\n---\n\n## 4. 日にちと時間の選び方：平日・午後便・フリー便\n\n同じ時期でも、日にちと時間の選び方で料金が変わることがあります。\n\n- **平日**：土日・祝日より依頼が少ないため、料金がおさえられることがあります\n- **午後便**：午前に始める便より、始まる時間が後になる便です。前の作業が終わってからになるため、開始時間がずれることがあります\n- **フリー便（時間指定なし）**：業者の都合のよい時間に来てもらう便です。何時に来るかが当日まで分からないことがあります\n\n午後便やフリー便は、**その日のうちに新居で使えるようにしたいこと**（ガスの開栓の立ち会い・ネットの開通工事など）がある人は、時間が重ならないか先に確かめてください。\nそれぞれの便があるか、いくらになるかは会社によって違います。見積もりのときに「平日ならどうか」「時間指定なしならどうか」と、条件を変えた金額も聞いてみてください。\n\n---\n\n## 5. 荷物を減らす\n\n料金は荷物の量にも左右されます。荷物が減れば、トラックの大きさや作業の人数が変わることがあります。\n\n- **見積もりの前に** 捨てる物・売る物・譲る物を決める（見積もりの後に減らすと、金額に反映されないことがあります）\n- 粗大ごみは自治体によって予約が必要。収集日が引越しに間に合うか確かめる\n- 新居に合わない家具（サイズが入らない・使わない）は、運ぶ前に決める\n\n---\n\n## 6. 標準引越運送約款で、確かめておきたいこと\n\n引越しの契約のルールとして、国土交通省が定める **「標準引越運送約款」** があります。契約する会社の約款は、見積もりのときに確かめてください。ここでは、特に大切な点をまとめます。\n\n### 見積書に書かれること\n約款では、見積書に **運賃などの合計額と内訳・支払い方法、荷物を受け取る日時と引き渡す日、作業の内容、解約手数料の額** などを書くことになっています。\n口頭の説明だけでなく、**書面（またはデータ）で見積書を受け取り**、頼んだ作業がすべて書いてあるか確かめてください。\n\n### キャンセル・延期の手数料\nお客さんの都合でキャンセルや延期をする場合、約款では引越しの日に近いほど手数料がかかる決まりになっています（3日前までの連絡なら、約款上の手数料はかかりません）。\n- 引越しの **2日前**：運賃と料金の **20％以内**\n- 引越しの **前日**：運賃と料金の **30％以内**\n- 引越しの **当日**：運賃と料金の **50％以内**\n\nまた、業者は引越しの日の **3日前までに** 見積書の内容に変更がないかお客さんに確かめることになっていて、確かめなかった場合は、2日前・前日・当日のキャンセルや延期でも手数料を請求しないとされています。\n予定が変わりそうな人は、早めに業者に連絡してください。\n\n### 荷物の傷や紛失\n荷物の一部がなくなったり傷ついたりしたときは、**荷物を引き渡された日から3か月以内に業者に知らせないと、業者の責任がなくなる** と約款にあります。\n引越しの後、荷ほどきが遅れそうな人も、家具・家電の傷だけは早めに確かめ、見つけたら写真を撮って業者に連絡してください。\n\n---\n\n## よくある失敗\n\n**1. 1社目の見積もりでその場で契約してしまう**\n比べる前に決めると、条件が合っていたのか分かりません。「ほかの会社の見積もりも見てから決めます」と伝えて大丈夫です。\n\n**2. オンライン見積もりで荷物を少なく伝えてしまう**\n当日に荷物が乗り切らないと、追加の料金や積み残しにつながることがあります。見積もりのときは、しまってある物まで伝えてください。\n\n**3. 見積書の解約手数料を読んでいなかった**\n予定が変わってから慌てないように、契約の前に見積書の「解約手数料」の欄を読んでおきます。\n\n---\n\n## 困ったときの相談先：消費者ホットライン188\n\n見積もりや契約、引越しの後の補償などで業者と話がまとまらないときは、**消費者ホットライン「188」** に電話してください。消費者庁が設けている全国共通の番号で、近くの消費生活センターなどの相談窓口を案内してもらえます。受付の時間は窓口によって違います。\n\n---\n\n## チェックリスト：見積もりから契約まで\n\n```\n【見積もりの前】\n□ 候補日（第1〜第3希望）と時間帯の希望を決めた\n□ 家具・家電の数と、頼みたい作業をメモした\n□ 捨てる物・売る物を決めた\n\n【見積もり】\n□ 複数の会社に、同じ条件で見積もりを頼んだ\n□ 訪問かオンラインかを選んだ（オンラインは収納の中まで伝える）\n□ 「平日なら」「時間指定なしなら」の金額も聞いた\n□ 下見の費用がかかる場合、事前に金額を聞いた\n\n【契約の前】\n□ 見積書を書面（またはデータ）で受け取った\n□ 合計額と内訳・頼んだ作業がすべて書いてある\n□ 解約手数料の欄を読んだ\n□ 当日の開始時間と、ガス・ネットの立ち会いが重ならない\n\n【引越しの後】\n□ 家具・家電の傷を確かめた（見つけたら写真）\n□ 困ったら業者に連絡／まとまらなければ 188\n\n<!-- 画像：チェックリスト -->\n![保存用チェックリスト](../images/N015/checklist.png)\n\n```\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n「どの業者に頼めばいいか分からない」「見積もりを取る時間がない」という方には、関東の引越し業者をご紹介しています。【社長確認：提携業者の範囲・紹介の流れ】\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n\n- 関東の引越し業者のご紹介\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：紹介料の有無と書き方】\n\n▶ **[引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N015)**\n\n---\n\n## 確認リスト（公開前に消す）\n\n### 出典（すべて原文未確認：検索結果の要約で確認。公式ページは作業環境から開けなかった）\n- 標準引越運送約款（見積料・下見の費用、見積書の記載事項、解約・延期手数料 20％／30％／50％以内、3日前の確認、3か月以内の通知）：国土交通省 https://www.mlit.go.jp/notice/noticedata/sgml/1990/68227000/68227000.html （原文未確認）\n- 標準引越運送約款の改正について：国土交通省 https://www.mlit.go.jp/jidosha/jidosha_tk4_000033.html （原文未確認）\n- 引越時期の分散のお願い：国土交通省 https://www.mlit.go.jp/jidosha/jidosha_fr4_000022.html ／報道発表 https://www.mlit.go.jp/report/press/jidosha04_hh_000206.html （原文未確認）\n- 引越しのキャンセル料の相談（国民生活センター）：https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2018_23.html （原文未確認）\n- 引越トラブル（オンライン見積もりで積み残し等の相談）：国民生活センター https://www.kokusen.go.jp/news/data/n-20260204_1.html （原文未確認）\n- 消費者ホットライン188：政府広報オンライン https://www.gov-online.go.jp/tokusyu/hotline188/ ／消費者庁 https://www.caa.go.jp/policies/policy/local_cooperation/local_consumer_administration/hotline/ （原文未確認）\n\n### ジンに確かめてほしいこと\n- [ ] 解約手数料の日数・割合、「3日前までの確認をしないと請求できない」の条件が約款の条文どおりか（延期手数料の扱いも含む）\n- [ ] 3か月以内の通知の条文の言い方\n- [ ] 国土交通省の呼びかけの最新年（令和8年1月の報道発表とする検索結果あり）。「3月の引越件数は通常月の約2倍」という数字は記事に入れていない（入れるなら原文で確認）\n- [ ] 業者ごとに独自の約款を使う場合があるか（記事では「契約する会社の約款を確かめる」とだけ書いた）\n\n### 【社長確認】\n- [ ] 関東の提携業者の範囲・紹介の流れ（knowledge.md が未記入）\n- [ ] 仲介手数料を無料にできる条件と、宅建業の免許の表示\n- [ ] 紹介料の有無と書き方\n- [ ] 引越し相談フォームの公開 URL", "paid": "", "chars": 5181, "asks": 5, "header": "images/N015/header.png"}, {"id": "N019", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "春に引越すなら部屋探しは秋冬から：10〜12月に始める段取りと、今の部屋の退去で確かめること", "price": 0, "status": "校正待ち", "writer": "アオイ", "memo": "状態：校正待ち（ライター：アオイ・10/1）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/1）＋直した点：①出典が民間サイト1つだけの「1〜3月は物件が早く決まりやすい」を削除し、国土交通省の「3〜4月に引越しの依頼が集中」（各年の報道発表で同じ言い方）に差し替え ②借主負担の例を、ガイドラインの例どおり「結露を放置して広がったカビ・シミ」に直し、「善管注意義務」を追記 ③民法621条を本文に明記。宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示・ng-words は問題なし。原文未確認の出典は社長が公開前に確認\n     編集長へ：10/1 の指示どおり、手数料の無料の話はこの記事では一切書いていない（本文・締め・確認リストとも）\n     国土交通省のページは作業環境から開けず、検索結果の要約で確かめた（確認リストに「原文未確認」）。「1〜3月は物件が早く決まりやすい」は民間の不動産会社サイトの見方なので、本文では「〜と言われます」とし、数字は書いていない\n     N012（内見と申込の前に見る10のこと）と重ならないよう、内見の中身は書かず「いつ・何を始めるか」と退去に絞った", "free": "**こんな人向け：** 1〜3月に関東で引越しを考えている人。まだ物件を探し始めていないけれど、春に慌てたくない人。今の部屋を出るときの費用が気になっている人。\n\n**この記事で分かること：** 10〜12月の3か月で進める部屋探しの段取り。今の部屋の契約書で先に見ておくこと。退去のときの費用の考え方（国土交通省のガイドライン）と、立ち会いで確かめること。\n\n**結論：** 10月は「条件と今の契約書」、11月は「相場と候補のエリア」、12月は「引越しの時期と退去の日」を決めます。物件の申し込みは1〜2月が中心になりますが、**準備を秋のうちに済ませておくと、良い物件を見つけたその日に動けます**。退去の費用は、国土交通省の「原状回復をめぐるトラブルとガイドライン」で考え方を知っておきます。\n\n---\n\n## なぜ秋冬から始めるのか\n\n1〜3月は、進学・就職・転勤で部屋を探す人や引越す人が増える時期です。国土交通省も、引越しの依頼が3〜4月に集中するとして、毎年、引越しの時期をずらす協力を呼びかけています。\n\nただ、空いている部屋は、申し込みから入居まで長く待ってもらえないことが多いです。3月に住む部屋を10月に申し込む、ということは、ふつうはできません。\n\nだから秋冬にやるのは、**物件を押さえることではなく、決める準備**です。\n\n- 何を優先するか（家賃・駅・広さ）がはっきりしている\n- 今の部屋をいつ・どう出るかが分かっている\n- 申し込みに必要な書類がそろっている\n\nこの3つができていれば、1〜2月に気に入った部屋に出会ったとき、その場で申し込めます。まだ10月なら、時間は十分にあります。\n\n## 10〜12月の段取り\n\n### 10月：条件を書き出し、今の契約書を読む\n**条件を書き出す**\n- 家賃の上限（管理費・共益費を含めた月の合計で考える）\n- 通勤・通学の時間の上限と、使いたい駅や路線\n- 間取り・広さ・階数・設備で「ゆずれないもの」を3つまで\n- 入居したい時期（何月何日ごろから住みたいか）\n\n**今の部屋の契約書で見ること**\n- **解約の予告期間**：出る日の何か月前（何日前）までに連絡するか\n- **解約の連絡の方法**：電話でよいか、書面が要るか\n- **原状回復の特約**：ハウスクリーニング代などを借主が負担する特約があるか\n- **敷金**の額と、精算のしかた\n\n契約書が見つからないときは、管理会社か大家さんに写しをもらえるか聞いてみてください。\n\n### 11月：相場を知り、候補のエリアを絞る\n- 不動産のポータルサイトで、条件に近い物件の家賃を見て、相場の感覚をつかむ\n- 候補のエリアを2〜3か所に絞り、休日に駅のまわりを歩いてみる\n- 初期費用（敷金・礼金・前家賃・保険・保証会社など）が、家賃の何か月分くらいになりそうか見積もり、貯めておく額を決める\n\nこの時期に実際の部屋を内見しても、春まで空いていることは少ないです。内見は「間取りや広さの感覚をつかむ練習」くらいに考えると、がっかりせずに済みます。\n\n### 12月：引越しの時期と、退去の日を決める\n- 引越しの時期を決める（3月の最終週や土日は引越し業者も混むので、ずらせるか考える）\n- 今の部屋の**退去の日**を、解約の予告期間から逆算して決める\n- 新しい部屋の家賃がかかり始める日と、今の部屋の家賃が終わる日の重なり（二重の家賃）を、何日までなら許せるか決める\n- 申し込みに使う書類（本人確認書類・収入を示す書類など）の準備を始める。必要な書類は不動産会社や保証会社によって違うので、申し込む前に確かめる\n\n### 1〜2月：準備ができていれば、ここからは早い\n秋冬の準備ができていれば、1〜2月は「探す・見る・決める」に集中できます。\n\n- 書き出した条件をそのまま不動産会社に伝え、候補を出してもらう\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N019/points.png)\n\n- 内見の日は、まとめて2〜3件見られるように休みを空けておく\n- 気に入った部屋があれば、入居の日と家賃がかかり始める日を確かめてから申し込む\n- 申し込みが決まったら、その日のうちに今の部屋の解約の連絡を入れる（予告期間に間に合うかを先に確かめておく）\n\n解約の連絡は、新しい部屋の審査が通り、契約の日が見えてから出すのが安心です。先に出してしまうと、審査が通らなかったときに住む部屋がなくなってしまうことがあります。\n\n## 今の部屋の退去で確かめること\n\n### 退去の費用の考え方：国土交通省のガイドライン\n退去のときに、部屋をどこまで元に戻すか（原状回復）、その費用を誰が負担するかで、もめることがあります。国土交通省は、その一般的な考え方を「原状回復をめぐるトラブルとガイドライン」にまとめています。\n\n大まかな考え方は次のとおりです。\n\n- **経年変化**（日焼けなど、時間がたってできる傷み）や**通常損耗**（ふつうに暮らしていてできる汚れや傷）は、貸主の負担\n- 借主が負担するのは、**故意・過失**による汚れや傷、**ふつうの使い方を超える使い方**でできた傷み（たとえば、結露を放置して広がったカビやシミなど、借りた部屋を注意して使う義務＝善管注意義務を守らなかったためにできた傷み）\n\n2020年4月に施行された改正民法（621条）でも、通常損耗や経年変化については、借主は原状回復の義務を負わないことが明記されています。\n\nただし、契約書に**特約**（ハウスクリーニング代は借主が負担する、など）がある場合は、その内容も関わります。ガイドラインは一般的な基準なので、**自分の契約書の内容とあわせて**確かめてください。\n\n### 入居のときの記録を探す\n国土交通省は、原状回復の問題を「退去のときだけの問題」ではなく、**入居のときの問題**としてとらえ、入居と退去のときに部屋の状態をよく確かめておくことを勧めています。\n\n- 入居のときに撮った写真や、管理会社に出したチェック表があれば探しておく\n- ない場合は、今の部屋の傷や汚れのうち「入居のときからあったもの」をメモにしておく\n\n### 退去の立ち会いで確かめること\n- 傷や汚れを一緒に見て、**どれが借主の負担と言われているか**をその場で確かめる\n- 気になる傷は、その場で写真を撮る\n- 費用の見積もりや精算書は、**内訳（どこを・何を・いくらで）**が書かれたものをもらう\n- その場で決めきれないときは、内容を持ち帰って確かめたいと伝える\n\n話がまとまらないときは、消費者ホットライン「188」や、住んでいる自治体の相談窓口に相談できます。\n\n## チェックリスト：10〜12月にやること\n\n- [ ] 家賃の上限・駅・ゆずれない条件3つを書き出した\n- [ ] 今の部屋の契約書で、解約の予告期間と連絡の方法を確かめた\n- [ ] 契約書の原状回復の特約と、敷金の額を確かめた\n- [ ] 候補のエリアを2〜3か所に絞った\n- [ ] 初期費用の目安を見積もり、貯める額を決めた\n- [ ] 引越しの時期と、今の部屋の退去の日を決めた\n- [ ] 二重の家賃を何日まで許せるか決めた\n- [ ] 申し込みの書類の準備を始めた\n- [ ] 入居のときの写真やチェック表を探した\n\n## よくある失敗\n\n**1. 解約の予告期間を知らずに、二重の家賃が長くなる**\n新しい部屋が決まってから契約書を読み、「1か月前までに連絡」などの決まりに気づく例です。予告期間は10月のうちに確かめ、退去の日から逆算しておきます。\n\n**2. 秋に気に入った部屋を見つけて、春まで待ってもらえない**\n空いている部屋は、早く住める人が申し込むことが多いです。秋冬は準備に使い、申し込みは住みたい時期に合わせます。\n\n**3. 退去の立ち会いで、内訳を見ないままサインする**\n精算の金額だけ見て、内訳を確かめずに済ませる例です。どこを・何を・いくらで直すのかを書面でもらい、ガイドラインと契約書の特約に照らして確かめます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n春の部屋探しを秋冬から進めたい方は、筆者の会社にご相談ください。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）。【社長確認：提携先の不動産会社名と宅建業の免許番号】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（提携する不動産会社をご紹介）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N019)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 国土交通省「原状回復をめぐるトラブルとガイドライン」について https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000020.html ：経年変化・通常損耗は貸主の負担、借主は故意・過失・善管注意義務違反などによる損耗を負担、一般的な基準【原文未確認】\n- 同 ガイドライン本文（再改訂版・平成23年8月）https://www.mlit.go.jp/jutakukentiku/house/torikumi/honbun2.pdf 【原文未確認】\n- 同 参考資料（令和5年3月）https://www.mlit.go.jp/jutakukentiku/house/content/001611293.pdf ：改正民法で通常損耗・経年変化は借主が原状回復義務を負わないと明記【原文未確認】（条文は民法621条。e-Gov で確認）\n- 国土交通省「賃貸住宅の入居・退去に係る留意点」https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk3_000026.html ：入居時の問題としてとらえ、入退去時に物件の状況をよく確認、契約時に原状回復の条件を確認【原文未確認】\n- 消費者ホットライン188（消費者庁）https://www.caa.go.jp/policies/policy/local_cooperation/local_consumer_administration/hotline/ 【原文未確認】\n- 国土交通省「引越時期の分散に向けたお願い」https://www.mlit.go.jp/jidosha/jidosha_fr4_000022.html ：3〜4月に引越しの依頼が集中（平成31年〜令和5年の各報道発表で同じ言い方を検索結果で確認）【原文未確認】\n- （ジン・10/1）「1〜3月は物件が早く決まりやすい」は出典が民間の不動産会社サイトだけのため本文から削除した\n- （ジン・10/1）結露を放置して拡大したカビ・シミが借主負担になる例は、ガイドライン本文・参考資料（令和5年3月）の検索結果の要約で確認【原文未確認】\n\n**ジンに確かめてほしいこと**\n- [ ] 「ふつうの使い方を超える使い方」「掃除を怠ってできたカビ」の例がガイドラインの区分どおりか\n- [ ] 特約の書き方（「その内容も関わります」）が言い過ぎ・言い足りなくないか\n\n**【社長確認】**\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] 法律・ガイドラインは公式の出典つき（原文未確認はジンが確認）\n- [x] 手数料の無料の話は書いていない（10/1 の編集長判断）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーンを書いていない\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N019\n- [x] ng-words なし。不安をあおっていない\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/1）", "paid": "", "chars": 4976, "asks": 5, "header": "images/N019/header.png"}, {"id": "N020", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "春の新生活でネットが間に合わない…を防ぐ：繁忙期の回線・電気・ガス・水・ウォーターサーバーを申し込む順番", "price": 0, "status": "校正待ち", "writer": "リク", "memo": "状態：校正待ち（ライター：リク・10/1）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/1）＋直した点：①結論の「今日1件目に電話すれば、まだ間に合います」と、表の下の「大丈夫です／数日のうちに片づけられます」は、間に合うことを約束する書き方なので、事実の手順だけに直した ②「約2倍」は平成31年〜令和5年の各報道発表で同じタイトルを検索結果で確認（確認リストに追記）。ソフトバンク光の2〜4月の案内は公式ページとFAQで確認、料金・日数は書いていない。宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示・でんき開通サポートの説明（LPどおり、公式窓口ではない旨あり）は問題なし。原文未確認の出典は社長が公開前に確認\n     編集長へ：N014（回線の申込で何を確かめるか）と重ならないよう、繁忙期に「どれから申し込むか」の順番に絞った。確かめる中身は N014 に任せている\n     出典の公式ページは作業環境から開けず、すべて検索結果の要約で確認（確認リストに「原文未確認」）。開通までの日数・工事費・料金は書いていない（民間記事の日数は使わない）\n     締めの「でんき開通サポート」の説明は ../lp/index.html の記載どおり。お部屋探しの行は knowledge.md の新しい書き方（提携する不動産会社をご紹介）にそろえ、仲介手数料の条件は入れていない", "free": "**こんな人向け：** 1〜3月に引越す予定の人。進学・就職・転勤で、3月の後半に新生活が始まる人。電気・ガス・水道・ネット・ウォーターサーバーを、どれから申し込めばいいか迷っている人。\n\n**この記事で分かること：** 春の繁忙期に、ライフラインとネットを申し込む順番。順番をそう決める理由。新居が決まった日から入居の日までの逆算のしかた。\n\n**結論：** 新居が決まったら、**①ネット回線 → ②ガスの開栓の予約 → ③電気 → ④水道 → ⑤ウォーターサーバー → ⑥旧居の解約・返却** の順で連絡します。「人が来る日を予約するもの」から先に押さえるのがコツです。新居が決まったら、その日のうちに1件目（ネット）の申し込みから始めます。\n\n---\n\n## なぜ春は「順番」が大事なのか\n\n国土交通省は毎年、引越しの依頼が3〜4月に集中するとして、引越しの時期をずらす協力を呼びかけています。報道発表のタイトルでは「3月の引越件数は通常月の約2倍」と案内しています（出典は最後の確認リスト）。\n\n引越しが集中すると、混むのは引越し業者だけではありません。新居で「誰かが来て作業する日」を予約する手続きも、同じ時期に申し込みが重なります。\n\n- **ネット回線の開通工事**：工事の人が来る日を予約する\n- **ガスの開栓**：係の人が来て、立ち会いのもとで開栓する\n- **ウォーターサーバーの設置・配送**：サーバーや水を届けてもらう日を決める\n\nたとえばソフトバンク光は、公式ページで、2〜4月の引越しシーズンは手続きが混み合い、希望の工事日にそえないことがあると案内しています。ほかの回線でも、時期によって工事日が先になることがあります。\n\n一方で、電気や水道は、多くの物件で立ち会いなしで使い始められます。だから、**予約の枠が埋まりやすいものから先に申し込む**のが、春の引越しの順番の考え方です。\n\n## 申し込む順番と、その理由\n\n### ① ネット回線（新居が決まった日のうちに）\nいちばん先に動くのはネットです。理由は2つあります。\n\n1. 工事が要る場合、工事日は事業者の予定に合わせて決まる\n2. 建物の設備によって、使える回線そのものが変わる\n\nまず管理会社に「建物にどの回線の設備があるか」を聞き、そのうえで申し込む回線を決めます（聞くことの詳しい中身は、別の記事「引越し先のネットが使えない…を防ぐ：回線の申込はいつ・何を確かめるか」にまとめています）。\n\nフレッツ光・ドコモ光・auひかり・ソフトバンク光など、どの回線でも、**開通までの目安と、いつから申し込みを受け付けているかは、各社の公式ページで確かめて**ください。目安は時期や建物で変わるので、この記事では日数を書いていません。\n\n今の回線を新居でも続ける（移転する）場合も、移転の手続きで新居の工事日を決めます。考え方は新しく申し込むときと同じで、早いほど選べる日が増えます。\n\n### ② ガスの開栓の予約（ネットと同じ週に）\nガスは、新居で使い始めるときに立ち会いが必要になるのが一般的です。立ち会いの日時は、希望どおりに取れるとは限りません。\n\n入居の日の夜にお風呂に入りたいなら、**入居の日か、その翌日の枠**を先に押さえます。引越し業者の作業時間と重ならないよう、作業が終わる見込みの時間より後で予約すると安心です。\n\n### ③ 電気（ガスの予約のあと、早めに）\n電気は、スマートメーターが付いている物件なら、多くの場合、立ち会いなしで使用開始の処理ができます。ただ、申し込みを忘れると入居の夜に明かりがつきません。\n\n引越しは、電力会社や料金プランを見直しやすいタイミングでもあります。選び直す場合は、料金や契約の条件を各社の公式サイトで確かめてから決めます。迷う時間が長くなりそうなら、**まず使用開始の申し込みだけ先に済ませる**のも手です。\n\n### ④ 水道（新居の地域の水道局に）\n水道は、新居の住所を担当する水道局に申し込みます。多くの物件では立ち会いは要りませんが、申し込みの締め切りや方法は水道局ごとに違います。新居の市区町村のページで確かめてください。\n\n### ⑤ ウォーターサーバー（ネットの工事日が決まってから）\n今のサーバーを新居に持っていく場合は、移設の方法と、水の配送先の住所変更を事業者に伝えます。新しく申し込む場合は、置き場所と電源を新居で確かめてからにします。\n\n順番を後ろにしているのは、**届けてもらう日を、ネットの工事やガスの立ち会いの日と分けたい**からです。入居の日に人の出入りが重なると、立ち会いの時間に遅れやすくなります。\n\n### ⑥ 旧居の解約・撤去・機器の返却（新居の手配がそろってから）\n旧居の回線の解約、撤去工事の要否、ルーターなどレンタル機器の返却、ウォーターサーバーの返却は、新居の手配がそろってから進めます。\n\n先に旧居を止めてしまうと、新居が開通するまでネットが使えない期間ができます。**解約の日は、新居の開通日より後**に設定するのが基本です。\n\n## 入居日から逆算する：書き込み用の表\n\n入居の日が決まったら、下の表のように「いつ・何を」を書き出します。日付は自分の予定で埋めてください。\n\n| 順番 | やること | 自分の予定日 |\n|---|---|---|\n| ① | 管理会社に回線の設備を聞き、ネットを申し込む | 新居が決まった日 |\n| ② | ガスの開栓の立ち会いを予約する | ①と同じ週 |\n| ③ | 電気の使用開始を申し込む | ②のあと |\n| ④ | 水道の使用開始を申し込む | 水道局の締め切りまで |\n| ⑤ | ウォーターサーバーの移設・配送日を決める | ①の工事日が決まってから |\n| ⑥ | 旧居の解約・撤去・返却の日を決める | 新居の開通日より後 |\n\n「もう2月の終わりで、新居も決まったばかり」という人も、やることの順番は同じです。まず①と②を今日のうちに申し込み、残りも続けて進めます。ネットの工事日が入居より後になったときは、モバイルルーターやテザリングなど、つなぎの方法を用意しておきます。\n\n## チェックリスト：繁忙期の申し込み順\n\n- [ ] 管理会社に、建物の回線の設備を聞いた\n- [ ] ネット回線を申し込み、開通の目安（工事日）を確かめた\n- [ ] ガスの開栓の立ち会いを、入居の日かその翌日に予約した\n- [ ] 電気の使用開始を申し込んだ（契約先を選び直すなら公式サイトで条件を確認）\n- [ ] 水道の使用開始を、新居の水道局に申し込んだ\n- [ ] ウォーターサーバーの移設・配送の日を、工事・立ち会いと重ならない日にした\n- [ ] 旧居の回線の解約日を、新居の開通日より後にした\n- [ ] レンタル機器・サーバーの返し方と期限を確かめた\n- [ ] 工事日が入居より後なら、つなぎの方法を決めた\n\n## よくある失敗\n\n**1. 電気から手をつけて、ネットの工事日が先になる**\nいちばん分かりやすい電気から申し込み、ネットを後回しにする例です。電気は立ち会いが要らないことが多いので、順番は後でも間に合いやすいです。人が来るものから先に押さえます。\n\n**2. 旧居の回線を先に解約して、ネットのない期間ができる**\n「引越すから解約」と先に止めてしまい、新居の開通まで家でネットが使えない例です。解約の日は、新居の開通日を確かめてから決めます。\n\n**3. 入居の日に、工事・ガス・配送を全部入れてしまう**\n一日で片づけようとして、引越し業者の作業が延びたときに立ち会いに間に合わない例です。時間帯を分けるか、日を分けておきます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n春の引越しで、ネットとライフラインの申し込みをまとめて進めたい方は、筆者の会社にご相談ください。インターネット回線は、フレッツ光・ドコモ光・auひかり・ソフトバンク光などの中から、新居の建物で使える回線をご案内します（建物やエリアによって使えない回線があります）。電気・ガス・水道は「でんき開通サポート」（関東1都6県：東京・神奈川・埼玉・千葉・茨城・群馬・栃木）で、新居の電気の使用開始のお申し込みを取り次ぎ、ガス・水道・インターネットのお申し込みもあわせてお預かりします。電力会社・ガス会社・水道局の公式窓口ではなく、民間の取次サービスです。\nでんき開通サポート：【社長確認：LPのURL】\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N020/points.png)\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- インターネット回線\n- 電気・ガス・水道の手続き\n- ウォーターサーバー\n- お部屋探し（提携する不動産会社をご紹介します。物件のご案内・契約・仲介は提携先の不動産会社が行います【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N020)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 国土交通省 報道発表「引越時期の分散に御協力をお願いします！～3月の引越件数は通常月の約2倍！～」https://www.mlit.go.jp/report/press/jidosha04_hh_000226.html （令和3年1月の発表）【原文未確認】\n- 同 最新の報道発表（2026年1月28日とする検索結果）https://www.mlit.go.jp/report/press/jidosha04_hh_000324.html 【原文未確認】（「約2倍」は最新の発表の数字で書くのがよい）\n- （ジン・10/1）平成31年・令和2年・令和4年・令和5年の報道発表の PDF のタイトルがいずれも「3月の引越件数は通常月の約2倍」であることを検索結果で確認（例：https://www.mlit.go.jp/report/press/content/001582861.pdf ）【原文未確認】\n- ソフトバンク「SoftBank 光 引っ越しのお手続き」https://www.softbank.jp/internet/moving/sbhikari/ ：2〜4月の引越しシーズンは手続きが混み合い、希望の工事日にそえないことがある【原文未確認】（受付開始の時期の記載もあるとの要約。本文には数字を入れていない）\n- ソフトバンク FAQ「希望より先の工事日しか選択できません」https://www.softbank.jp/support/faq/view/27026 【原文未確認・参考】\n- NTT東日本「どうする？インターネット回線！お引越しの前と後のチェックポイント」https://flets.com/navigation/column/move_guide/ 【原文未確認・参考】\n- ドコモ光・auひかりの公式ページの繁忙期の案内は見つけられなかった。本文では社名を並べ「各社の公式ページで確かめて」とだけ書いた\n- 「ガスの開栓は立ち会いが一般的」「スマートメーターなら多くの場合立ち会いなしで電気の使用開始」は N013 の出典（東京ガス）と ../lp/index.html の Q&A と同じ内容【原文未確認】\n\n**【社長確認】**\n- でんき開通サポートの LP の URL\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] 役所・決まりごとは公式の出典つき（原文未確認はジンが確認）\n- [x] 「仲介手数料無料」は書いていない（該当なし）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーン・開通日数を書いていない\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N020\n- [x] ng-words なし。不安をあおっていない（「間に合う」と約束する言い方はジンが 10/1 に削除）\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/1）", "paid": "", "chars": 4969, "asks": 6, "header": "images/N020/header.png"}, {"id": "N021", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "3月の引越しで慌てないために：国交省の混雑予想・キャンセル料のルール・マイナポータルの転出届", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・10/1）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/1）＋直した点：①「2026年1月の発表のタイトルは〜でした」は日付が検索結果1件だけなので、日付を書かず「毎年の発表のタイトルで約2倍と案内」に直した（平成31年〜令和5年の各発表で同じタイトルを確認） ②「動かせない人も心配はいりません／選べる枠はまだ残っています」は根拠のない約束なので削除し、事実の手順だけにした ③附帯サービスの費用は「見積書に書かれたものに限り」別に請求される、と約款どおりに直した。解約・延期手数料の割合と「3日前までの確認」の条件は、約款・国民生活センター・運輸局の案内（検索結果）と一致。宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示は問題なし。原文未確認の出典は社長が公開前に確認\n     編集長・ジンへ：国土交通省・国民生活センター・マイナポータル（myna.go.jp）は作業環境から開けず、WebSearch の検索結果の要約で確かめた。確認リストの URL はすべて「原文未確認」\n     2026年春の数字は、2026年1月28日の報道発表（検索結果）の言い方に合わせた。2027年春の発表が出たら差し替える\n     N015 と重ならないよう、キャンセル料は「3月に予定が動いたとき」の場面に絞った。他社の料金・相場は書いていない", "free": "**こんな人向け：** 1〜3月に関東で引越す予定の人。辞令や入学の日程で、引越しの日がまだ動くかもしれない人。役所の手続きを、できるだけ窓口に行かずに済ませたい人。\n\n**この記事で分かること：** 国土交通省が毎年出している、春の引越しの混雑についての呼びかけ。予定が変わったときのキャンセル料・延期の手数料のルール。マイナポータルで転出届を出すときの流れと期限。\n\n**結論：** 3月の引越しは、日にちが決まった時点で業者の予約を入れます。予定が動きそうなら、**引越しの日の3日前より前に**業者へ連絡します。別の市区町村へ引越す人は、マイナンバーカードがあればマイナポータルで転出届を出せます。ただし**転入届は、新しい住所の役所の窓口で出します**。\n\n---\n\n## 1. 国土交通省の呼びかけ：3月は通常の月の約2倍\n\n国土交通省は毎年、春の引越しシーズンの前に「引越時期の分散に御協力をお願いします！」という報道発表を出しています。発表のタイトルでは「3月の引越件数は通常月の約2倍！混雑時期を外してスムーズな引越を」と案内しています（出典は最後の確認リスト）。\n\n発表では、3〜4月に依頼が集中するとして、経済団体などを通じて利用者に時期の分散を呼びかけています。時期をずらした利用者の声として、次のような例も紹介されています。\n\n- 3月末の土日の引越しと比べて、引越し代金が安くなった\n- 会社の従業員の引越しにかかるコストを抑えられた\n- 3月の最終週からずらしたことで、予約が取りやすくなった\n\n日にちを自分で選べる人は、**3月の最終週と土日を外せるか**を、最初に考えてみてください。動かせない人は、日にちが決まった時点で、できるだけ早く予約を入れます。\n\n### 日にちが動かせない人がやること\n- 引越しの日が決まった日のうちに、複数の業者に見積もりを頼む\n- 候補日を第1〜第3まで出し、「この日ならいくらか」を聞く\n- 午前・午後・時間指定なしで、どれが空いているかも聞く\n\n見積もりの取り方の詳しいことは、別の記事「関東の引越し：見積もりの取り方と、費用をおさえる時期・コツ」にまとめています。\n\n## 2. 3月は予定が動きやすい：キャンセル料のルール\n\n春の引越しは、辞令の日、入学の手続き、新居の入居日などで、予定が後から動くことがあります。だから契約の前に、**キャンセルや延期をしたときの手数料**を知っておくと安心です。\n\n### 標準引越運送約款での決まり\n引越しの契約のルールとして、国土交通省が定めた「標準引越運送約款」があります。国民生活センターの解説などによると、お客さんの都合で解約・延期をするときの手数料は、次のようになっています。\n\n| 連絡した日 | 解約・延期の手数料 |\n|---|---|\n| 引越しの日の3日前まで | かからない |\n| 2日前 | 見積書の運賃と料金の20％以内 |\n| 前日 | 30％以内 |\n| 当日 | 50％以内 |\n\nさらに、手数料を請求できるのは、**業者が荷物の受け取りの日の3日前までに、見積書の内容に変更がないかを確かめた場合に限る**とされています。\n\n### 気をつけたい2つのこと\n1. **手数料とは別の費用がかかることがある**：業者がすでに始めた附帯サービス（段ボールの配達、エアコンの取り外しなど）にかかった費用は、見積書に書かれたものに限り、手数料とは別に請求されることがあります\n2. **約款は契約する会社のものを読む**：業者が独自の約款を使っている場合もあります。見積書と約款の「解約手数料」の欄を、契約の前に確かめてください\n\n### 予定が動きそうなときの進め方\n- 辞令や入居日が確定しそうな日を、見積もりのときに業者へ伝えておく\n- 変わりそうだと分かったら、確定を待たずに**3日前より前に**一度相談する\n- 延期の場合は、新しい日の空きをその場で聞く（3月は枠が埋まりやすいため）\n\n### たとえば、こんなとき\n3月20日に引越しの予約をしていて、辞令で日にちが1週間後ろにずれそうだと分かったとします。\n\n- 3月16日の時点で分かったなら、3日前より前なので、約款の上では延期の手数料はかかりません\n- 3月19日（前日）に連絡すると、約款の上では30％以内の手数料がかかることがあります\n\n同じ延期でも、連絡の日で負担が変わります。「まだ決まっていないけれど、ずれるかもしれない」という段階で、一度業者に伝えておくのが安心です。\n\n話がまとまらないときは、消費者ホットライン「188」で近くの消費生活センターなどの窓口を案内してもらえます。\n\n## 3. マイナポータルの転出届：窓口に行く回数を減らす\n\n別の市区町村へ引越す人は、今の住所の役所に転出届を出します。マイナンバーカードがあれば、デジタル庁の「引越し手続オンラインサービス（引越しワンストップサービス）」を使って、マイナポータルから**転出届の提出と、新しい住所の役所に行く日（来庁予定日）の連絡**ができます。この場合、今の住所の役所の窓口に行くのは原則不要です。\n\n### 使うときの流れ\n1. マイナポータルで、引越す日・新しい住所・引越す人・来庁予定日などを入力する\n2. マイナンバーカードで本人確認をして、転出届を出す\n3. 引越したあと、新しい住所の役所の窓口に行き、転入届を出す（マイナンバーカードを持って行く）\n\n### 期限で気をつけること\n- オンラインで転出届を出せる時期は、自治体の案内で「引越し予定日の30日前から、引越した日から10日後まで」とされている例があります。**住んでいる自治体のページで確かめて**ください\n- 転入届は、住民基本台帳法で**新しい住所に住み始めてから14日以内**に出すことになっています。オンラインの転出届を使った場合は、自治体の案内で「転出予定日から30日以内」という期限も示されています\n- 転入届の窓口には、引越す人のマイナンバーカードを全員分持って行きます\n\n来庁予定日は、引越しの日から無理のない日を選んでおくと、転入届の14日以内に収めやすくなります。同じ市区町村の中で引越す人は、転出届はいりません（引越してから転居届を出します）。\n\n## チェックリスト：3月の引越しの前に\n\n- [ ] 3月の最終週・土日を外せるか考えた\n- [ ] 日にちが決まった日に、複数の業者に見積もりを頼んだ\n- [ ] 見積書と約款の「解約手数料」の欄を読んだ\n- [ ] 予定が動きそうなら、引越しの日の3日前より前に相談すると決めた\n- [ ] 附帯サービス（段ボール・エアコンなど）を頼む日を確かめた\n- [ ] 自治体のページで、オンラインの転出届を出せる時期を確かめた\n- [ ] マイナポータルで転出届を出し、来庁予定日を選んだ\n- [ ] 転入届を出す日を、住み始めてから14日以内で予定に入れた\n- [ ] 転入届の日に、全員分のマイナンバーカードを持って行く\n\n## よくある失敗\n\n**1. 辞令が出るまで業者に連絡しない**\n確定を待つうちに、3月の希望の日が埋まってしまう例です。候補日のまま見積もりを取り、変わりそうなら3日前より前に相談します。\n\n**2. キャンセルの手数料だけ見て、附帯サービスの費用を見落とす**\n段ボールの配達や工事をすでに頼んでいると、その費用は別にかかることがあります。頼んだ作業の一覧を見積書で確かめておきます。\n\n**3. オンラインで転出届を出して、転入届も済んだと思ってしまう**\nマイナポータルでできるのは、転出届と来庁予定日の連絡です。転入届は、新しい住所の役所の窓口で出します。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n3月の引越しで「どの業者に頼めばいいか分からない」「見積もりを取る時間がない」という方には、筆者の会社が関東の引越し業者をご紹介しています。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N021/points.png)\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- 関東の引越し業者のご紹介\n- お部屋探し（提携する不動産会社をご紹介します。物件のご案内・契約・仲介は提携先の不動産会社が行います【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N021)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 国土交通省 報道発表「引越時期の分散に御協力をお願いします！～3月の引越件数は通常月の約2倍！～」（2026年1月28日とする検索結果）https://www.mlit.go.jp/report/press/jidosha04_hh_000324.html ：3〜4月に依頼が集中、利用者の声3つ【原文未確認】\n- （ジン・10/1）2026年1月28日という日付は検索結果1件だけのため本文に書かない。タイトルの「約2倍」は平成31年・令和2年・令和4年・令和5年の発表 PDF で同じであることを検索結果で確認（例：https://www.mlit.go.jp/report/press/content/001582861.pdf ）。利用者の声3つは「引越時期の分散に向けたお願い」ページの要約で同じ言い方を確認【原文未確認】\n- （ジン・10/1）解約手数料の割合・3日前までの確認・附帯サービス（見積書に明記したものに限る）は、約款の告示・国民生活センター・近畿運輸局 Q&A https://wwwtb.mlit.go.jp/kinki/hikosi/q-a.html の検索結果で一致を確認【原文未確認】\n- 同 令和3年1月の発表（articles.csv のメモの URL）https://www.mlit.go.jp/report/press/jidosha04_hh_000226.html 【原文未確認】\n- 国土交通省「引越時期の分散に向けたお願い」https://www.mlit.go.jp/jidosha/jidosha_fr4_000022.html 【原文未確認】\n- 国民生活センター「引っ越しのキャンセル料が高い！」https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2018_23.html ：3日前まで無料／2日前20％以内／前日30％以内／当日50％以内、3日前までの確認をした場合に限り請求、附帯サービスの費用は別に請求される場合あり【原文未確認】\n- 標準引越運送約款（国土交通省告示）https://www.mlit.go.jp/notice/noticedata/sgml/1990/68227000/68227000.html 【原文未確認】\n- デジタル庁 引越しワンストップサービスのチラシ https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/7b66d7ba-7184-49c0-bca1-5e249046a3f5/c458aeb4/20241223_policies_moving_onestop_service_leaflet.pdf ：転出届と来庁予約をオンラインで【原文未確認】\n- デジタル庁ニュース「役所に行かずに転出届が出せる！引越し手続オンラインサービス」https://digital-agency-news.digital.go.jp/articles/2025-02-06 【原文未確認】\n- マイナポータル 引越しワンストップサービス https://myna.go.jp/html/moving_oss.html 【原文未確認】\n- 千葉市「マイナポータルを利用したオンライン申請（転出届）」https://www.city.chiba.jp/shimin/shimin/kusei/tensyutsu_mn.html ／葛飾区 https://www.city.katsushika.lg.jp/kurashi/1000046/1001401/1030654.html ：オンラインの転出は引越し予定日の30日前から引越し後10日まで、転入は住み始めて14日以内かつ転出予定日から30日以内、マイナンバーカード全員分を持参【原文未確認】（本文は「自治体の案内の例」として書いた）\n- 消費者ホットライン188（消費者庁）https://www.caa.go.jp/policies/policy/local_cooperation/local_consumer_administration/hotline/ 【原文未確認】\n\n* **：点検表（review.md）を全部確かめ、引っかかったら直してから出す\n\nそして、万一のために **元に戻せる状態にしておく**。これで「消された」「送られた」の多くは、起きる前に止めるか、起きても戻せます。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N016/points.png)\n\n**無料部分のまとめ（ここだけでも使えます）**\n- AI の道具は「読む」「書く」「動かす」「外に出す」に分けて考える。危ないのは後ろの2つ\n- 中身がわからない確認画面では、許可しない\n- 「送らないで」は口で言うだけでなく、約束ごとのファイルに1行書く\n- 作業の前に、今の状態を保存しておく\n\n### 有料部分の目次\n1. 道具を4つに分ける：「読む」「書く」「動かす」「外に出す」\n2. 役割ごとに道具を絞る（指示書の `tools:` の実物）\n3. 「送信・公開は人」を、約束とツールの両方で決める\n4. 出す前の点検表（review.md）と、状態の流れ\n5. 直させたことを残す（mistakes.md）\n6. 元に戻せるようにしておく\n7. コピーして使える型4つ\n8. つまずきやすい点と、直し方\n9. 明日から始めるチェックリスト", "paid": "## 1. 道具を4つに分ける\n\nClaude Code が使う道具には、それぞれ名前があります。細かく覚えなくて大丈夫です。4つに分けて考えます。\n\n| 分け方 | 道具の例 | できること | 危なさ |\n|---|---|---|---|\n| 読む | Read・Glob・Grep | ファイルを読む・探す | 低い |\n| 書く | Write・Edit | ファイルを作る・書き換える | 中くらい（上書きはできる） |\n| 動かす | Bash | コマンドを動かす（ファイルの削除もできる） | 高い |\n| 外に出す | 送信・投稿・公開 | 相手に届く | 取り消せない |\n\nネットで調べる道具（WebSearch・WebFetch）もあります。読むだけですが、**読んだページに書いてあることを、そのまま信じさせない**ことが大事です。\n\nClaude Code には、ファイルを書き換える前やコマンドを動かす前に「実行してよいか」を聞く仕組みがあります。何を聞かずに許すか、何を禁止するかは、設定で決められます。設定の書き方は版によって変わるので、公式ドキュメントで確かめてください。\n\nまず覚えておきたいのは1つです。**確認画面で、中身がわからないものは許可しない。** わからないときは「このコマンドは何をするのか、やさしく説明して」と聞き返せば大丈夫です。\n\n## 2. 役割ごとに道具を絞る\n\nClaude Code では、`.claude/agents/<名前>.md` に役割ごとの指示書を置けます（サブエージェントと呼びます）。指示書のいちばん上に、`tools:` の行で **その役が使える道具** を書けます。\n\n### 実物：note のライターの指示書（冒頭）\n```\n---\nname: note-writer\ndescription: note 事業部のライター。編集長に割り当てられた企画の原稿を note/out/drafts/<ID>.md に書く。\ntools: Read, Write, Edit, Glob, Grep\n---\n```\n\nライターは「読む」と「書く」だけです。**Bash（コマンドを動かす道具）を持っていません。**\n\n### このチームの割り振り\n\n| 役割 | 使える道具 | 足している理由 |\n|---|---|---|\n| ライター・編集長・データ分析・マーケ・事務 | Read, Write, Edit, Glob, Grep | 読んで書くだけの仕事 |\n| リサーチ | 上に WebSearch, WebFetch を足す | ネットで調べるため |\n| SV・アポインター（営業文の点検・作成） | 上に WebFetch を足す | 送り先のページに「営業お断り」がないか確かめるため |\n| リスト抽出 | 上に Bash を足す | 抽出ツールを動かすため |\n\n営業部・note 事業部・引越しチームの指示書のうち、**コマンドを動かせるのはリスト抽出の1役だけ**です。道具を足すときは、「なぜ要るか」を1つ言えるものだけにしています。\n\n`tools:` の行を書かないと、多くの道具が使える状態になることがあります（細かい決まりは公式ドキュメントで確認してください）。**指示書を作ったら、必ず `tools:` の行を書く**のが安全です。\n\n### 「書く」だけでも、上書きはできる\n\n注意したいのは、Write・Edit でも既存のファイルを上書きできることです。そこで、指示書の中で **書く場所を1つに決めて** います。ライターなら「`note/out/drafts/<ID>.md` に書く」です。\n\nこれは約束で、仕組みで止めるものではありません。だから6章の「元に戻せるようにしておく」とセットにします。\n\n## 3. 「送信・公開は人」を2か所で決める\n\n外に出すことは、取り消せません。このチームでは、AI に送信・公開をさせないと決めています。決め方は2か所です。\n\n### 1か所目：約束ごと（CLAUDE.md）\nClaude Code は、作業フォルダの `CLAUDE.md` をセッション（作業のひと区切り）を始めるたびに読みます。そこに1行書いています。\n\n```\n- 送信・投稿・公開は人が行う。Claude は DM やフォームを送らず、note やSNSに投稿しない\n```\n\nアポインター（営業文を作る役）の指示書にも、同じことを書いています。\n\n```\n送信はあなたにはできません（人が tools/send_assist.py で送ります）。\n```\n\n### 2か所目：ツールの作り\n営業文を送るときは、補助ツールを人が動かします。このツールの説明書きから抜粋します。\n\n```\n- フォーム：ブラウザでフォームを開き、名前・会社名・メール・電話・件名・本文を入力して、送信ボタンに枠を付けて止まる\n  **送信ボタンは押しません。** 内容を確かめて、人が押してください（同意のチェック・選択肢も人が選ぶ）\n- 送ったら Enter（s）で outbox.csv の状態を「送信済」にし、送信日時を入れる\n- 1日の上限（sender.yaml の daily_limit）を超えたら止まる。営業お断り表記が見つかったフォームは開くだけで入力しない\n```\n\n入力の手間は機械に任せ、**最後のボタンだけは人が押す**。同意のチェックも人が選びます。\n\n## 4. 出す前の点検：review.md\n\nAI が作ったものは、外に出す前に点検表で確かめます。note の記事用の点検表から抜粋します。\n\n<!-- 画像：チェックリスト -->\n![保存用チェックリスト](../images/N016/checklist.png)\n\n```\n原稿・SNS 投稿案を出す前に全部確かめる。1つでも ✗ なら直してから出す。\n\n- [ ] 実績・数字はすべて knowledge.md にあるか、社長が確認したもの\n- [ ] 無料部分だけでも読者に役立つことが1つある\n- [ ] ng-words.md の言葉・誇大な表現がない\n- [ ] 他人の文章・画像をそのまま使っていない。引用には出典がある\n- [ ] 個人情報・取引先名・APIキーなどが入っていない\n```\n\n最後の項目は、権限の話とつながっています。**AI はフォルダの中のものを読めるので、記事や文面に入り込むことがあります。** 出す前に目で確かめます。\n\n### 状態の流れ\n点検の前と後で、ファイルに「状態」を書いています。どこまで進んだかが、ひと目でわかります。\n\n- 営業文：下書き（アポインター）→ 承認済・差し戻し（SV が点検）→ 送信済（人が送って記録）\n- note の記事：校正待ち（ライター）→ ストック（編集長が点検）→ 公開（社長）\n\nどちらも、**最後の一歩は人**です。\n\n## 5. 直させたことを残す：mistakes.md\n\n直させたことは、AI 自身に3行で書かせます。次の作業で同じ失敗を繰り返さないためです。\n\n```\n何を：確認していない売上の数字を原稿に書いた（例）\nなぜ：knowledge.md にない数字を推測で埋めた\n次から：数字がないときは空けておく\n```\n\nCLAUDE.md に「作業の終わりに、直された点を mistakes.md に足す」と1行書いておくと、頼み忘れがなくなります。\n\n## 6. 元に戻せるようにしておく\n\nどれだけ絞っても、「書く」道具を渡す以上、上書きは起こりえます。だから、**消されても戻せる状態** を先に作ります。\n\n- **Git（変更の履歴を残す道具）で管理する**：このチームのフォルダも Git で管理しています。作業の前に今の状態を保存（コミット）しておけば、あとから元に戻せます\n- **Git が難しければ、フォルダごと控えを取る**：作業の前に、大事なフォルダをコピーして別の場所に置く\n- **AI に渡すフォルダを分ける**：経理・契約書など、AI に触らせなくてよいファイルは、作業フォルダに入れない\n\n3つ目がいちばん簡単で、効きます。**AI が開くフォルダに無いものは、消されません。**\n\n## 7. コピーして使える型\n\n### 型1：CLAUDE.md\n```\n# CLAUDE.md\nこの仕事の目的：〇〇（1行）\n\n## 守ること\n- 送る・公開するのは私。AI は下書きまで\n- ファイルを消さない。消す必要があるときは、理由を書いて私に聞く\n- 数字は、私が渡した資料にあるものだけ使う。なければ空けておく\n- 出す前に review.md を全部確かめて、引っかかったら直す\n- 作業の終わりに、直された点を mistakes.md に足す（何を・なぜ・次からどうするか）\n```\n\n### 型2：役割の指示書（`.claude/agents/writer.md`）\n```\n---\nname: writer\ndescription: 〇〇の下書きを drafts/ に書く係\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは〇〇の下書き係です。\n必ず最初に読む：CLAUDE.md review.md\n\n## 仕事\n1. 渡された内容で、drafts/<名前>.md に下書きを書く（ほかの場所には書かない）\n2. 出す前に review.md を全部確かめ、引っかかったら直す\n3. 送信・公開はしない\n```\n\n### 型3：review.md\n```\n# review.md（出す前の点検）\n1つでも ✗ なら直してから出す。\n\n- [ ] 数字は、渡した資料にあるものだけ\n- [ ] 個人情報・取引先名・パスワード・APIキーが入っていない\n- [ ] 言ってはいけない言葉がない\n- [ ] 書いたのは決められた場所だけ\n```\n\n### 型4：頼み方の文例\n```\nCLAUDE.md を読んでから、〇〇の下書きを作って。\nファイルを消す・コマンドを動かす必要があるときは、やる前に何をするか説明して。\n出す前に review.md を全部確かめて、引っかかったら直す。\n```\n\n## 8. つまずきやすい点と、直し方\n\n| つまずき | 原因 | 直し方 |\n|---|---|---|\n| 指示書の役が、思ったより多くの道具を使う | `tools:` の行を書いていない | 指示書には必ず `tools:` を書き、要る道具だけ並べる |\n| 確認画面を、よく読まずに許可してしまう | 中身がわからない | わからないものは許可せず、「何をするのか説明して」と聞く |\n| 書く係なのに、別のファイルが書き換わった | Write・Edit は上書きもできる | 書く場所を指示書で1つに決める。作業の前に保存しておく |\n| 「送らないで」と言ったのに不安が残る | 口で言っただけ | CLAUDE.md に1行書く。送信のツールは、ボタンの手前で止まる作りにする |\n| 点検したと言うのに、直っていない | 「確かめて」だけ頼んでいる | 「引っかかったら直す」まで1行に入れる |\n\n## 9. 明日から始めるチェックリスト\n\n- [ ] AI に渡すフォルダから、触らせなくてよいファイルを外す\n- [ ] 作業の前に、今の状態を保存する（Git か、フォルダの控え）\n- [ ] CLAUDE.md に「送る・公開するのは私」「ファイルを消さない」を書く\n- [ ] 役割の指示書に `tools:` を書き、コマンドを動かす道具（Bash）は本当に要る役だけに渡す\n- [ ] review.md を作り、「出す前に全部確かめて、引っかかったら直す」と頼む\n- [ ] 確認画面で、中身がわからないものは許可しない\n\n---\n\n質問はコメントでどうぞ。", "chars": 5754, "asks": 0, "header": "images/N016/header.png"}, {"id": "N018", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "Googleマップの店舗情報が勝手に変わった・停止された：店舗オーナーが最初に確かめることと直し方", "price": 1480, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・10/1）／アカウント：A03／価格：1,480円\n     編集長へ：Google のヘルプは、この環境から support.google.com を開けず（接続がブロック）、検索結果の要約でしか確かめられていない。本文の Google の説明はすべて公開前に原文と照合する（末尾の一覧）。所要日数・期間は原文を読めていないので書いていない\n     根拠メモ（articles.csv）の nexer.co.jp の記事は公式ではないので本文には使っていない。「4日で自動反映」「閉業の選択肢が消えた」など公式ヘルプで確かめられない話も書いていない\n     価格 1,480円は A03 の目安（1,980〜4,980円）より低い。articles.csv どおりにした\n     画像は `python tools/build_note_images.py N018` でまだ作っていない（下の画像の行は N007 と同じ位置の仮置き）\n     無料相談フォームの案内（9/30 社長の指示）：「相談は無料」「無理な勧誘はしない」「順位の保証はしない」が実際の対応と合っているか社長が確認。フォームの URL は公開後に入れる", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。Googleマップを見たら、営業時間や電話番号が知らないうちに変わっていた。「閉業」と出ていた。プロフィールが「停止」と表示された。どうしていいか分からない人。\n\n**この記事でできること：** 「勝手に変わった」と「停止された」を見分けて、それぞれ最初に確かめることと、Google の公式ヘルプに書かれている直し方の順番が分かります。やると状況が悪くなりやすいことも分かります。\n\n**筆者について：** 店舗向けに MEO（Googleマップ集客）のツールを案内する仕事をしています。【社長確認：MEO に関わった期間・担当した店舗の数など、確認できる事実だけ】\n\n---\n\n## まず落ち着いて：「変わった」と「停止された」は別のこと\n\nどちらも「Googleマップがおかしい」に見えますが、原因も直し方も違います。\n\n**① 情報が勝手に変わった**\nGoogle の公式ヘルプでは、Google はユーザーからの報告など、さまざまな情報源から情報を集めていて、情報が正しくない・古いと報告されると、Google がプロフィールを更新することがあると説明されています（[ビジネス プロフィールに対する Google による変更を管理する](https://support.google.com/business/answer/3480441?hl=ja)）。\nまた、お店の人でなくても、Googleマップを使う人は情報の修正を「提案」できます（[ビジネス プロフィールを編集する](https://support.google.com/business/answer/3039617?hl=ja)）。\n\nつまり「誰かにいたずらされた」とは限りません。**まずは、何が・どう変わったかを管理画面で確かめる**のが先です。\n\n**② プロフィールが停止された・制限された**\n公式ヘルプでは、Google のガイドラインに従っていないプロフィールは、停止や無効化されることがあり、回復するのが妥当だと考える場合は **再審査を請求できる** と説明されています（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n## 最初に確かめる3つ（どちらの場合も）\n\n1. **自分がそのプロフィールの管理者になっているか**\n   Google のアカウントでログインして、自分のお店のプロフィールを開けるか確かめます。お店の名前や営業時間を編集するには、オーナー確認が必要です（[Google でビジネスのオーナー確認を行う](https://support.google.com/business/answer/7107242?hl=ja)）。\n2. **管理画面に「Google による変更」が出ていないか**\n   出ていれば「①変わった」のパターンです。\n3. **「停止」「制限」の表示やお知らせが出ていないか**\n   出ていれば「②停止された」のパターンです。\n\n## いちばん大事な注意：同じお店のプロフィールを新しく作らない\n\n慌てて「作り直せばいい」と考えがちですが、公式ヘルプでは、**再審査請求の審査中は、同じビジネスの新しいプロフィールを作らないように** と書かれています（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n有料部分では、パターンごとの直し方の手順、「閉業」にされていたときの戻し方、再審査請求で用意する書類、慌てたときに確かめるチェックリストを載せています。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N018/points.png)\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 「勝手に変わった」と「停止された」は別。直し方も別\n- まず管理画面で「Google による変更」と「停止・制限」の表示を確かめる\n- 同じお店のプロフィールを新しく作らない\n\n### 有料部分の目次\n1. 情報が勝手に変わったときの直し方\n2. 「閉業」「臨時休業」にされていたときの戻し方\n3. 管理者になっていない・オーナー確認がまだのとき\n4. 停止・制限されたときの再審査請求の流れ\n5. 再審査請求の前に用意しておくもの\n6. やると状況が悪くなりやすいこと\n7. 慌てたときのチェックリスト\n\n> **自分でやるのは難しそう、と思った方へ**：無料でご相談いただけます。▶ [Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N018)", "paid": "## 1. 情報が勝手に変わったときの直し方\n\n公式ヘルプ（[Google による変更を管理する](https://support.google.com/business/answer/3480441?hl=ja)）では、Google による変更は、**もともとの情報の横に表示され**、それを見てどうするかを選べると説明されています。選べることは次のとおりです。\n\n| したいこと | やり方（公式ヘルプの説明） |\n|---|---|\n| 変更が正しいので受け入れる | ページ上部で変更をすべて承認する。または、承認したい変更がある項目を選んで「適用」 |\n| 変更がまちがっているので元に戻す | 破棄したい変更がある項目を選び、元の内容に戻して「適用」 |\n| 自分で正しい内容に直す | 変更の内容を編集する |\n\n手順：\n1. 自分のお店のプロフィールを開き、「プロフィールを編集」に進む\n2. Google による変更が出ている項目を1つずつ確かめる\n3. 正しいものは承認、まちがっているものは元に戻す\n4. 保存したあと、編集内容に表示されるステータスを確かめる。「承認済み」になると、更新した情報がプロフィールに表示されます（[ビジネス プロフィールの編集内容の反映](https://support.google.com/business/answer/3038311?hl=ja)）\n\n**注意：** 公式ヘルプには、Google による変更の **すべてが** プロフィールの中で管理できるわけではない、とも書かれています。管理画面で見つからない変更があっても、自分の操作ミスとは限りません。\n\n**直したあとにやること：** 店の看板・ホームページ・予約サイトの情報と、Google の情報が同じかを見直します。お店の外にある情報と Google の情報が食い違っていると、お客さんがどちらが正しいか分からなくなるためです。\n\n## 2. 「閉業」「臨時休業」にされていたときの戻し方\n\n公式ヘルプ（[ビジネス情報を営業中に再設定する](https://support.google.com/business/answer/15300571?hl=ja)）では、営業中に戻すと、Googleマップと Google 検索で「臨時休業」「閉業」の表示が出なくなると説明されています。\n\n1店舗の場合の手順：\n1. 自分のお店のプロフィールに移動する\n2. 「プロフィールを編集」→「営業時間」を選ぶ\n3. 営業時間の編集で「決まった営業時間で営業している」を選ぶ\n\n**注意：** 同じヘルプには、**所在地や名称の変更にともなって閉業マークが付いた場合は、営業中に戻せない** と書かれています。その場合は、新しいビジネス情報を追加するよう案内されています。移転や店名変更をしたあとに「閉業」になっていたら、このパターンかどうかを先に確かめてください。\n\n## 3. 管理者になっていない・オーナー確認がまだのとき\n\n「昔だれかが登録したまま」「前の店長のアカウントで管理していた」というときは、まず自分のアカウントで管理できる状態にします。\n\n- オーナー確認の方法には、電話・SMS、メール、ビデオ通話、はがき などがあります。**どの方法が使えるかは Google が自動で決め、自分では選べない** と公式ヘルプに書かれています。お店の業種や地域などによって変わり、複数の方法での確認が必要になることもあります（[Google でビジネスのオーナー確認を行う](https://support.google.com/business/answer/7107242?hl=ja)）\n- すでにほかの人がオーナーになっている場合は、オーナー権限をリクエストする手順が公式ヘルプにあります（[ビジネス プロフィールのオーナー権限をリクエストする](https://support.google.com/business/answer/4566671?hl=ja)）\n\n## 4. 停止・制限されたときの再審査請求の流れ\n\n1. **原因になりそうなところを直す**\n   公式ヘルプでは、ガイドラインに従っていないプロフィールが停止・無効化されると説明されています。まず [Google に掲載するビジネス情報のガイドライン](https://support.google.com/business/answer/3038177?hl=ja) と自分のプロフィールを見くらべます（例：お店の名前にキーワードを足していないか、実際にお客さんに対応している住所か）\n2. **再審査請求ツールを開く**\n   プロフィールに関連付けられた Google アカウントでログインし、プロフィールを選んで進みます（[ビジネス プロフィールのコンテンツとプロフィールの制限に対する再審査請求](https://support.google.com/business/answer/13597551?hl=ja)）\n3. **証拠書類を出す**\n   証拠書類の提出を求められることがあり、公式ヘルプでは、再審査請求の裏付けとして出すことが強くすすめられています\n4. **審査を待つ**\n   審査中は、**同じお店の新しいプロフィールを作らない**（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）\n\nプロフィール全体ではなく、口コミや写真などの一部のコンテンツが制限された場合も、同じ再審査請求のページから請求できると説明されています（[再審査請求](https://support.google.com/business/answer/13597551?hl=ja)・[ポリシー違反によるビジネス プロフィールの制限](https://support.google.com/business/answer/14114287?hl=ja)）。\n\n## 5. 再審査請求の前に用意しておくもの\n\n公式ヘルプで、再審査請求の裏付けに役立つ証拠書類としてあげられているものです（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n| 書類 | 手元にあるか |\n|---|---|\n| 正式な事業登録証 | |\n| 営業許可証 | |\n| 納税証明書 | |\n| 事業用の公共料金の請求書（電気・電話・水道・インターネット） | |\n\n**いちばん大事なこと：** 書類に書かれている **お店の名前と住所が、再審査を請求するプロフィールと同じか** を確かめます（同じヘルプで、一致していることを確認するよう書かれています）。\n書類の店名とプロフィールの店名がちがう場合は、どちらが正しいかを先に整理してください。\n\n## 6. やると状況が悪くなりやすいこと\n\n| やらないこと | 理由 |\n|---|---|\n| 同じお店のプロフィールを新しく作る | 公式ヘルプで、再審査請求の審査中は作らないよう書かれている |\n| 直さないまま再審査請求を出す | 停止はガイドラインに従っていないことが理由。原因を直さないと、請求の理由が説明できない |\n| お店の名前にキーワードを足して「目立たせる」 | ビジネス名のガイドライン違反（[ガイドライン](https://support.google.com/business/answer/3038177?hl=ja)） |\n| 書類と違う店名・住所のまま請求する | 名前と住所が一致しているか確かめるよう書かれている |\n| 「すぐ復活させます」「必ず戻します」という業者にまかせる | 審査をするのは Google。結果を約束できる人はいない |\n\n## 7. 慌てたときのチェックリスト\n\n<!-- 画像：チェックリスト -->\n![保存用チェックリスト](../images/N018/checklist.png)\n\n```\n- [ ] 自分のアカウントでプロフィールを開けるか（管理者か）\n- [ ] 「Google による変更」が出ていないか\n- [ ] 出ていたら、正しいものは承認・まちがいは元に戻したか\n- [ ] 「閉業」「臨時休業」になっていないか\n- [ ] 「停止」「制限」の表示が出ていないか\n- [ ] ガイドラインと見くらべて、原因を直したか\n- [ ] 書類の店名・住所がプロフィールと同じか\n- [ ] 同じお店のプロフィールを新しく作っていないか\n```\n\n## 「自分でやるのは難しい」と思ったら\n\nここまで読んで、「時間がない」「自分でやるのは不安」と感じた方は、お気軽にご相談ください。筆者の会社で、Googleビジネスプロフィールの整え方をご案内しています。\n\n- 相談は無料です\n- 無理な勧誘はしません。ご案内だけで終わっても大丈夫です\n- 順位の保証はしていません（表示順位は Google が決めるためです）\n\n▶ **[Googleマップ集客の無料相談フォーム](https://【社長確認：フォームを公開したURL】?src=N018)**（お店の名前・エリア・お困りのことを入れるだけ。2分ほどで送れます）\n\n質問はコメントでどうぞ。\n\n---\n\n### 社長に原文を確認してほしい Google ヘルプ（公開前）\nすべて **原文未確認**（この環境から support.google.com を開けず、検索結果の要約でしか確かめていない）\n- Google による変更を管理する：https://support.google.com/business/answer/3480441?hl=ja（原文未確認）\n- ビジネス プロフィールを編集する（編集の提案）：https://support.google.com/business/answer/3039617?hl=ja（原文未確認）\n- 編集内容の反映（ステータス）：https://support.google.com/business/answer/3038311?hl=ja（原文未確認）\n- 営業中に再設定する：https://support.google.com/business/answer/15300571?hl=ja（原文未確認）\n- オーナー確認を行う：https://support.google.com/business/answer/7107242?hl=ja（原文未確認）\n- オーナー権限をリクエストする：https://support.google.com/business/answer/4566671?hl=ja（原文未確認）\n- 停止または無効化されたプロフィールを修正する：https://support.google.com/business/answer/4569145?hl=ja（原文未確認）\n- コンテンツとプロフィールの制限に対する再審査請求：https://support.google.com/business/answer/13597551?hl=ja（原文未確認）\n- ポリシー違反によるビジネス プロフィールの制限：https://support.google.com/business/answer/14114287?hl=ja（原文未確認）\n- ビジネス情報のガイドライン：https://support.google.com/business/answer/3038177?hl=ja（原文未確認）\n（この一覧は公開前に消す）", "chars": 6568, "asks": 3, "header": "images/N018/header.png"}, {"id": "N201", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "秋に部屋を決める前に：今の部屋の解約予告と、新居のガス（プロパン）料金を契約前に確かめる方法", "price": 0, "status": "校正待ち", "writer": "アオイ", "memo": "状態：校正待ち（ライター：アオイ・10/2）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/2）＋直した点：①「10分ほどで確かめられる」「今日の夜に契約書を開けば、まだ十分に間に合います」は根拠のない数字・間に合う約束なので、事実の手順に直した ②賃貸向けの設備費用の計上禁止は「2025年4月2日以降に結ばれた契約が対象」と範囲を足した ③「契約の前に料金を確かめられる仕組みも決められました／遠慮しなくて大丈夫」を、2024年7月からの「料金を前もって示す努力義務・直接頼まれたら応じる義務」の言い方に直した ④標準契約書の30日分の家賃の一文を40字以内に。仲介手数料無料は「条件は物件によって違うため、ご相談のときにご説明します」とセットで、「すべて・必ず無料」はなし。宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示・相談フォームの ?src・ng-words は問題なし。【社長確認】は既存の3つのまま。公式ページはジンの環境からも開けず、WebSearch の検索結果で確認（原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：国土交通省・消費者庁・経済産業省のページは作業環境から開けず、WebSearch の検索結果の要約で確かめた（確認リストはすべて「原文未確認」）\n     解約予告は「標準契約書（ひな形）では少なくとも30日前。実際は自分の契約書で決まる」と書き、30日と言い切っていない。プロパンの料金の数字・相場、「プロパンは高い」などの比べ方は書いていない\n     「10月中旬以降は条件を比べやすい」は出典が民間の不動産サイトだけなので使っていない\n     N019（秋冬の段取り・退去の費用）と重ならないよう、「申し込む前の2つの確認」（解約予告・ガスの種類と料金）に絞った\n     仲介手数料無料は、10/1 社長了承どおり締めのお部屋探しの案内で「条件は物件によって違うため、ご相談のときにご説明します」とセットで書いた", "free": "**こんな人向け：** 10〜11月に関東で部屋を探している人。年内に引越したい人。\n\n**この記事で分かること：** 今の部屋の解約予告の確かめ方。新居のガスがプロパンのとき、契約前に聞くこと。\n\n**結論：** 申し込む前に、今の部屋の契約書で解約の予告期間を見ます。新居がプロパンガスなら、契約の前に料金を聞いておきます。\n\n---\n\n## なぜ「決める前」に確かめるのか\n\n部屋を決めると、2つの話が一気に動きます。今の部屋の解約と、新しい部屋の契約です。\n\n契約のあとに気づいても、直せないことがあります。だから申し込みの前に、2つだけ確かめておきます。\n\n- 今の部屋は、いつまでに解約の連絡が要るか\n- 新しい部屋のガスは何か。プロパンなら料金はどうか\n\nどちらも、契約書を見たり、不動産会社に聞いたりすれば確かめられます。申し込みの前に、時間をとっておきます。\n\n## 1. 今の部屋の解約予告を確かめる\n\n### ひな形では「少なくとも30日前」\n\n国土交通省は、賃貸の契約書のひな形を出しています。「賃貸住宅標準契約書」です。\n\nその中では、借主は少なくとも30日前に解約を申し入れる、とされています。30日分の家賃を払えば、すぐに解約できる決まりもあります。\n\nただ、これはあくまでひな形です。**実際の期限は、あなたの契約書で決まります。**\n\n### 契約書で見るところ\n\n- **解約の予告期間**：何日前か、何か月前か\n- **連絡の方法**：電話でよいか、書面が要るか\n- **最後の月の家賃**：日割りか、月の分をまるごと払うか\n- **特約**：早く出るときの違約金などの決まりがないか\n\n契約書が見つからないときは、管理会社に聞いてみてください。写しをもらえるか、内容を教えてもらえるかを確かめます。\n\n### 解約の連絡は「審査が通ってから」\n\n解約の連絡を先に出すと、困ることがあります。新しい部屋の審査に通らないと、住む部屋がなくなるからです。\n\n審査が通り、契約の日が見えてから連絡します。予告期間から逆算すると、二重の家賃が何日かかるか見通せます。\n\n## 2. 新居のガスがプロパンか確かめる\n\n### なぜ契約の前に聞くのか\n\nガスが都市ガスかプロパン（LPガス）かは、物件ごとに違います。プロパンの料金は、ガス会社ごとに決まります。\n\n賃貸では、ガス会社を自分で選べないことが多いです。だから、決める前に料金を知っておくと安心です。\n\n消費者庁も、賃貸の契約の前にLPガスの料金を確かめるよう呼びかけています。まずは不動産会社に尋ねてみましょう、と案内しています。\n\n### 2025年4月からのルール\n\n経済産業省のルールが変わり、2025年4月2日から料金の示し方が変わりました。料金は「基本料金・従量料金・設備料金」の3つに分けて示されます。\n\nガスと関係のない設備の費用は、ガス料金に入れられなくなりました。たとえば、エアコンの費用です。\n\n賃貸向けでは、給湯器などガス器具の費用も入れてはいけない、とされています。こうした設備の費用は、家賃で回収すべきという考え方です。\n\nただし、この禁止は2025年4月2日以降に結ばれたガスの契約が対象です。それより前からの契約には、当てはまりません。\n\nまた2024年7月から、ガス会社は料金を前もって示すよう努めます。入居を考えている人から直接頼まれたときは、応じることになっています。\n\n### 契約の前に聞くこと\n\n- ガスは都市ガスか、プロパンか\n- プロパンなら、ガス会社の名前\n- 基本料金と、1㎥あたりの料金（従量料金）\n- 設備料金があるか。あれば、何の費用か\n\n設備料金の欄に金額があれば、何の費用かを確かめます。聞いた内容は、メモか書面で残しておきます。\n\n料金が高いか安いかは、この記事では決めつけません。気になるときは、同じ条件の物件と比べてみてください。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N201/points.png)\n\n## この記事のポイント\n\n- 今の部屋の解約予告は、自分の契約書で確かめる\n- 解約の連絡は、新居の審査が通ってから\n- 新居のガスが都市ガスかプロパンかを聞く\n- プロパンなら、3つの料金を契約前に聞く\n\n## チェックリスト：申し込む前に\n\n- [ ] 今の部屋の契約書を出した\n- [ ] 解約の予告期間（何日前・何か月前）を確かめた\n- [ ] 解約の連絡の方法（電話・書面など）を確かめた\n- [ ] 最後の月の家賃が日割りか、月の分かを確かめた\n- [ ] 早く出るときの違約金などの特約がないか見た\n- [ ] 新居のガスが都市ガスかプロパンかを聞いた\n- [ ] プロパンなら、ガス会社の名前を聞いた\n- [ ] 基本料金・従量料金・設備料金を聞いて、メモした\n\n## よくある失敗\n\n**1. 「解約は1か月前」と思い込む**\n\nひな形の30日前を、自分の契約と思い込む例です。\n\n契約書では「2か月前」のこともあります。必ず自分の契約書で確かめます。\n\n**2. 審査の前に解約の連絡を出してしまう**\n\n早く動こうとして、先に解約を伝える例です。審査が通り、契約の日が見えてから連絡します。\n\n**3. ガスの種類を聞かずに契約する**\n\n入居してから、プロパンだったと気づく例です。料金は、契約の前に不動産会社に聞いておきます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n秋の部屋探しは、まるっと窓口（筆者の会社）にご相談ください。今の部屋の解約の段取りから、一緒に考えます。\n\nお部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】\n\n仲介手数料を無料にできる物件もあります。条件は物件によって違うため、ご相談のときにご説明します。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（提携する不動産会社をご紹介）\n- 電気・ガス・水道の手続き\n- インターネット回線（新居で使える回線をご案内）\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N201)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて WebSearch の検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 国土交通省「賃貸住宅標準契約書（平成30年3月版・家賃債務保証業者型）」https://www.mlit.go.jp/jutakukentiku/house/content/001493354.pdf ：第11条、借主は少なくとも30日前に解約の申入れ。30日分の賃料を払えば随時に解約できる【原文未確認】（条番号も原文で確認）\n- 消費者庁「賃貸住宅のLPガス料金 賃貸借契約 「原文未確認」）\n     N013（手続き先）・N020（繁忙期の申し込み順）と重ならないよう、「入居日の当日に、何をどの順で確かめるか」に絞った。手続き先の調べ方は N013、申し込みの順番は N020 に任せている\n     ガスの申し込みの目安の日数（入居の1〜2週間前など）・ネットの開通日数・料金は書いていない（日数は出典が FAQ の要約や民間サイトだけのため）\n     締めの「でんき開通サポート」の説明は N013・N020 と同じ（lp/index.html の記載どおり）。LP の URL は【社長確認】を増やさないため入れていない", "free": "**こんな人向け：** 10〜12月に関東で引越す人。入居したその日から、お風呂と暖房を使いたい人。\n\n**この記事で分かること：** 入居日の前にそろえておく予約。入居日の当日に、何をどの順で確かめるか。\n\n**結論：** 入居日に一番合わせにくいのは、ガスの開栓の立会いです。ガスの予約を先に入れ、ほかは入居日の午前に順に確かめます。\n\n---\n\n## なぜ冬前は「入居日」が大事なのか\n\n寒くなる時期は、お湯と暖房がないと困ります。入居した夜にシャワーが使えないと、つらいものです。\n\n電気と水道は、立会いなしで使い始められることが多いです。ガスは、立会いが要るのが一般的です。\n\nだから、入居日の段取りはガスを中心に組みます。\n\n## 入居日の前に：予約をそろえる\n\n### ガスの開栓：立会いの日時を押さえる\n\n東京ガスは、ガスの使用開始（開栓）の作業には立会いをお願いしています。係の人が訪問して、メーターの栓を開け、点火を確かめます。\n\n本人が立ち会えないときは、代理の人でもよいとされています。たとえば、大家さんや管理人さんです。\n\n立会いの日時は、希望どおりに取れるとは限りません。新居が決まったら、**ほかの手続きより先に**予約を入れておきます。\n\n東京ガス以外のガス会社や、プロパンの物件もあります。立会いの条件や予約のしかたは、**新居のガス会社の案内**で確かめてください。\n\n### 電気：使用開始の申し込みを済ませる\n\n電気は、入居日を「使用開始日」として申し込みます。スマートメーターの物件なら、立会いなしで使い始められることが多いです。\n\n申し込みが済んでいないと、ブレーカーを上げても明かりがつかないことがあります。\n\n### 水道：新居の水道局に申し込む\n\n水道は、新居の地域の水道局に、使用開始を申し込みます。申し込み方法は、水道局ごとに違います。\n\n### ネット：工事や機器の届く日を確かめる\n\nネットの開通日は、回線や建物によって違います。工事の立会いが要る場合もあります。\n\n申し込んだら、開通日と、ルーターなど機器の届く日を確かめます。入居日に間に合わないときのつなぎも考えておきます。\n\n### ウォーターサーバー：届く日は入居日以降に\n\nウォーターサーバーを使う人は、届く日を入居日以降にします。電源が要るので、置く場所のコンセントも見ておきます。\n\n<!-- 画像：図解 -->\n![入居日の段取り](../images/N202/diagram.png)\n\n## 入居日の当日：この順で確かめる\n\n### ① 鍵を受け取る\n\nまず鍵を受け取ります。ガスの立会いの時間より前に、受け取れるようにしておきます。\n\n### ② 電気：ブレーカーを上げる\n\n分電盤のブレーカーを上げて、明かりがつくか確かめます。つかないときは、電気の契約先に連絡します。\n\n### ③ 水道：蛇口から水が出るか見る\n\n台所とお風呂の蛇口をひねって、水が出るか確かめます。出ないときは、水道局の案内を見て連絡します。\n\n### ④ ガス：立会いで開栓してもらう\n\n予約した時間に、係の人が来ます。開栓のあと、給湯器やコンロに火がつくか確かめてもらいます。\n\n給湯器には、電気も使う機種があります。電気が先に使えると、その場でお湯まで確かめやすくなります。\n\n### ⑤ ネット・ウォーターサーバー\n\nネットの工事や機器の受け取りがあれば、その時間に合わせます。ウォーターサーバーも、届く日にコンセントの近くに置きます。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N202/points.png)\n\n## この記事のポイント\n\n- ガスの開栓の立会いを、最初に予約する\n- 立ち会えないときは、代理の人を決めておく\n- 電気・水道は入居日で申し込む\n- 当日はブレーカー→蛇口→ガスの順で確かめる\n\n## チェックリスト：入居日にそろえる\n\n- [ ] 新居のガス会社に、開栓の立会いの日時を予約した\n- [ ] 立ち会えないときの代理の人（大家さん・管理人さん）を決めた\n- [ ] 鍵を受け取る時間を、立会いの前にした\n- [ ] 電気の使用開始を、入居日で申し込んだ\n- [ ] 水道の使用開始を、新居の水道局に申し込んだ\n- [ ] ネットの開通日と、機器の届く日を確かめた\n- [ ] ウォーターサーバーの届く日を、入居日以降にした\n- [ ] 当日：ブレーカー → 蛇口 → ガスの立会い → ネットの順で確かめる\n\n## よくある失敗\n\n**1. ガスの予約を最後にして、立会いの日が取れない**\n\n電気と水道を先に済ませて、ガスを後回しにする例です。ガスは立会いの日時が要るので、最初に予約します。\n\n**2. 立会いの時間に、まだ鍵がない**\n\n鍵を受け取る時間が、立会いのあとになっている例です。鍵の受け取りは、立会いより前にしておきます。\n\n**3. 給湯器に電気が来ていない**\n\nガスは開いたのに、電気の申し込みがまだでお湯が出ない例です。電気の使用開始は、入居日で申し込んでおきます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n入居日にライフラインとネットをそろえたい方は、まるっと窓口（筆者の会社）へ。関東1都6県では「でんき開通サポート」があります。対象は東京・神奈川・埼玉・千葉・茨城・群馬・栃木です。\n\n新居の電気の使用開始のお申し込みを取り次ぎます。ガス・水道・インターネットのお申し込みも、あわせてお預かりします。\n\n電力会社・ガス会社・水道局の公式窓口ではなく、民間の取次サービスです。\n\nネット回線は、フレッツ光・ドコモ光・auひかり・ソフトバンク光などからご案内します。建物やエリアによって使えない回線があるため、新居で使える回線をお伝えします。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n- お部屋探し（提携する不動産会社をご紹介します。物件のご案内・契約・仲介は提携先の不動産会社が行います【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N202)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて WebSearch の検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 東京ガス FAQ「ガスの使用開始（開栓）作業時に、立会いが必要か知りたい。」https://support.tokyo-gas.co.jp/faq/show/1870?category_id=900&site_domain=open ：開栓作業には立会いが必要【原文未確認】\n- 東京ガス FAQ「ガスの使用開始（開栓）作業の立会者は、入居者本人以外でも可能か知りたい。」https://support.tokyo-gas.co.jp/faq/show/1874?category_id=924&site_domain=open ：お知らせを伝えられる代理の方（大家さま・管理人さまなど）の立会いでも可【原文未確認】\n- 東京ガス「ガス・電気の使用開始お手続き詳細」https://home.tokyo-gas.co.jp/gas_power/procedure/moving/khsn_k_nagare.html ：係員が訪問し、メーターの栓を開く・宅内で点火の確認・安全のお願いの説明【原文未確認】\n- 東京ガス FAQ 2件は、ジンが10/2に WebSearch の検索結果で再確認（立会いは必要・代理の方〈大家さま・管理人さまなど〉でも可）。公式ページはジンの環境からも開けず【原文未確認】\n- 給湯器と電気：リンナイ FAQ「ガス給湯器｜電源が入らない場合の対応方法は？」https://faq.rinnai.co.jp/faq/show/1185?category_id=2&site_domain=default （ブレーカー・電源プラグの確認を案内）。言い過ぎを避け「電気も使う機種があります」に弱めた【原文未確認】\n- 「電気はスマートメーターなら立会いなしで使用開始できることが多い」「水道の申し込み方法は水道局ごとに違う」は N013 と同じ書き方（N013 の確認リストの出典・lp/index.html のQ&A）【原文未確認】\n- 使っていない話：開栓の申し込みは「入居の1〜2週間前まで」などの日数（FAQ の要約と民間サイトだけのため）。ネットの開通日数・料金\n\n**ジンに確かめてほしいこと**\n- [ ] 「給湯器は、電気も使う機種が多いです」は一般的な話として言い過ぎでないか（出典なし。言い過ぎなら削る）\n- [ ] 「東京ガスは、開栓の作業には立会いをお願いしています」の言い方が FAQ の原文に合っているか\n\n**【社長確認】**\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] ガス会社の決まりは公式の出典つき（原文未確認はジンが確認）\n- [x] 「仲介手数料無料」は書いていない（この記事のテーマ外）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーン・開通日数を書いていない\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N202\n- [x] ng-words なし。不安をあおっていない\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/2）\n- [x] 出典が1つだけの話（日数など）は使っていない", "paid": "", "chars": 3938, "asks": 5, "header": "images/N202/header.png"}, {"id": "N203", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "引越したあとの住所変更はこの順番で：転入届・マイナンバーカード・運転免許証（マイナ免許証）・郵便の転送（年賀状の前に）", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・10/2）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/2）＋直した点：①マイナ免許証の事前の手続きを「免許センターなどで電子証明書を出し、マイナポータルで連携」と具体化し、事前の手続きをしていない人も警察への届出が要ると足した ②マイナンバーカードは「90日以内」を自治体の案内で再確認、転入届が遅れても失効することがある旨を足した。「カードの裏など」を「追記欄」に ③郵便の「今日のうちに出しておくと安心」を「早めに出しておきます」に（急がせる書き方を外した） ④40字を超える文を短くした。14日（住民基本台帳法）・1年間・3〜7営業日は公式の言い方どおり。宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示・相談フォームの ?src・ng-words は問題なし。【社長確認】は既存の3つのまま。公式ページはジンの環境からも開けず、WebSearch の検索結果で確認（原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：総務省・警察庁・日本郵便・自治体のページは作業環境から開けず、WebSearch の検索結果の要約で確かめた（確認リストはすべて「原文未確認」）\n     N010（全体のチェックリスト）・N021（マイナポータルの転出届）と重ならないよう、「転入したあとの住所変更の順番」に絞った\n     日数（転入届の14日・マイナンバーカードの90日・郵便の1年間と3〜7営業日）は、法律・公式の案内の言い方として「〜とされています」「案内しています」と書き、自治体・日本郵便のページで確かめるよう添えた\n     「年賀状の前に転居届を」はリサーチでも推測扱いのため、時期の目安としてだけ書き、日付は書いていない", "free": "**こんな人向け：** 10〜11月に関東で引越す人。年内に引越して、住所変更をまとめて片づけたい人。\n\n**この記事で分かること：** 引越したあとの住所変更の順番と、郵便の転送を出す時期。マイナ免許証の人と、そうでない人の違い。\n\n**結論：** 転入届とマイナンバーカードの住所変更は、同じ日に済ませます。次に運転免許証、郵便の転送の順です。\n\n---\n\n<!-- 画像：図解 -->\n![住所変更の順番](../images/N203/diagram.png)\n\n## なぜ順番が大事なのか\n\n住所変更の多くは、新しい住所が分かる書類を求めます。その書類のもとになるのが、転入届です。\n\nだから、まず役所の手続きを済ませます。そのあとで、ほかの住所変更を進めると手戻りが少なくなります。\n\n## ① 転入届（新しい市区町村の役所で）\n\n### 期限は「転入した日から14日以内」\n\n別の市区町村から引越したら、新しい市区町村に転入届を出します。住民基本台帳法では、転入した日から14日以内とされています。\n\n同じ市区町村の中での引越しは「転居届」です。こちらも、役所の窓口で手続きします。\n\n### 持っていくもの\n\n- 本人確認書類\n- マイナンバーカード（持っている人。家族の分も）\n- 転出証明書（旧住所の役所で受け取った人）\n\nマイナポータルで転出届を出した人は、転出証明書が要らない場合があります。持ち物は、新しい市区町村のページで確かめてください。\n\n## ② マイナンバーカードの住所変更（転入届と同じ日に）\n\nマイナンバーカードを持っている人は、転入届と一緒に住所の変更をします。カードの追記欄に、新しい住所が書き込まれます。\n\n自治体の案内では、転入届から90日以内の手続きが必要とされています。過ぎると、カードが使えなくなります。\n\n転入届が遅れたときも、カードが使えなくなることがあります。転入届は、期限の14日以内に出します。\n\n窓口で同じ日に済ませておけば、期限を気にせずに済みます。**転入届の日に、カードも一緒に出す**と覚えておきます。\n\n暗証番号を聞かれることがあります。カードを受け取ったときの暗証番号の控えを、出かける前に探しておきます。\n\n## ③ 運転免許証の住所変更\n\n### マイナ免許証だけを持っている人\n\nマイナ免許証だけの人は、警察への届出が要らない場合があります。警察庁の案内で、転入届だけで済む仕組みです。\n\nただし、事前の手続きが要ります。免許センターなどで電子証明書を出し、マイナポータルで連携します。\n\n事前の手続きをしていない人は、警察への届出が要ります。従来の免許証との2枚持ちの人も、対象外です。\n\n### それ以外の人\n\n従来の免許証や2枚持ちの人は、警察署などで住所を変えます。事前の手続きをしていない人も同じです。\n\n新しい住所が分かる書類（住民票の写しなど）が要ります。窓口や持ち物は、新しい住所の都県の警察のページで確かめてください。\n\n## ④ 郵便の転送（年賀状の前に）\n\n日本郵便に転居届を出すと、旧住所あての郵便が新しい住所に届きます。窓口・ポスト・Webの「e転居」で出せます。\n\n日本郵便は、届け出た日から1年間転送すると案内しています。転送が始まるまでに、3〜7営業日ほどかかる（前後する場合がある）としています。\n\nまだ出していない人は、早めに出しておきます。年末に引越す人は、年賀状のやりとりが始まる前に出します。\n\n転送されているあいだに、送り主に新しい住所を伝えていきます。\n\n## ⑤ そのほかの住所変更\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N203/points.png)\n\n役所と郵便が済んだら、残りをまとめて進めます。\n\n- 銀行・クレジットカード\n- 携帯電話\n- 勤め先・学校\n- 保険（生命保険・自動車保険など）\n- 通販サイト・定期便\n\n## この記事のポイント\n\n- 転入届は、転入した日から14日以内\n- マイナンバーカードの住所変更は同じ日に\n- マイナ免許証だけの人は、警察の届出が要らない場合がある\n- 郵便の転送は、年賀状の前に出す\n\n## チェックリスト：引越したあとの住所変更\n\n- [ ] 転入届（または転居届）を出した\n- [ ] 同じ日に、マイナンバーカードの住所を変えた（家族の分も）\n- [ ] マイナンバーカードの暗証番号の控えを確かめた\n- [ ] 自分の免許証がマイナ免許証だけか、2枚持ちかを確かめた\n- [ ] 必要な人は、警察署などで免許証の住所を変えた\n- [ ] 日本郵便に転居届を出した\n- [ ] 銀行・カード・携帯・勤め先・保険の住所を変えた\n\n## よくある失敗\n\n**1. カードを持たずに転入届に行く**\n\n転入届だけ出して、マイナンバーカードを持っていない例です。もう一度役所に行くことになるので、家族の分も持っていきます。\n\n**2. 2枚持ちなのに、警察の手続きは要らないと思う**\n\nマイナ免許証と従来の免許証を両方持つ例です。2枚持ちは対象外なので、警察署などで住所を変えます。\n\n**3. 転居届を出すのが遅れる**\n\n引越しの直前に出して、転送が間に合わない例です。登録には日数がかかるので、早めに出しておきます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n引越し業者選びに迷ったら、まるっと窓口（筆者の会社）にご相談ください。関東の引越し業者をご紹介しています。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- 関東の引越し業者のご紹介\n- お部屋探し（提携する不動産会社をご紹介します。物件のご案内・契約・仲介は提携先の不動産会社が行います【社長確認：提携先の不動産会社名と宅建業の免許番号】）\n- 電気・ガス・水道の手続き\n- インターネット回線\n- ウォーターサーバー\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N203)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべて WebSearch の検索結果の要約で確認。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 住民基本台帳法 第22条（転入した日から14日以内に届出）e-Gov 法令検索 https://laws.e-gov.go.jp/law/342AC0000000081 【原文未確認】\n- 総務省「住所の異動届は正しく行われていますか？」https://www.soumu.go.jp/menu_kyotsuu/important/topics081127.html 【原文未確認】\n- 横浜市「マイナンバーカードを利用した転入届（市外からの引越し）」https://www.city.yokohama.lg.jp/kurashi/koseki-zei-hoken/todokede/koseki-juminhyo/todokede-touroku/jyumin/tennyuu_shigai/card.html ／大田区「住所変更に伴うマイナンバーカードの手続きについて」https://www.city.ota.tokyo.jp/seikatsu/koseki_j/jyuminhyo/todokede/jyuusyo-henkou_mynumber-card.html ：転入届から90日以内に継続利用の手続きをしないと失効、暗証番号が必要【原文未確認】（90日は自治体の案内の要約だけ。総務省・デジタル庁の原文でも確かめる）\n- マイナポータル「引越し関連手続一覧」https://myna.go.jp/html/moving_oss_procedure_list.html 【原文未確認】\n- 警察庁「住所変更ワンストップサービス等の FAQ」https://www.npa.go.jp/bureau/traffic/FAQ05.pdf ／「マイナンバーカードと運転免許証の一体化」https://www.npa.go.jp/bureau/traffic/r4kaisei_main.html ：マイナ免許証のみの人は、事前の手続（署名用電子証明書の提出・連携）をしていれば転入届だけで警察への届出が不要、2枚持ちは対象外【原文未確認】\n- 警視庁「記載事項変更（住所、氏名、本籍（国籍等）の変更の方）」https://www.keishicho.metro.tokyo.lg.jp/menkyo/koshin/kisai00.html ：従来の免許証の住所変更の窓口・持ち物【原文未確認】\n- 日本郵便「転居・転送サービス」https://www.post.japanpost.jp/service/tenkyo/index.html ：窓口・ポスト・e転居で届出、届出日から1年間転送、登録まで3〜7営業日（前後する場合あり）【原文未確認】\n- ジン10/2 再確認（WebSearch の検索結果。公式ページは開けず【原文未確認】）：杉並区・中央区・生駒市など自治体の案内で「転入届から90日以内に継続利用の手続きをしないと失効」「転入届が転入から14日・転出予定日から30日を過ぎると失効」。警察庁・埼玉県警の案内で、ワンストップは「マイナ免許証のみ」「事前に免許センター等で署名用電子証明書を提出」「自分でマイナポータル連携」の3条件、利用申請していない人・2枚持ちは警察への届出が必要\n- 推測の扱い：「年賀状のやりとりが始まる前に出しておく」はリサーチでも推測。日付は書いていない\n\n**ジンに確かめてほしいこと**\n- [ ] マイナンバーカードの「90日以内」の書き方（自治体の案内の要約だけ）。総務省の原文で確かめ、違えば直す\n- [ ] 「マイナポータルで転出届を出した人は、転出証明書が要らない場合があります」が N021・デジタル庁の言い方に合っているか\n- [ ] 従来の免許証の住所変更で「住民票の写しなど」が持ち物として合っているか（都県の警察で違うか）\n\n**【社長確認】**\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] 役所の手続き・期限・法律は公式の出典つき（原文未確認はジンが確認）\n- [x] 「仲介手数料無料」は書いていない（この記事のテーマ外）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーンを書いていない\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N203\n- [x] ng-words なし。不安をあおっていない\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/2）\n- [x] 出典が1つだけの話は断定していない（90日・年賀状の時期）", "paid": "", "chars": 4383, "asks": 5, "header": "images/N203/header.png"}, {"id": "N103", "acc": "A02", "accName": "AI×営業（DM・フォーム営業の型）", "title": "10人で送っても同じ店に二度送らない：送信台帳を1つにして「30日ルール」と「お断り表記は見送り」で守る仕組み", "price": 1480, "status": "校正待ち", "writer": "タロ", "memo": "状態：校正待ち（ライター：タロ・10/3）／アカウント：A02／価格：1,480円\n     編集長へ：材料は callcenter/ の実物だけ（sales/review.md・.claude/agents/appointer.md・sv.md・list-extractor.md・tools/send_assist.py・sender.yaml.example）。\n     send_assist.py が自動で止めるのは「承認済以外は出さない」「フォームの営業お断り表記」「1日の上限」だけ。30日以内の重複は、リスト係・AP・SV が台帳で確かめる運用として書いた。「自動で防ぐ」とは書いていない\n     送信数・返信率・二重送信の件数など営業部の実数は入れていない。1日の上限の値（sender.yaml.example の初期値）も書いていない\n     「再送は1回まで・1週間以内に再送しない」は sales/review.md で「案」の扱いなので、本文でも案として書いた\n     社長確認の空欄は入れていない。根拠メモの listoru.com・lead-dynamics.com は業者の記事なので本文には使っていない（悩みの確認だけ）\n     N005（点検）・N017（現場の流れ）と重ならないよう「二重送信・お断り」に絞った。画像は build_note_images.py で作成済み（header・points・checklist）", "free": "**こんな人向け：** 複数の人や AI でフォーム営業をしている営業責任者。人数を増やしたら、同じ店に二度送ってしまわないか心配な人。\n\n**この記事でできること：** 二重送信と「営業お断り」の店への送信を防ぐ仕組みが分かります。\n使うのは、台帳1つと点検の順番です。\n\nツールで止めることと、人が見ることの分け方も分かります。\n\n**筆者がやったこと：** Claude Code で、MEO対策ツールの営業部を作りました。\nAP（アポインター＝文面を作る役）10人が、並んで文面を作っています。\n\n送信は人が行います。\n\n---\n\n## 人を増やすと、なぜ二重送信が起きるのか\n\n1人で送っているうちは、自分の記憶で防げます。\n「この店には先週送った」と覚えているからです。\n\n人や AI を増やすと、この記憶が分かれます。\n\n- Aさんの一覧と、Bさんの一覧が別になっている\n- 同じ店が、別のリストに別の名前で入っている\n- 送ったかどうかを、送った本人しか知らない\n\n二重送信は、だれか1人の不注意ではありません。\n**「送った記録」が1か所にないこと**が原因です。\n\n## 結論：台帳を1つにして、「だれが・いつ見るか」を決める\n\n私たちの営業部は、送り先も文面も送信済みも、1つの台帳に入れています。\nそのうえで、確かめる係と順番を決めています。\n\n| 確かめること | どう止めるか |\n|---|---|\n| 「営業お断り」の表記 | 人と AI が確かめる。送信補助ツールも、フォームの表記を見つけたら入力しない |\n| 1日に送る数 | 送信補助ツールが、上限で止まる |\n| 30日以内に同じ店へ送っていないか | **人（AP・SV）が台帳で確かめる。ツールでは止めていない** |\n\n正直に書くと、30日の重複は自動では止めていません。\n台帳を見る人と順番を決めて、人の目で防いでいます。\n\n「ツールで全部ブロック」の前に、やることがあります。\n**台帳を1つにして、だれが見るかを決めること**です。\n\nツールを入れても、記録が分かれていれば重複は防げません。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N103/points.png)\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 送り先・文面・送信済みを、1つの台帳に入れる\n- 「同じ店に30日以内に送らない」を、点検項目に書く\n- 「営業お断り」の店は、文面を作らず「見送り」にする\n- ツールで止めることと、人が見ることを分けて書いておく\n\n### 有料部分の目次\n1. 台帳1つの作り方（列と状態）\n2. 30日ルール：だれが、いつ台帳を見るか\n3. 「営業お断り」を何度も見る理由\n4. 送信補助ツールが止めること・止めないこと\n5. 1日の上限を決める\n6. 断られた店・返信のない店への再送（案）\n7. コピーして使える点検項目と指示文\n8. つまずきやすい点と直し方\n9. 保存用チェックリスト", "paid": "## 1. 台帳1つの作り方\n\n台帳は、CSV（表計算で開ける表）1つです。\n私たちは outbox.csv という名前にしています。\n\n列はこうしています。\n\n```\nID,店名,送る手段,送り先URL,件名,本文,AP,SV,状態,作成日,送信日時,返信日時,メモ\n```\n\n大事なのは、**文面の下書きの段階から、この台帳に入れる**ことです。\n送ったものだけを記録すると、作りかけの重複に気づけません。\n\n状態は、次のように進みます。\n\n```\n下書き → 承認済／差し戻し → 送信済 → 返信あり\n（お断り表記などで送らない店は「見送り」）\n```\n\n「見送り」も消さずに残します。\n消すと、次の人がまた同じ店に文面を作るからです。\n\n**ポイント：** 状態を変えられる人を分けています。\n\n- AP：「下書き」まで\n- SV：「承認済」「差し戻し」\n- 送った人：「送信済」\n\n## 2. 30日ルール：だれが、いつ台帳を見るか\n\n点検リストには、この1行を入れています。\n\n<!-- 画像：チェックリスト -->\n![保存用チェックリスト](../images/N103/checklist.png)\n\n```\n- [ ] 同じ店に、この30日で送っていない（outbox.csv で店名・URLを確認）\n```\n\nこの確認は、3つの場面で行います。\n\n1. **リストに入れるとき（リスト係）**\n   送り先リストと台帳を見て、すでにある店・送信済みの店を除く。\n   店名と住所、フォームの URL、Instagram で照らし合わせる\n2. **文面を作る前（AP）**\n   台帳で、同じ店に30日以内に送っていないか確かめる\n3. **点検のとき（SV）**\n   点検リストの1行として、もう一度確かめる\n\n同じことを3回見るのは、むだに見えます。\nでも、1か所で見落としても、次で止まります。\n\n**ここは自動ではありません。**\n送信補助ツールは、30日以内かどうかを見ていません。\n\nだから「最後はツールが止めてくれる」と考えないことが大事です。\n\n### 30日は、決まった正解ではない\n\n30日は、私たちが決めた間隔です。\n業界や商材で、ちょうどよい間隔は変わります。\n\n決めるときは、次の2つを考えます。\n\n- 相手が「またこの会社か」と感じない長さか\n- 断られた店や返信のない店を、どう扱うか（6章）\n\n## 3. 「営業お断り」を何度も見る理由\n\nフォームのページに「営業のご連絡はご遠慮ください」とある店があります。\n私たちは、この表記がある店には送りません。\n\nこの確認も、何度も行います。\n\n1. **リスト係**：表記がある店は、リストに入れない\n2. **AP**：送り先のページを開いて確かめる。表記があれば、文面を作らず「見送り」にし、メモに理由を書く\n3. **SV**：AP の報告をうのみにせず、自分でもページを開いて確かめる\n4. **送信補助ツール**：フォームを開いたとき、表記を見つけたら入力しない\n\n何度も見る理由は、表記の場所がばらばらだからです。\nフォームの上にある店も、ページのいちばん下にある店もあります。\n\n**ポイント：** 「お断り」の店は、文面を作る前に止めます。\n作ってから捨てるより、作らないほうが手間も事故も少ないからです。\n\n## 4. 送信補助ツールが止めること・止めないこと\n\n人がフォームに毎回入力するのは大変です。\nそこで、送信を手伝うツール（send_assist.py）を作りました。\n\nツールが**止めること**は、次の3つです。\n\n- **「承認済」以外は出さない。** 下書き・差し戻し・見送りの文面は、送る画面に出てこない\n- **フォームに「営業お断り」の表記があれば、入力しない。** 状態を「見送り」にし、見つけた表記をメモに残す\n- **1日の上限を超えたら、止まる**\n\nツールが**止めないこと**も、はっきり書いておきます。\n\n- **30日以内に同じ店へ送っていないか**は、見ていない\n- 送信ボタンは押さない。最後は人が文面を見て押す\n\nお断り表記は、決まった言い方を探して見つけます。\n\n「営業」「セールス」「勧誘」「売り込み」のあとに続く言葉を見ます。\n「お断り」「ご遠慮」「禁止」などです。\n\n言い方が違えば、ツールは見つけられません。\n**だから、ツールの前に人が見る**順番にしています。\n\n### 送ったら、すぐ台帳に書く\n\n人が送ったら、ツールが台帳の状態を「送信済」にします。\n送った日時も、同じ行に入れます。\n\nここがずれると、二重送信が起きます。\n「あとでまとめて記録」にしないことが大事です。\n\n## 5. 1日の上限を決める\n\n送信補助ツールは、設定ファイルに書いた上限で止まります。\n今日「送信済」になった数を台帳から数えて、上限に達したら止まります。\n\n上限の数は、自社で決めてください。\n決めるときは、人がきちんと文面を見て押せる数にします。\n\n**ポイント：** 上限は、二重送信の対策にもなります。\n急いで大量に送る日をなくすと、確かめる時間が残るからです。\n\n## 6. 断られた店・返信のない店への再送（案）\n\nいま、次の項目を点検リストの「案」として出しています。\nまだ正式な項目ではありません。\n\n```\n- [ ] 断られた店、返信のない店に、1週間以内に同じ内容を再送していない（再送は1回まで）\n```\n\n30日ルールは「同じ店に続けて送らない」決まりです。\nこちらは「何回まで送るか」の決まりです。\n\n台帳の状態とメモに、断られたことを残しておきます。\n残していないと、30日たったあとに、また送ってしまいます。\n\n## 7. コピーして使える点検項目と指示文\n\n### 点検リスト（重複・お断りの部分だけ）\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない（台帳で店名・URLを確認）\n- [ ] 断られた店、返信のない店に、1週間以内に同じ内容を再送していない（再送は1回まで・案）\n```\n\n### 文面を作る係（AP）への指示（該当の部分）\n\nClaude Code のサブエージェント（役ごとの AI）への指示の一部です。\nファイル名は自社に合わせて書き換えてください。\n\n```\n2. 送り先のページを確かめる。「営業お断り」などの表記があれば、文面を作らず 状態=見送り・メモに理由\n3. 台帳（outbox.csv）で、同じ店に30日以内に送っていないか確かめる\n4. 店ごとの文面を作る。店について書くのは確かめたことだけ\n5. 台帳に1行追加：ID,店名,送る手段,送り先URL,件名,本文,AP,SV,状態=下書き,作成日\n```\n\n### 点検する係（SV）への指示（該当の部分）\n\n```\n1. 台帳の自チームの「下書き」を、点検リストで1件ずつ点検\n   - 全部OK → 状態を「承認済」\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n```\n\n**書き換えるときの注意**\n- 文面を作る係に、送信の手段を持たせない\n- 「台帳を見る」を、作る係と点検する係の両方に書く\n- 台帳のファイルは1つだけ。チームごと・人ごとに分けない\n\n## 8. つまずきやすい点と直し方\n\n- **台帳がチームごとに分かれている** → 1つにまとめる。チームは「AP」「SV」の列で分ける\n- **同じ店が別の名前で入る** → 店名だけで照らし合わせない。住所・フォームの URL・Instagram でも見る\n- **フォームと Instagram で別の店扱いになる** → 送る手段が違っても、同じ店は同じ店として数える\n- **「見送り」の行を消してしまう** → 消さない。次の人への目印になる\n- **送ったあとの記録が遅れる** → 送った直後に「送信済」にする。まとめて記録しない\n- **ツールがあるから大丈夫と思う** → ツールが止めないこと（30日の重複）を、指示と点検リストに書いておく\n\n## 9. 保存用チェックリスト\n\n```\n- [ ] 送り先・下書き・送信済みを、1つの台帳に入れている\n- [ ] リストに入れる前に、台帳と照らし合わせている\n- [ ] 文面を作る前に、30日以内に送っていないか確かめている\n- [ ] 点検でも、30日以内の重複を確かめている\n- [ ] 「営業お断り」の店は、文面を作らず「見送り」にしている\n- [ ] 点検する係も、自分でページを開いて表記を確かめている\n- [ ] 「見送り」の行を消さずに残している\n- [ ] 送った直後に、台帳を「送信済」にしている\n- [ ] 1日の上限を決めている\n- [ ] ツールが止めないことを、指示と点検リストに書いている\n```\n\n---\n\n質問はコメントでどうぞ。", "chars": 4603, "asks": 0, "header": "images/N103/header.png"}, {"id": "N104", "acc": "A03", "accName": "MEO・Googleマップ集客（店舗オーナー向け）", "title": "年末年始の営業時間は11月のうちに：Googleマップの「特別営業時間」の入れ方と、通常の営業時間を書き換えないほうがよい理由", "price": 980, "status": "校正待ち", "writer": "ハナ", "memo": "状態：校正待ち（ライター：ハナ・10/3）／アカウント：A03／価格：980円\n     編集長へ：Google の説明は、公式ヘルプ「特別営業時間を設定する方法」（answer/6303076）の内容だけで書いた。この環境から support.google.com を開けず（接続がブロック）、WebSearch の要約でしか確かめていない。公開前に原文と照合する（末尾の一覧）\n     「7日以上・期間未定は臨時休業マーク」は検索の要約で 6303076 の説明として出たもの。原文で、このページの説明か別ページかを確かめる\n     「年末年始の分は11月のうちに」は Google のヘルプにはない。民間サイトの見方（根拠なし）なので、本文では筆者の考え（推測）として書いた。民間サイトは本文に使っていない\n     10/2 決定⑥どおり「業者の営業を見分ける・断る」立場で書いた。筆者が MEO ツールを扱う会社にいることは前半に明記\n     MEO の無料相談フォームの案内は入れていない（URL がまだないため。templates.md の「A03 の締め」とは違う。URL が決まったら足すか編集長が判断）\n     数字（来店・表示回数など）は入れていない。社長確認の空欄は入れていない。N018・N102 への言及もしていない（未公開のため）。画像は build_note_images.py で作成済み（header・points・checklist）", "free": "**こんな人向け：** 美容室・整骨院・飲食店などの店長やオーナー。\n年末年始の休みを、Googleマップにどう入れるか分からない人。\n\n**この記事でできること：** 「いつもと違う日」だけを入れる方法が分かります。\n使うのは、Google の「特別営業時間」です。\n\n通常の営業時間を書き換えないほうがよい理由も分かります。\n\n**筆者について：** 店舗向けに MEO のツールを案内する会社にいます。\nMEO は、Googleマップでお店を見つけてもらう工夫のことです。\n\nこの記事では、業者に頼まなくても、お店の人が自分でできることを書きます。\n\n---\n\n## 年末年始、マップの営業時間で困ること\n\n年末年始は、休む日や短く営業する日が出ます。\nでも Googleマップには、いつもの営業時間が出たままになりがちです。\n\nお客さんから見ると、こうなります。\n\n- マップで「営業中」と出ていたのに、行ったら閉まっていた\n- 休みだと思って来なかったのに、実は開いていた\n\nどちらも、お客さんは悪くありません。\nマップの情報を信じて動いただけです。\n\n## 結論：通常の営業時間は変えず、「特別営業時間」で日付ごとに入れる\n\nGoogle の公式ヘルプに、「特別営業時間」という設定があります。\n祝休日やイベントなど、一時的に営業時間が変わる日のための設定です。\n\n出典：[特別営業時間を設定する方法](https://support.google.com/business/answer/6303076?hl=ja)\n\nポイントは3つです。\n\n1. **いつもの営業時間はそのまま。** 違う日だけを、日付ごとに入れる\n2. **休む日は「休業」、短くする日は時間を入れる**\n3. **祝日は、いつもどおり営業する日でも入れる。** 公式ヘルプでは、通常と同じでも設定することがすすめられています\n\n### いつまでに入れるか（筆者の考え）\n\nGoogle のヘルプに、「何日前までに」という決まりは見当たりません。\n（筆者が確かめた範囲です）\n\n筆者は、年末年始の分は**11月のうちに入れておく**のがよいと考えています。\n\n理由は、12月はお店が忙しく、後回しになりやすいからです。\n休みの日が決まったら、その日のうちに入れるのがおすすめです。\n\nこれは筆者の考え（推測）で、Google が決めた期限ではありません。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N104/points.png)\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 年末年始は、通常の営業時間を書き換えない\n- 違う日だけを「特別営業時間」で、日付ごとに入れる\n- 祝日は、いつもどおりの営業でも入れておく\n- 休みが決まったら、早めに入れる（筆者は11月中をおすすめ）\n\n### 有料部分の目次\n1. 特別営業時間の入れ方（手順）\n2. 年末年始の入れ方の例（休む日・短くする日・いつもどおりの日）\n3. 長く休むときは「臨時休業」を使う\n4. 特別営業時間が出ないときに確かめること\n5. 通常の営業時間を書き換えないほうがよい理由\n6. 11月に書き込んでおく年末年始の表\n7. この時期の「営業時間の代行」の連絡の見分け方・断り方\n8. 保存用チェックリスト", "paid": "## 1. 特別営業時間の入れ方\n\n公式ヘルプ（[特別営業時間を設定する方法](https://support.google.com/business/answer/6303076?hl=ja)）で案内されている流れです。\n画面の言葉は変わることがあるので、公式ヘルプも一緒に見てください。\n\n1. 自分のお店のビジネス プロフィールを開く\n2. 「プロフィールを編集」→「営業時間」を選ぶ\n3. 「特別営業時間」の横の編集（えんぴつの印）を押す\n4. 日付を選ぶ。Google が出す日付を確かめるか、新しい日付を足す\n5. その日の営業時間を入れる（下の表）\n6. 保存する\n\n| その日 | 入れ方 |\n|---|---|\n| 営業する（時間が違う） | 「休業」のチェックを外し、開始と終了の時間を入れる |\n| 休む | 「休業」にチェックを入れる |\n\n**ポイント：** Google が祝日などの日付を出してくれることがあります。\n出てきた日付も、自分のお店の予定と合っているか1つずつ確かめます。\n\n## 2. 年末年始の入れ方の例\n\n年末年始は、日によって入れ方が変わります。\n自分のお店の予定に置きかえて使ってください。\n\n| 日付の例 | お店の予定 | 特別営業時間の入れ方 |\n|---|---|---|\n| 12月30日 | 短くする | 「休業」を外し、短い時間を入れる |\n| 12月31日 | 休む | 「休業」にチェック |\n| 1月1日 | 休む | 「休業」にチェック |\n| 1月2日 | 休む | 「休業」にチェック |\n| 1月3日 | 休む | 「休業」にチェック |\n| 1月4日 | いつもどおり | いつもの時間をそのまま入れる |\n\nいつもどおりの日も入れると、「本当に開いている」と伝わります。\n公式ヘルプでも、祝日は通常と同じでも入れるようすすめています。\n\n**注意：** 上の日付は、入れ方の例です。\n休みの日は、お店ごとに決めてください。\n\n## 3. 長く休むときは「臨時休業」を使う\n\n公式ヘルプでは、特別営業時間は**連続して最長6日間の休業**までの設定です。\n\n7日以上続けて休むとき、いつまで休むか未定のときは違います。\n「臨時休業」のマークを付けるよう案内されています。\n\n| 休む長さ | 使う設定 |\n|---|---|\n| 6日以内 | 特別営業時間（日付ごとに「休業」） |\n| 7日以上・いつまでか未定 | 臨時休業 |\n\n年末年始に長めに休むお店は、休む日数を先に数えてから選んでください。\n\n## 4. 特別営業時間が出ないときに確かめること\n\n特別営業時間を出すには、営業時間の設定に条件があります。\n**「決まった営業時間で営業している」**を選んでおく必要がある、と公式ヘルプにあります。\n\n入れたのに出ないときは、まずここを確かめます。\n\n1. 「プロフィールを編集」→「営業時間」を開く\n2. 「決まった営業時間で営業している」になっているか見る\n3. なっていなければ選び、いつもの営業時間を入れる\n\n## 5. 通常の営業時間を書き換えないほうがよい理由\n\n年末年始だけのために、いつもの営業時間を書き換えるお店もあります。\n筆者は、これはおすすめしません。\n\n理由は、次の3つです（公式ヘルプの説明をもとにした、筆者の考えです）。\n\n- **戻し忘れる。** 年が明けて忙しいと、元に戻すのを忘れやすい。戻し忘れると、1月からずっと違う時間が出る\n- **日付ごとに入れられない。** いつもの営業時間は曜日ごとの設定。「12月31日だけ休み」は、特別営業時間のほうが入れやすい\n- **Google の説明に合っている。** 公式ヘルプでは、一時的な変更には特別営業時間を使うと案内されている\n\n特別営業時間は、日付ごとの設定です。\nいつもの営業時間には手を付けないので、あとで戻す作業がいりません。\n\n## 6. 11月に書き込んでおく年末年始の表\n\n休みの予定が決まったら、この表を埋めてから入力すると迷いません。\n紙に書いても、スマホのメモに写しても使えます。\n\n```\n| 日付 | 営業する／休む | 営業時間（営業する日だけ） | Googleに入れた |\n|------|---------------|--------------------------|---------------|\n| 12/  |               |                          |               |\n| 12/  |               |                          |               |\n| 12/  |               |                          |               |\n| 1/   |               |                          |               |\n| 1/   |               |                          |               |\n| 1/   |               |                          |               |\n```\n\n**ポイント：** 「Googleに入れた」の列に印を付けます。\n入れ忘れの日が、ひと目で分かります。\n\nあわせて、貼り紙・ホームページ・予約サイトの予定も見くらべます。\n\n場所によって予定が違うと、お客さんがどれを信じていいか迷うからです。\n\n## 7. この時期の「営業時間の代行」の連絡の見分け方・断り方\n\n「営業時間の設定を代わりにやります」という連絡が来たときの話です。\n筆者も MEO のツールを扱う側ですが、だからこそ書いておきます。\n\n**特別営業時間は、お店の人が自分の管理画面から入れられます。**\n手順は、この記事の1章と公式ヘルプにあるとおりです。\n\n### 見分けるときに見るところ\n\n- 「入れないと表示されなくなる」など、不安をあおる言い方をしていないか\n- その場で契約や支払いを決めさせようとしていないか\n- 何をするのか、自分で確かめられる説明があるか\n\n当てはまるときは、その場で決めずに、まず自分の管理画面を開いて確かめてください。\n\n### 断るときの一言（そのまま使えます）\n\n```\n営業時間は自分で設定しますので、今回はけっこうです。\n今後のご連絡も不要です。\n```\n\nフォームやメールなら、この2行を返すだけで大丈夫です。\n理由をくわしく説明する必要はありません。\n\n## 8. 保存用チェックリスト\n\n<!-- 画像：チェックリスト -->\n![保存用チェックリスト](../images/N104/checklist.png)\n\n```\n- [ ] 年末年始の休み・短縮営業の日を決めた\n- [ ] 6日以内か、7日以上かを数えた（7日以上は臨時休業）\n- [ ] 通常の営業時間は書き換えていない\n- [ ] 違う日を「特別営業時間」で日付ごとに入れた\n- [ ] 祝日など、いつもどおりの日も入れた\n- [ ] Google が出した日付も、自分の予定と合っているか確かめた\n- [ ] 「決まった営業時間で営業している」になっている\n- [ ] 貼り紙・ホームページ・予約サイトの予定と同じにした\n- [ ] 代行の連絡には、その場で決めずに自分で確かめた\n```\n\n---\n\n質問はコメントでどうぞ。\n\n---\n\n### 公開前に原文を確認する Google ヘルプ\n**原文未確認**（この環境から support.google.com を開けず、WebSearch の検索結果の要約でしか確かめていない）\n- 特別営業時間を設定する方法：https://support.google.com/business/answer/6303076?hl=ja（原文未確認）\n  - 確かめること：手順（プロフィールを編集 → 営業時間 → 特別営業時間の横の編集 → 日付 → 休業／時間）・画面の言葉\n  - 確かめること：「連続して最長6日間の休業まで」「7日以上・期間未定は臨時休業マーク」がこのページの説明か\n  - 確かめること：「祝日は通常と同じでも設定をすすめる」\n  - 確かめること：「表示には『決まった営業時間で営業している』が必要」\n  - 確かめること：「いつまでに入れる」の記載がないこと（本文の「11月中」は筆者の推測として書いた）\n（この一覧は公開前に消す）", "chars": 4265, "asks": 0, "header": "images/N104/header.png"}, {"id": "N204", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "秋の部屋探しで申込をやめたくなったら：申込金（預り金）が返ってくる決まりと、「その部屋はもう決まりました」が続くときに確かめること", "price": 0, "status": "校正待ち", "writer": "アオイ", "memo": "状態：校正待ち（ライター：アオイ・10/3）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/3）＋直した点：①預り金の決まりは「不動産会社（宅建業者）は」と主語を足し、検索結果（Lawzilla・国交省事例集・不動産適正取引推進機構の賃貸の相談事例 No.15・複数の解説）で第16条の12第2号の内容と賃貸の申込にも使われることを確認。条番号は本文に書かないまま ②「名目が手付金など」は、手付金は契約のときのお金で意味が違い誤解を招くため「申込証拠金など、ほかの呼び方」に直した ③出典のない「秋は物件を比べながら動く人が多い時期」を削り、「秋も、人気の部屋は早く決まります」を「早く決まることがあります」に弱めた ④おとり広告はガイドラインの言い方（成約済みの物件を速やかに削除せず掲載し続ける）に合わせた。申込→審査→重要事項の説明→契約の流れは「一般には」で言い過ぎではない。仲介手数料無料は条件の一文とセット、宅建業法（提携先をご紹介・仲介は提携先）・紹介料の表示・?src=N204・ng-words は問題なし。【社長確認】は既存の3つのまま。公式ページはジンの環境からも開けず WebSearch の検索結果で確認（原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：出典はすべてリサーチメモ（カナデ・10/3）の検索結果の要約で、原文未確認。施行規則の条番号は本文に書かず、確認リストにだけ置いた（e-Gov 法令検索の原文で確かめてほしい）\n     「申込はまだ契約ではない」とは言い切らず、「申込のあと、契約の前」という段階の言い方にした。申込から契約までの流れは「一般には」とした\n     おとり物件の割合などの数字は書いていない。不動産会社を悪く言わず、「確かめ方」と「本当に決まることもある」に寄せた\n     N011（手数料の仕組み）・N012（内見と申込の前）・N201（解約予告とプロパン）と重ねず、「申込のあと〜契約の前」に絞った\n     仲介手数料無料は締めのお部屋探しの案内だけで、「条件は物件によって違うため、ご相談のときにご説明します」とセット。【社長確認】は3種類だけ\n     画像（見出し・ポイント図など）は入れていない（センター長が tools/build_note_images.py で作る）", "free": "**こんな人向け：** 10〜11月に関東で部屋を探している人。申込をしたけれど、迷い始めた人。\n\n**この記事で分かること：** 申込をやめたいときの伝え方と、預り金の扱い。「もう決まりました」が続くときの確かめ方。\n\n**結論：** やめると決めたら、すぐ申込先に伝えて記録を残します。お金を払うときは、名目と返す条件を書面で確かめます。\n\n---\n\n## 申込のあと、契約の前に起きること\n\n一般には、申込のあとに審査があります。そのあと、重要事項の説明と契約に進みます。\n\n申込のあとで、別の部屋が気になることもあります。\n\n迷ったまま進めると、話がどんどん進みます。やめるかどうかは、契約の前に決めておきます。\n\n## 1. 申込をやめたくなったら\n\n### 預り金についての決まり\n\n申込のときに、お金を預けることがあります。「申込金」「預り金」などと呼ばれます。\n\n宅地建物取引業法の施行規則に、決まりがあるとされています。\n申込みを撤回した人に、不動産会社は預り金の返還を拒めない、という内容です。\n\n国土交通省の相談対応事例集にも、賃貸の申込と預り金の事例が載っています。くわしい言い回しは、国の原文で確かめてください。\n\n### やめるときの伝え方\n\n- **早めに伝える**：迷いが決まったら、その日のうちに\n- **申込先に伝える**：申込をした不動産会社の担当者に\n- **記録を残す**：電話のあとにメールでも送っておく\n- **返し方を聞く**：預り金を返す日と方法を確かめる\n\n伝えるときに、理由をくわしく話す必要はありません。「申込を取り下げます」と、はっきり伝えます。\n\n### 預り金の受取書は残しておく\n\nお金を払ったら、受取書（領収書など）をもらいます。返してもらうまで、捨てずに持っておきます。\n\n「申込証拠金」など、ほかの呼び方のこともあります。名前の意味が分からないときは、払う前に聞いておきます。\n\n## 2. お金を払う前に確かめること\n\n### 名目と、返す条件\n\n申込のときにお金を求められたら、まず名目を聞きます。そのお金を、どんなときに返すのかも聞きます。\n\n口で聞いただけだと、あとで食い違うことがあります。メールや書面で、答えを残してもらいます。\n\n### 確かめる3つのこと\n\n- 何のためのお金か（名目）\n- やめたとき、返してもらえるか\n- 返すときの日にちと方法\n\n## 3. 「その部屋はもう決まりました」が続くとき\n\n### 本当に決まることもある\n\n人気の部屋は、早く決まることがあります。問い合わせの前に、ほかの人が申し込むこともあります。\n\n一度決まったと言われたら、次の候補に目を向けます。\n\n### 何度も続くときに見ること\n\n不動産公正取引協議会連合会は、「おとり広告」のガイドラインを出しています。\n成約済みの物件を、すぐに広告から消さずに出し続ける。これは、おとり広告に当たるとされています。\n\n何度も続くときは、次のことを確かめてみてください。\n\n- **掲載日・更新日**：ずっと前から出ている広告ではないか\n- **内見の予定**：「今週、内見できますか」と具体的に聞く\n- **ほかのサイト**：同じ部屋が、ほかでどう出ているか\n- **すすめられた部屋**：元の部屋の状況も、あわせて聞く\n\n確かめるのは、相手を疑うためではありません。自分に合う部屋を、落ち着いて選ぶためです。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N204/points.png)\n\n## この記事のポイント\n\n- 申込のあと、契約の前にやめるかどうかを決める\n- やめるときは、すぐ申込先に伝えて記録を残す\n- お金を払う前に、名目と返す条件を書面で聞く\n- 「もう決まりました」が続くときは、掲載日を見る\n\n## チェックリスト：申込のあと、契約の前に\n\n- [ ] 申込のときに払ったお金の名目を確かめた\n- [ ] やめたときに返してもらえるかを聞いた\n- [ ] 答えをメールや書面で残してもらった\n- [ ] 受取書（領収書など）を保管した\n- [ ] やめるなら、申込先に早めに伝えた\n- [ ] 電話で伝えたあと、メールでも送った\n- [ ] 預り金を返す日と方法を確かめた\n- [ ] 気になる物件の掲載日・更新日を見た\n\n## よくある失敗\n\n**1. 迷ったまま、返事をのばす**\n\n決めきれずに、連絡をしないでおく例です。話が進む前に、やめるなら早めに伝えます。\n\n**2. 名目を聞かずにお金を払う**\n\nあとで「これは返せません」と言われる例です。払う前に名目と返す条件を聞き、書面で残します。\n\n**3. 「決まりました」をそのまま受け取り続ける**\n\n同じことが何度も続くのに、確かめない例です。掲載日を見て、内見の予定を具体的に聞きます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n申込を迷っているときは、まるっと窓口（筆者の会社）にご相談ください。部屋探しの進め方から、一緒に考えます。\n\nお部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】\n\n仲介手数料を無料にできる物件もあります。条件は物件によって違うため、ご相談のときにご説明します。\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- お部屋探し（提携する不動産会社をご紹介）\n- 電気・ガス・水道の手続き\n- インターネット回線（新居で使える回線をご案内）\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N204)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべてリサーチメモ・10/3 の検索結果の要約。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 宅地建物取引業法施行規則 第16条の12第2号（申込みの撤回のとき、受け取った預り金の返還を拒むことの禁止）：民間の法令データベース https://lawzilla.jp/law/332M50004000012?n=ln16_11.1&mode=only 【原文未確認】（e-Gov 法令検索の原文で条番号・号・言い回しを確かめる。本文には条番号を書いていない）\n- 国土交通省「民間賃貸住宅に関する相談対応事例集（再改訂版・令和4年3月）」https://www.mlit.go.jp/jutakukentiku/house/content/001493363.pdf ：賃貸の申込・預り金の事例【原文未確認】\n- 不動産公正取引協議会連合会「おとり広告ガイドライン」https://www.rftc.jp/webkanri/kanri/wp-content/uploads/2019/11/20191106-otori-guideline.pdf ：成約済みの物件を広告し続けることはおとり広告に当たる【原文未確認】\n- 使っていない話：民間記事にあるおとり物件の割合の数字（原文未確認のため）\n- ジンの確認（10/3・WebSearch の検索結果。公式ページはジンの環境からも開けず）：第16条の12第2号の内容は Lawzilla と複数の解説で一致。賃貸の申込の事例として 不動産適正取引推進機構「相談事例 No.15 賃貸借の申込みを撤回したにもかかわらず、預り金の返還を拒否された」https://www.otc.or.jp/page/mmg/pdf/no15.pdf 【原文未確認】。おとり広告はガイドラインの要約「成約済みの物件を速やかに広告から削除せずに掲載すること」で確認【原文未確認】\n\n**ジンに確かめてほしいこと**\n- [ ] 「申込みを撤回した人に、預り金を返すのを拒んではいけない」が施行規則の原文の範囲に合っているか（賃貸の申込にも当てはまる書き方でよいか）\n- [ ] 「一般には、申込のあとに審査、そのあと重要事項の説明と契約」の流れの書き方が言い過ぎでないか\n-
