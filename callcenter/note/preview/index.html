約するなら、解約金・工事費の残り・撤去工事の3つを先に聞きます。\n\n---\n\n## なぜ「今の部屋の回線」を先に考えるのか\n\n引越しでは、新居の回線に目が向きがちです。でも、今の部屋の回線も片づける必要があります。\n\n移転か解約かで、手続きもお金も変わります。決めてから動くと、二度手間が少なくなります。\n\n## 1. 「移転」か「解約」かを決める\n\n### 移転：同じ契約先で新居に移す\n\n今の回線会社のまま、新居で使い続ける方法です。新居で同じ回線が使えることが前提になります。\n\n建物やエリアによって、使えない回線があります。新居の住所で使えるかを、契約先に確かめます。\n\n### 解約：今の回線をやめる\n\n新居で使えないときや、別の回線にしたいときの方法です。新居の回線は、別に申し込みます。\n\n解約するときは、お金がかかるかを先に確かめます。次の章の3つです。\n\n### 決めるときに見ること\n\n- 新居の住所で、今の回線が使えるか\n- 移転の手続きと、新居での工事が要るか\n- 解約したとき、どんなお金がかかるか\n- 新居の建物に、入っている回線があるか\n\n## 2. 解約の前に確かめる3つのこと\n\n### ① 解約金（期間の決まりがある契約）\n\n「2年契約」など、期間の決まりがある契約があります。期間の途中でやめると、解約金がかかることがあります。\n\n総務省の消費者保護ルールに、解約金の上限があるとされています。\n2022年7月からで、月額料金に当たる額が上限、という内容です。\n\nそれより前からの契約には、当てはまらない場合があるとされています。自分の解約金がいくらかは、契約先に確かめます。\n\n### ② 工事費の残り\n\n始めたときの工事費を、毎月分けて払っていることがあります。途中でやめると、残りを請求される場合があります。\n\n総務省のQ&Aでも、期間に応じて減った残りを請求される場合があるとされています。残りがいくらかは、契約先に聞きます。\n\n### ③ 撤去工事と、機器の返却\n\n回線によっては、やめるときに撤去の工事が要ることがあります。立会いが要るかも、あわせて聞いておきます。\n\nルーターなどの機器を、借りていることもあります。返し方と、返す期限を確かめます。\n\n## 3. 解約の日の決め方\n\n今の部屋の回線を、いつまで使うかを決めます。新居の回線が使えるようになる日も、見ておきます。\n\n撤去工事が要るときは、退去の日より前に日を決めます。解約の日は、契約先と相談して決めます。\n\n## 4. ウォーターサーバーも、今の契約を確かめる\n\nウォーターサーバーを使っている人は、今の契約先に聞きます。引越しのときの手続きは、会社や契約で違います。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N205/points.png)\n\n## この記事のポイント\n\n- 新居で今の回線が使えるかを、まず確かめる\n- 解約金には、総務省のルールで上限があるとされている\n- 工事費の残りと撤去工事は、契約先に聞く\n- 撤去工事が要るなら、退去の日より前に日を決める\n\n## チェックリスト：今の部屋の回線\n\n- [ ] 今の回線の契約先と、契約の内容を確かめた\n- [ ] 新居の住所で、今の回線が使えるか聞いた\n- [ ] 移転か解約かを決めた\n- [ ] 解約金がかかるか、いくらかを聞いた\n- [ ] 工事費の残りがあるか、いくらかを聞いた\n- [ ] 撤去工事が要るか、立会いが要るかを聞いた\n- [ ] 借りている機器の返し方と期限を確かめた\n- [ ] ウォーターサーバーの引越しの手続きを確かめた\n\n## よくある失敗\n\n**1. 新居の回線だけ申し込んで、今の回線を忘れる**\n\n新居の準備に気をとられる例です。今の回線をどうするかも、自分で契約先に伝えます。\n\n**2. 工事費の残りを知らずに解約する**\n\n解約金だけを見て、工事費の残りを見落とす例です。解約の前に、両方の金額を契約先に聞きます。\n\n**3. 撤去工事の日が、退去に間に合わない**\n\n撤去工事が要ると、あとで知る例です。解約を伝えるときに、工事が要るかを一緒に聞きます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n新居の回線選びに迷ったら、まるっと窓口（筆者の会社）にご相談ください。フレッツ光・ドコモ光・auひかり・ソフトバンク光などからご案内します。\n\n建物やエリアによって、使えない回線があります。新居で使える回線をお伝えします。\n\n関東1都6県では「でんき開通サポート」もあります。新居の電気の使用開始のお申し込みを取り次ぎます。\n電力会社などの公式窓口ではなく、民間の取次サービスです。\n\nお部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- インターネット回線（新居で使える回線をご案内）\n- ウォーターサーバー\n- 電気・ガス・水道の手続き\n- お部屋探し（提携する不動産会社をご紹介）\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N205)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべてリサーチメモ・10/3 の検索結果の要約。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 総務省 電気通信消費者情報コーナー「消費者保護ルール」https://www.soumu.go.jp/main_sosiki/joho_tsusin/d_syohi/shohi.htm ：2022年7月1日施行、期間拘束の解約金は月額料金相当額が上限、遅滞なく解約できる措置の義務化【原文未確認】\n- 総務省「改正電気通信事業法施行規則に関するQ&A（令和4年7月1日最終改正）」https://www.soumu.go.jp/main_content/000824364.pdf ：工事費は契約期間に応じて減った残りを請求される場合がある【原文未確認】\n- 推測の扱い：上限ルールが施行日より前の契約に当てはまらない場合があるか（リサーチでも推測）。本文では「契約によります。契約先に確かめます」とだけ書いた\n- ジンの確認（10/3・WebSearch の検索結果。総務省のページはジンの環境からも開けず）：総務省資料「消費者保護ルールの現状と課題（令和5年11月）」https://www.soumu.go.jp/main_content/000914681.pdf ・同「電気通信事業法第27条の3の施行状況の検討（2022年10月）」https://www.soumu.go.jp/main_content/000842225.pdf の要約で、上限は「一月当たりの料金に相当する額」、2022年7月1日時点の既往契約（その更新を含む）には当分の間適用しない経過措置、と確認【原文未確認】\n- 出典なし（一般論）：撤去工事・機器の返却が要る場合がある／ウォーターサーバーの引越し手続きは会社や契約で違う。金額・日数は書いていない\n\n**ジンに確かめてほしいこと**\n- [ ] 「2022年7月から解約金に上限」「月額料金に当たる額が上限」が総務省の原文の言い回し・対象（光回線を含むか）に合っているか\n- [ ] 「ルールの前からの契約に当てはまるかは、契約によります」で言い過ぎ・言い足りなくないか（原文に経過措置の記載があれば、その言い方に直す）\n- [ ] 工事費の残りの書き方が Q&A の範囲に合っているか\n- [ ] 撤去工事・機器の返却の一般論が、出典なしで書いてよい範囲か\n\n**【社長確認】**\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] 法律・ルールは公式の出典つき（原文未確認はジンが確認・上限は断定していない）\n- [x] 「仲介手数料無料」は書いていない（この記事のテーマ外）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーンを書いていない（解約金・工事費・撤去費の金額なし）\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N205\n- [x] ng-words なし。不安をあおっていない\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/3）\n- [x] 出典が1つだけの話は断定していない（施行前の契約の扱い）\n- [ ] 画像・ハッシュタグ（センター長が作る）", "paid": "", "chars": 3642, "asks": 5, "header": "images/N205/header.png"}, {"id": "N206", "acc": "A11", "accName": "引越し・新生活（本業のサービス紹介につなぐ）", "title": "年内の引越しで粗大ごみが間に合わない…を防ぐ：区への申込・家電4品目（エアコン・テレビ・冷蔵庫・洗濯機）の出し方・無許可の回収業者に頼まない", "price": 0, "status": "校正待ち", "writer": "サヤ", "memo": "状態：校正待ち（ライター：サヤ・10/3）／アカウント：A11／価格：無料\n     制度確認：済（ジン・10/3）＋直した点：①「その週に申し込めば足りる」と読める言い方（結論・ポイント・よくある失敗）を「日が決まったら、すぐに」に直した ②出典が大田区だけなので「大田区などは」を「大田区は」にした ③家電4品目を「冷蔵庫・冷凍庫」「洗濯機・衣類乾燥機」と経産省の言い方にそろえ「など」を消した ④出し先に、経産省の案内どおり「買った店が分からないときは市区町村の案内で」を足し、料金はリサイクル料金と収集運搬料金の2つとした ⑤許可は環境省の言い方（市区町村の一般廃棄物処理業の許可・市区町村の委託）に合わせた ⑥出典のない「持ち込みができる区もある」「退去のあとは出せなくなることがある」「区の粗大ごみでは出せない例が多い」を削るか弱めた。日数・手数料・リサイクル料金の断定なし。宅建業法（提携先をご紹介）・紹介料の表示・?src=N206・ng-words は問題なし。【社長確認】は既存の3つのまま。公式ページはジンの環境からも開けず WebSearch の検索結果で確認（原文未確認の出典は社長が公開前に確認）\n     編集長・ジンへ：環境省・経産省・東京都環境局・大田区のページは作業環境から開けず、出典はリサーチメモ（カナデ・10/3）の検索結果の要約だけ（確認リストはすべて「原文未確認」）\n     収集までの日数・粗大ごみの手数料・リサイクル料金は書いていない（区ごと・品目ごとに違うため、区のページで確かめるよう案内した）\n     回収業者をひとまとめに「違法」とは書かず、公式の呼びかけ（無許可の回収業者を利用しない・家庭のごみは市区町村のルールで）の言い方に合わせた\n     N010（全体チェックリスト）・N015（見積もり）・N203（転入後の住所変更）と重ねず、「旧居の不用品の処分」に絞った\n     締めは N201 と同じ形（提携する不動産会社をご紹介＋【社長確認】3種類だけ）。仲介手数料無料はこの記事のテーマ外なので書いていない\n     画像（見出し・ポイント図・流れの図解など）は入れていない（センター長が tools/build_note_images.py で作る）", "free": "**こんな人向け：** 10〜12月に関東で引越す人。今の部屋の家具や家電を処分したい人。\n\n**この記事で分かること：** 粗大ごみを申し込む時期と、家電4品目の出し方。回収業者に頼む前に知っておくこと。\n\n**結論：** 引越しの日が決まったら、すぐに区の粗大ごみを申し込みます。家電4品目は粗大ごみとは別の出し方なので、先に行き先を決めます。\n\n---\n\n## なぜ早めに申し込むのか\n\n粗大ごみは、申し込んだ日にすぐ出せるとは限りません。収集の日が決まるまで、待つことがあります。\n\n大田区は、引越しの多い時期や年末年始は時間がかかると案内しています。だから、日が決まったら早めに申し込みます。\n\nかかる日数は、区によって違います。住んでいる区のページで確かめてください。\n\n## 1. 処分するものを3つに分ける\n\nまず、捨てるものを書き出します。そのうえで、次の3つに分けます。\n\n- **粗大ごみ**：家具・寝具・自転車など（区のルールで決まる）\n- **家電4品目**：エアコン・テレビ・冷蔵庫（冷凍庫）・洗濯機（衣類乾燥機）\n- **ふだんのごみ**：区の分け方どおりに出せるもの\n\n何が粗大ごみに当たるかは、区のルールで決まります。迷うものは、区のページで品目を調べます。\n\n## 2. 区の粗大ごみに申し込む\n\n### 申し込む前に確かめること\n\n- 申込の方法（電話・インターネットなど）\n- 手数料の払い方\n- 収集の日と、出す場所・時間\n- 引越しの日より前に収集できるか\n\n### 収集の日は、引越しの前に\n\n収集の日は、今の部屋にいるうちにします。\n\n収集の日が引越しより後になりそうなときは、区に相談します。ほかの出し方があるかも、区のページで確かめます。\n\n## 3. 家電4品目は、粗大ごみとは別に出す\n\n### 4品目とは\n\n家電リサイクル法の対象になる家電です。経済産業省は、次の4つとしています。\n\n- エアコン\n- テレビ\n- 冷蔵庫・冷凍庫\n- 洗濯機・衣類乾燥機\n\n### 出す先\n\n経済産業省のQ&Aでは、出す先として次のような所が挙げられています。\n\n- **買い替える店**：新しい家電を買う店に、引き取りを頼む\n- **買った店**：今の家電を買った店に頼む\n- **指定引取場所**：自分で持ち込む\n\n買った店が分からないときは、住んでいる市区町村の案内に従います。\n\nお金は、リサイクル料金と、運んでもらう収集運搬料金がかかります。金額は品目や店で違うので、出す前に確かめてください。\n\n## 4. 回収業者に頼む前に\n\n### 公式の呼びかけ\n\n環境省は、無許可の回収業者を利用しないよう呼びかけています。東京都環境局も、同じように注意を呼びかけています。\n\n家庭のごみは、市区町村が案内するルールで処分します。市区町村の許可や委託のない業者は、家庭のごみを集められないとされています。\n\n### 頼む前に見ること\n\n- 区のページで、ごみの出し方を確かめたか\n- 家電4品目は、決まった出し先に出せるか\n- 相手が、市区町村の許可か委託を受けているか\n\n迷ったときは、区の清掃の窓口に聞いてみてください。\n\n<!-- 画像：ポイント -->\n![この記事のポイント](../images/N206/points.png)\n\n## この記事のポイント\n\n- 引越しの日が決まったら、すぐに粗大ごみを申し込む\n- 収集の日は、今の部屋にいるうちにする\n- 家電4品目は、粗大ごみとは別の出し方\n- 無許可の回収業者は利用しない\n\n## チェックリスト：今の部屋の不用品\n\n- [ ] 処分するものを書き出した\n- [ ] 粗大ごみ・家電4品目・ふだんのごみに分けた\n- [ ] 区のページで、粗大ごみの申込方法を確かめた\n- [ ] 粗大ごみを申し込み、収集の日を決めた\n- [ ] 収集の日が、引越しの日より前か確かめた\n- [ ] 家電4品目の出し先（店・指定引取場所）を決めた\n- [ ] リサイクルの料金を、店や公式の案内で確かめた\n- [ ] 回収業者に頼むなら、市区町村の許可か委託があるか確かめた\n\n## よくある失敗\n\n**1. 引越しの直前に申し込む**\n\n収集の日が、退去のあとになる例です。日が決まったら、すぐに申し込みます。\n\n**2. 冷蔵庫や洗濯機を粗大ごみで出そうとする**\n\n家電4品目は、粗大ごみとは別の出し方です。買い替える店か買った店に、先に相談します。\n\n**3. 確かめずに回収業者に頼む**\n\nすぐ来てくれるからと、そのまま頼む例です。区のルールと、許可や委託があるかを先に確かめます。\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n引越し業者選びに迷ったら、まるっと窓口（筆者の会社）にご相談ください。関東の引越し業者をご紹介しています。\n\nお部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います）【社長確認：提携先の不動産会社名と宅建業の免許番号】\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n- 関東の引越し業者のご紹介\n- お部屋探し（提携する不動産会社をご紹介）\n- 電気・ガス・水道の手続き\n- インターネット回線（新居で使える回線をご案内）\n- ウォーターサーバー\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。【社長確認：書き方】\n\n▶ [引越しの無料相談フォーム](https://【社長確認：引越し相談フォームのURL】?src=N206)\n\n---\n\n## 確認リスト（公開前に消す）\n\n**出典（すべてリサーチメモ・10/3 の検索結果の要約。公式ページの本文は作業環境から開けず＝原文未確認。ジンが原文で確かめる）**\n- 環境省 チラシ「廃棄物の処分に無許可の回収業者を利用しないでください」https://www.env.go.jp/recycle/kaden/tv-recycle/attach/ad_tool26-01.pdf 【原文未確認】\n- 東京都環境局 不用品の回収の注意 https://www.kankyo.metro.tokyo.lg.jp/resource/industrial_waste/improper_handling/fuyouhin ：無許可の回収業者に頼まない、家庭のごみは市区町村のルールで【原文未確認】\n- 経済産業省 家電リサイクル法 Q&A https://www.meti.go.jp/policy/it_policy/kaden_recycle/case1/case1_04.html ：家電4品目（エアコン・テレビ・冷蔵庫/冷凍庫・洗濯機/衣類乾燥機）は買い替え先・購入した店・指定引取場所へ【原文未確認】\n- 大田区「引越しを予定されている皆様へ」https://www.city.ota.tokyo.jp/seikatsu/gomi/shigentogomi/hikkoshi-no-gomi.html ：引越しの多い時期・年末年始は収集日まで時間がかかるので早めに【原文未確認】（品川区なども同様の案内とリサーチメモにあるが、URL は大田区だけ）\n- 書いていないこと：収集までの日数・粗大ごみの手数料・リサイクル料金（区ごと・品目ごとに違うため）\n- 出典なし（一般論）：「区の清掃の窓口に聞く」（ジンが「持ち込みができる区もある」「退去のあとは出せなくなることがある」「区の粗大ごみでは出せない例が多い」は削った・弱めた）\n- ジンの確認（10/3・WebSearch の検索結果。公式ページはジンの環境からも開けず）：環境省 Q&A https://www.env.go.jp/recycle/kaden/tv-recycle/qa.html の要約で「市区町村の一般廃棄物処理業の許可なく、または市区町村の委託を受けずに回収する業者が無許可」と確認。経産省「使い終えた家電製品、どうしたらいいの？」https://www.meti.go.jp/policy/it_policy/kaden_recycle/katei/case/case_01.html の要約で、買い替えは新しく買う店・処分だけは買った店・買った店が分からないときは市町村の案内、費用はリサイクル料金と収集運搬料金、と確認【原文未確認】\n\n**ジンに確かめてほしいこと**\n- [ ] 家電4品目の出し先の書き方（「次のような所」）が経産省 Q&A の範囲に合っているか。買った店が分からないときの案内（市区町村）の言い方\n- [ ] 「家電4品目は、区の粗大ごみでは出せない例が多い」が言い過ぎでないか\n- [ ] 「回収を頼む相手が、許可を持っているか」の確かめ方が、環境省・東京都の言い回しに合っているか（どの許可かを書くべきか）\n- [ ] 「持ち込みができる区もある」は出典なし。残すか消すか\n\n**【社長確認】**\n- 提携先の不動産会社名と宅建業の免許番号\n- 紹介料についての書き方\n- 引越し相談フォームの URL\n\n**点検（moving/review.md）**\n- [x] 役所の手続き・ルールは公式の出典つき（原文未確認はジンが確認・日数と料金は書いていない）\n- [x] 「仲介手数料無料」は書いていない（この記事のテーマ外）\n- [x] 物件の紹介は「提携する不動産会社をご紹介」、会社名・免許番号は【社長確認】\n- [x] 他社の料金・キャンペーンを書いていない。回収業者をひとまとめに断定していない\n- [x] 締めあり（筆者の会社が紹介していること・紹介料を受け取る場合があること）\n- [x] フォームのリンクに ?src=N206\n- [x] ng-words なし。不安をあおっていない\n- [x] チェックリストあり\n- [x] 制度確認：済（ジン・10/3）\n- [x] 出典が1つだけの話（区の時期の案内）は日数を書かず「区のページで確かめる」とした\n- [ ] 画像・ハッシュタグ（センター長が作る）", "paid": "", "chars": 3897, "asks": 5, "header": "images/N206/header.png"}];
const $ = s => document.querySelector(s);
const yen = n => n ? "¥" + n.toLocaleString() : "無料";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let filter = "all", current = null, showPaid = false;

const FORM_PREVIEW = "https://claude.ai/artifact/CWFkkuGqYeCwwmTvRcQTtM";
const MOVING_PREVIEW = "https://claude.ai/artifact/HP1RqgcZVdAGmyTCiDmq8i"; // 引越し相談フォームの確認用画面 // 相談フォームの確認用画面（公開後は本物の URL が記事に入る）
function md(src) {
  src = src.replace(/\]\(\.\.\/images\//g, "](images/");
  src = src.replace(/\]\(https:\/\/【社長確認：引越し相談フォームのURL】(\?src=\w+)?\)/g, "](" + MOVING_PREVIEW + ")\u0001");
  src = src.replace(/\]\(https:\/\/【社長確認：フォームを公開したURL】(\?src=\w+)?\)/g, "](" + FORM_PREVIEW + ')<mark class="ask">【社長確認：フォームを公開したURL】</mark>');
  const withAsk = src.replace(/<mark class="ask">【社長確認：フォームを公開したURL】<\/mark>/g, "\u0000").replace(/【社長確認[^】]*】/g, m => `<mark class="ask">${esc(m)}</mark>`).replace(/\u0000/g, ' <mark class="ask">【社長確認：フォームを公開したURL】</mark>').replace(/\u0001/g, ' <mark class="ask">【社長確認：引越し相談フォームのURL】</mark>');
  const html = window.marked ? marked.parse(withAsk, { gfm: true, breaks: false }) : `<pre>${esc(src)}</pre>`;
  return html.replace(/<table>/g, '<div class="tbl"><table>').replace(/<\/table>/g, "</table></div>");
}
function accounts() { return [...new Set(DATA.map(d => d.acc))].sort(); }
function renderChips() {
  const opts = [["all", "すべて"], ...accounts().map(a => [a, `${a} ${DATA.find(d => d.acc === a).accName.replace(/（.*?）/, "")}`])];
  $("#chips").innerHTML = opts.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${k === filter}">${esc(l)}</button>`).join("");
  $("#chips").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.k; renderChips(); renderList(); });
}
function renderList() {
  const items = DATA.filter(d => filter === "all" || d.acc === filter);
  const asks = items.reduce((n, d) => n + d.asks, 0);
  $("#sum").textContent = `${items.length}本・【社長確認】の残り ${asks}か所`;
  $("#list").innerHTML = items.map(d => `<li><button type="button" data-id="${d.id}" aria-current="${current === d.id}">
    <span class="t">${esc(d.title)}</span><span class="p">${yen(d.price)}</span>
    <span class="m">${d.id}・${d.acc}・${esc(d.status)}・約${Math.round(d.chars / 100) / 10}千字${d.asks ? `　<b>社長確認 ${d.asks}</b>` : ""}</span></button></li>`).join("");
  $("#list").querySelectorAll("button").forEach(b => b.onclick = () => open(b.dataset.id, true));
}
function open(id, scroll) {
  const d = DATA.find(x => x.id === id); if (!d) return;
  if (current !== id) showPaid = false;
  current = id; renderList();
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  const read = Math.max(1, Math.round(d.chars / 500));
  $("#reader").innerHTML = `
    ${d.header ? `<img class="hero" src="${d.header}" alt="見出し画像">` : ""}
    <div class="meta"><div class="av">${d.acc}</div><div class="who"><b>${esc(d.accName)}</b>ライター：${esc(d.writer)}（下書き・${esc(d.status)}）</div></div>
    <h2 class="title">${esc(d.title)}</h2>
    <div class="facts"><span class="price">${yen(d.price)}</span><span>${d.id}</span><span>約${d.chars.toLocaleString()}字・読了 約${read}分</span>${d.asks ? `<span class="warn">【社長確認】あと${d.asks}か所</span>` : ""}</div>
    ${d.memo ? `<details class="memo"><summary>編集メモ（公開前に消す）</summary><pre>${esc(d.memo)}</pre></details>` : ""}
    <div class="body">${md(d.free)}
      ${d.paid ? (showPaid
        ? `<span class="paidlabel">ここから有料部分</span>${md(d.paid)}`
        : `<div class="wall"><p>ここから先は有料部分です</p><span class="yen">${yen(d.price)}</span><button type="button" id="unlock">有料部分をひらく（確認用）</button><p>実際の note では、購入した人だけが読めます</p></div>`) : ""}
    </div>`;
  const u = $("#unlock"); if (u) u.onclick = () => { showPaid = true; open(id, false); };
  if (scroll && innerWidth <= 860) $("#reader").scrollIntoView({ behavior: "smooth", block: "start" });
}
renderChips(); renderList();
const start = (location.hash || "").slice(1);
open(DATA.some(d => d.id === start) ? start : (DATA[0] && DATA[0].id), false);
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== current && DATA.some(d => d.id === h)) open(h, true); });
})();
</script>
