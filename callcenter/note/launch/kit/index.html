<script>
const DATA = [{"id": "N016", "title": "Claude Code にファイルを消されないために：非エンジニアでも決められる権限と点検のルール", "price": 1480, "account": "ツナグラボ", "accountUrl": "https://note.com/tunagulab", "magazine": "AIで営業チームを作る", "free": "**こんな人向け**\nClaude Code（AI にパソコン上の作業をさせる道具）を使い始めたけれど、「大事なファイルを消されたら」「勝手に送信されたら」が怖い経営者・一人社長。\nエンジニアでなくても読めるように書きました。\n\n**この記事でできること**\nAI に「何をさせるか」ではなく「何をさせないか」を、3つのルールで決められるようになります。\nこのチームで実際に使っている設定ファイルの実物と、コピーして使える型が入っています。\n\n**この記事の材料**\n自社の営業チームと note の編集チームを、Claude Code で動かしています。\nその設定ファイル（CLAUDE.md・点検表・役割ごとの指示書・送信の補助ツール）をもとに書きました。\n\n**この記事について**\n2026年10月に書きました。\nClaude Code の機能名・設定の書き方・画面は変わりやすいので、使う前に公式ドキュメントの最新情報を確認してください。\n\n---\n\n## AI に作業を任せるとき、怖いこと\n\nClaude Code は、チャットの AI と違って、パソコンの中で実際に手を動かします。\nファイルを読み、書き、コマンド（パソコンへの命令）を動かせます。\n\n便利な分、怖いところもあります。\n\n- ファイルを書き換える・消す\n- メールやフォームを送る、記事を公開する\n- 確かめていない内容を、そのまま外に出す\n\nどれも「AI がうっかりやる」と取り返しがつきにくいことです。\n\n## 結論：できることを絞り、外に出すのは人、出す前に点検\n\nこのチームで決めているルールは3つです。\n\n1. **役割ごとに、使える道具を絞る**：文章を書く役には、コマンドを動かす道具を渡さない\n2. **送信・公開は人が行う**：AI は下書きまで。送信の補助ツールも、送信ボタンの手前で止まる\n3. **出す前に点検する**：点検表（review.md）を全部確かめ、引っかかったら直してから出す\n\nそして、万一のために **元に戻せる状態にしておく**。\nこれで「消された」「送られた」の多くは、起きる前に止めるか、起きても戻せます。\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n**無料部分のまとめ（ここだけでも使えます）**\n- AI の道具は「読む」「書く」「動かす」「外に出す」に分けて考える。危ないのは後ろの2つ\n- 中身がわからない確認画面では、許可しない\n- 「送らないで」は口で言うだけでなく、約束ごとのファイルに1行書く\n- 作業の前に、今の状態を保存しておく\n\n### 有料部分の目次\n1. 道具を4つに分ける：「読む」「書く」「動かす」「外に出す」\n2. 役割ごとに道具を絞る（指示書の `tools:` の実物）\n3. 「送信・公開は人」を、約束とツールの両方で決める\n4. 出す前の点検表（review.md）と、状態の流れ\n5. 直させたことを残す（mistakes.md）\n6. 元に戻せるようにしておく\n7. コピーして使える型4つ\n8. つまずきやすい点と、直し方\n9. 明日から始めるチェックリスト", "paid": "## 1. 道具を4つに分ける\n\nClaude Code が使う道具には、それぞれ名前があります。\n細かく覚えなくて大丈夫です。\n\n4つに分けて考えます。\n\n- **読む**　道具の例：Read・Glob・Grep／できること：ファイルを読む・探す／危なさ：低い\n- **書く**　道具の例：Write・Edit／できること：ファイルを作る・書き換える／危なさ：中くらい（上書きはできる）\n- **動かす**　道具の例：Bash／できること：コマンドを動かす（ファイルの削除もできる）／危なさ：高い\n- **外に出す**　道具の例：送信・投稿・公開／できること：相手に届く／危なさ：取り消せない\n\nネットで調べる道具（WebSearch・WebFetch）もあります。\n読むだけですが、**読んだページに書いてあることを、そのまま信じさせない**ことが大事です。\n\nClaude Code には、ファイルを書き換える前やコマンドを動かす前に「実行してよいか」を聞く仕組みがあります。\n何を聞かずに許すか、何を禁止するかは、設定で決められます。\n\n設定の書き方は版によって変わるので、公式ドキュメントで確かめてください。\n\nまず覚えておきたいのは1つです。\n**確認画面で、中身がわからないものは許可しない。\n\n** わからないときは「このコマンドは何をするのか、やさしく説明して」と聞き返せば大丈夫です。\n\n## 2. 役割ごとに道具を絞る\n\nClaude Code では、`.claude/agents/<名前>.md` に役割ごとの指示書を置けます（サブエージェントと呼びます）。\n指示書のいちばん上に、`tools:` の行で **その役が使える道具** を書けます。\n\n### 実物：note のライターの指示書（冒頭）\n```\n---\nname: note-writer\ndescription: note 事業部のライター。編集長に割り当てられた企画の原稿を note/out/drafts/<ID>.md に書く。\ntools: Read, Write, Edit, Glob, Grep\n---\n```\n\nライターは「読む」と「書く」だけです。\n**Bash（コマンドを動かす道具）を持っていません。\n\n**\n\n### このチームの割り振り\n\n- **ライター・編集長・データ分析・マーケ・事務**　使える道具：Read, Write, Edit, Glob, Grep／足している理由：読んで書くだけの仕事\n- **リサーチ**　使える道具：上に WebSearch, WebFetch を足す／足している理由：ネットで調べるため\n- **SV・アポインター（営業文の点検・作成）**　使える道具：上に WebFetch を足す／足している理由：送り先のページに「営業お断り」がないか確かめるため\n- **リスト抽出**　使える道具：上に Bash を足す／足している理由：抽出ツールを動かすため\n\n営業部・note 事業部・引越しチームの指示書のうち、**コマンドを動かせるのはリスト抽出の1役だけ**です。\n道具を足すときは、「なぜ要るか」を1つ言えるものだけにしています。\n\n`tools:` の行を書かないと、多くの道具が使える状態になることがあります（細かい決まりは公式ドキュメントで確認してください）。\n**指示書を作ったら、必ず `tools:` の行を書く**のが安全です。\n\n### 「書く」だけでも、上書きはできる\n\n注意したいのは、Write・Edit でも既存のファイルを上書きできることです。\nそこで、指示書の中で **書く場所を1つに決めて** います。\n\nライターなら「`note/out/drafts/<ID>.md` に書く」です。\n\nこれは約束で、仕組みで止めるものではありません。\nだから6章の「元に戻せるようにしておく」とセットにします。\n\n## 3. 「送信・公開は人」を2か所で決める\n\n外に出すことは、取り消せません。\nこのチームでは、AI に送信・公開をさせないと決めています。\n\n決め方は2か所です。\n\n### 1か所目：約束ごと（CLAUDE.md）\nClaude Code は、作業フォルダの `CLAUDE.md` をセッション（作業のひと区切り）を始めるたびに読みます。\nそこに1行書いています。\n\n```\n- 送信・投稿・公開は人が行う。Claude は DM やフォームを送らず、note やSNSに投稿しない\n```\n\nアポインター（営業文を作る役）の指示書にも、同じことを書いています。\n\n```\n送信はあなたにはできません（人が tools/send_assist.py で送ります）。\n```\n\n### 2か所目：ツールの作り\n営業文を送るときは、補助ツールを人が動かします。\nこのツールの説明書きから抜粋します。\n\n```\n- フォーム：ブラウザでフォームを開き、名前・会社名・メール・電話・件名・本文を入力して、送信ボタンに枠を付けて止まる\n  **送信ボタンは押しません。** 内容を確かめて、人が押してください（同意のチェック・選択肢も人が選ぶ）\n- 送ったら Enter（s）で outbox.csv の状態を「送信済」にし、送信日時を入れる\n- 1日の上限（sender.yaml の daily_limit）を超えたら止まる。営業お断り表記が見つかったフォームは開くだけで入力しない\n```\n\n入力の手間は機械に任せ、**最後のボタンだけは人が押す**。\n同意のチェックも人が選びます。\n\n## 4. 出す前の点検：review.md\n\nAI が作ったものは、外に出す前に点検表で確かめます。\nnote の記事用の点検表から抜粋します。\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n原稿・SNS 投稿案を出す前に全部確かめる。1つでも ✗ なら直してから出す。\n\n- [ ] 実績・数字はすべて knowledge.md にあるか、社長が確認したもの\n- [ ] 無料部分だけでも読者に役立つことが1つある\n- [ ] ng-words.md の言葉・誇大な表現がない\n- [ ] 他人の文章・画像をそのまま使っていない。引用には出典がある\n- [ ] 個人情報・取引先名・APIキーなどが入っていない\n```\n\n最後の項目は、権限の話とつながっています。\n**AI はフォルダの中のものを読めるので、記事や文面に入り込むことがあります。\n\n** 出す前に目で確かめます。\n\n### 状態の流れ\n点検の前と後で、ファイルに「状態」を書いています。\nどこまで進んだかが、ひと目でわかります。\n\n- 営業文：下書き（アポインター）→ 承認済・差し戻し（SV が点検）→ 送信済（人が送って記録）\n- note の記事：校正待ち（ライター）→ ストック（編集長が点検）→ 公開（社長）\n\nどちらも、**最後の一歩は人**です。\n\n## 5. 直させたことを残す：mistakes.md\n\n直させたことは、AI 自身に3行で書かせます。\n次の作業で同じ失敗を繰り返さないためです。\n\n```\n何を：確認していない売上の数字を原稿に書いた（例）\nなぜ：knowledge.md にない数字を推測で埋めた\n次から：数字がないときは空けておく\n```\n\nCLAUDE.md に「作業の終わりに、直された点を mistakes.md に足す」と1行書いておくと、頼み忘れがなくなります。\n\n## 6. 元に戻せるようにしておく\n\nどれだけ絞っても、「書く」道具を渡す以上、上書きは起こりえます。\nだから、**消されても戻せる状態** を先に作ります。\n\n- **Git（変更の履歴を残す道具）で管理する**：このチームのフォルダも Git で管理しています。作業の前に今の状態を保存（コミット）しておけば、あとから元に戻せます\n- **Git が難しければ、フォルダごと控えを取る**：作業の前に、大事なフォルダをコピーして別の場所に置く\n- **AI に渡すフォルダを分ける**：経理・契約書など、AI に触らせなくてよいファイルは、作業フォルダに入れない\n\n3つ目がいちばん簡単で、効きます。\n**AI が開くフォルダに無いものは、消されません。\n\n**\n\n## 7. コピーして使える型\n\n### 型1：CLAUDE.md\n```\n# CLAUDE.md\nこの仕事の目的：〇〇（1行）\n\n## 守ること\n- 送る・公開するのは私。AI は下書きまで\n- ファイルを消さない。消す必要があるときは、理由を書いて私に聞く\n- 数字は、私が渡した資料にあるものだけ使う。なければ空けておく\n- 出す前に review.md を全部確かめて、引っかかったら直す\n- 作業の終わりに、直された点を mistakes.md に足す（何を・なぜ・次からどうするか）\n```\n\n### 型2：役割の指示書（`.claude/agents/writer.md`）\n```\n---\nname: writer\ndescription: 〇〇の下書きを drafts/ に書く係\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは〇〇の下書き係です。\n必ず最初に読む：CLAUDE.md review.md\n\n## 仕事\n1. 渡された内容で、drafts/<名前>.md に下書きを書く（ほかの場所には書かない）\n2. 出す前に review.md を全部確かめ、引っかかったら直す\n3. 送信・公開はしない\n```\n\n### 型3：review.md\n```\n# review.md（出す前の点検）\n1つでも ✗ なら直してから出す。\n\n- [ ] 数字は、渡した資料にあるものだけ\n- [ ] 個人情報・取引先名・パスワード・APIキーが入っていない\n- [ ] 言ってはいけない言葉がない\n- [ ] 書いたのは決められた場所だけ\n```\n\n### 型4：頼み方の文例\n```\nCLAUDE.md を読んでから、〇〇の下書きを作って。\nファイルを消す・コマンドを動かす必要があるときは、やる前に何をするか説明して。\n出す前に review.md を全部確かめて、引っかかったら直す。\n```\n\n## 8. つまずきやすい点と、直し方\n\n- **指示書の役が、思ったより多くの道具を使う**　原因：`tools:` の行を書いていない／直し方：指示書には必ず `tools:` を書き、要る道具だけ並べる\n- **確認画面を、よく読まずに許可してしまう**　原因：中身がわからない／直し方：わからないものは許可せず、「何をするのか説明して」と聞く\n- **書く係なのに、別のファイルが書き換わった**　原因：Write・Edit は上書きもできる／直し方：書く場所を指示書で1つに決める。作業の前に保存しておく\n- **「送らないで」と言ったのに不安が残る**　原因：口で言っただけ／直し方：CLAUDE.md に1行書く。送信のツールは、ボタンの手前で止まる作りにする\n- **点検したと言うのに、直っていない**　原因：「確かめて」だけ頼んでいる／直し方：「引っかかったら直す」まで1行に入れる\n\n## 9. 明日から始めるチェックリスト\n\n- [ ] AI に渡すフォルダから、触らせなくてよいファイルを外す\n- [ ] 作業の前に、今の状態を保存する（Git か、フォルダの控え）\n- [ ] CLAUDE.md に「送る・公開するのは私」「ファイルを消さない」を書く\n- [ ] 役割の指示書に `tools:` を書き、コマンドを動かす道具（Bash）は本当に要る役だけに渡す\n- [ ] review.md を作り、「出す前に全部確かめて、引っかかったら直す」と頼む\n- [ ] 確認画面で、中身がわからないものは許可しない\n\n---\n\n質問はコメントでどうぞ。", "images": ["checklist.png", "header.png", "points.png"], "checks": ["Claude Code の機能名（権限・確認画面など）を公式ドキュメントで1回見る"], "links": []}, {"id": "N001", "title": "Claude Code で17人の営業チームを組んだ手順と、実際のファイル一式", "price": 2980, "account": "ツナグラボ", "accountUrl": "https://note.com/tunagulab", "magazine": "AIで営業チームを作る", "free": "**こんな人向け**\n営業を少人数で回していて、リスト作り・文面作り・点検・事務に時間を取られている経営者や営業責任者。\n\n**この記事でできること**\nClaude Code の「サブエージェント」を使って、SV・アポインター・リスト担当・マーケ・事務がそろった営業チームを作れます。\nチームが毎回読むルールの書き方と、AI の失敗を減らしていく仕組みも入っています。\n\n**筆者がやったこと**\n自社の営業のために、Claude だけで SV 2人・アポインター 10人・リスト抽出 1人・マーケ 1人・事務 3人の17人と、まとめ役のセンター長からなるチームを組みました。\n\n**この記事について**\n2026年9月に書きました。\n書いた時点で動いている仕組みと、実際のファイルをもとにしています。\n\nClaude Code の機能名・料金・画面は変わりやすいので、使う前に公式の最新情報を確認してください。\n\n---\n\n## AI に営業を任せようとして、最初につまずいたこと\n\nAI に「営業文を書いて」と頼むと、それらしい文章はすぐに出てきます。\nでも、実際に送れる文面はほとんどありませんでした。\n\n- 店のことを調べずに、どの店にも同じことを書く\n- 「必ず売上が上がります」のような、言ってはいけないことを言う\n- 「営業お断り」と書いてあるフォームにも送ろうとする\n\n原因は AI の性能ではありませんでした。\n**人間の新人に渡すような「ルール」と「点検」を渡していなかった**ことです。\n\n## 結論：役割ごとに分けて、全員に同じ3つのファイルを読ませる\n\nうまく回り始めたのは、次の3つをそろえてからです。\n\n1. **役割を分ける**：1人の AI に全部やらせず、リスト担当・文面担当・点検担当を分ける\n2. **毎回読むルールを短く書く**：`CLAUDE.md` に守ってほしいことだけを書く\n3. **出す前に点検させる**：`review.md` に点検項目を書き、「出す前に全部確かめて、引っかかったら直して」と1行足す\n\nこの記事の有料部分では、実際に使っている組織図・ファイル8つの中身・エージェントの指示書を、そのまま載せています。\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n**無料部分のまとめ（ここだけでも使えます）**\n- AI には「何をするか」より先に「何をしてはいけないか」を渡す\n- 1人に全部やらせず、作る役と点検する役を分ける\n- 直したことは AI 自身に記録させる（何を・なぜ・次からどうするかの3行）\n\n### 有料部分の目次\n1. 組織図：17人＋センター長の役割と、仕事の流れ\n2. 8つのファイルの中身（CLAUDE.md・review.md・mistakes.md ほか）\n3. エージェントの指示書5つ（SV・アポインター・リスト抽出・マーケ・事務。コピーして使える）\n4. 「送信は人」にした理由と、送信の手前で止める補助ツール\n5. つまずいたことと、直し方\n6. 明日から始めるチェックリスト", "paid": "［画像：diagram.png（17人の営業チームと仕事の流れ）をここにアップロード］\n\n## 1. 組織図：17人＋センター長の役割と、仕事の流れ\n\n- **センター長（まとめ役・17人には数えない）**　人数：1（メインのセッション）／やること：仕事の割り振りと社長への報告\n- **SV**　人数：2／やること：アポインター5人ずつの文面を点検し、承認か差し戻し\n- **アポインター**　人数：10／やること：店ごとに問い合わせフォーム・DM の文面を作る\n- **リスト抽出**　人数：1／やること：送り先の店と、問い合わせフォーム・Instagram を探す\n- **マーケ**　人数：1／やること：返信率の高い書き出しを分析し、ルールを育てる\n- **事務**　人数：3／やること：返信への返事の案・日程調整・案件票\n\n流れは次のとおりです。\n\n1. リスト抽出が、送り先と連絡先を探す（「営業お断り」の店は外す）\n2. アポインター10人が並列で、店ごとの文面を「下書き」にする\n3. SV が点検して「承認」か「差し戻し」\n4. **人が**承認済みの文面を確認して送る\n5. 返信が来たら、事務が返事の案と日程調整を作る\n\nポイントは、**SV は5人に1人**にしたことです。\n1人の SV が見る下書きの数を、点検が雑にならない量に抑えるためです。\n\n## 2. 8つのファイルの中身\n\n全員が読むファイルを、役割ごとに分けています。\n\n```\nCLAUDE.md      毎回読む約束ごと\ncharacter.md   人柄・口調\ntemplates.md   返信が来た文面の型\nhooks.md       効いた一言目\nknowledge.md   商材の知識（数字は確認済みのものだけ）\nng-words.md    使わない言葉\nreview.md      出す前の点検\nmistakes.md    直させたこと\n```\n\n### CLAUDE.md（実物から抜粋）\n```\n- 1回目の連絡で売り込まない。目的は「15分の説明の日程」だけ\n- 数字は knowledge.md にある値だけ使う。書いていなければ「確認して折り返します」\n- 出す前に review.md を全部確かめて、引っかかったら直す\n- 作業の終わりに、直された点を mistakes.md に足す（何を・なぜ・次からどうするか の3行）\n```\n\n**短く書くのがコツです。\n** 毎回読まれるので、長いと守られない項目が出てきます。\n\n### review.md（実物から抜粋）\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n- [ ] 送り先に「営業お断り」の表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 名乗りと連絡先、「連絡が不要な場合の伝え方」がある\n- [ ] ng-words.md の言葉を使っていない\n- [ ] 1通目で申込を迫っていない\n```\n\n### mistakes.md の書き方\n```\n何を：フォームの下に「営業のご連絡はご遠慮ください」とあった店に下書きを作った\nなぜ：フォームのページの下まで読まなかった\n次から：review.md の1行目を、フォームのページ全体で確かめる\n```\n作業の終わりに「今回直させたところを mistakes.md に足して。何を・なぜ・次からどうするかの3行で」と送るだけです。\n**言い回しの直しは ng-words.md に移す**と、同じ言葉を二度と使わなくなります。\n\n## 3. エージェントの指示書5つ（コピーして使える）\n\nClaude Code では `.claude/agents/<名前>.md` に指示書を置くと、その役割の AI を呼び出せます。\n実際に使っている5つを、そのまま載せます（ファイルの場所は、この記事で紹介したフォルダ構成に合わせて読み替えてください）。\n\nリスト抽出の指示書では、リストの集め方を決めていません。\n使うサービスの利用規約を確かめてから、ご自分で決めてください。\n\n### SV（`sv.md`）\n```markdown\n---\nname: sv\ndescription: スーパーバイザー（SV）。AP 5人を見る。outbox.csv の下書きを sales/review.md で点検して承認・差し戻しし、返信率や差し戻し理由を集計して改善点を出す。文面の点検・チームの振り返りで使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは Claude 営業センター営業部の SV です（Aチーム：レン／Bチーム：ミナ）。担当は自分のチームの AP 5人だけ。\n\n必ず最初に読む：`CLAUDE.md` `sales/review.md` `sales/ng-words.md` `sales/knowledge.md` `sales/mistakes.md`\n\n## 仕事\n1. `sales/out/outbox.csv` の自チームの「下書き」を `review.md` で1件ずつ点検\n   - 全部OK → 状態を「承認済」、SV列に自分の名前\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n3. AP ごとの 下書き数・承認率・返信数・アポ数 を集計\n4. 差し戻しや同じ失敗は `sales/mistakes.md` に3行（何を・なぜ・次から）で足す\n5. 返信につながった文面は `sales/templates.md` に足す提案をセンター長へ出す\n```\n\n### アポインター（`appointer.md`）\n```markdown\n---\nname: appointer\ndescription: アポインター（AP）。割り当てられた店舗ごとに、MEO対策ツールを案内する問い合わせフォームまたは Instagram DM で送る短い文面を作り、sales/out/outbox.csv に「下書き」で入れる。返信の読み取りと記録もする。DM・フォーム営業の文面作成で使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは Claude 営業センター営業部のアポインターです。名前は依頼文で指定されます（例：ハル）。\n\n必ず最初に読む：`CLAUDE.md` `sales/character.md` `sales/templates.md` `sales/hooks.md` `sales/knowledge.md` `sales/ng-words.md` `sales/review.md`\n\n## 仕事\n1. 割り当てられた店ごとに、`sales/data/leads.csv` の「送る手段」を見る（フォーム ／ Instagram DM）\n2. 送り先のページを確かめる。「営業お断り」などの表記があれば、文面を作らず 状態=見送り・メモに理由\n3. `sales/out/outbox.csv` で、同じ店に30日以内に送っていないか確かめる\n4. `templates.md` の型と `hooks.md` の一言目で、その店向けの文面を作る。店について書くのは確かめたことだけ\n5. `outbox.csv` に1行追加：ID（日付-AP名-連番）,店名,送る手段,送り先URL,件名,本文,AP,SV,状態=下書き,作成日\n6. 出す前に `review.md` を全部確かめる\n\n送信はあなたにはできません（人が `tools/send_assist.py` で送ります）。返信の内容を渡されたら、`outbox.csv` の状態を「返信あり」にし、返事の案を `case-admin` に回します。\n```\n\n### リスト抽出（`list-extractor.md`）\n```markdown\n---\nname: list-extractor\ndescription: リスト抽出担当。MEO対策ツールの営業先（関東の店舗）と、その問い合わせフォーム・Instagram を探し、営業お断りの店・送信済みの店を除いて sales/data/leads.csv に追加する。送り先リストの補充で使う。\ntools: Read, Write, Edit, Glob, Grep, Bash\n---\nあなたは Claude 営業センター営業部のリスト抽出担当（ミオ）です。\n\n## 仕事\n1. リストの作り方は、使うサービスの利用規約を確かめてから決める\n2. 「Google口コミ数」が少ない店（目安：30件未満）・公式サイトがない店を優先する\n3. 集めた候補から「送る手段」がある店（フォーム ／ Instagram DM）だけを取る。「営業お断り表記」がある店は入れない\n4. `sales/data/leads.csv` と `sales/out/outbox.csv` を見て、すでにある店・送信済みの店を除く（店名＋住所、フォームURL、Instagram で照合）\n5. `sales/data/leads.csv` に追加：店名,業種,住所,Google口コミ数,送る手段,問い合わせフォーム,Instagram,公式サイト,取得元,反響(0/1),追加日\n6. 追加件数・送れる店の割合をセンター長に報告\n```\n\n### マーケ（`marketer.md`）\n```markdown\n---\nname: marketer\ndescription: マーケッター。LP・Meta広告からの反響を優先リストに入れ、送信結果から返信率の高い一言目や言い回しを分析して sales/hooks.md・sales/ng-words.md を育てる。集客と改善提案で使う。\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは Claude 営業センター営業部のマーケッター（セナ）です。\n\n必ず最初に読む：`CLAUDE.md` `sales/hooks.md` `sales/ng-words.md` `sales/mistakes.md`\n\n## 仕事\n1. 反響（問い合わせフォーム・広告からの申込）が渡されたら、`sales/data/leads.csv` の先頭に 反響=1 で入れる\n2. `sales/out/outbox.csv` を集計し、送る手段別・エリア別・ジャンル別・一言目別の返信率とアポ率を出す（件数が少ないものは「参考値」と書く）\n3. 返信につながった一言目を `sales/hooks.md` に足す\n4. `sales/mistakes.md` の中の言い回しの直しを `sales/ng-words.md` に移す\n5. 次に抽出すべきエリア・業種を `list-extractor` 向けに提案する\n6. note の MEO アカウント（A03）経由の問い合わせも反響として扱う\n\n広告文・LPの表現は景品表示法に注意し、「最短」「無料」「必ず」などは事実と一致するものだけ使う。\n```\n\n### 事務（`case-admin.md`）\n```markdown\n---\nname: case-admin\ndescription: 案件処理の事務。返信が来た店への返事の案と日程調整、アポ確定後の案件票・デモの案内を作る。3人で分担。返信対応とアポ後の事務処理で使う。\ntools: Read, Write, Edit, Glob, Grep\n---\nあなたは Claude 営業センター営業部の事務担当です（ナナ・サキ・ユウ）。\n\n必ず最初に読む：`CLAUDE.md` `sales/character.md` `sales/knowledge.md` `sales/review.md`\n\n## 仕事\n1. `sales/out/outbox.csv` の「返信あり」を上から取り、メモに自分の名前を書く（他の事務担当と取り合わない）\n2. 返信の内容に合わせて返事の案を作る（日程は2択で出す。断りなら丁寧にお礼だけ・状態=見送り）\n3. 日程が決まったら 状態=アポ にし、`sales/out/appointments.csv` に1行追加\n4. `sales/out/cases/<訪問日>_<店名>.md` に案件票・日程確定の文面・デモの案内（`knowledge.md` にある内容だけ）を作る\n5. 出す前に `review.md` を確かめる。返事を送るのは人\n```\n\n## 4. 「送信は人」にした理由\n\n最初は送信まで自動にしようと考えました。\nやめた理由は3つです。\n\n- Instagram は、公式の仕組みでは相手から先に連絡がないと DM を送れない。非公式の自動送信は規約違反になりうる\n- 問い合わせフォームには「営業お断り」と書いてある店がある。送る前に人の目で見たい\n- 送りすぎると迷惑行為と受け取られる。1日の上限を人が管理したい\n\nそこで、**フォームに自動で入力して、送信ボタンの手前で止まる**補助ツールを作りました。\n人は内容を見て、送信ボタンを押すだけです。\n\n「営業お断り」の表記を見つけたフォームには入力しません。\n\n## 5. つまずいたことと、直し方\n\n- **どの店にも同じ文面になる**　原因：店の情報を渡していなかった／直し方：リストに口コミ数・公式サイト・Instagram を入れ、「店について1つだけ具体的に書く。調べていないことは書かない」と character.md に書いた\n- **言ってはいけない表現が出る**　原因：禁止事項を書いていなかった／直し方：ng-words.md に「使わない → 代わりに」の表で書いた\n\n## 6. 明日から始めるチェックリスト\n\n- [ ] `CLAUDE.md` に守ってほしいことを5行以内で書く\n- [ ] `review.md` に出す前の点検項目を5つ書き、CLAUDE.md に「出す前に全部確かめる」と1行足す\n- [ ] 作る役と点検する役を、別のエージェントに分ける\n- [ ] 作業の終わりに mistakes.md を AI に書かせる\n- [ ] 送信・公開は人が行う\n\n---\n\n質問はコメントでどうぞ。", "images": ["checklist.png", "diagram.png", "header.png", "points.png"], "checks": ["「始めた時期」は本文から外してある。書けるなら「筆者がやったこと」の最後に1文足す"], "links": []}, {"id": "N018", "title": "Googleマップの店舗情報が勝手に変わった・停止された：店舗オーナーが最初に確かめることと直し方", "price": 1480, "account": "ツナグラボ", "accountUrl": "https://note.com/tunagulab", "magazine": "お店のGoogleマップ集客", "free": "**こんな人向け**\n美容室・整骨院・飲食店などの店長やオーナー。\nGoogleマップを見たら、営業時間や電話番号が知らないうちに変わっていた。\n\n「閉業」と出ていた。\nプロフィールが「停止」と表示された。\n\nどうしていいか分からない人。\n\n**この記事でできること**\n「勝手に変わった」と「停止された」を見分けて、それぞれ最初に確かめることと、Google の公式ヘルプに書かれている直し方の順番が分かります。\nやると状況が悪くなりやすいことも分かります。\n\n---\n\n## まず落ち着いて：「変わった」と「停止された」は別のこと\n\nどちらも「Googleマップがおかしい」に見えますが、原因も直し方も違います。\n\n**① 情報が勝手に変わった**\nGoogle の公式ヘルプでは、Google はユーザーからの報告など、さまざまな情報源から情報を集めていて、情報が正しくない・古いと報告されると、Google がプロフィールを更新することがあると説明されています（[ビジネス プロフィールに対する Google による変更を管理する](https://support.google.com/business/answer/3480441?hl=ja)）。\nまた、お店の人でなくても、Googleマップを使う人は情報の修正を「提案」できます（[ビジネス プロフィールを編集する](https://support.google.com/business/answer/3039617?hl=ja)）。\n\nつまり「誰かにいたずらされた」とは限りません。\n**まずは、何が・どう変わったかを管理画面で確かめる**のが先です。\n\n**② プロフィールが停止された・制限された**\n公式ヘルプでは、Google のガイドラインに従っていないプロフィールは、停止や無効化されることがあり、回復するのが妥当だと考える場合は **再審査を請求できる** と説明されています（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n## 最初に確かめる3つ（どちらの場合も）\n\n1. **自分がそのプロフィールの管理者になっているか**\nGoogle のアカウントでログインして、自分のお店のプロフィールを開けるか確かめます。\nお店の名前や営業時間を編集するには、オーナー確認が必要です（[Google でビジネスのオーナー確認を行う](https://support.google.com/business/answer/7107242?hl=ja)）。\n2. **管理画面に「Google による変更」が出ていないか**\n   出ていれば「①変わった」のパターンです。\n3. **「停止」「制限」の表示やお知らせが出ていないか**\n   出ていれば「②停止された」のパターンです。\n\n## いちばん大事な注意：同じお店のプロフィールを新しく作らない\n\n慌てて「作り直せばいい」と考えがちですが、公式ヘルプでは、**再審査請求の審査中は、同じビジネスの新しいプロフィールを作らないように** と書かれています（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n有料部分では、パターンごとの直し方の手順、「閉業」にされていたときの戻し方、再審査請求で用意する書類、慌てたときに確かめるチェックリストを載せています。\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 「勝手に変わった」と「停止された」は別。直し方も別\n- まず管理画面で「Google による変更」と「停止・制限」の表示を確かめる\n- 同じお店のプロフィールを新しく作らない\n\n### 有料部分の目次\n1. 情報が勝手に変わったときの直し方\n2. 「閉業」「臨時休業」にされていたときの戻し方\n3. 管理者になっていない・オーナー確認がまだのとき\n4. 停止・制限されたときの再審査請求の流れ\n5. 再審査請求の前に用意しておくもの\n6. やると状況が悪くなりやすいこと\n7. 慌てたときのチェックリスト", "paid": "## 1. 情報が勝手に変わったときの直し方\n\n公式ヘルプ（[Google による変更を管理する](https://support.google.com/business/answer/3480441?hl=ja)）では、Google による変更は、**もともとの情報の横に表示され**、それを見てどうするかを選べると説明されています。\n選べることは次のとおりです。\n\n- **変更が正しいので受け入れる**　やり方（公式ヘルプの説明）：ページ上部で変更をすべて承認する。または、承認したい変更がある項目を選んで「適用」\n- **変更がまちがっているので元に戻す**　やり方（公式ヘルプの説明）：破棄したい変更がある項目を選び、元の内容に戻して「適用」\n- **自分で正しい内容に直す**　やり方（公式ヘルプの説明）：変更の内容を編集する\n\n手順：\n1. 自分のお店のプロフィールを開き、「プロフィールを編集」に進む\n2. Google による変更が出ている項目を1つずつ確かめる\n3. 正しいものは承認、まちがっているものは元に戻す\n4. 保存したあと、編集内容に表示されるステータスを確かめる。「承認済み」になると、更新した情報がプロフィールに表示されます（[ビジネス プロフィールの編集内容の反映](https://support.google.com/business/answer/3038311?hl=ja)）\n\n**注意**\n公式ヘルプには、Google による変更の **すべてが** プロフィールの中で管理できるわけではない、とも書かれています。\n管理画面で見つからない変更があっても、自分の操作ミスとは限りません。\n\n**直したあとにやること**\n店の看板・ホームページ・予約サイトの情報と、Google の情報が同じかを見直します。\nお店の外にある情報と Google の情報が食い違っていると、お客さんがどちらが正しいか分からなくなるためです。\n\n## 2. 「閉業」「臨時休業」にされていたときの戻し方\n\n公式ヘルプ（[ビジネス情報を営業中に再設定する](https://support.google.com/business/answer/15300571?hl=ja)）では、営業中に戻すと、Googleマップと Google 検索で「臨時休業」「閉業」の表示が出なくなると説明されています。\n\n1店舗の場合の手順：\n1. 自分のお店のプロフィールに移動する\n2. 「プロフィールを編集」→「営業時間」を選ぶ\n3. 営業時間の編集で「決まった営業時間で営業している」を選ぶ\n\n**注意**\n同じヘルプには、**所在地や名称の変更にともなって閉業マークが付いた場合は、営業中に戻せない** と書かれています。\nその場合は、新しいビジネス情報を追加するよう案内されています。\n\n移転や店名変更をしたあとに「閉業」になっていたら、このパターンかどうかを先に確かめてください。\n\n## 3. 管理者になっていない・オーナー確認がまだのとき\n\n「昔だれかが登録したまま」「前の店長のアカウントで管理していた」というときは、まず自分のアカウントで管理できる状態にします。\n\n- オーナー確認の方法には、電話・SMS、メール、ビデオ通話、はがき などがあります。**どの方法が使えるかは Google が自動で決め、自分では選べない** と公式ヘルプに書かれています。お店の業種や地域などによって変わり、複数の方法での確認が必要になることもあります（[Google でビジネスのオーナー確認を行う](https://support.google.com/business/answer/7107242?hl=ja)）\n- すでにほかの人がオーナーになっている場合は、オーナー権限をリクエストする手順が公式ヘルプにあります（[ビジネス プロフィールのオーナー権限をリクエストする](https://support.google.com/business/answer/4566671?hl=ja)）\n\n## 4. 停止・制限されたときの再審査請求の流れ\n\n1. **原因になりそうなところを直す**\n公式ヘルプでは、ガイドラインに従っていないプロフィールが停止・無効化されると説明されています。\nまず [Google に掲載するビジネス情報のガイドライン](https://support.google.com/business/answer/3038177?hl=ja) と自分のプロフィールを見くらべます（例：お店の名前にキーワードを足していないか、実際にお客さんに対応している住所か）\n2. **再審査請求ツールを開く**\n   プロフィールに関連付けられた Google アカウントでログインし、プロフィールを選んで進みます（[ビジネス プロフィールのコンテンツとプロフィールの制限に対する再審査請求](https://support.google.com/business/answer/13597551?hl=ja)）\n3. **証拠書類を出す**\n   証拠書類の提出を求められることがあり、公式ヘルプでは、再審査請求の裏付けとして出すことが強くすすめられています\n4. **審査を待つ**\n   審査中は、**同じお店の新しいプロフィールを作らない**（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）\n\nプロフィール全体ではなく、口コミや写真などの一部のコンテンツが制限された場合も、同じ再審査請求のページから請求できると説明されています（[再審査請求](https://support.google.com/business/answer/13597551?hl=ja)・[ポリシー違反によるビジネス プロフィールの制限](https://support.google.com/business/answer/14114287?hl=ja)）。\n\n## 5. 再審査請求の前に用意しておくもの\n\n公式ヘルプで、再審査請求の裏付けに役立つ証拠書類としてあげられているものです（[停止または無効化されたプロフィールを修正する](https://support.google.com/business/answer/4569145?hl=ja)）。\n\n- **正式な事業登録証**\n- **営業許可証**\n- **納税証明書**\n- **事業用の公共料金の請求書（電気・電話・水道・インターネット）**\n\n**いちばん大事なこと**\n書類に書かれている **お店の名前と住所が、再審査を請求するプロフィールと同じか** を確かめます（同じヘルプで、一致していることを確認するよう書かれています）。\n書類の店名とプロフィールの店名がちがう場合は、どちらが正しいかを先に整理してください。\n\n## 6. やると状況が悪くなりやすいこと\n\n- **同じお店のプロフィールを新しく作る**　理由：公式ヘルプで、再審査請求の審査中は作らないよう書かれている\n- **直さないまま再審査請求を出す**　理由：停止はガイドラインに従っていないことが理由。原因を直さないと、請求の理由が説明できない\n- **お店の名前にキーワードを足して「目立たせる」**　理由：ビジネス名のガイドライン違反（[ガイドライン](https://support.google.com/business/answer/3038177?hl=ja)）\n- **書類と違う店名・住所のまま請求する**　理由：名前と住所が一致しているか確かめるよう書かれている\n- **「すぐ復活させます」「必ず戻します」という業者にまかせる**　理由：審査をするのは Google。結果を約束できる人はいない\n\n## 7. 慌てたときのチェックリスト\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n- [ ] 自分のアカウントでプロフィールを開けるか（管理者か）\n- [ ] 「Google による変更」が出ていないか\n- [ ] 出ていたら、正しいものは承認・まちがいは元に戻したか\n- [ ] 「閉業」「臨時休業」になっていないか\n- [ ] 「停止」「制限」の表示が出ていないか\n- [ ] ガイドラインと見くらべて、原因を直したか\n- [ ] 書類の店名・住所がプロフィールと同じか\n- [ ] 同じお店のプロフィールを新しく作っていないか\n```", "images": ["checklist.png", "header.png", "points.png"], "checks": ["下の Google ヘルプを開いて、本文の説明と合っているか見る（こちらの環境では原文を開けなかった）", "相談フォームの案内は外してある。フォームを公開したら足す"], "links": [{"name": "Google による変更を管理する", "url": "https://support.google.com/business/answer/3480441?hl=ja"}, {"name": "ビジネス プロフィールを編集する（編集の提案）", "url": "https://support.google.com/business/answer/3039617?hl=ja"}, {"name": "編集内容の反映（ステータス）", "url": "https://support.google.com/business/answer/3038311?hl=ja"}, {"name": "営業中に再設定する", "url": "https://support.google.com/business/answer/15300571?hl=ja"}, {"name": "オーナー確認を行う", "url": "https://support.google.com/business/answer/7107242?hl=ja"}, {"name": "オーナー権限をリクエストする", "url": "https://support.google.com/business/answer/4566671?hl=ja"}, {"name": "停止または無効化されたプロフィールを修正する", "url": "https://support.google.com/business/answer/4569145?hl=ja"}, {"name": "コンテンツとプロフィールの制限に対する再審査請求", "url": "https://support.google.com/business/answer/13597551?hl=ja"}, {"name": "ポリシー違反によるビジネス プロフィールの制限", "url": "https://support.google.com/business/answer/14114287?hl=ja"}, {"name": "ビジネス情報のガイドライン", "url": "https://support.google.com/business/answer/3038177?hl=ja"}]}, {"id": "N005", "title": "SV 1人で AP 5人を回す：AI 営業チームの点検の仕組み", "price": 1980, "account": "ツナグラボ", "accountUrl": "https://note.com/tunagulab", "magazine": "AIと人で回す店舗営業", "free": "**こんな人向け**\n営業チームの責任者。\nAI に営業文面を書かせ始めたが、品質のばらつきや「変な文面が送られないか」が心配な人。\n\n**この記事でできること**\nAI の営業チームを「作る役」と「点検する役」に分け、点検リスト・差し戻しの集計・失敗の記録で回す仕組みが分かります。\nそのまま使える点検役（SV）の指示ファイルも載せています。\n\n**筆者がやったこと**\nMEO対策ツールの営業で、Claude Code を使って営業部を作りました。\nAP（アポインター＝文面を作る役）5人に SV（スーパーバイザー＝点検する役）1人をつけ、A・B の2チームで動かしています。\n\n送信は人が行います。\n\n---\n\n［画像：diagram.png（作る役・点検する役・送る役を分ける）をここにアップロード］\n\n## AI に文面を書かせると、何が困るか\n\nAI は速く、たくさん書けます。\n困るのは、その速さに点検が追いつかないことです。\n\n- 店について、確かめていないことを書いてしまう\n- 「必ず」「保証」など、言ってはいけない言葉が混ざる\n- 「営業お断り」と書いてある店にも、文面を作ってしまう\n- 同じ店に、何度も送る下書きができる\n\n1通ずつなら、人が読めば防げます。\nでも AI が1日に何十通も作ると、人の目だけでは見落とします。\n\n## 結論：作る役と点検する役を分け、送るのは人\n\n私たちの営業部は、3つの段に分けています。\n\n1. **作る（AP）**：店ごとの文面を作り、「下書き」で出す\n2. **点検する（SV）**：点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n3. **送る（人）**：承認済だけを、人が1件ずつ目で見て送る\n\n大事なのは、**作った本人に点検させない**ことです。\n同じ AI に「書いて、確かめて」と頼むと、自分の書いたものを甘く見がちです。\n役を分けると、点検役は「通さない理由」を探す立場になります。\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 文面を作る AI と、点検する AI を分ける\n- 点検はリストで行う。「よさそうか」ではなく「✗ が1つもないか」で決める\n- 差し戻しには必ず「どの項目で落ちたか」を書かせる\n- 送信ボタンは人が押す。AI には送らせない\n\n### 有料部分の目次\n1. SV 1人に AP 5人にしている考え方\n2. 仕事の流れ（下書き → 点検 → 送信）\n3. 点検リスト全項目（コピーして使える）\n4. 差し戻し理由の集計のしかた\n5. mistakes.md：同じ失敗を繰り返さない記録\n6. 「送信は人」のルールと、送信補助ツールの作り\n7. SV の指示ファイル（sv.md）の全文\n8. つまずきやすい点と直し方", "paid": "## 1. SV 1人に AP 5人にしている考え方\n\n私たちの営業部は、A・B の2チームです。\nそれぞれ SV 1人・AP 5人。\nSV は自分のチームの5人だけを見ます。\n\n1:5 は、決まった正解ではありません。\n考え方は次の3つです。\n\n- **SV が1件ずつ読める量にする。** 点検は全件を読むのが前提です。読み飛ばすなら、点検役を置く意味がありません\n- **AP ごとの違いが見える人数にする。** 5人なら、誰の差し戻しが多いかを表1枚で見比べられます\n- **増やすときは、チームごと増やす。** AP を増やしたいときは、SV 1人・AP 5人の組をもう1つ作ります\n\nAI なので、人数を増やすのは簡単です。\nでも点検が追いつかない人数にすると、仕組み全体が崩れます。\n**AP の数は、SV が全件読める量で決めます。\n**\n\n## 2. 仕事の流れ\n\n1. リスト係が、送り先の店とフォーム・Instagram を集める（「営業お断り」表記の店は入れない）\n2. リストを AP に均等に割り振る\n3. AP が店ごとに文面を作り、一覧表（outbox.csv）に「下書き」で1行足す\n4. SV が点検リストで1件ずつ確かめ、「承認済」か「差し戻し」にする\n5. 人が送信補助ツールで、承認済だけを1件ずつ確かめて送る\n6. 返信は事務係が、返事の案と日程調整を作る\n\n一覧表の列はこうしています。\n\n```\nID,店名,送る手段,送り先URL,件名,本文,AP,SV,状態,作成日,メモ\n```\n\n状態は「下書き → 承認済／差し戻し → 送信済 → 返信あり」と進みます。\n送り先に「営業お断り」があれば、AP は文面を作らず「見送り」にします。\n\n**ポイント**\nAP は「下書き」までしか書けません。\n「承認済」にできるのは SV だけ。\n「送信済」にできるのは人だけです。\n状態を変えられる人を分けておくと、どこで止まったかがすぐ分かります。\n\n## 3. 点検リスト全項目\n\nSV はこのリストで1件ずつ確かめます。\n1つでも ✗ なら差し戻しです。\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n- [ ] 送り先のフォーム・プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない（一覧表で店名・URLを確認）\n- [ ] 店名・エリアが正しい。店について書いたことは実際に確かめたこと\n- [ ] 名乗り（会社名・名前）と、連絡先・署名がある\n- [ ] 連絡が不要な場合の伝え方が書いてある\n- [ ] 使わない言葉の一覧にある言葉を使っていない。数字は資料にある値だけ\n- [ ] 1通目で申込を迫っていない。目的は「15分の説明（デモ）の日程」だけ\n- [ ] 順位の保証、見返り付きの口コミ集めを思わせる表現がない\n- [ ] 検索順位・口コミ数などの店の数字は、実際に確かめた値だけ\n- [ ] Instagram DM は5行以内、URLを貼っていない\n- [ ] アポは決裁者（店長・オーナー）本人の返信で、日時・店名・連絡先がそろっている\n```\n\nいま、次の4項目を追加の案として SV に渡しています。\n店のオーナーに「しつこい業者」と思われないための項目です。\n\n```\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 「無料診断」「今だけ」など、業者の決まり文句を使っていない\n- [ ] 断られた店、返信のない店に、1週間以内に同じ内容を再送していない（再送は1回まで）\n- [ ] 「Google から連絡が来た」「このままだと表示されなくなる」など、不安をあおる書き方をしていない\n```\n\n**リストの作り方のコツ**\n- 1項目は「はい／いいえ」で答えられる文にする。「適切か」「自然か」は書かない\n- 項目は増やしすぎない。増やしたら、使っていない項目を消す\n- 「営業お断り」の確認は、SV も自分でページを開いて確かめる。AP の報告をうのみにしない\n\n## 4. 差し戻し理由の集計のしかた\n\n差し戻しは、ただ直させて終わりにしません。\n**どの項目で落ちたかを数えると、AP への指示のどこが弱いかが分かります。\n**\n\n### 差し戻しのメモの書き方\nメモ列には、点検リストの何番で落ちたかと、一言の理由を書かせます。\n\n```\n差し戻し｜3番：「ランチが人気」と書いたが、確かめた事実にない\n差し戻し｜6番：「必ず」を使っている\n```\n\n番号を先に書くと、あとで数えやすくなります。\n\n### 集計の表\nSV には、AP ごとにこの表を作らせます。\n\n```\n- **{AP名}**　下書き数：{数}／承認数：{数}／差し戻し数：{数}／多かった項目：{項目番号}／返信数：{数}／アポ数：{数}\n```\n\n項目ごとにも数えます。\n\n```\n- **3番 店について確かめたことだけ**　差し戻し数：{数}／直し方（指示・テンプレのどこを変えるか）：{直し方}\n```\n\n### 集計を見たら、何を直すか\n- **特定の AP だけ多い** → その AP の指示の読み違い。指示ファイルを見直す\n- **全員が同じ項目で落ちる** → テンプレや指示そのものが弱い。テンプレを直す\n- **ずっと0の項目** → 本当に守れているか、点検が甘いかを、SV に数件読み直させる\n\n## 5. mistakes.md：同じ失敗を繰り返さない記録\n\nAI は、前回の失敗を覚えていません。\nだから失敗を1つのファイル（mistakes.md）に書き残し、毎回最初に読ませます。\n\n書き方は1件3行です。\n\n```\n何を：フォームの下に「営業のご連絡はご遠慮ください」とあった店に下書きを作った（例）\nなぜ：フォームのページの下まで読まなかった\n次から：点検リストの1行目を、フォームのページ全体で確かめる\n```\n\n**3行にする理由**\n- 「何を」だけだと、次にどうすればいいか分からない\n- 「なぜ」があると、似た別の失敗も防げる\n- 「次から」は、点検リストか指示ファイルのどこかを直す形で書く\n\n言い回しの直し（「この言葉は使わない」）は、使わない言葉の一覧に移します。\nmistakes.md が長くなりすぎないようにするためです。\n\n## 6. 「送信は人」のルール\n\n私たちのルールでは、**送信・投稿・公開は人が行います。\n**\nAI は DM もフォームも送りません。\n\n理由は2つです。\n- 送ったものは取り消せない。最後の確認は、責任を持つ人がする\n- 送り先の規約や法律の判断を、AI に任せきりにしない\n\nとはいえ、人が毎回フォームに入力するのは手間です。\nそこで送信補助ツールを作りました。\nやることはこれだけです。\n\n- 承認済の文面を、上から1件ずつ出す\n- フォームなら、ブラウザで開いて名前・会社名・メール・電話・件名・本文を入れる。**送信ボタンは押さず、ボタンに枠を付けて止まる**。同意のチェックや選択肢も人が選ぶ\n- Instagram DM なら、プロフィールを開いて文面を画面に出すだけ。人がコピーして貼り、人が送る\n- 人が送ったら、一覧表の状態を「送信済」にし、送信日時を入れる\n- 1日の上限を超えたら止まる。フォームに「営業お断り」の表記を見つけたら、開くだけで入力しない\n\n**ポイント**\n「送信ボタンの手前で止まる」ことが大事です。\n人は必ず画面の文面を見てから押すことになります。\n\n## 7. SV の指示ファイル（sv.md）\n\nClaude Code のサブエージェントとして使っている SV の指示ファイルです。\n会社名や商材に合わせて書き換えてください。\n\n```\n---\nname: sv\ndescription: スーパーバイザー（SV）。AP 5人を見る。outbox.csv の下書きを review.md で点検して承認・差し戻しし、返信率や差し戻し理由を集計して改善点を出す。文面の点検・チームの振り返りで使う。\ntools: Read, Write, Edit, Glob, Grep, WebFetch\n---\nあなたは営業部の SV です（Aチーム：{名前}／Bチーム：{名前}）。担当は自分のチームの AP 5人だけ。\n\n必ず最初に読む：review.md（点検リスト）・ng-words.md（使わない言葉）・knowledge.md（商材の事実）・mistakes.md（過去の失敗）\n\n## 仕事\n1. outbox.csv の自チームの「下書き」を review.md で1件ずつ点検\n   - 全部OK → 状態を「承認済」、SV列に自分の名前\n   - ✗ がある → 「差し戻し」にし、メモに理由（どの項目か）\n2. 送り先ページの「営業お断り」表記は、自分でもページを開いて確かめる\n3. AP ごとの 下書き数・承認率・返信数・アポ数 を集計\n4. 差し戻しや同じ失敗は mistakes.md に3行（何を・なぜ・次から）で足す\n5. 返信につながった文面は templates.md に足す提案を責任者へ出す\n```\n\n**書き換えるときの注意**\n- tools に送信の手段を入れない。SV は点検と記録だけ\n- 「最初に読む」に mistakes.md を必ず入れる\n- 担当の AP を名前で決める。全員を見させると、集計がぼやけます\n\n## 8. つまずきやすい点と直し方\n\n- **点検が甘くなる** → 「よさそうなら承認」と書かない。「✗ が1つでもあれば差し戻し」と書く\n- **差し戻しの理由がばらばら** → メモの先頭に項目番号を書かせる\n- **AP が店のことを盛る** → 指示に「店について書くのは確かめた事実だけ。ないことは書かない」と入れ、点検リストにも同じ項目を置く\n- **点検リストが長くなる** → 追加は「案」として出し、SV か責任者が採用を決める。使わない項目は消す\n- **人の送信が追いつかない** → AP を増やさない。1日の上限を決め、その範囲で回す\n\n---\n\n質問はコメントでどうぞ。", "images": ["checklist.png", "diagram.png", "header.png", "points.png"], "checks": [], "links": []}, {"id": "N006", "title": "Instagram DM で店舗に嫌われない書き方", "price": 980, "account": "ツナグラボ", "accountUrl": "https://note.com/tunagulab", "magazine": "AIと人で回す店舗営業", "free": "**こんな人向け**\n飲食店・美容室・整骨院などの店舗に、Instagram の DM で営業している人。\n送っても無視される、ブロックされないか心配な人。\n\n**この記事でできること**\n店のオーナーに「しつこい業者」と思われない DM の書き方が分かります。\n5行の型、店の投稿の触れ方、言わないこと、再送のルール、そのまま使える文例を載せています。\n\n**筆者がやったこと**\n店舗向けに MEO対策ツールを案内する営業で、DM の文面を AI に作らせ、別の AI に点検させ、人が1件ずつ送る仕組みを作りました。\nこの記事のルールは、その点検リストから取っています。\n\n---\n\n## 店の DM は、どう読まれているか\n\n店の Instagram には、お客さんからの予約や質問が届きます。\nそこに営業の DM が混ざります。\n\nオーナーが営業 DM を嫌うのは、だいたい次のときです。\n\n- 長い。スマホの画面をスクロールしないと終わらない\n- どの店にも同じ文を送っているのが分かる\n- 1通目から URL や資料が貼ってある\n- 返事をしないと、何度も送ってくる\n\n**DM は「お客さんの連絡が届く場所」に入っていく営業です。\n**\nフォームやメールより、相手の場所に近い。\nだから短く、丁寧に、1回で引くのが基本です。\n\n## 結論：5行・URLなし・投稿は1つだけ・再送は1回\n\n1. **5行まで。** スマホで1画面に収める\n2. **1通目に URL を貼らない。** 資料も送らない\n3. **店の実際の投稿に1つだけ触れる。** 見ていないことは書かない\n4. **断り方を書く。**「ご興味がなければスルーで大丈夫です」\n5. **再送は1回まで。1週間以上あける。** 断られたら、もう送らない\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n**無料部分のまとめ（ここだけでも使えます）**\n- 1通目の目的は「売ること」ではなく「15分だけ話を聞いてもらえるか」\n- 「投稿を拝見しました」だけでは足りない。どの投稿かを1つ書く\n- 自動で大量に送る仕組みは使わない。人が1件ずつ送る\n\n### 有料部分の目次\n1. 5行の型と、1行ずつの書き方\n2. URL を貼らない理由と、資料を渡すタイミング\n3. 店の実際の投稿の触れ方（よい例・だめな例）\n4. 言わないことの一覧（代わりの言い方つき）\n5. 再送のルールと、返事が来たあと\n6. 自動送信をすすめない理由（Instagram の仕組みと規約）\n7. 業種別の文例（飲食・美容・整骨院）\n8. 送る前の点検リスト", "paid": "## 1. 5行の型\n\n```\n1行目：名乗り（会社名・名前）\n2行目：この店に送った理由（実際に見た投稿を1つ）\n3行目：お願い（「15分だけご紹介させていただけないでしょうか」）\n4行目：断り方（「ご興味がなければ、このままスルーしていただいて大丈夫です」）\n5行目：（なくてもよい）お礼の一言\n```\n\n**1行ずつのコツ**\n- **1行目**：「はじめまして、{会社名}の{名前}です。」だけ。会社の説明は書かない\n- **2行目**：ここだけが、その店あての部分です。一番時間をかけます\n- **3行目**：お願いは小さく。「契約」「導入」ではなく「15分」\n- **4行目**：断り方があると、相手は安心して読めます。返事をしない自由を先に渡します\n- **「突然のご連絡失礼いたします」は1回まで。** 何度も謝ると長くなるだけです\n\n5行に収まらないときは、2行目を短くするのではなく、ほかの行を削ります。\n\n## 2. URL を貼らない理由\n\n1通目には URL を貼りません。\n資料や画像も送りません。\n\n- 知らない相手からの URL は、開くのが怖い\n- URL があると「宣伝の DM」に見えやすい\n- 読む前に「押すかどうか」を迷わせてしまう\n\n**資料を渡すのは、相手が「詳しく知りたい」と返事をくれてから**です。\nそのときも、まず1枚だけにします。\n\n## 3. 店の実際の投稿の触れ方\n\n2行目は、その店の投稿を実際に見て書きます。\n\n### 見るところ\n- 最近の投稿のメニュー・施術・商品\n- 新しくオープンした、移転した、などのお知らせ\n- 季節の限定メニューやイベント\n\n### よい例\n```\n{店名}さんの、秋限定の{メニュー名}の投稿を拝見してご連絡しました。\n```\n```\n{エリア}に新しくオープンされたとの投稿を拝見してご連絡しました。\n```\n\n### だめな例\n```\n素敵な投稿をいつも拝見しています。\n```\n→ どの店にも送れる文です。\n見ていないのが伝わります。\n\n「いつも」も事実でなければ書きません。\n\n```\nフォロワーが少なくて、もったいないと思いました。\n```\n→ 店の弱みを指摘する書き方は、上から目線に聞こえます。\n\n**ルール**\n- 触れる投稿は1つだけ。たくさん褒めると、かえって作り物に見えます\n- 見ていないこと、推測したことは書かない（「人気のお店と伺いました」など）\n- 投稿の文章や写真を、そのまま DM に貼らない。どの投稿かが分かる一言で十分です\n- AI に書かせるときは、実際に見た投稿の内容を人が渡す。AI に想像で書かせない\n\n## 4. 言わないことの一覧\n\n- **必ず来店が増えます／絶対儲かります**　理由・代わりに：「来店を増やす方法の1つとしてご案内しています」\n- **1位にします・上位表示を保証**　理由・代わりに：順位は Google が決めます。保証はできません\n- **口コミを増やします・★5を集めます**　理由・代わりに：見返り付きの口コミ集めを思わせます。Google のポリシー違反の手法を連想させるので使いません\n- **Google公認・Google提携**　理由・代わりに：事実でなければ使いません\n- **今だけ・本日中に**　理由・代わりに：事実の期限がないなら書きません\n- **無料診断**　理由・代わりに：業者の決まり文句に見えます\n- **皆さんやってます**　理由・代わりに：事実で確かめられるときだけ、具体的に\n- **至急ご返信ください／ご返信がない場合は…**　理由・代わりに：返信は相手の自由。使いません\n- **「このままだと表示されなくなります」**　理由・代わりに：不安をあおる書き方はしません\n- **競合店の悪口**　理由・代わりに：使いません\n\nほかに、**1通目で料金・契約の話をしない**ことも決めています。\nまだ話を聞くと決めていない相手に、お金の話は早すぎます。\n\n## 5. 再送のルールと、返事が来たあと\n\n### 再送\n- **返事がないとき**：再送は1回まで。1週間以上あける\n- 再送は同じ文を送らない。短く、「先日ご連絡した{名前}です」から始める\n- **断られたとき**：お礼だけ返して、以後送らない\n- 同じ店に30日以内に送っていないか、送る前に一覧で確かめる\n\n再送の文例です。\n\n```\n先日ご連絡した、{会社名}の{名前}です。\nGoogleマップからのご来店を増やすツールを、15分だけご紹介できればと思い、もう一度だけご連絡しました。\nご興味がなければ、このままで大丈夫です。今後はお送りしません。\n```\n\n### 返事が来たら\n- **興味あり** → 日程を2つ出して返す。その日のうちに返す\n- **検討中** → 資料は1枚だけ。「1週間後にもう一度ご連絡してもよいですか」と聞く\n- **お断り** → 「お忙しいところありがとうございました」で終える\n\n## 6. 自動送信をすすめない理由\n\nDM を自動でたくさん送りたくなるかもしれません。\n私たちは、すすめません。\n人が1件ずつ送っています。\n\n**Instagram の公式の仕組み（API）では、企業から自由に DM を送れるわけではありません。\n**\n基本は、相手から先にメッセージが届いたときに、その後24時間以内に返信できる、という形です。\nつまり、こちらから知らない店に1通目を送る用途には、公式の仕組みは向いていません。\n\n公式でないツールで自動送信すると、Instagram の規約に反するおそれがあります。\nアカウントが制限されることも考えられます。\n手で送る場合も、短い時間に大量に送る使い方は避けてください。\n\nルールは変わることがあります。\n**使う前に、Meta の最新のポリシーを必ず確認してください。\n\n**\n- Meta Messenger Platform のポリシー：https://developers.facebook.com/documentation/business-messaging/messenger-platform/policy\n\n私たちの送り方はこうです。\n- AI が文面を作り、別の AI が点検して「承認済」にする\n- 送信補助ツールは、店のプロフィールを開いて文面を画面に出すだけ\n- 人が文面を読み、コピーして DM に貼り、人が送る\n- 1日に送る上限を決めておく\n\n※規約・法律の判断は、必要に応じて専門家に確認してください。\n\n## 7. 業種別の文例\n\nどれも、`{ }` の中は実際に見た事実だけで埋めます。\n\n### 飲食店\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{メニュー名}の投稿を拝見してご連絡しました。\nGoogleマップからのご来店を増やすためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 美容室・サロン\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんの{施術名}のスタイル写真の投稿を拝見してご連絡しました。\nGoogleマップで見つけてもらいやすくするツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n### 整骨院\n```\nはじめまして、{会社名}の{名前}です。\n{店名}さんが{エリア}に新しく開院されたとの投稿を拝見してご連絡しました。\nGoogleマップで近くの方に見つけてもらうためのツールを、15分だけご紹介させていただけないでしょうか。\nご興味がなければ、このままスルーしていただいて大丈夫です。\n```\n\n## 8. 送る前の点検リスト\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n- [ ] プロフィールに「営業お断り」「セールスご遠慮」などの表記がない\n- [ ] 同じ店に、この30日で送っていない\n- [ ] 5行以内。URL・資料を貼っていない\n- [ ] 名乗り（会社名・名前）がある\n- [ ] 触れた投稿は1つで、実際に見たもの\n- [ ] 断り方が書いてある\n- [ ] 1通目で料金・契約の話をしていない\n- [ ] 上の「言わないこと」を使っていない\n- [ ] 不安をあおる書き方をしていない\n- [ ] 再送なら、前回から1週間以上あいていて、1回目の再送である\n- [ ] 送るのは人。自動送信ツールを使っていない\n```\n\n---\n\n質問はコメントでどうぞ。", "images": ["checklist.png", "header.png", "points.png"], "checks": [], "links": []}, {"id": "N010", "title": "引越しが決まったらやること：1か月前から当日までのチェックリスト", "price": 0, "account": "まるっと窓口", "accountUrl": "https://note.com/maruttosupport", "magazine": "（マガジンなし）", "free": "**こんな人向け**\n引越しの日が決まった人。\nやることが多すぎて、何から手を付ければいいか分からない人。\n\n**この記事で分かること**\n1か月前・2週間前・1週間前・前日・当日・引越し後に、それぞれ何をすればいいか。\n役所の手続きの期限と、オンラインでできること。\n\n印刷して使えるチェックリスト。\n\n**結論**\nまずは「退去の連絡」と「引越し業者の見積もり」の2つを今日やってください。\n役所の手続きは、転入届が **引越してから14日以内** という期限だけ覚えておけば、あとは順番どおりで間に合います。\n\n---\n\n［画像：diagram.png（引越しまでの流れ）をここにアップロード］\n\n## はじめに：順番を決めるのは「相手の都合」です\n\n引越しの準備は、自分だけで終わる作業と、相手（大家さん・管理会社・引越し業者・電気やネットの会社・役所）が必要な作業に分かれます。\n相手が必要な作業ほど、日にちの調整に時間がかかります。\nだから **相手が必要なものから先に** 連絡します。\n\n荷造りは自分のペースで進められます。\n後回しでも大丈夫です。\n\n---\n\n## 1か月前：相手のいる連絡から始める\n\n### □ 今の住まいの退去の連絡\n賃貸なら、まず契約書を開いてください。\n**「解約の予告は何日前まで」** と書いてあります。\n\nこの期限を過ぎると、住んでいない月の家賃がかかることがあります。\n連絡先（管理会社か大家さんか）と、連絡の方法（電話か書面か）も契約書で確かめます。\n\n### □ 引越し業者の見積もりを取る\n見積もりは **2〜3社から取って比べる** のがおすすめです。\n同じ荷物でも、会社や日にちで金額や作業内容が変わるためです。\n見積もりのときは、次をメモしておくと比べやすくなります。\n- 引越しの日と時間帯（午前・午後・時間指定なし）\n- 大きな家具・家電の数（冷蔵庫・洗濯機・ベッドなど）\n- 今の住まいと新しい住まいの階数、エレベーターの有無\n\n見積書で確かめたいこと（キャンセル料の扱いなど）は、別の記事「関東の引越し：見積もりの取り方と、費用をおさえる時期・コツ」で詳しく書いています。\n\n### □ 新しい住まいの鍵を受け取る日を確かめる\n引越しの日に鍵がないと、荷物を入れられません。\n不動産会社に受け取り日と場所を確かめておきます。\n\n---\n\n## 2週間前：ライフラインとネットの申し込み\n\n### □ 電気・ガス・水道の「止める」と「使い始める」\n今の住まいで止める日と、新しい住まいで使い始める日を、それぞれの会社に伝えます。\n- **電気**：契約している電力会社に連絡。新しい住まいで使う電力会社を選び直すこともできます\n- **ガス**：使い始めるときに **係の人の立ち会いが必要なことが多い** ので、引越し当日か翌日に予約を入れておきます\n- **水道**：新しい住まいの地域の水道局（自治体のページに連絡先があります）に連絡します\n\n### □ インターネット回線\nネット回線は、**開通工事が必要な場合があり、時期によっては申し込みから開通まで日にちがかかることがあります。\n** 在宅勤務の人や、スマホの通信量が気になる人は、ここを早めに申し込むと安心です。\n今の回線を続けるなら「移転」の手続き、変えるなら「新しい申し込み」と「今の回線の解約」の2つが必要です。\n解約の手続きで違約金や撤去の扱いがどうなるかは、契約している会社の公式サイトで確かめてください。\n\n### □ 転出届（別の市区町村に引越す人）\n今住んでいる市区町村に出します。\n窓口で出すと「転出証明書」がもらえ、新しい住所の役所に持っていきます。\n転出届を出せる時期は自治体のページで確かめてください（引越しの前に出せる期間が決まっています）。\n\n**マイナンバーカードがある人は、オンラインでもできます。\n** デジタル庁の「引越しワンストップサービス」で、マイナポータルから転出届を出し、新しい住所の役所へ行く日を予約できます。\n\nこの場合は、今の住所の役所に行く必要はありません。\nただし **転入届は、新しい住所の役所に自分で行って出します。\n\n**\n\n同じ市区町村の中で引越す人は、転出届はいりません。\n引越してから「転居届」を出します。\n\n---\n\n## 1週間前：郵便と、細かい住所変更\n\n### □ 郵便の転送（日本郵便の e転居）\n日本郵便の「e転居」は、Webサイトや郵便局アプリから転居届を出せる無料のサービスです。\n**届け出た日から1年間**、前の住所あての郵便物を新しい住所に転送してもらえます。\n「転送を始めたい日から1年」ではなく「届け出た日から1年」なので、そこだけ注意です。\n登録には日にちがかかることがあるので、早めに出しておきます。\n\n### □ 住所を登録しているところの一覧を作る\n銀行・クレジットカード・スマホ・保険・通販サイトなど。\n1週間前に一覧を作っておくと、引越し後に順番に変えるだけで済みます。\n\n### □ 荷造りの仕上げと、いらない物の処分\n粗大ごみは、自治体によって予約が必要です。\n収集日が引越しに間に合うか、自治体のページで確かめてください。\n\n---\n\n## 前日：当日に慌てないための準備\n\n### □ 冷蔵庫の電源を抜く・洗濯機の水を抜く\nどちらも取扱説明書に手順が書いてあります。\n冷蔵庫は霜取りと水受けの水を捨てるところまで。\n\n### □ 当日すぐ使う物を1つの箱にまとめる\nトイレットペーパー・タオル・スマホの充電器・カーテン・はさみ・常備薬・その夜の着替え。\nこの箱には大きく印をつけて、最後に積んでもらいます。\n\n### □ 鍵・契約書・貴重品は自分で持つ\n現金・通帳・印鑑・マイナンバーカード・新しい住まいの鍵は、業者に預けず手元に置きます。\n\n---\n\n## 当日：立ち会いと確認\n\n### □ 今の住まいの退去の立ち会い\n部屋の傷や汚れを管理会社と一緒に確かめます。\n気になるところは、その場で写真を撮っておくと後で話がしやすくなります。\n\n### □ 荷物の積み残しがないか確かめる\n押し入れ・ベランダ・玄関の靴箱まで、最後に自分の目で見ます。\n\n### □ 新しい住まいで、荷物と家具の傷を確かめる\n荷物が届いたら、家具や家電に傷がないか、その日のうちに見ておきます。\n\n### □ 電気のブレーカーを上げる・ガスの開栓に立ち会う\n予約した時間に立ち会えるよう、スマホの予定に入れておきます。\n\n---\n\n## 引越し後：期限のある手続きから\n\n### □ 転入届（引越してから14日以内）\n住民基本台帳法で、**転入した日から14日以内** に新しい住所の市区町村に届け出ることになっています。\n窓口には転出証明書を持って行きます（ワンストップサービスを使った人は、マイナンバーカードを持って行きます）。\n同じ市区町村の中で引越した人の「転居届」も、引越してから14日以内です。\n\n### □ マイナンバーカードの住所の変更\n転入届と同じときに、窓口でカードの住所を書き換えてもらいます。\nマイナンバーカードを持って行ってください。\n\n### □ 運転免許証の住所変更\n免許証の住所は、引越したら **速やかに** 新しい住所の警察署や運転免許センターなどで変更の届けを出すことになっています。\n必要な書類（新しい住所が分かる書類など）は、都道府県の警察のページで確かめてください。\nマイナ免許証の人は、手続きの流れが違う場合があります。\nこれも都道府県の警察のページで確かめてください。\n\n### □ そのほかの住所変更\n1週間前に作った一覧を上から順に変えていきます。\n国民健康保険や子どもの手当など、自治体の手続きが必要な人は、転入届のときに窓口でまとめて聞くと早いです。\n\n---\n\n## よくある失敗\n\n**1. 退去の予告の期限を過ぎていた**\n契約書を見ないまま日にちを決めて、住んでいない期間の家賃がかかってしまうことがあります。\n退去の連絡は、引越しが決まったその日にしてください。\n\n**2. ガスの開栓を予約していなかった**\n引越しの夜にお風呂が使えない、というのはよくあります。\nガスは立ち会いが必要なことが多いので、電気・水道と一緒に2週間前に予約してください。\n\n**3. 転入届を後回しにして14日を過ぎそうになった**\n引越し後は片付けで忙しく、役所に行く日がなかなか取れません。\n引越しの前に「この日に役所へ行く」と予定に入れておくと安心です。\n\n---\n\n## 印刷用チェックリスト\n\n```\n【1か月前】\n□ 退去の連絡（契約書で「解約予告の期限」を確認）\n□ 引越し業者の見積もりを2〜3社から取る\n□ 新しい住まいの鍵を受け取る日を確認\n\n【2週間前】\n□ 電気：止める日・使い始める日を連絡\n□ ガス：止める日・開栓の立ち会いを予約\n□ 水道：新しい地域の水道局に連絡\n□ インターネット回線：移転 or 新規申し込み＋解約\n□ 転出届（別の市区町村へ／マイナポータルでも可）\n\n【1週間前】\n□ 郵便の転送（e転居）\n□ 住所変更が必要なところの一覧を作る\n□ 粗大ごみの予約・荷造りの仕上げ\n\n【前日】\n□ 冷蔵庫の電源を抜く・洗濯機の水抜き\n□ 当日すぐ使う物の箱を作る\n□ 鍵・契約書・貴重品・マイナンバーカードを手元に\n\n【当日】\n□ 退去の立ち会い（気になる所は写真）\n□ 積み残しの確認\n□ 新居で荷物・家具の傷を確認\n□ ブレーカー・ガス開栓の立ち会い\n\n【引越し後】\n□ 転入届・転居届（引越してから14日以内）\n□ マイナンバーカードの住所変更\n□ 運転免許証の住所変更（速やかに）\n□ 銀行・カード・スマホ・保険などの住所変更\n\n［画像：checklist.png（保存用チェックリスト）をここにアップロード］\n\n```\n\n---\n\n## 引越しのこと、まとめて相談できます\n\n「どこに何を連絡すればいいか分からない」「電気もネットも業者も、まとめて決めたい」という方は、ご相談ください。\n\n［画像：points.png（この記事のポイント）をここにアップロード］\n\n筆者の会社では、引越しにまつわる次のご相談をまとめて受けています。\n\n- お部屋探し（仲介手数料を無料にできる物件があります。条件は物件によって違うため、ご相談のときにご説明します。お部屋探しは、提携する不動産会社をご紹介します（物件のご案内・契約・仲介は提携先の不動産会社が行います））\n- 電気・ガス・水道の手続き\n- インターネット回線（フレッツ光・ドコモ光・auひかり・ソフトバンク光 など）\n- ウォーターサーバー\n- 関東の引越し業者のご紹介\n\n※紹介するサービスによって、当社が紹介料を受け取る場合があります。", "paid": "", "images": ["checklist.png", "diagram.png", "header.png", "points.png"], "checks": [], "links": []}];

try { state = JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch (e) {} };
const STEPS = ['新規作成', '見出し画像', 'タイトル', '本文', '画像を入れる', '有料エリア', '公開設定', 'URL を送る'];

function md(src, id) {
  const marked_ = src.replace(/［画像：([^（]+)（([^）]*)）をここにアップロード］/g, (_, f, alt) => `\n\n<p class="mark">［画像：${f}（${alt}）をここに入れる］</p>\n\n`);
  return window.marked ? marked.parse(marked_, { gfm: true, breaks: true }) : `<pre>${esc(src)}</pre>`;
}
function bodyHTML(a) {
  return md(a.free, a.id) + (a.paid ? `<p class="paidline">――― ここから有料（有料エリアの線をここに引いたら、この行は消す）―――</p>` + md(a.paid, a.id) : '');
}

async function copyRich(html, plain, btn) {
  const t = btn.parentElement.querySelector('.toast');
  const done = msg => { t.textContent = msg; setTimeout(() => t.textContent = '', 2500) };
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
      return done('コピーしました');
    }
    throw 0;
  } catch (e) {
    const buf = $('#copybuf'); buf.innerHTML = html;
    const r = document.createRange(); r.selectNodeContents(buf);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    let ok = false; try { ok = document.execCommand('copy') } catch (e2) {}
    s.removeAllRanges(); buf.innerHTML = '';
    done(ok ? 'コピーしました' : 'コピーできませんでした。下の「中身を見る」を開いて、選んでコピーしてください');
  }
}
async function copyText(text, btn) {
  const t = btn.parentElement.querySelector('.toast');
  try { await navigator.clipboard.writeText(text); t.textContent = 'コピーしました' }
  catch (e) { t.textContent = 'コピーできませんでした。文字を長押しして選んでください' }
  setTimeout(() => t.textContent = '', 2500);
}

function stepsDone(a) { return (state[a.id] || []).length }

function renderList(cur) {
  $('#list').innerHTML = DATA.map((a, i) => {
    const n = stepsDone(a), all = n >= STEPS.length;
    return `<button type="button" data-i="${i}" aria-current="${a.id === cur}"><span class="no">${i + 1}</span>
      <span class="nt">${esc(a.title)}</span>
      <span class="nm">${esc(a.id)}・${esc(a.magazine)}・${yen(a.price)}・${all ? '<span class="ok">公開済み</span>' : `${n}/${STEPS.length}`}</span></button>`;
  }).join('');
  $('#list').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.i));
}

function show(i) {
  const a = DATA[i];
  try { localStorage.setItem(KEY + '-cur', a.id) } catch (e) {}
  renderList(a.id);
  const done = new Set(state[a.id] || []);
  const html = bodyHTML(a);
  const plain = (a.free + (a.paid ? '\n\n――― ここから有料 ―――\n\n' + a.paid : ''));
  const imgs = a.images.filter(f => f !== 'header.png');
  const step = (k, title, inner) => `<li class="${done.has(k) ? 'done' : ''}" data-k="${k}">
    <div class="st"><h3>${title}</h3><label><input type="checkbox" id="c-${a.id}-${k}" ${done.has(k) ? 'checked' : ''}> 済んだ</label></div>
    <div class="sb">${inner}</div></li>`;
  $('#main').innerHTML = `
  <section class="head">
    <h2>${esc(a.title)}</h2>
    <div class="meta"><span class="chip">${esc(a.account)}</span><span class="chip">マガジン：${esc(a.magazine)}</span><span class="chip">価格 <b>${yen(a.price)}</b></span><span class="chip">${esc(a.id)}</span></div>
    ${a.checks.length ? `<div class="warn"><b>公開の前に社長が確かめること</b><ul>${a.checks.map(c => `<li>${esc(c)}</li>`).join('')}${a.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></li>`).join('')}</ul></div>` : ''}
  </section>
  <ol class="steps">
    ${step(0, 'note で新しい記事を作る', `<p>${esc(a.account)}のアカウントでログインし、「投稿」→「テキスト」。</p><a class="btn sec" href="${esc(a.accountUrl)}" target="_blank" rel="noopener">${esc(a.account)}の note を開く</a>`)}
    ${step(1, '見出し画像を入れる', `<p>画像を長押し（パソコンは右クリック）で保存し、記事の上の画像アイコンからアップロード。</p><div class="imgs"><figure><img src="images/${a.id}/header.png" alt="見出し画像"><figcaption>header.png</figcaption></figure></div>`)}
    ${step(2, 'タイトルを貼る', `<div class="val">${esc(a.title)}</div><div class="row"><button class="btn" type="button" data-copy="title">タイトルをコピー</button><span class="toast" role="status"></span></div>`)}
    ${step(3, '本文を貼る', `<p>本文の欄に貼り付け。見出し・太字・箇条書きはそのまま入ります（崩れたら、見出しは note の「大見出し」「小見出し」で直してください）。</p><div class="row"><button class="btn" type="button" data-copy="body">本文をコピー</button><button class="btn sec" type="button" data-copy="plain">文字だけコピー</button><span class="toast" role="status"></span></div><details><summary>中身を見る</summary><div class="body">${html}</div></details>`)}
    ${step(4, '本文の中に画像を入れる', `<p>本文の「［画像：〜をここに入れる］」の行に、同じ名前の画像を入れて、その行を消す。</p><div class="imgs">${imgs.map(f => `<figure><img src="images/${a.id}/${f}" alt="${esc(f)}"><figcaption>${esc(f)}</figcaption></figure>`).join('') || '<p>なし</p>'}</div>`)}
    ${step(5, '有料エリアの線を引く', a.paid ? `<p>「公開に進む」→ 販売設定で「有料」を選び、価格に <b>${a.price.toLocaleString('ja-JP')}</b> を入れる。「有料エリア設定」で、本文の「――― ここから有料 ―――」の行のすぐ上に線を合わせる。そのあと、この行を本文から消す。</p>` : '<p>無料記事なので不要。</p>')}
    ${step(6, '公開設定をして投稿', `<p>マガジン「${esc(a.magazine)}」に追加して、「投稿する」。</p>`)}
    ${step(7, '公開した URL をチャットに貼る', `<p>公開した記事の URL をこのチャットに貼ってください。記事一覧に記録し、明日の日報から数字を追います。</p>`)}
  </ol>`;
  $('#main').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const k = b.dataset.copy;
    if (k === 'title') copyText(a.title, b);
    else if (k === 'plain') copyText(plain, b);
    else copyRich(html, plain, b);
  });
  $('#main').querySelectorAll('ol.steps>li input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const li = cb.closest('li'), k = +li.dataset.k, s = new Set(state[a.id] || []);
    cb.checked ? s.add(k) : s.delete(k);
    state[a.id] = [...s]; save(); li.classList.toggle('done', cb.checked); renderList(a.id);
  });
}

let start = 0;
try { const c = localStorage.getItem(KEY + '-cur'); const j = DATA.findIndex(a => a.id === c); if (j >= 0) start = j } catch (e) {}
if (DATA.length) show(start);
</script>
