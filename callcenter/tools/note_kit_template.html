<title>note 公開キット</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* レイアウト：左に記事の切り替え、右に「公開までの手順」を上から順に。スマホでは1列 */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1A2340; --muted:#5B6683; --line:#D9DFEB;
  --accent:#2B4C9B; --accent-ink:#FFFFFF; --soft:#E7EDF8; --done:#1F7A55; --warn:#9A5B00; --warn-bg:#FFF4E0;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162A; --surface:#182038; --ink:#E6EBF5; --muted:#9AA6C2; --line:#2C3756;
  --accent:#8FB0F5; --accent-ink:#0E1424; --soft:#1F2A48; --done:#6FD3A4; --warn:#F2C26B; --warn-bg:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#182038; --ink:#E6EBF5; --muted:#9AA6C2; --line:#2C3756;
  --accent:#8FB0F5; --accent-ink:#0E1424; --soft:#1F2A48; --done:#6FD3A4; --warn:#F2C26B; --warn-bg:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding:24px 16px 64px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1120px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--f-head);font-weight:900;font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
nav.list{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){nav.list{position:static}}
nav.list button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
nav.list button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
nav.list button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.no{font-family:var(--f-head);font-weight:900;color:var(--accent);font-size:18px;grid-row:span 2}
.nt{font-weight:700;font-size:13.5px;line-height:1.45}
.nm{font-size:12px;color:var(--muted)}
.nm .ok{color:var(--done);font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.head h2{font-family:var(--f-head);font-weight:900;font-size:22px;line-height:1.4;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums}
.warn{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;font-size:13.5px}
.warn ul{margin:4px 0 0;padding-left:1.2em}
.warn a{color:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps>li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
ol.steps>li::before{content:counter(s);font-family:var(--f-head);font-weight:900;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
ol.steps>li.done::before{content:"✓";background:var(--done);color:var(--surface)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.st h3{font-size:15.5px;margin:0;font-weight:700}
.st label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.sb{grid-column:2;display:flex;flex-direction:column;gap:10px;min-width:0}
.sb p{margin:0;color:var(--muted);font-size:13.5px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:9px 16px;border-radius:8px;align-self:flex-start}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.sec{background:var(--soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{font-size:12.5px;color:var(--done);font-weight:700}
.val{font-family:var(--f-head);font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;word-break:break-all}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.imgs figure{margin:0;display:flex;flex-direction:column;gap:4px}
.imgs img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.imgs figcaption{font-size:12px;color:var(--muted)}
details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--muted)}
.body{padding:4px 16px 16px;max-height:420px;overflow:auto;font-size:14px}
.body h2{font-size:18px;font-family:var(--f-head);margin:18px 0 6px}
.body h3{font-size:16px;margin:14px 0 4px}
.body pre{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:6px;font-size:12.5px}
.body .mark{background:var(--warn-bg);border:1px dashed var(--warn);padding:6px 10px;border-radius:6px;font-weight:700}
.body .paidline{border-top:3px double var(--accent);color:var(--accent);text-align:center;font-weight:700;padding-top:6px}
.body a{color:var(--accent)}
#copybuf{position:fixed;left:-9999px;top:0;width:600px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <h1>note 公開キット</h1>
  <p class="sub">上から順に「コピー → note に貼る」。公開ボタンは社長が押します。チェックはこの端末にだけ残ります。</p>
</header>
<div class="wrap">
  <nav class="list" id="list" aria-label="記事"></nav>
  <main id="main"></main>
</div>
<div id="copybuf" aria-hidden="true"></div>

<script>
const DATA = /*__DATA__*/[];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => n ? n.toLocaleString('ja-JP') + '円' : '無料';
const KEY = 'note-kit-v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch (e) {} };
const STEPS = ['新規作成', '見出し画像', 'タイトル', '本文', '画像を入れる', '有料エリア', '公開設定', 'URL を送る'];

function md(src, id) {
  const marked_ = src.replace(/［画像：([^（]+)（([^）]*)）をここにアップロード］/g, (_, f, alt) => `\n\n<p class="mark">［画像：${f}（${alt}）をここに入れる］</p>\n\n`);
  return window.marked ? marked.parse(marked_, { gfm: true }) : `<pre>${esc(src)}</pre>`;
}
function bodyHTML(a) {
  return md(a.free, a.id) + (a.paid ? `<p class="paidline">――― ここから有料（有料エリアの線をここに引いたら、この行は消す）―――</p>` + md(a.paid, a.id) : '');
}

async function copyRich(html, plain, btn) {
  const t = btn.parentElement.querySelector('.toast');
  const done = msg => { t.textContent = msg; setTimeout(() => t.textContent = '', 2500) };
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
      return done('コピーしました');
    }
    throw 0;
  } catch (e) {
    const buf = $('#copybuf'); buf.innerHTML = html;
    const r = document.createRange(); r.selectNodeContents(buf);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    let ok = false; try { ok = document.execCommand('copy') } catch (e2) {}
    s.removeAllRanges(); buf.innerHTML = '';
    done(ok ? 'コピーしました' : 'コピーできませんでした。下の「中身を見る」を開いて、選んでコピーしてください');
  }
}
async function copyText(text, btn) {
  const t = btn.parentElement.querySelector('.toast');
  try { await navigator.clipboard.writeText(text); t.textContent = 'コピーしました' }
  catch (e) { t.textContent = 'コピーできませんでした。文字を長押しして選んでください' }
  setTimeout(() => t.textContent = '', 2500);
}

function stepsDone(a) { return (state[a.id] || []).length }

function renderList(cur) {
  $('#list').innerHTML = DATA.map((a, i) => {
    const n = stepsDone(a), all = n >= STEPS.length;
    return `<button type="button" data-i="${i}" aria-current="${a.id === cur}"><span class="no">${i + 1}</span>
      <span class="nt">${esc(a.title)}</span>
      <span class="nm">${esc(a.id)}・${esc(a.magazine)}・${yen(a.price)}・${all ? '<span class="ok">公開済み</span>' : `${n}/${STEPS.length}`}</span></button>`;
  }).join('');
  $('#list').querySelectorAll('button').forEach(b => b.onclick = () => show(+b.dataset.i));
}

function show(i) {
  const a = DATA[i];
  try { localStorage.setItem(KEY + '-cur', a.id) } catch (e) {}
  renderList(a.id);
  const done = new Set(state[a.id] || []);
  const html = bodyHTML(a);
  const plain = (a.free + (a.paid ? '\n\n――― ここから有料 ―――\n\n' + a.paid : ''));
  const imgs = a.images.filter(f => f !== 'header.png');
  const step = (k, title, inner) => `<li class="${done.has(k) ? 'done' : ''}" data-k="${k}">
    <div class="st"><h3>${title}</h3><label><input type="checkbox" id="c-${a.id}-${k}" ${done.has(k) ? 'checked' : ''}> 済んだ</label></div>
    <div class="sb">${inner}</div></li>`;
  $('#main').innerHTML = `
  <section class="head">
    <h2>${esc(a.title)}</h2>
    <div class="meta"><span class="chip">${esc(a.account)}</span><span class="chip">マガジン：${esc(a.magazine)}</span><span class="chip">価格 <b>${yen(a.price)}</b></span><span class="chip">${esc(a.id)}</span></div>
    ${a.checks.length ? `<div class="warn"><b>公開の前に社長が確かめること</b><ul>${a.checks.map(c => `<li>${esc(c)}</li>`).join('')}${a.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></li>`).join('')}</ul></div>` : ''}
  </section>
  <ol class="steps">
    ${step(0, 'note で新しい記事を作る', `<p>${esc(a.account)}のアカウントでログインし、「投稿」→「テキスト」。</p><a class="btn sec" href="${esc(a.accountUrl)}" target="_blank" rel="noopener">${esc(a.account)}の note を開く</a>`)}
    ${step(1, '見出し画像を入れる', `<p>画像を長押し（パソコンは右クリック）で保存し、記事の上の画像アイコンからアップロード。</p><div class="imgs"><figure><img src="images/${a.id}/header.png" alt="見出し画像"><figcaption>header.png</figcaption></figure></div>`)}
    ${step(2, 'タイトルを貼る', `<div class="val">${esc(a.title)}</div><div class="row"><button class="btn" type="button" data-copy="title">タイトルをコピー</button><span class="toast" role="status"></span></div>`)}
    ${step(3, '本文を貼る', `<p>本文の欄に貼り付け。見出し・太字・箇条書きはそのまま入ります（崩れたら、見出しは note の「大見出し」「小見出し」で直してください）。</p><div class="row"><button class="btn" type="button" data-copy="body">本文をコピー</button><button class="btn sec" type="button" data-copy="plain">文字だけコピー</button><span class="toast" role="status"></span></div><details><summary>中身を見る</summary><div class="body">${html}</div></details>`)}
    ${step(4, '本文の中に画像を入れる', `<p>本文の「［画像：〜をここに入れる］」の行に、同じ名前の画像を入れて、その行を消す。</p><div class="imgs">${imgs.map(f => `<figure><img src="images/${a.id}/${f}" alt="${esc(f)}"><figcaption>${esc(f)}</figcaption></figure>`).join('') || '<p>なし</p>'}</div>`)}
    ${step(5, '有料エリアの線を引く', a.paid ? `<p>「公開に進む」→ 販売設定で「有料」を選び、価格に <b>${a.price.toLocaleString('ja-JP')}</b> を入れる。「有料エリア設定」で、本文の「――― ここから有料 ―――」の行のすぐ上に線を合わせる。そのあと、この行を本文から消す。</p>` : '<p>無料記事なので不要。</p>')}
    ${step(6, '公開設定をして投稿', `<p>マガジン「${esc(a.magazine)}」に追加して、「投稿する」。</p>`)}
    ${step(7, '公開した URL をチャットに貼る', `<p>公開した記事の URL をこのチャットに貼ってください。記事一覧に記録し、明日の日報から数字を追います。</p>`)}
  </ol>`;
  $('#main').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const k = b.dataset.copy;
    if (k === 'title') copyText(a.title, b);
    else if (k === 'plain') copyText(plain, b);
    else copyRich(html, plain, b);
  });
  $('#main').querySelectorAll('ol.steps>li input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const li = cb.closest('li'), k = +li.dataset.k, s = new Set(state[a.id] || []);
    cb.checked ? s.add(k) : s.delete(k);
    state[a.id] = [...s]; save(); li.classList.toggle('done', cb.checked); renderList(a.id);
  });
}

let start = 0;
try { const c = localStorage.getItem(KEY + '-cur'); const j = DATA.findIndex(a => a.id === c); if (j >= 0) start = j } catch (e) {}
if (DATA.length) show(start);
</script>
